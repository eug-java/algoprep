- id: KNOWING_WHAT_TO_TRACK
  order: 24
  week: 4
  title: Knowing What to Track
  subtitle: Solve one-pass problems by identifying the right running counters
  intuition: A surprising number of interview problems aren't about a fancy algorithm at all - they're
    solved the moment you identify the one or two running statistics that matter and update them incrementally
    as you scan, instead of recomputing anything from scratch. This pattern is less about a fixed template
    and more about the habit of asking 'what small piece of state, updated in O(1) per step, would let
    me answer this in one pass?'
  recognition: The problem can be solved with a single pass if you track the right counters or state -
    majority element (a candidate and a count), longest consecutive sequence (only start scanning from
    sequence beginnings), or fruit-into-baskets-style 'at most K types' tracking.
  walkthrough: 'Before reaching for a known pattern, ask explicitly what small amount of state, if tracked
    and updated as you scan, would let you answer the question without ever looking backward. For majority
    element, that''s a single candidate value and a running count (Boyer-Moore voting): increment when
    you see the candidate, decrement otherwise, and swap candidates when the count hits zero. For longest
    consecutive sequence, the insight is to only start counting a sequence from a number that has no predecessor
    in the set, so each number is visited a bounded number of times overall despite looking like nested
    loops. Once you''ve identified the tracked state, verify with a couple of hand-traced examples that
    updating it incrementally really does preserve enough information to answer correctly, since this
    pattern''s main risk is discovering partway through that you''re missing one more piece of state.'
  telltaleSigns:
  - A single linear pass would work if you tracked the right small piece of state
  - Majority/frequency-threshold questions (appears more than n/2 times, etc.)
  - '''Longest consecutive run'' or similar sequence-based counting'
  - At-most-K-types / at-most-K-distinct tracking without an explicit sliding window framing
  templateSteps:
  - Identify the minimal state that needs to be tracked to answer the question
  - Decide the O(1) update rule for that state as each element is processed
  - Scan once, applying the update rule and checking/recording the answer as needed
  - Verify with hand-traced examples that no additional state is silently needed
  - Avoid recomputing from scratch - always update incrementally
  commonMistakes:
  - Recomputing counts or state from scratch each iteration instead of updating incrementally
  - Missing an edge case that requires one more piece of tracked state than originally planned
  - Applying Boyer-Moore voting without a required verification pass when majority isn't guaranteed to
    exist
  - Confusing 'starts of sequences' with 'all elements' when the trick relies on visiting each number
    a bounded number of times
  whenNotToUse:
  - The relationships between elements aren't simple enough to reduce to a small fixed set of running
    counters
  - Sorting or a data structure (heap, hash map) more naturally captures the needed state than ad hoc
    counters
  problems:
  - id: majority-element
    title: Majority Element
    difficulty: EASY
    className: com.algoprep.patterns.tracking.MajorityElement
    summary: Find the element that appears more than n/2 times in an array.
    whenToUse: 'Boyer-Moore voting: track a single candidate and a count instead of a full frequency map.'
    timeComplexity: O(n)
    spaceComplexity: O(1)
    hints:
    - Increment the count when the current number matches the candidate, decrement otherwise.
    - When the count hits zero, switch the candidate to the current number.
    tags:
    - tracking
    companies:
    - Amazon
    - Microsoft
    frequency: HIGH
  - id: longest-consecutive
    title: Longest Consecutive Sequence
    difficulty: MEDIUM
    className: com.algoprep.patterns.tracking.LongestConsecutive
    summary: Find the length of the longest run of consecutive integers in an unsorted array.
    whenToUse: Put everything in a hash set, then only start counting a run from numbers with no predecessor
      present.
    timeComplexity: O(n)
    spaceComplexity: O(n)
    hints:
    - Only begin extending a sequence from a number x where x-1 is not in the set.
    - From each valid start, keep checking x+1, x+2, ... to measure the run's length.
    tags:
    - hash-set
    companies:
    - Meta
    - Google
    - Amazon
    frequency: HIGH
  - id: majority-element-ii
    title: Majority Element II
    difficulty: MEDIUM
    className: com.algoprep.patterns.tracking.MajorityElementII
    summary: All elements appearing more than ⌊n/3⌋ times.
    whenToUse: Boyer-Moore with two candidates.
    timeComplexity: O(n)
    spaceComplexity: O(1)
    hints:
    - At most two answers
    - Verify counts in second pass
    tags:
    - tracking
    companies:
    - Amazon
    frequency: MEDIUM
  - id: max-points-on-line
    title: Max Points on a Line
    difficulty: HARD
    className: com.algoprep.patterns.tracking.MaxPointsOnLine
    summary: Maximum number of points that lie on the same straight line.
    whenToUse: For each origin, track slopes via reduced fractions.
    timeComplexity: O(n²)
    spaceComplexity: O(n)
    hints:
    - Normalize slope by GCD
    - Handle vertical/duplicate points
    tags:
    - math
    - hash-map
    companies:
    - Google
    - Meta
    frequency: MEDIUM
- id: UNION_FIND
  order: 25
  week: 4
  title: Union Find (DSU)
  subtitle: Dynamic connectivity with near-O(1) unions via path compression and rank
  intuition: 'Union-Find (Disjoint Set Union) answers ''are these two things connected?'' and ''merge
    these two groups'' in near-constant time by keeping a parent pointer for every element and letting
    each element''s ultimate ''root'' represent its group. Two optimizations make this fast in practice:
    path compression (flatten the path to the root every time you look it up) and union by rank/size (always
    attach the smaller tree under the larger one''s root).'
  recognition: The problem involves merging or connecting things dynamically and later needs to answer
    connectivity questions - number of provinces/connected components, detecting a redundant connection
    that creates a cycle, or merging accounts/groups by shared attributes.
  walkthrough: Initialize a parent array where every element is its own parent, representing n separate
    singleton groups initially. For each given connection or edge, find the root of both endpoints; if
    the roots differ, union them by attaching one root under the other (using rank or size to decide which
    stays on top for balance), and decrement your running count of distinct components. For find, always
    follow parent pointers up to the root, applying path compression on the way - point every visited
    node directly at the root - which keeps future lookups from that node fast. For 'redundant connection'
    style problems, process edges in the given order and the first edge whose two endpoints already share
    a root is your answer. For grouping/merging problems like accounts merge, union by whatever shared
    attribute defines the relationship, then group final results by each element's root.
  telltaleSigns:
  - Merge or connect elements dynamically, then answer connectivity questions
  - Number of connected components / provinces in a graph
  - Detecting the edge that creates a cycle (redundant connection) in a tree-plus-one-edge graph
  - Merging groups by a shared attribute (accounts merge, similar string groups)
  templateSteps:
  - Initialize each element as its own parent/root, tracking a component count
  - Implement find() with path compression (point nodes directly at the root)
  - Implement union() by rank/size, decrementing the component count on a successful merge
  - Process edges/relationships one at a time, unioning connected elements
  - Use the final root-per-element mapping to answer connectivity or grouping queries
  commonMistakes:
  - Forgetting path compression, degrading find() toward O(n) on skewed trees
  - Unioning without checking whether the two elements already share a root, double-counting components
  - Ignoring union by rank/size, leading to a tall skewed tree in adversarial input orders
  - Off-by-one errors in 1-indexed vs 0-indexed element numbering in the parent array
  whenNotToUse:
  - The connectivity structure never changes after being built (a plain graph traversal computed once
    is simpler)
  - You need the shortest path between two connected nodes, not just whether they're connected - union-find
    doesn't track path length
  problems:
  - id: number-of-provinces
    title: Number of Provinces
    difficulty: MEDIUM
    className: com.algoprep.patterns.unionfind.NumberOfProvinces
    summary: Count connected components in an undirected graph given as an adjacency matrix.
    whenToUse: Union every direct connection in the matrix, then count how many distinct roots remain.
    timeComplexity: O(n^2 * alpha(n))
    spaceComplexity: O(n)
    hints:
    - Only need to scan the upper (or lower) triangle of the symmetric matrix.
    - The final answer is the number of elements that are their own root.
    tags:
    - union-find
    companies:
    - Amazon
    - Google
    frequency: HIGH
  - id: redundant-connection
    title: Redundant Connection
    difficulty: MEDIUM
    className: com.algoprep.patterns.unionfind.RedundantConnection
    summary: Find the edge that can be removed so the graph becomes a tree again (a tree plus one extra
      edge).
    whenToUse: Process edges in order; the first edge whose endpoints already share a root is the redundant
      one.
    timeComplexity: O(n * alpha(n))
    spaceComplexity: O(n)
    hints:
    - Union endpoints one edge at a time, in the given input order.
    - As soon as find(u) == find(v) before unioning, that edge is the answer.
    tags:
    - union-find
    companies:
    - Google
    - Amazon
    frequency: MEDIUM
  - id: accounts-merge
    title: Accounts Merge
    difficulty: MEDIUM
    className: com.algoprep.patterns.unionfind.AccountsMerge
    summary: Merge accounts that share emails.
    whenToUse: Union emails; group by root.
    timeComplexity: O( ste · α)
    spaceComplexity: O(emails)
    hints:
    - Map email→name
    - Union consecutive emails in an account
    tags:
    - union-find
    companies:
    - Meta
    - Amazon
    frequency: MEDIUM
  - id: number-of-islands-ii
    title: Number of Islands II
    difficulty: HARD
    className: com.algoprep.patterns.unionfind.NumberOfIslandsII
    summary: After each land add, return current island count.
    whenToUse: Online Union-Find as cells become land.
    timeComplexity: O(k α(mn))
    spaceComplexity: O(mn)
    hints:
    - Add land then union 4-neighbors
    - Increment count on add; decrement on each successful union
    tags:
    - union-find
    companies:
    - Google
    frequency: MEDIUM
  - id: path-exists
    title: Find if Path Exists in Graph
    difficulty: EASY
    className: com.algoprep.patterns.unionfind.PathExists
    summary: Return whether a path exists between source and destination.
    whenToUse: Union all edges, then check same component.
    timeComplexity: O(n + e·α(n))
    spaceComplexity: O(n)
    hints:
    - Union endpoints of each edge
    - find(source)==find(destination)
    tags:
    - union-find
    companies:
    - Backend
    frequency: LOW
- id: CUSTOM_DATA_STRUCTURES
  order: 26
  week: 4
  title: Custom Data Structures
  subtitle: Compose well-known building blocks to meet per-operation complexity constraints
  intuition: Many interview 'design' questions are really asking whether you can decompose a set of required
    operations and their complexity bounds into a combination of simpler, well-known building blocks -
    a hash map for O(1) lookup, a doubly linked list for O(1) reordering, a heap for priority access -
    wired together so each operation only touches the structures it needs.
  recognition: The question asks you to design a data structure or class supporting multiple operations
    (get/put, push/pop/getMin, insert/delete/getRandom) under specific time-complexity constraints, such
    as LRU/LFU caches, min stacks, or time-based key-value stores.
  walkthrough: 'Start by listing every required operation and its target time complexity exactly as stated
    in the problem - this list drives every design decision that follows. For each operation, ask which
    single data structure gives you that complexity for free: O(1) average lookup usually means a hash
    map, O(1) insertion/removal at both ends usually means a doubly linked list, O(1) access to a minimum/maximum
    usually means an auxiliary stack or heap. Combine structures so each one is only responsible for the
    operations it''s naturally good at - for an LRU cache, the hash map gives O(1) lookup by key while
    the doubly linked list gives O(1) reordering to mark recency, with the map storing direct references
    to linked-list nodes to avoid any O(n) search. Once the combination handles every listed operation
    at its required complexity, trace through a short sequence of operations by hand to confirm state
    stays consistent across the combined structures, especially at edge cases like an empty structure
    or capacity of one.'
  telltaleSigns:
  - '"Design a data structure that supports..." with multiple operations and complexity targets'
  - LRU/LFU cache, min stack, time-based key-value store, snapshot array
  - Multiple operations that seemingly need different single data structures at once
  - Explicit Big-O requirements per operation rather than for the whole algorithm
  templateSteps:
  - List every required operation and its target time complexity
  - For each operation, identify the single structure that gives that complexity naturally
  - Combine structures so state stays consistent (e.g., map storing references into a linked list)
  - Wire updates so every operation touches only the structures it actually needs
  - Trace a short operation sequence by hand, including edge cases (empty, capacity one)
  commonMistakes:
  - Using one structure for everything, sacrificing the complexity of at least one required operation
  - Letting two combined structures drift out of sync (e.g., a map pointing to a stale linked-list node)
  - Not handling capacity/eviction edge cases (empty structure, at-capacity insert) explicitly
  - Overcomplicating the design instead of composing well-known building blocks
  whenNotToUse:
  - A single existing built-in structure already meets every required operation's complexity
  - The operations don't actually have meaningfully different complexity needs, so a simpler unified structure
    suffices
  problems:
  - id: min-stack
    title: Min Stack
    difficulty: MEDIUM
    className: com.algoprep.patterns.customds.MinStack
    summary: Design a stack supporting push, pop, top, and getMin, all in O(1).
    whenToUse: An auxiliary stack (or encoded value pairs) tracks the running minimum alongside the main
      stack.
    timeComplexity: O(1) all ops
    spaceComplexity: O(n)
    hints:
    - Push the new minimum onto an auxiliary stack every time it changes (or on every push, tracking duplicates).
    - Pop from both stacks together to keep them in sync.
    tags:
    - design
    - stack
    companies:
    - FAANG
    - Amazon
    - Meta
    frequency: HIGH
  - id: lru-cache
    title: LRU Cache
    difficulty: HARD
    className: com.algoprep.patterns.customds.LruCache
    summary: Design a cache with O(1) get and put that evicts the least-recently-used entry when full.
    whenToUse: A hash map for O(1) key lookup, combined with a doubly linked list for O(1) recency reordering.
    timeComplexity: O(1)
    spaceComplexity: O(capacity)
    hints:
    - Store map values as direct references to doubly linked list nodes, not just raw values.
    - On every get/put, move the touched node to the front (or back) of the list to mark it most-recently-used.
    tags:
    - design
    - hash-map
    companies:
    - FAANG
    - Amazon
    - Meta
    - Google
    - Microsoft
    frequency: HIGH
  - id: time-map
    title: Time Based Key-Value Store
    difficulty: MEDIUM
    className: com.algoprep.patterns.customds.TimeMap
    summary: Store values by timestamp; get latest at or before timestamp.
    whenToUse: HashMap + binary search on timestamp lists.
    timeComplexity: O(log n) get
    spaceComplexity: O(n)
    hints:
    - Append-only timestamps are sorted
    - Binary search upper bound
    tags:
    - design
    companies:
    - Amazon
    - Google
    frequency: MEDIUM
  - id: lfu-cache
    title: LFU Cache
    difficulty: HARD
    className: com.algoprep.patterns.customds.LfuCache
    summary: O(1) get/put with least-frequently-used eviction (tie → LRU).
    whenToUse: Maps + freq buckets of doubly linked lists.
    timeComplexity: O(1)
    spaceComplexity: O(capacity)
    hints:
    - Track min frequency
    - On get bump frequency bucket
    tags:
    - design
    companies:
    - Google
    - Amazon
    frequency: MEDIUM
  - id: design-hashmap
    title: Design HashMap
    difficulty: EASY
    className: com.algoprep.patterns.customds.DesignHashMap
    summary: Implement a simple HashMap without built-in map libraries.
    whenToUse: Array of buckets + chaining for interview design warmup.
    timeComplexity: O(1) average
    spaceComplexity: O(n)
    hints:
    - Use an array of linked lists
