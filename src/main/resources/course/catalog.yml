      bound.'
    timeComplexity: O(log n)
    spaceComplexity: O(1)
    hints:
    - On finding a match while searching for the first position, keep narrowing left instead of stopping.
    - Do the same but narrow right for the last position search.
    tags:
    - binary-search
    companies:
