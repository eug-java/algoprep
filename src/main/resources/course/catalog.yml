- id: TREE_BFS
  order: 21
  week: 3
  title: Tree Breadth-First Search
  subtitle: Level-order traversal with a queue, one full level at a time
  intuition: 'Whenever a tree problem talks about levels, depth, or ''the closest X'', level-order traversal
    with a queue is the natural fit: process one full level at a time by capturing the queue''s size at
    the start of each iteration, since that size tells you exactly how many nodes belong to the current
    level before any children get enqueued.'
  recognition: The problem asks for level-order traversal, values grouped by depth, zigzag ordering, the
    rightmost/leftmost visible node per level, or connecting nodes at the same level via pointers.
  walkthrough: Initialize a queue containing just the root, then loop while the queue is non-empty. At
    the start of each iteration, record the current queue size - this is the exact number of nodes in
    the current level, which is the key trick that separates tree BFS from generic graph BFS. Poll exactly
    that many nodes, process each one (add to the current level's result list, track the last one for
    right-side-view, etc.), and enqueue each polled node's non-null children as you go. Once the level's
    fixed count of nodes has been fully processed, move to the next iteration of the outer loop, which
    now handles the next level. For zigzag traversal, keep a direction flag and reverse alternate levels'
    result lists; for right-side view, simply keep the last node processed in each level's inner loop.
  telltaleSigns:
  - Level order, depth, or 'per level' wording
  - Zigzag / alternating direction traversal
  - Rightmost or leftmost visible node per level
  - Connecting sibling nodes at the same depth via next pointers
  templateSteps:
  - Initialize a queue with the root node
  - At the start of each outer loop iteration, capture the current queue size as the level width
  - Poll exactly that many nodes, processing each and enqueuing its non-null children
  - Collect or use the level's results (list, last node, reversed order) as required
  - Repeat until the queue is empty
  commonMistakes:
  - Not capturing the level size before the inner loop, causing level boundaries to blur together
  - Enqueuing null children, requiring extra null checks later instead of checking before enqueueing
  - Forgetting to reverse alternate levels for zigzag traversal, or reversing every level instead of every
    other one
  - Using recursion with a depth parameter when a queue-based approach is clearer for genuinely level-based
    questions
  whenNotToUse:
  - The problem is about paths or subtree aggregates rather than levels (tree DFS is the more natural
    and often simpler fit)
  - The tree is extremely wide, making per-level queue size potentially very large - consider whether
    DFS with a depth counter avoids that memory spike
  problems:
  - id: level-order
    title: Binary Tree Level Order Traversal
    difficulty: MEDIUM
    className: com.algoprep.patterns.treebfs.LevelOrderTraversal
    summary: Return node values grouped level by level, top to bottom.
    whenToUse: 'The classic tree BFS template: capture queue size per level.'
    timeComplexity: O(n)
    spaceComplexity: O(n)
    hints:
    - Capture queue.size() before the inner loop to know the current level's width.
    - Build one list per level and append it to the outer result list.
    tags:
    - tree
    - bfs
    companies:
    - FAANG
    - Amazon
    - Microsoft
    frequency: HIGH
  - id: zigzag-level-order
    title: Zigzag Level Order
    difficulty: MEDIUM
    className: com.algoprep.patterns.treebfs.ZigzagLevelOrder
    summary: Traverse level by level, alternating left-to-right and right-to-left.
    whenToUse: Standard level-order BFS, plus a direction flag that reverses every other level's list.
    timeComplexity: O(n)
    spaceComplexity: O(n)
    hints:
    - Build each level's list normally, then reverse it when the direction flag says right-to-left.
    - Flip the direction flag after finishing each level.
    tags:
    - tree
    - bfs
    companies:
    - Amazon
    - Meta
    frequency: MEDIUM
  - id: right-side-view
    title: Binary Tree Right Side View
    difficulty: MEDIUM
    className: com.algoprep.patterns.treebfs.RightSideView
    summary: Return the values of the nodes visible from the right side of the tree.
    whenToUse: Standard level-order BFS, keeping only the last node processed at each level.
    timeComplexity: O(n)
