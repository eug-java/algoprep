- id: K_WAY_MERGE
  order: 7
  week: 1
  title: K-way Merge
  subtitle: Merge multiple sorted inputs using a min-heap of current candidates
  intuition: 'Merging k already-sorted lists generalizes the two-list merge from merge sort: instead of
    comparing two heads, keep the current head of every list in a min-heap and always pop the globally
    smallest one. Because the heap only ever holds k elements at a time, this turns an O(n*k) naive merge
    into O(n log k).'
  recognition: Multiple sorted arrays or linked lists need to be combined into one sorted output, or you
    need the k-th smallest/largest element across several sorted sources, or the smallest range covering
    at least one element from each list.
  walkthrough: Push the first element of each of the k sorted lists into a min-heap, tagging each heap
    entry with which list (and index/node) it came from so you can find its successor. Repeatedly pop
    the smallest element, append it to your result, and if the list it came from has a next element, push
    that successor into the heap. Continue until the heap is empty, which guarantees the output is fully
    sorted because you only ever emit the globally smallest available candidate. For 'kth smallest in
    sorted matrix' or 'smallest range' variants, treat each row (or list) as one of the k sorted sources
    and adapt the stopping condition - for smallest range, track the current max across all heap entries
    and shrink the range every time you pop and refill.
  telltaleSigns:
  - Multiple sorted arrays, lists, or matrix rows need to be combined
  - Need the k-th smallest/largest element across several sorted sources
  - Smallest range covering at least one element from each of k sorted lists
  - Explicit mention of merging linked lists or sorted streams
  templateSteps:
  - Push the first element of each of the k sources into a min-heap with source metadata
  - Pop the minimum, append it to the result or advance a counter
  - Push the popped element's successor from its source list, if one exists
  - Repeat until the heap empties or the target k-th element is reached
  - Adapt the stopping/tracking condition for range or matrix variants
  commonMistakes:
  - Forgetting to store which source (list/row/index) a heap entry came from, losing the ability to find
    its successor
  - Pushing an entire list into the heap upfront instead of one element at a time (blows up space to O(n))
  - Using the wrong comparator so the heap does not actually pop the global minimum
  - Off-by-one when converting between a 1-indexed 'k-th smallest' and a zero-indexed pop count
  whenNotToUse:
  - Only two lists need merging (a simple two-pointer merge avoids heap overhead)
  - The sources are not sorted and cannot be cheaply sorted first (heap merge relies on local order)
  problems:
  - id: merge-k-sorted-lists
    title: Merge K Sorted Lists
    difficulty: HARD
    className: com.algoprep.patterns.kwaymerge.MergeKSortedLists
    summary: Merge k sorted linked lists into a single sorted linked list.
    whenToUse: Min-heap of the k current list heads, always popping the smallest.
    timeComplexity: O(N log k)
    spaceComplexity: O(k)
    hints:
    - Push each list's head node (not just its value) so you can advance it later.
    - After popping a node, push its .next into the heap if it exists.
    tags:
    - heap
    - linked-list
    companies:
    - FAANG
    - Amazon
    - Google
    - Meta
    frequency: HIGH
  - id: kth-smallest-sorted-matrix
    title: Kth Smallest in Sorted Matrix
    difficulty: MEDIUM
    className: com.algoprep.patterns.kwaymerge.KthSmallestInSortedMatrix
    summary: Find the k-th smallest element in a matrix sorted by row and column.
    whenToUse: Treat rows as sorted lists and heap-merge them, or binary search directly on the value
      range.
    timeComplexity: O(k log n)
    spaceComplexity: O(n)
    hints:
    - Seed the heap with the first element of each row (up to k rows).
    - Pop k times; the k-th pop is the answer.
    tags:
