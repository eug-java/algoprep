- id: TRIE
  order: 22
  week: 3
  title: Trie
  subtitle: Prefix tree for word dictionaries, autocomplete, and shared-prefix search
  intuition: A trie shares common prefixes across many words in a single tree structure, so words with
    the same beginning literally share the same path from the root - this makes prefix search, autocomplete,
    and dictionary lookups take time proportional to the word's length rather than the number of words
    stored.
  recognition: The problem needs repeated prefix queries against a fixed dictionary of words - implement
    a Trie, word search II (multiple words in a grid), replace words with their shortest root, or autocomplete
    suggestions.
  walkthrough: Design a trie node with a children map (or fixed-size array keyed by character) and a boolean
    flag marking whether a complete word ends at that node. To insert a word, walk character by character
    from the root, creating a new child node whenever the current character isn't already present, and
    mark the final node's end-of-word flag true. To search for an exact word, walk the same way, but only
    return true if you both reach the end of the word and that final node's end-of-word flag is set -
    reaching the last character alone only proves the prefix exists, not the whole word. For startsWith/prefix
    queries, the check is identical except you skip the end-of-word flag check entirely. For word-search-in-grid
    problems, build a trie of all target words first, then DFS through the grid while simultaneously walking
    down the trie, pruning any grid path whose corresponding trie path doesn't exist - this shares work
    across all target words instead of searching each one independently.
  telltaleSigns:
  - Many repeated prefix queries against the same fixed dictionary
  - Implement Trie / autocomplete / typeahead functionality
  - Word search across a grid for multiple dictionary words simultaneously
  - Replace words with their shortest matching dictionary root
  templateSteps:
  - Design a node with a children map/array and an end-of-word flag
  - 'Insert: walk character by character, creating missing child nodes, then mark the end flag'
  - 'Search: walk the same way, but require both full traversal and the end flag to be true'
  - 'StartsWith: walk the same way but skip the end flag check'
  - For grid search, DFS the grid and the trie together, pruning paths with no matching trie node
  commonMistakes:
  - Confusing search() (needs the end-of-word flag) with startsWith() (doesn't need it)
  - Not sharing the trie across multiple target words in word-search-style problems, losing the pattern's
    main benefit
  - Using a fixed 26-letter array when the alphabet is actually larger (unicode, mixed case)
  - Forgetting to mark or check the end-of-word flag, causing prefixes to be reported as full matches
  whenNotToUse:
  - Only a handful of one-off string comparisons are needed - building a trie has more overhead than a
    simple set/map lookup
  - Memory is tightly constrained and the dictionary is large, since tries can use significantly more
    memory than a hash set of the same words
  problems:
  - id: implement-trie
    title: Implement Trie (Prefix Tree)
    difficulty: MEDIUM
    className: com.algoprep.patterns.trie.Trie
    summary: Implement insert, search, and startsWith operations for a trie.
    whenToUse: The core Trie ADT that every other trie problem builds on.
    timeComplexity: O(L) per op
    spaceComplexity: O(ALPHABET * total chars)
    hints:
    - Each node needs a children map and a boolean end-of-word flag.
    - search() requires the end flag to be true; startsWith() does not.
    tags:
    - trie
    companies:
    - FAANG
    - Google
    - Amazon
    frequency: HIGH
  - id: word-break-dict
    title: Extra Characters in a String (Trie dict)
    difficulty: MEDIUM
    className: com.algoprep.patterns.trie.ExtraCharacters
    summary: Find the minimum number of extra characters left over after breaking a string using dictionary
      words.
    whenToUse: DP over string positions, using a trie to quickly check which dictionary words start at
      each position.
    timeComplexity: O(n^2)
    spaceComplexity: O(dictionary)
    hints:
    - dp[i] = minimum extra characters for the substring starting at i.
    - At each position, try every dictionary word that matches as a prefix via the trie, then recurse
      past it.
    tags:
    - trie
    - dp
    companies:
    - Amazon
    - Google
    frequency: MEDIUM
  - id: replace-words
    title: Replace Words
    difficulty: MEDIUM
