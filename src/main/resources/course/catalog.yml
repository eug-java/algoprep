description: AlgoPrep teaches coding interviews through reusable patterns, not memorized solutions. Each
  pattern comes with recognition cues, a step-by-step interview walkthrough, a Java template, common pitfalls,
  and progressively harder problems backed by JUnit tests. Work through the four-week roadmap, then test
  yourself with the unlabeled Challenge Yourself set. A bonus module covers Spring Boot interview topics
  for Java backend roles.
patterns:
- id: TWO_POINTERS
  order: 1
  week: 1
  title: Two Pointers
  subtitle: Move two indices toward a goal on sorted arrays, strings, or linked lists
  intuition: 'When a brute-force solution compares every pair with nested loops, ask whether sorting the
    input first would let two indices - one starting from each end, or both moving forward at different
    speeds - replace the inner loop entirely. Two pointers exploit monotonic structure: as one side of
    a sorted range grows, the other can only shrink or stay put, so each pointer sweeps the array once
    for a combined O(n) pass instead of O(n^2).'
  recognition: The input is sorted or can be sorted cheaply, you need pairs or triplets that hit a target,
    you must reverse or partition data in place, or you compare characters from both ends of a string.
  walkthrough: Start by asking whether the array is sorted; if not, decide whether sorting is legal given
    the constraints, since sorting costs O(n log n) but often unlocks O(n) afterward. Place one pointer
    at the front and one at the back for target-sum problems, or keep both moving forward at different
    speeds for in-place compaction. On each step, compare the values at the two pointers against your
    goal, then move only the pointer that can improve the comparison - this invariant guarantees no valid
    answer is skipped. Narrate the invariant to your interviewer before coding, implement a clear termination
    condition such as left crossing right, then trace a small example by hand, including duplicates and
    edge cases like an empty or single-element array.
  telltaleSigns:
  - Sorted input, or sorting first is allowed and cheap enough
  - Looking for a pair, triplet, or quadruplet that meets a sum or comparison target
  - Need to reverse, partition, or de-duplicate an array in place with O(1) extra space
  - Two positions moving toward each other, or a slow/fast pair moving the same direction
  - Problem explicitly says "in-place" and forbids extra arrays
  templateSteps:
  - Sort the input first if order isn't already guaranteed and sorting won't break the problem
  - Place pointers at the two ends (opposite direction) or both at the start (same direction)
  - Compare the pointer values against the target/invariant and move the pointer that helps
  - Skip duplicate values at each pointer to avoid duplicate results when uniqueness is required
  - Stop when the pointers cross or the window becomes invalid
  commonMistakes:
  - Forgetting to skip duplicate values, producing duplicate pairs/triplets in the answer
  - Moving both pointers every step instead of only the one that can fix the comparison
  - Sorting the array when the problem requires preserving original indices or order
  - Off-by-one errors in the crossing condition (left <= right vs left < right)
  whenNotToUse:
  - Input is unsorted and cannot be sorted because original indices/order must be preserved (use a hash
    map instead)
  - The relationship between elements isn't monotonic, so moving a pointer doesn't reliably narrow the
    search space
  problems:
  - id: pair-with-target-sum
    title: Pair with Target Sum
    difficulty: EASY
    className: com.algoprep.patterns.twopointers.PairWithTargetSum
    summary: Find the indices of two numbers in a sorted array that add up to a target value.
    whenToUse: Sorted array plus pair-sum question is the textbook signal for opposite-direction two pointers.
    timeComplexity: O(n)
    spaceComplexity: O(1)
    hints:
    - Start left at index 0 and right at index n-1.
    - If the sum is too small move left forward; if too large move right backward.
    tags:
    - array
    - two-pointers
    companies:
    - FAANG
    - Google
    - Amazon
    frequency: HIGH
  - id: remove-duplicates
    title: Remove Duplicates from Sorted Array
    difficulty: EASY
    className: com.algoprep.patterns.twopointers.RemoveDuplicates
    summary: Compact a sorted array in-place so each element appears once, returning the new length.
    whenToUse: In-place compaction with a slow write pointer and a fast scan pointer over sorted data.
    timeComplexity: O(n)
    spaceComplexity: O(1)
    hints:
    - Keep a write index that only advances when a new unique value is found.
    - The fast pointer scans every element; the slow pointer marks the next free slot.
    tags:
    - array
    - two-pointers
    - in-place
    companies:
    - FAANG
    - Microsoft
    frequency: HIGH
  - id: triplet-sum-zero
    title: Triplet Sum to Zero
    difficulty: MEDIUM
    className: com.algoprep.patterns.twopointers.TripletSumToZero
    summary: Find all unique triplets in an array that sum to zero.
    whenToUse: Sort, fix one index as an anchor, then run two pointers over the remaining range for its
      complement pair.
    timeComplexity: O(n^2)
    spaceComplexity: O(1) excluding output
    hints:
    - Sort first so two pointers and duplicate-skipping both become possible.
    - After fixing nums[i], search for a pair summing to -nums[i] in the rest of the array.
    - Skip over repeated values for i, left, and right to avoid duplicate triplets.
    tags:
    - array
    - two-pointers
    companies:
    - FAANG
    - Meta
    - Amazon
    frequency: HIGH
  - id: container-with-most-water
    title: Container With Most Water
    difficulty: MEDIUM
    className: com.algoprep.patterns.twopointers.ContainerWithMostWater
    summary: Find two lines that form a container with the max water area.
    whenToUse: Heights on a line; opposite pointers maximize min(h)*width.
    timeComplexity: O(n)
    spaceComplexity: O(1)
    hints:
    - Start at both ends
    - Move the shorter side inward
    tags:
    - array
    - two-pointers
    companies:
    - FAANG
    - Google
    - Amazon
    frequency: HIGH
  - id: dutch-national-flag
    title: Dutch National Flag / Sort Colors
    difficulty: MEDIUM
    className: com.algoprep.patterns.twopointers.DutchNationalFlag
    summary: Sort an array of 0/1/2 in-place with one pass.
    whenToUse: Three-way partition with low/mid/high pointers.
    timeComplexity: O(n)
    spaceComplexity: O(1)
    hints:
    - Maintain [0..low) as 0s and (high..n] as 2s
    - Swap mid with low/high based on value
    tags:
    - array
    - two-pointers
    companies:
    - Microsoft
    - Amazon
    frequency: MEDIUM
  - id: quadruple-sum
    title: Quadruple Sum to Target
    difficulty: HARD
    className: com.algoprep.patterns.twopointers.QuadrupleSum
    summary: Find all unique quadruplets that sum to target.
    whenToUse: Sort + fix two indices + two pointers for the pair.
    timeComplexity: O(n³)
    spaceComplexity: O(n)
    hints:
    - Sort first and skip duplicates at every level
    - Inner pair uses classic two pointers
    tags:
    - array
    - two-pointers
    companies:
    - Amazon
    - Meta
    frequency: MEDIUM
- id: FAST_SLOW_POINTERS
  order: 2
  week: 1
  title: Fast & Slow Pointers
  subtitle: Detect cycles and find midpoints by moving two pointers at different speeds
  intuition: 'Picture two runners on a track: a fast runner covering two steps for every one step of the
    slow runner. If the track loops back on itself, the fast runner eventually laps the slow one and they
    meet - proving a cycle exists without ever counting the track''s length. The same speed trick locates
    the midpoint of a linked list, because when the fast pointer reaches the end, the slow pointer is
    standing exactly halfway.'
  recognition: The problem involves a linked list, or a sequence defined by repeatedly applying a function
    (like summing squared digits), where you must detect a cycle, find a midpoint, or determine whether
    a value eventually repeats without knowing the total length up front.
  walkthrough: Initialize both slow and fast pointers at the head (or starting value), then advance slow
    by one step and fast by two steps on every iteration. If fast ever reaches null without meeting slow,
    there is no cycle, so return immediately. If slow and fast meet, a cycle is confirmed - for the 'find
    the entry point' follow-up, reset one pointer to the head and advance both one step at a time until
    they meet again, which lands exactly at the cycle's start due to Floyd's algorithm distance math.
    For midpoint-style problems, simply stop when fast reaches the end; slow is then at the middle, which
    you can verify against a couple of hand-traced examples.
  telltaleSigns:
  - Cycle detection in a linked list or functional graph
  - Need the middle node without a separate length-counting pass
  - A sequence from repeatedly applying a function (e.g., Happy Number) that may loop forever
  - Checking whether a linked list is a palindrome by reversing its second half
  - Interviewer forbids O(n) extra space for a linked-list problem
  templateSteps:
  - Initialize slow = head and fast = head
  - Loop while fast and fast.next are non-null
  - Advance slow by one node and fast by two nodes each iteration
  - On meeting, reason about what it proves (cycle exists / midpoint found)
  - For cycle start, reset one pointer to head and advance both by one until they meet
  commonMistakes:
  - Forgetting to null-check fast.next before dereferencing it, causing an NPE
  - Confusing which pointer ends up at the middle for even- vs odd-length lists
  - Not resetting a pointer to head when the entry point (not just existence) is required
  - Applying fast/slow to a problem that really needs random access (an array fits better)
  whenNotToUse:
  - You need indexed/random access to elements, not just sequential traversal
  - The structure has no notion of a 'next' step or speed difference for two pointers to diverge on
  problems:
  - id: linked-list-cycle
    title: Linked List Cycle
    difficulty: EASY
    className: com.algoprep.patterns.fastslow.LinkedListCycle
    summary: Detect whether a linked list contains a cycle.
    whenToUse: Floyd's cycle detection gives O(1) space where a hash set would cost O(n).
    timeComplexity: O(n)
    spaceComplexity: O(1)
    hints:
    - If fast ever meets slow, a cycle exists.
    - If fast reaches null, the list is acyclic.
    tags:
    - linked-list
    - cycle
    companies:
    - FAANG
    - Amazon
    - Microsoft
    frequency: HIGH
  - id: middle-of-linked-list
    title: Middle of the Linked List
    difficulty: EASY
    className: com.algoprep.patterns.fastslow.MiddleOfLinkedList
    summary: Return the middle node (the second middle for even length).
    whenToUse: Fast reaches the end exactly when slow is at the middle - no length count needed.
    timeComplexity: O(n)
    spaceComplexity: O(1)
    hints:
    - Advance fast by two and slow by one in the same loop.
    - When fast is null or fast.next is null, slow is the answer.
    tags:
    - linked-list
    companies:
    - Amazon
    - Microsoft
    frequency: HIGH
  - id: happy-number
    title: Happy Number
    difficulty: EASY
    className: com.algoprep.patterns.fastslow.HappyNumber
    summary: Determine if repeatedly summing squared digits eventually reaches 1.
    whenToUse: The digit-square transform forms a functional graph; a cycle that isn't 1 means unhappy.
    timeComplexity: O(log n)
    spaceComplexity: O(1)
    hints:
    - Treat 'next value' as one step of a linked structure.
    - Run fast/slow on that implicit sequence to detect a non-1 cycle.
    tags:
    - math
    - cycle
    companies:
    - Google
    - Amazon
    frequency: MEDIUM
  - id: cycle-start
    title: Start of Linked List Cycle
    difficulty: MEDIUM
    className: com.algoprep.patterns.fastslow.CycleStart
    summary: Return the node where the cycle begins, or null.
    whenToUse: Floyd meet + reset one pointer to head.
    timeComplexity: O(n)
    spaceComplexity: O(1)
    hints:
    - After meeting, move one pointer to head
    - Advance both one step until they meet again
    tags:
    - linked-list
    - cycle
    companies:
    - Amazon
    - Microsoft
    frequency: MEDIUM
  - id: palindrome-linked-list
    title: Palindrome Linked List
    difficulty: MEDIUM
    className: com.algoprep.patterns.fastslow.PalindromeLinkedList
    summary: Check if a linked list reads the same forward and backward.
    whenToUse: Find middle, reverse second half, compare.
    timeComplexity: O(n)
    spaceComplexity: O(1)
    hints:
    - Fast/slow to middle
    - Reverse second half then compare
    tags:
    - linked-list
    companies:
    - Amazon
    - Meta
    frequency: MEDIUM
  - id: circular-array-loop
    title: Circular Array Loop
    difficulty: HARD
    className: com.algoprep.patterns.fastslow.CircularArrayLoop
    summary: Detect a cycle in a circular jump array of length > 1 in one direction.
    whenToUse: Treat indices as a functional graph; fast/slow per start.
    timeComplexity: O(n)
    spaceComplexity: O(1)
    hints:
    - Reject opposite-direction jumps
    - Mark visited indices to avoid rework
    tags:
    - array
    - cycle
    companies:
    - Google
    frequency: LOW
- id: SLIDING_WINDOW
  order: 3
  week: 1
  title: Sliding Window
  subtitle: Maintain a contiguous window that grows and shrinks to satisfy a constraint
  intuition: Whenever a problem asks about a contiguous subarray or substring, a brute-force approach
    recomputes the same overlapping range from scratch for every start index. A sliding window keeps a
    running window state - a sum, character counts, a distinct-element count - and updates it incrementally
    as the window's right edge expands and its left edge contracts, turning an O(n^2) or worse scan into
    a single O(n) pass.
  recognition: Look for phrasing like longest/shortest/maximum/minimum contiguous subarray or substring,
    "at most K distinct characters", anagram or permutation existence inside a larger string, or a fixed
    window size K.
  walkthrough: Identify what state the window must track - a running sum, a frequency map, or a distinct
    count - and what condition makes the window valid or invalid. Expand the window by moving the right
    pointer forward one step at a time, updating the state as each new element enters. Whenever the window
    becomes invalid (or, for a fixed size, once it reaches size K), shrink from the left, removing elements
    from the state until the window is valid again, then record the best answer so far. Repeat until the
    right pointer has swept the entire input, and be explicit with your interviewer about why each element
    enters and leaves the state exactly once, which is what gives the O(n) bound.
  telltaleSigns:
  - Contiguous subarray or substring (never re-orders elements)
  - Longest / shortest / count-of-windows language
  - A constraint on sum, distinct character count, or a frequency map ("at most K distinct")
  - A fixed window size K stated explicitly in the problem
  - Anagram or permutation detection inside a longer string
  templateSteps:
  - Pick the window state to track (sum, frequency map, distinct count) and the validity condition
  - Expand the window by moving the right edge forward and updating state
  - While the window is invalid (or exceeds a fixed size), shrink from the left and update state
  - Update the best answer once the window is valid
  - Continue until the right edge has covered the whole input
  commonMistakes:
  - Using the wrong shrink condition, causing missed valid windows
  - Recomputing the frequency map from scratch instead of updating counts incrementally
  - Off-by-one errors when computing window length (right - left + 1)
  - Forgetting to update the best answer inside the shrink loop, not just after it
  whenNotToUse:
  - The subsequence does not need to be contiguous (usually a DP or two-pointer-on-sorted-data problem)
  - The window's validity cannot be checked or updated in O(1) time as elements enter and leave
  problems:
  - id: max-sum-subarray-k
    title: Maximum Sum Subarray of Size K
    difficulty: EASY
    className: com.algoprep.patterns.slidingwindow.MaxSumSubarrayOfSizeK
    summary: Find the maximum sum of any contiguous subarray of a fixed size K.
    whenToUse: 'Fixed window size K: add the entering element on the right, remove the leaving one on
      the left.'
    timeComplexity: O(n)
    spaceComplexity: O(1)
    hints:
    - Compute the first window's sum directly, then slide by one.
    - Each slide only needs one addition and one subtraction, not a full re-sum.
    tags:
    - array
    - sliding-window
    companies:
    - Amazon
    - Microsoft
    frequency: MEDIUM
  - id: longest-substring-k-distinct
    title: Longest Substring with K Distinct Characters
    difficulty: MEDIUM
    className: com.algoprep.patterns.slidingwindow.LongestSubstringKDistinct
    summary: Find the length of the longest substring containing at most K distinct characters.
    whenToUse: Variable-size window plus a frequency map of distinct keys, shrinking whenever distinct
      count exceeds K.
    timeComplexity: O(n)
    spaceComplexity: O(k)
    hints:
    - Grow the window and add each new character to a frequency map.
    - While the map has more than K keys, shrink from the left and decrement/remove counts.
    tags:
    - string
    - sliding-window
    companies:
    - Meta
    - Google
    frequency: MEDIUM
  - id: find-all-anagrams
    title: Find All Anagrams in a String
    difficulty: MEDIUM
    className: com.algoprep.patterns.slidingwindow.FindAllAnagrams
    summary: Return the start indices of all of p's anagrams found within s.
    whenToUse: Fixed window equal to p's length, comparing running character counts against p's counts.
    timeComplexity: O(n)
    spaceComplexity: O(1)
    hints:
    - Build a target frequency map for p once, up front.
    - Slide a window of len(p) over s, comparing counts; matching counts means an anagram starts there.
    tags:
    - string
    - sliding-window
    - anagram
    companies:
    - Meta
    - Amazon
    frequency: MEDIUM
  - id: longest-no-repeat
    title: Longest Substring Without Repeating Characters
    difficulty: MEDIUM
    className: com.algoprep.patterns.slidingwindow.LongestNoRepeat
    summary: Longest substring with all unique characters.
    whenToUse: Variable window + last-seen index map.
    timeComplexity: O(n)
    spaceComplexity: O(min(n,alphabet))
    hints:
    - Shrink left when a duplicate enters
    - Track best window length
    tags:
    - string
    - sliding-window
    companies:
    - FAANG
    - Meta
    - Amazon
    frequency: HIGH
  - id: min-window-substring
    title: Minimum Window Substring
    difficulty: HARD
    className: com.algoprep.patterns.slidingwindow.MinWindowSubstring
    summary: Smallest substring of s covering all characters of t.
    whenToUse: Shrinkable window with need/have counts.
    timeComplexity: O(|s|+|t|)
    spaceComplexity: O(alphabet)
    hints:
    - Expand until valid, then shrink greedily
    - Track how many required chars are satisfied
    tags:
    - string
    - sliding-window
    companies:
    - FAANG
    - Meta
    - Google
    frequency: HIGH
- id: INTERVALS
  order: 4
  week: 1
  title: Intervals
  subtitle: Sort by start time and sweep once to merge, insert, or reason about ranges
  intuition: Interval problems become tractable the moment you sort by start time, because overlap can
    then only happen between an interval and the ones immediately before or after it in sorted order.
    Once sorted, a single left-to-right sweep with one running 'current interval' is enough to merge,
    count conflicts, or find gaps, since you never need to look backward more than one step.
  recognition: Input given as a list of [start, end] pairs, and the question involves merging, inserting,
    detecting conflicts or overlaps, counting meeting rooms, or finding free time across several interval
    lists.
  walkthrough: 'Sort all intervals by start time first - this single step is what makes the rest of the
    algorithm linear. Keep a ''current'' interval initialized to the first one, then walk through the
    rest: if the next interval''s start is less than or equal to current''s end, they overlap, so merge
    by extending current''s end to the max of both ends. If it doesn''t overlap, push current to the result
    and make the next interval the new current. For variants like insert-interval or employee-free-time,
    adapt the same sweep: track intervals strictly before the new one, merge all overlapping ones, then
    append everything strictly after. Always double check whether the problem uses inclusive or exclusive
    boundaries, since that changes the overlap comparison operator.'
  telltaleSigns:
  - Input as a list of [start, end] pairs
  - Overlap, merge, conflict, or 'free time' language
  - Meeting rooms / scheduling style problems
  - Need to insert one new interval into an already sorted, non-overlapping list
  templateSteps:
  - Sort intervals by start time (and by end time for tie-breaking if needed)
  - Track a 'current' open interval, initialized from the first interval
  - Merge into current when the next interval's start <= current's end
  - Emit the current interval and start a new one when no overlap is found
  - Handle insert / free-time variants as before / overlapping / after phases
  commonMistakes:
  - Forgetting to sort first, or sorting by end time when start time is required
  - Using < instead of <= (or vice versa) at the overlap boundary, mishandling touching intervals
  - Not merging the end as max(current.end, next.end) - just overwriting it
  - Forgetting to flush the last 'current' interval after the loop ends
  whenNotToUse:
  - The intervals are already guaranteed disjoint and no merge/overlap logic is needed
  - You need repeated point-in-time queries across many intervals (a segment tree or sorted map fits better)
  problems:
  - id: merge-intervals
    title: Merge Intervals
    difficulty: MEDIUM
    className: com.algoprep.patterns.intervals.MergeIntervals
    summary: Merge all overlapping intervals into a minimal set of non-overlapping ranges.
    whenToUse: Classic sort-by-start plus a single linear merge sweep.
    timeComplexity: O(n log n)
    spaceComplexity: O(n)
    hints:
    - Sort by start time before anything else.
    - Compare each interval's start against the last merged interval's end.
    tags:
    - intervals
    companies:
    - FAANG
    - Google
    - Meta
    frequency: HIGH
  - id: insert-interval
    title: Insert Interval
    difficulty: MEDIUM
    className: com.algoprep.patterns.intervals.InsertInterval
    summary: Insert a new interval into a sorted, non-overlapping list and merge where needed.
    whenToUse: 'Three phases: copy intervals strictly before, merge all overlapping ones, copy the rest.'
    timeComplexity: O(n)
    spaceComplexity: O(n)
    hints:
    - No sorting needed - the input list is already sorted.
    - Keep expanding the new interval's bounds while it overlaps the current one.
    tags:
    - intervals
    companies:
    - Google
    - Meta
    frequency: HIGH
  - id: conflicting-appointments
    title: Conflicting Appointments
    difficulty: EASY
    className: com.algoprep.patterns.intervals.ConflictingAppointments
    summary: Check whether any two appointments in a list overlap.
    whenToUse: Sort then check each adjacent pair for overlap (the Meeting Rooms I question).
    timeComplexity: O(n log n)
    spaceComplexity: O(1)
    hints:
    - After sorting by start, only adjacent pairs can possibly overlap.
    - An overlap exists as soon as one appointment's start is before the previous one's end.
    tags:
    - intervals
    companies:
    - Meta
    - Amazon
    frequency: MEDIUM
  - id: interval-intersection
    title: Interval List Intersections
    difficulty: MEDIUM
    className: com.algoprep.patterns.intervals.IntervalIntersection
    summary: Return intersections of two sorted interval lists.
    whenToUse: Two-pointer sweep over sorted intervals.
    timeComplexity: O(m+n)
    spaceComplexity: O(1) excluding output
    hints:
    - Intersection start is max of starts
    - Advance the list that ends first
    tags:
    - intervals
    companies:
    - Google
    - Amazon
    frequency: MEDIUM
  - id: minimum-meeting-rooms
    title: Minimum Meeting Rooms
    difficulty: HARD
    className: com.algoprep.patterns.intervals.MinimumMeetingRooms
    summary: Find the minimum number of meeting rooms required.
    whenToUse: Sort starts/ends or use a min-heap of end times.
    timeComplexity: O(n log n)
    spaceComplexity: O(n)
    hints:
    - Sort by start
    - Heap of ongoing meeting end times
    tags:
    - intervals
    - heap
    companies:
    - Meta
    - Google
    - Amazon
    frequency: HIGH
- id: IN_PLACE_LINKED_LIST
  order: 5
  week: 1
  title: In-place Linked List Manipulation
  subtitle: Reverse, reorder, and transform lists with O(1) extra space
  intuition: 'Reversing or reordering a linked list without extra space is really careful pointer bookkeeping:
    before you overwrite a node''s next pointer, save where it used to point, or you lose the rest of
    the list forever. Holding three references - previous, current, and next - at every step lets you
    rewire links one at a time while keeping the whole list connected.'
  recognition: The problem asks to reverse an entire list, reverse a sublist between two positions, reverse
    in groups of k, or reorder/rearrange nodes, all under an O(1) extra space constraint.
  walkthrough: 'Set up three pointers: prev (initially null), curr (initially head), and a temporary next
    used to remember curr.next before overwriting it. On each iteration, save next = curr.next, rewire
    curr.next = prev, then advance prev = curr and curr = next. For sublist or k-group variants, first
    walk to the boundary node just before the segment you need to reverse, run the same three-pointer
    reversal only within that segment, then reconnect the segment''s new head and tail to the surrounding
    list - the node originally at the segment''s start becomes the tail and must point to whatever followed
    the segment. Draw the list on paper with 4-5 nodes before coding, since almost every bug here is a
    reconnection mistake at the segment boundary, not the core reversal loop.'
  telltaleSigns:
  - Reverse an entire linked list, a sublist, or groups of k nodes
  - Reorder or interleave nodes (e.g., first half / second half zipper)
  - Explicit O(1) extra space requirement on a linked list
  - Combined with fast/slow pointers to find a midpoint before reversing
  templateSteps:
  - Track prev, curr, and a temporary next reference
  - Save next = curr.next before mutating anything
  - Rewire curr.next = prev, then advance prev and curr
  - For sub-ranges, locate boundary nodes first and reconnect head/tail after reversing
  - Use a dummy-head node when the list's actual head might change
  commonMistakes:
  - Losing the rest of the list by rewiring curr.next before saving the original next
  - Forgetting a dummy head node, causing special-casing bugs when the head itself moves
  - Not reconnecting the reversed segment's tail to the node that follows it
  - Miscounting k or the sublist boundaries by one position
  whenNotToUse:
  - Random access or frequent lookups by value are needed (an array or hash map fits better)
  - The list can be rebuilt with O(n) extra space with no space constraint from the interviewer, where
    recursion may be clearer
  problems:
  - id: reverse-linked-list
    title: Reverse Linked List
    difficulty: EASY
    className: com.algoprep.patterns.linkedlist.ReverseLinkedList
    summary: Reverse a singly linked list iteratively and return the new head.
    whenToUse: The foundational three-pointer reversal template for every variant in this pattern.
    timeComplexity: O(n)
    spaceComplexity: O(1)
    hints:
