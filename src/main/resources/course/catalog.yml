- id: TOP_K_ELEMENTS
  order: 8
  week: 1
  title: Top K Elements
  subtitle: Keep only K candidates alive using a heap of size K
  intuition: When you only need the K largest, smallest, or most frequent elements out of N, sorting all
    N does unnecessary work - a heap of size K is enough, because you only ever need to compare new candidates
    against the current worst element that survived so far. This brings the cost down from O(n log n)
    to O(n log k), which matters when K is small relative to N.
  recognition: The problem explicitly asks for the top/largest/smallest/most-frequent K elements, K closest
    points, or otherwise wants a bounded subset rather than a full ordering of everything.
  walkthrough: 'Decide the heap orientation based on what you''re keeping: to find the K largest elements,
    use a min-heap of size K, since the smallest element in that heap is your current ''worst kept'' candidate
    and the one to evict. Push each new element, and once the heap exceeds size K, pop the top (the current
    minimum) to discard it. By the end, the heap holds exactly the K largest elements seen, though not
    necessarily in sorted order - sort the final heap contents only if the problem asks for an ordered
    result. For ''K most frequent'', first build a frequency map in one pass, then run the same size-K
    heap logic over the map''s entries using frequency as the comparison key (or use bucket sort by frequency
    for an O(n) alternative).'
  telltaleSigns:
  - '"Top K", "K largest/smallest/frequent", or "K closest" wording'
  - A full sort would work but is more expensive than necessary
  - Need a bounded-size result set out of a much larger input
  - Frequency counting combined with a size limit (top K frequent)
  templateSteps:
  - Choose a min-heap for "K largest" or a max-heap for "K smallest" (invert the usual heap)
  - Push elements one at a time, keeping the heap size capped at K
  - Pop the heap's top whenever size exceeds K, discarding the current worst candidate
  - Read off the final K elements (sort them only if order is required)
  - For frequency variants, build counts first, then apply the same size-K heap over count values
  commonMistakes:
  - Using a max-heap of all N elements instead of a min-heap of size K, losing the efficiency gain
  - Forgetting to cap the heap size, letting it grow past K
  - Comparing by the wrong key (e.g., value instead of frequency, or distance instead of coordinate)
  - Assuming heap order equals sorted order without an explicit final sort when required
  whenNotToUse:
  - K is close to N, so a full sort is simpler and not meaningfully slower
  - You need the exact sorted order of every element, not just the top K
  problems:
  - id: top-k-numbers
    title: Top K Numbers
    difficulty: EASY
    className: com.algoprep.patterns.topk.TopKNumbers
    summary: Return the K largest numbers from an unsorted array.
    whenToUse: A min-heap of size K is the direct application of the pattern.
    timeComplexity: O(n log k)
    spaceComplexity: O(k)
    hints:
    - Push the first K numbers, then compare every later number to the heap's top.
    - Replace the top only if the new number is larger.
    tags:
    - heap
    companies:
    - Amazon
    - Meta
    frequency: MEDIUM
  - id: k-closest-points
    title: K Closest Points to Origin
    difficulty: MEDIUM
    className: com.algoprep.patterns.topk.KClosestPoints
    summary: Return the K points with the smallest Euclidean distance to the origin.
    whenToUse: A max-heap of size K by distance keeps the farthest of the kept points ready to evict.
    timeComplexity: O(n log k)
    spaceComplexity: O(k)
    hints:
    - Compare squared distances to avoid unnecessary sqrt calls.
    - Evict the max-heap's top whenever the heap grows past K.
    tags:
    - heap
    - geometry
    companies:
    - FAANG
    - Amazon
    - Google
    frequency: HIGH
  - id: top-k-frequent
    title: Top K Frequent Numbers
    difficulty: MEDIUM
