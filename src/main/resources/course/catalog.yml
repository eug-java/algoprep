- id: SPRING_BOOT_INTERVIEW
  order: 29
  week: 4
  track: spring
  title: Spring Boot Interview Lab
  subtitle: Backend Java topics that appear alongside algorithms in interview loops
  intuition: 'Java backend interviews increasingly blend classic DSA with practical Spring Boot know-how:
    can you design a small REST resource, reason about bean lifecycle and scopes, explain when @Transactional
    actually commits or rolls back, and build concurrency-safe or idempotent behavior for a busy API?
    This module treats those questions the same way as an algorithm pattern - recognizable, teachable,
    and practiced with runnable code.'
  recognition: 'The interview is for a Java/Spring backend role and mixes coding with system-design-lite
    questions: designing an endpoint, discussing caching/eviction, explaining transaction boundaries,
    or implementing rate limiting/idempotency for reliability.'
  walkthrough: 'Treat each backend design question the same way you''d treat an algorithm problem: clarify
    requirements first (expected request volume, consistency needs, failure modes), then map those requirements
    onto known Spring/Java building blocks rather than inventing something from scratch. For a rate limiter,
    recognize it as a token-bucket or sliding-window counter problem and discuss where state lives (in-memory
    for a single instance, or a shared store like Redis for multiple instances). For idempotency, recognize
    the need to store a key-to-result mapping with a TTL so retried requests return the original result
    instead of re-executing a side effect. For questions about @Transactional or bean scopes, be ready
    to explain the underlying mechanism (proxying, propagation, rollback rules) rather than just naming
    the annotation. Always connect the concurrency or reliability concern back to a concrete implementation
    choice - a ConcurrentHashMap, an atomic counter, or a scheduled cleanup task - the same way you''d
    justify a data structure choice in a pure algorithm interview.'
  telltaleSigns:
  - Java backend or Spring-focused interview loop
  - Mix of "design a small API" system-design-lite with coding
  - Questions about bean lifecycle, @Transactional, or dependency injection scopes
  - 'Reliability concerns: idempotency, rate limiting, caching with eviction'
  templateSteps:
  - Clarify requirements (scale, consistency, single vs multi-instance) before designing
  - Map the requirement onto a known building block (token bucket, TTL map, ConcurrentHashMap)
  - Explain the underlying Spring mechanism, not just the annotation name, when asked
  - Keep services testable with clear side effects, separated from framework plumbing
  - Justify concurrency/reliability choices the same way you'd justify a data structure choice
  commonMistakes:
  - Naming an annotation (@Transactional, @Cacheable) without explaining the mechanism behind it
  - Designing for a single instance when the question implies a distributed/multi-instance deployment
  - Ignoring thread-safety in shared in-memory state (plain HashMap instead of ConcurrentHashMap)
  - Skipping requirement clarification and jumping straight to an implementation that doesn't match the
    actual constraints
  whenNotToUse:
  - The interview is purely algorithmic with no backend/system-design component (focus on the core DSA
    patterns instead)
  - The role doesn't use Spring specifically - the underlying concepts still apply, but framework-specific
    annotation trivia won't
  problems:
  - id: rate-limiter
    title: Token Bucket Rate Limiter
    difficulty: MEDIUM
    className: com.algoprep.patterns.spring.TokenBucketRateLimiter
    summary: Allow at most N requests per time window per key using token bucket semantics.
    whenToUse: A classic API gateway / interview concurrency design question about controlling request
      rate per client.
    timeComplexity: O(1)
    spaceComplexity: O(1) per key
    hints:
    - Track available tokens and a last-refill timestamp per key.
    - Refill tokens lazily based on elapsed time instead of running a background timer.
    tags:
    - spring
    - concurrency
    companies:
    - Fintech
    - Backend
    - Netflix
    frequency: HIGH
  - id: idempotency-store
    title: Idempotency Key Store
    difficulty: MEDIUM
    className: com.algoprep.patterns.spring.IdempotencyStore
    summary: Store request results keyed by an idempotency key with TTL semantics so retries are safe.
    whenToUse: Safe POST retries in payment-like APIs, where re-sending a request must not duplicate a
      side effect.
    timeComplexity: O(1)
    spaceComplexity: O(n)
    hints:
    - Store (result, expiryTimestamp) pairs keyed by the client-supplied idempotency key.
    - On a repeated key within the TTL window, return the stored result instead of re-executing the operation.
    tags:
    - spring
    - design
    companies:
    - Fintech
    - Backend
    - Amazon
    frequency: HIGH
  - id: circuit-breaker
    title: Circuit Breaker
    difficulty: HARD
    className: com.algoprep.patterns.spring.CircuitBreaker
    summary: Simple circuit breaker with failure threshold and open-state timeout.
    whenToUse: Protect callers from cascading failures.
    timeComplexity: O(1)
    spaceComplexity: O(1)
    hints:
    - Trip open after N failures
    - After timeout allow trial in HALF_OPEN
    tags:
    - spring
    - resilience
    companies:
    - Netflix
    - Backend
    - Microsoft
    frequency: MEDIUM
  - id: lru-http-cache
    title: HTTP Response Cache
    difficulty: MEDIUM
    className: com.algoprep.patterns.spring.HttpResponseCache
    summary: TTL cache for idempotent GET responses with capacity eviction.
    whenToUse: Cache-aside for read-heavy REST endpoints.
    timeComplexity: O(1)
    spaceComplexity: O(capacity)
    hints:
    - Store expiry timestamp
    - Evict expired on get; LRU when full
    tags:
    - spring
    - cache
    companies:
    - Backend
    - Amazon
    frequency: MEDIUM
  - id: config-store
    title: In-Memory Config Store
    difficulty: EASY
    className: com.algoprep.patterns.spring.ConfigStore
    summary: Thread-safe in-memory configuration key/value store.
    whenToUse: Simple Spring-style config bean for interviews.
    timeComplexity: O(1)
    spaceComplexity: O(n)
    hints:
    - ConcurrentHashMap under the hood
    - getOrDefault for missing keys
    tags:
    - spring
    companies:
    - Backend
    frequency: LOW
  - id: request-id-filter
    title: Request Id Filter
    difficulty: EASY
    className: com.algoprep.patterns.spring.RequestIdFilter
    summary: Generate or propagate an X-Request-Id per inbound request and expose it to downstream calls
      and logs.
    whenToUse: Every request needs a stable correlation id for tracing across services, whether or not
      the caller already supplied one.
    timeComplexity: O(1)
    spaceComplexity: O(1)
    hints:
    - If the incoming header is present and non-blank, reuse it; otherwise generate a new id.
    - Store the resolved id somewhere request-scoped (here, a simple holder) so later code can read it
      without re-threading a parameter.
    tags:
    - spring
    - web
    companies:
    - Backend
    - Microsoft
    frequency: HIGH
  - id: transactional-outbox
    title: Transactional Outbox
    difficulty: MEDIUM
    className: com.algoprep.patterns.spring.TransactionalOutbox
    summary: In-memory outbox queue that enqueues events with a DB write and publishes only the ones that
      are due.
    whenToUse: Reliably publish an event after a transactional write without a distributed transaction,
      by writing the event to an outbox table/queue in the same transaction and publishing it separately.
    timeComplexity: O(n) per publishDue call
    spaceComplexity: O(n)
    hints:
    - Enqueue stores the event with a status and an eligible-at timestamp instead of publishing immediately.
    - publishDue scans for PENDING events that are eligible now, hands each to the publisher, then marks
      it PUBLISHED (or leaves it PENDING to retry if the publisher throws).
    tags:
    - spring
    - reliability
    companies:
    - Fintech
    - Backend
    - Netflix
    frequency: HIGH
  - id: optimistic-lock-service
    title: Optimistic Lock Service
    difficulty: MEDIUM
    className: com.algoprep.patterns.spring.OptimisticLockService
    summary: Versioned record update that fails when the caller's expected version is stale.
    whenToUse: Concurrent updates to the same row without taking a database lock, analogous to a JPA @Version
      column and OptimisticLockException.
    timeComplexity: O(1)
    spaceComplexity: O(n)
    hints:
    - Store a version number alongside each record's value; every successful update increments it.
    - Reject an update whose expected version does not match the stored version instead of overwriting
      silently.
    tags:
    - spring
    - concurrency
    companies:
    - Fintech
    - Backend
    - Amazon
    frequency: MEDIUM
  - id: concurrent-login-tracker
    title: Concurrent Login Tracker
    difficulty: HARD
    className: com.algoprep.patterns.spring.ConcurrentLoginTracker
    summary: Track active sessions per user and enforce a maximum number of concurrent logins.
    whenToUse: 'Enforce a "max N devices logged in" policy: a new login should either be rejected or evict
      the oldest session, depending on policy, once the per-user limit is reached.'
    timeComplexity: O(1) amortized per login/logout
    spaceComplexity: O(active sessions)
    hints:
    - Keep an ordered per-user collection of active session ids so the oldest session is easy to find.
    - On a new login past the limit, either reject it or evict-and-replace the oldest session depending
      on the configured policy; make eviction and insertion atomic under one lock per user.
    tags:
    - spring
    - concurrency
    companies:
    - Backend
    - Netflix
    - Microsoft
    frequency: MEDIUM
  - id: sql-injection-safe-query
    title: SQL Injection Safe Query Builder
    difficulty: MEDIUM
    className: com.algoprep.patterns.spring.SqlInjectionSafeQuery
    summary: Build parameterized query placeholders from a column-to-value map, validating identifiers
      instead of concatenating raw input.
    whenToUse: Discuss/implement how a repository layer builds dynamic WHERE clauses safely - validate
      column names against an allow-list and always bind values as parameters, never string-concatenate
      them into SQL.
    timeComplexity: O(n) in the number of columns
    spaceComplexity: O(n)
    hints:
    - Validate every identifier (column name) against an allow-list pattern before using it in the generated
      SQL text.
    - Never inline the value itself - always emit a `?` placeholder and return the value list separately
      for a PreparedStatement to bind.
    tags:
    - spring
    - security
    companies:
    - Fintech
    - Backend
    - Microsoft
    frequency: HIGH
