  - id: course-schedule
    title: Course Schedule
    difficulty: MEDIUM
    className: com.algoprep.patterns.topo.CourseSchedule
    summary: Determine whether you can finish all courses given a list of prerequisite pairs.
    whenToUse: Cycle detection via topological sort - if not all nodes get processed, a cycle blocks completion.
    timeComplexity: O(V+E)
    spaceComplexity: O(V+E)
    hints:
    - Build the graph as prerequisite -> course.
    - If the processed-node count ends up less than the total course count, a cycle exists.
    tags:
    - graph
    - topo
    companies:
    - FAANG
    - Meta
    - Google
    - Amazon
    frequency: HIGH
