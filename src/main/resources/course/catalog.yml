- id: STACKS
  order: 18
  week: 3
  title: Stacks
  subtitle: LIFO for matching pairs, next-greater elements, and monotonic structures
  intuition: A stack is the natural fit whenever the answer to 'what does this element resolve?' depends
    on the most recently seen unresolved candidate - like the most recent unmatched opening bracket, or
    the closest previous element still waiting for something bigger to appear. Keeping the stack monotonic
    (always increasing or always decreasing) lets you resolve many elements in a single amortized O(n)
    pass instead of comparing every pair.
  recognition: The problem involves matching pairs (parentheses/brackets), finding the next/previous greater
    or smaller element, computing spans until a condition changes (daily temperatures), or computing areas/heights
    that depend on nearby taller/shorter elements (largest rectangle in histogram).
  walkthrough: 'For matching problems, push opening symbols onto the stack and, on each closing symbol,
    check that it matches the top of the stack before popping - a mismatch or an empty stack at the wrong
    time means the input is invalid. For next/previous-greater-element problems, iterate through the array
    while maintaining a monotonic stack of indices: before pushing the current element, pop everything
    smaller than it, since the current element is precisely the ''next greater'' answer for each popped
    index. Record that resolution as you pop, then push the current index. For histogram-style area problems,
    use the same monotonic stack idea but additionally compute a width whenever you pop, using the new
    stack top (or -1) as the left boundary and the current index as the right boundary. Always finish
    by draining any elements still left on the stack after the main loop, since they may represent unresolved
    candidates that reach the end of the array.'
  telltaleSigns:
  - Matching pairs of symbols (parentheses, brackets, tags)
  - '"Next greater/smaller element" or "previous greater/smaller element" wording'
  - Days/positions until a condition changes (daily temperatures style)
  - Largest rectangle, area, or span computations dependent on nearby elements
  - Explicit monotonic-stack opportunity in an array/sequence
  templateSteps:
  - 'For matching: push openers, and validate/pop against the top on each closer'
  - 'For next/previous greater: maintain a monotonic stack of indices, popping and resolving when the
    current element beats the top'
  - Record the resolution (distance, value, area) at the moment of popping, not before
  - For area/width problems, use the new stack top after popping as the boundary
  - Drain any remaining stack entries after the main loop to resolve leftover candidates
  commonMistakes:
  - Popping without recording the resolution for the popped element first
  - Using a stack of values instead of indices when distances/spans are required
  - Forgetting to drain the stack after the loop, leaving some elements unresolved
  - Getting the monotonic direction backwards (increasing vs decreasing) for the specific variant
  whenNotToUse:
  - The relationship between elements isn't about the 'most recent unresolved candidate' (a hash map or
    two-pointer approach may be simpler)
  - Random access into the middle of the pending-candidate sequence is needed (a stack only exposes the
    top)
  problems:
  - id: valid-parentheses
    title: Valid Parentheses
    difficulty: EASY
    className: com.algoprep.patterns.stacks.ValidParentheses
    summary: Check whether a string of brackets is properly matched and nested.
    whenToUse: The classic stack matching template for any bracket-validity question.
    timeComplexity: O(n)
    spaceComplexity: O(n)
    hints:
    - Push opening brackets; on a closing bracket, pop and check it matches.
    - The string is valid only if the stack is empty at the very end.
    tags:
    - stack
    companies:
    - FAANG
    - Amazon
    - Meta
    - Microsoft
    frequency: HIGH
  - id: daily-temperatures
    title: Daily Temperatures
    difficulty: MEDIUM
    className: com.algoprep.patterns.stacks.DailyTemperatures
    summary: For each day, find how many days until a warmer temperature occurs.
    whenToUse: A monotonic decreasing stack of indices resolves each day the moment a warmer one appears.
    timeComplexity: O(n)
    spaceComplexity: O(n)
    hints:
    - Keep indices on the stack, not temperatures, so you can compute day differences.
    - Pop and resolve every stacked index whose temperature is less than the current day's.
    tags:
    - stack
    - monotonic
    companies:
    - Amazon
    - Meta
    frequency: HIGH
  - id: next-greater-element
