- id: TWO_HEAPS
  order: 6
  week: 1
  title: Two Heaps
  subtitle: Balance a max-heap and a min-heap for medians and greedy scheduling
  intuition: 'Anything that asks for a running median, or for balancing ''low'' and ''high'' halves of
    a data stream, becomes simple once you keep two heaps: a max-heap for the smaller half and a min-heap
    for the larger half. Keeping the two heaps within one element of each other in size means the median
    is always available at one or both heap tops in O(1).'
  recognition: Find the median of a number stream arriving one at a time, sliding window median, or scheduling/greedy
    problems where you must repeatedly pick the best of a 'ready' set gated by what has become available
    (e.g., maximize capital).
  walkthrough: 'Maintain a max-heap holding the smaller half of numbers seen so far and a min-heap holding
    the larger half. When a new number arrives, decide which heap it belongs to by comparing it to the
    max-heap''s top, insert it there, then rebalance: if one heap has more than one extra element compared
    to the other, pop its top and push it to the other heap. The median is then either the top of the
    larger heap (odd total count) or the average of both tops (even count). For sliding window median,
    additionally track which elements need lazy deletion as the window moves; for ''maximize capital''
    style problems, use one heap to track what''s currently affordable and another to always pick the
    most profitable affordable option.'
  telltaleSigns:
  - Need a running / streaming median as elements arrive one at a time
  - Splitting numbers into two ordered halves (smaller half vs larger half)
  - Sliding window median
  - Scheduling needing "best currently available option" (max heap) gated by "what has become available"
    (min heap)
  templateSteps:
  - Maintain a max-heap for the lower half and a min-heap for the upper half
  - Insert each new element into the correct heap based on comparison with the max-heap's top
  - Rebalance so heap sizes differ by at most one element
  - Read the median from the top(s) of the heaps in O(1)
  - For scheduling variants, use one heap to gate availability and one heap to pick the best option
  commonMistakes:
  - Letting the two heaps drift more than one element apart in size
  - Comparing the new element to the wrong heap's top when deciding where to insert
  - Forgetting Java's PriorityQueue is a min-heap by default and needs a custom comparator for max-heap
    behavior
  - Not handling lazy deletion correctly in the sliding-window median variant, leaving stale elements
    in a heap
  whenNotToUse:
  - You need the full sorted order, not just the median or top elements (a TreeMap fits better)
  - Data doesn't need incremental updates - a one-time sort is simpler than maintaining two heaps
  problems:
  - id: find-median-stream
    title: Find the Median of a Number Stream
    difficulty: HARD
    className: com.algoprep.patterns.twoheaps.MedianFinder
    summary: Support inserting numbers one at a time and returning the running median.
    whenToUse: 'The textbook two-heaps problem: balance a max-heap and min-heap as numbers arrive.'
    timeComplexity: O(log n) insert, O(1) median
    spaceComplexity: O(n)
    hints:
    - Insert into the max-heap first, then move its top to the min-heap to keep order.
    - Rebalance sizes after every insert so they differ by at most one.
    tags:
    - heap
    companies:
    - FAANG
    - Google
    - Amazon
    frequency: HIGH
  - id: maximize-capital
    title: Maximize Capital
    difficulty: HARD
    className: com.algoprep.patterns.twoheaps.MaximizeCapital
    summary: Pick at most k projects to maximize final capital (the IPO problem).
    whenToUse: A min-heap by required capital to find affordable projects, paired with a max-heap by profit
      to pick the best one.
    timeComplexity: O(n log n)
    spaceComplexity: O(n)
    hints:
    - Push all projects affordable with current capital into a max-heap by profit.
    - Always take the top of the profit max-heap, then unlock newly affordable projects.
    tags:
    - heap
    - greedy
    companies:
    - Amazon
    frequency: MEDIUM
  - id: sliding-window-median
    title: Sliding Window Median
    difficulty: HARD
    className: com.algoprep.patterns.twoheaps.SlidingWindowMedian
