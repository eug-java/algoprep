- id: CYCLIC_SORT
  order: 14
  week: 2
  title: Cyclic Sort
  subtitle: Place each number in range [1..n] at its home index value-1
  intuition: When an array's values are guaranteed to fall in a known small range like 1..n (or 0..n),
    each value has a 'correct' home index it belongs at. Repeatedly swapping each out-of-place value into
    its correct index sorts the array in O(n) without extra space, and a leftover second pass instantly
    reveals missing or duplicate numbers because their slots either point to the wrong value or hold the
    wrong count.
  recognition: The array contains n (or close to n) numbers drawn from a small, known range like 1..n
    or 0..n-1, and the question is about finding a missing number, duplicate numbers, a corrupt pair,
    or the first missing positive - all under O(n) time and O(1) extra space constraints.
  walkthrough: 'Walk through the array with an index i, and while nums[i] is not already at its correct
    position (nums[i] - 1 != i, assuming values 1..n), swap nums[i] with the element currently sitting
    at nums[i]''s correct home index. Repeat this swapping at the same index i until the value there is
    either correctly placed or is a duplicate/out-of-range value that would swap with itself - only then
    advance i. After this single pass, do a second pass: any index i where nums[i] != i + 1 reveals either
    a missing number (i + 1 is missing) or, if looking for duplicates, the value that appears twice. Guard
    against infinite loops when duplicates exist, since a duplicate can never actually reach a ''correct''
    position already occupied by itself.'
  telltaleSigns:
  - Numbers in a known, small range tightly related to array indices (1..n or 0..n)
  - Need to find missing number(s), duplicate number(s), or a corrupt pair
  - O(n) time and O(1) extra space are explicitly required
  - '''First missing positive'' or similar index-mapping framing'
  templateSteps:
  - For each index i, check whether nums[i] is at its correct home index (value - 1)
  - If not, swap nums[i] with the element at its correct home index
  - Repeat the swap at index i until it holds a correctly placed or duplicate value, then advance
  - Make a second pass to detect any index whose value doesn't match its expected value
  - Report missing/duplicate numbers based on that mismatch
  commonMistakes:
  - Advancing i after only one swap instead of repeating swaps at i until it's settled
  - Infinite looping when a duplicate value keeps trying to swap into an already-correct slot
  - Off-by-one errors converting between value and index (value - 1 vs value)
  - Forgetting the array might use 0-indexed values instead of 1-indexed, changing the mapping formula
  whenNotToUse:
  - Values are not confined to a small range tied to the array's length (a hash set or sort is needed
    instead)
  - The array must not be mutated, and no extra O(n) space is allowed for a read-only copy
  problems:
  - id: cyclic-sort
    title: Cyclic Sort
    difficulty: EASY
    className: com.algoprep.patterns.cyclicsort.CyclicSort
    summary: Sort an array containing numbers from 1 to n in-place.
    whenToUse: The direct, textbook application of the pattern.
    timeComplexity: O(n)
    spaceComplexity: O(1)
    hints:
    - While nums[i] isn't at index nums[i]-1, swap it there.
    - Each element is swapped at most once into its final place, keeping it O(n).
    tags:
    - cyclic-sort
    companies:
    - Amazon
    frequency: MEDIUM
  - id: find-missing-number
    title: Find the Missing Number
    difficulty: EASY
    className: com.algoprep.patterns.cyclicsort.FindMissingNumber
    summary: Given n distinct numbers taken from 0..n, find the one number missing from the array.
    whenToUse: Cyclic-place the numbers (or use sum/XOR math); here, cyclic sort then scan for the mismatch.
    timeComplexity: O(n)
    spaceComplexity: O(1)
    hints:
    - Place each value v at index v when v < n.
    - After placing, the first index i where nums[i] != i is the missing number.
    tags:
    - cyclic-sort
    companies:
    - Amazon
    - Microsoft
    frequency: HIGH
  - id: find-all-duplicates
    title: Find All Duplicate Numbers
    difficulty: MEDIUM
    className: com.algoprep.patterns.cyclicsort.FindAllDuplicates
    summary: Given numbers from 1..n where some appear twice, return all the duplicates.
    whenToUse: Place each value by index; whatever can't be placed because its slot is taken is a duplicate.
    timeComplexity: O(n)
    spaceComplexity: O(1) excluding output
    hints:
    - Run cyclic sort placement as usual.
    - After placement, any index i where nums[i] != i + 1 holds a duplicate value.
    tags:
    - cyclic-sort
    companies:
    - Amazon
    frequency: MEDIUM
  - id: find-duplicate-number
    title: Find the Duplicate Number
    difficulty: MEDIUM
    className: com.algoprep.patterns.cyclicsort.FindDuplicateNumber
    summary: Array of n+1 ints in 1..n with one duplicate; find it without modifying.
    whenToUse: Floyd cycle on index→value graph (or cyclic place).
    timeComplexity: O(n)
    spaceComplexity: O(1)
    hints:
    - Treat as linked list where next = nums[i]
    - Find cycle entrance
    tags:
    - cyclic-sort
    - cycle
