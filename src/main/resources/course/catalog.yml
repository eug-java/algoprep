- id: BITWISE
  order: 27
  week: 4
  title: Bitwise Manipulation
  subtitle: Use XOR, shifts, and masks for sets, parity, and constant-space tricks
  intuition: 'Bit manipulation tricks come from a small set of core identities: XOR-ing a number with
    itself cancels to zero (useful for finding unpaired elements), shifting left/right multiplies/divides
    by powers of two, and AND-ing with a mask isolates specific bits or checks flags. Recognizing which
    identity maps to a problem usually turns an O(n) extra-space solution into an O(1) extra-space one.'
  recognition: The problem involves finding a single unique element among duplicates, counting set bits,
    checking whether a number is a power of two, or otherwise hints that a constant-space arithmetic trick
    exists instead of a hash set or array.
  walkthrough: 'First identify which bitwise identity applies: if every element appears an even number
    of times except one, XOR-ing everything together isolates the odd one out, since a XOR a equals zero
    for any a. If you need to count set bits, remember that n & (n - 1) clears exactly the lowest set
    bit, so repeating that operation until n becomes zero counts the bits in a number of iterations equal
    to the popcount. If you need to check a power of two, note that powers of two have exactly one set
    bit, so n & (n - 1) equal to zero (for positive n) confirms it directly. Once matched, implement it
    carefully in Java specifically, watching for sign-bit behavior on negative numbers and int overflow,
    since >> is an arithmetic (sign-extending) shift while >>> is logical - picking the wrong one silently
    produces incorrect results for negative inputs.'
  telltaleSigns:
  - Every element appears in pairs except exactly one (or a similar parity pattern)
  - Counting set bits ("Hamming weight") or checking powers of two
  - Generating or iterating over subset bitmasks
  - A hash set/array solution exists but O(1) extra space is requested or implied
  templateSteps:
  - Identify which core bitwise identity fits (XOR cancellation, AND masking, shifting)
  - Map the problem's requirement to that identity explicitly before coding
  - Implement carefully, watching Java's signed integers and >> vs >>> behavior
  - Verify against a small example including negative numbers or edge values (0, Integer.MIN_VALUE)
  - Fall back to a hash set/array approach if no clean bitwise identity actually fits
  commonMistakes:
  - Using >> when >>> (unsigned shift) was needed, or vice versa, breaking negative-number cases
  - Forgetting operator precedence, mixing bitwise operators with arithmetic ones incorrectly
  - Assuming a bitwise trick generalizes when the problem's actual constraint doesn't match the identity
  - Not testing edge cases like 0, negative numbers, or Integer.MIN_VALUE where shifts and masks behave
    unexpectedly
  whenNotToUse:
  - No convenient bit-level identity actually matches the problem's structure - forcing one produces obscure,
    hard-to-verify code for no real gain
  - The interviewer or problem cares more about readability than the last constant factor of space, and
    a hash set is clearer
  problems:
  - id: single-number
    title: Single Number
    difficulty: EASY
    className: com.algoprep.patterns.bitwise.SingleNumber
    summary: Every element in an array appears twice except one - find that one.
    whenToUse: XOR every element together; paired values cancel to zero, leaving only the unpaired one.
    timeComplexity: O(n)
    spaceComplexity: O(1)
    hints:
    - a XOR a = 0 and a XOR 0 = a, so pairs vanish regardless of order.
    - No extra space or sorting is needed - a single pass of XOR suffices.
    tags:
    - bit
    companies:
    - Amazon
    - Meta
    frequency: HIGH
  - id: number-of-1-bits
    title: Number of 1 Bits
    difficulty: EASY
    className: com.algoprep.patterns.bitwise.NumberOf1Bits
    summary: Count the number of set bits (Hamming weight) in an integer.
    whenToUse: n &= n-1 clears the lowest set bit each time, so looping until n is zero counts the bits
      directly.
    timeComplexity: O(1)
    spaceComplexity: O(1)
    hints:
    - Each iteration of n &= (n - 1) removes exactly one set bit.
    - The loop runs exactly popcount(n) times, which is already efficient without checking every bit position.
    tags:
    - bit
    companies:
    - Amazon
    - Apple
    frequency: HIGH
  - id: single-number-ii
    title: Single Number II
    difficulty: MEDIUM
    className: com.algoprep.patterns.bitwise.SingleNumberII
    summary: Every element appears thrice except one — find it.
    whenToUse: Bit counts mod 3, or ones/twos state machine.
    timeComplexity: O(n)
    spaceComplexity: O(1)
    hints:
    - Count each bit mod 3
    - Or maintain ones/twos masks
    tags:
    - bit
    companies:
    - Amazon
    frequency: MEDIUM
  - id: sum-of-two-integers
    title: Sum of Two Integers
    difficulty: MEDIUM
    className: com.algoprep.patterns.bitwise.SumOfTwoIntegers
    summary: Sum two integers without + or - operators.
    whenToUse: XOR for sum bits, AND<<1 for carry loop.
    timeComplexity: O(1)
    spaceComplexity: O(1)
    hints:
    - a^b sum without carry
    - (a&b)<<1 is carry
    tags:
    - bit
    companies:
    - Amazon
    - Apple
    frequency: MEDIUM
  - id: reverse-bits
    title: Reverse Bits
    difficulty: EASY
    className: com.algoprep.patterns.bitwise.ReverseBits
    summary: Reverse bits of a 32-bit unsigned integer.
    whenToUse: Shift/accumulate bit by bit.
    timeComplexity: O(1)
    spaceComplexity: O(1)
    hints:
    - Loop 32 times
    - result = (result<<1) | (n&1); n>>>=1
    tags:
    - bit
    companies:
    - Apple
    - Amazon
    frequency: MEDIUM
  - id: bitwise-and-range
    title: Bitwise AND of Numbers Range
    difficulty: HARD
    className: com.algoprep.patterns.bitwise.BitwiseAndRange
    summary: Bitwise AND of all numbers in [left, right].
    whenToUse: Shift until left==right to clear differing low bits.
    timeComplexity: O(1)
    spaceComplexity: O(1)
    hints:
    - While left < right, right &= right-1 or shift both
    - Common prefix bits survive
    tags:
    - bit
    companies:
    - Backend
    frequency: LOW
- id: MATH_GEOMETRY
  order: 28
  week: 4
  title: Math & Geometry
  subtitle: Number theory and coordinate geometry identities for interviews
  intuition: A meaningful slice of interview problems are really about knowing a specific mathematical
    identity or geometric formula rather than a data-structure trick - GCD/LCM relationships, modular
    arithmetic, prime factorization, or coordinate formulas for area, distance, and rotation. Spotting
    which identity applies and reducing the problem to it before coding usually saves far more time than
    debugging an ad hoc numerical approach.
  recognition: The problem is framed in terms of pure numbers or coordinates rather than a data structure
    - palindrome numbers, GCD of strings, computing powers efficiently, rectangle/point geometry, or determining
    whether points form a valid shape.
  walkthrough: 'Before writing any code, ask whether the problem reduces to a known identity: does it
    involve divisibility (GCD/LCM), exponentiation (fast power via repeated squaring), modular arithmetic
    (mod for cycling or overflow avoidance), or coordinate geometry (distance formula, cross product for
    orientation, shoelace formula for area)? Once identified, reduce the problem statement to that identity
    explicitly - for example, ''string a is the GCD of two strings'' reduces to checking str1+str2 ==
    str2+str1 and then taking the GCD of the two lengths. Implement the identity carefully, paying attention
    to overflow (use long instead of int for intermediate products), sign handling for negative exponents
    or coordinates, and edge cases like zero, negative numbers, or degenerate shapes. Finally, verify
    your formula against two or three hand-computed small examples before trusting it on the full input,
    since a math-based solution that''s subtly wrong tends to fail silently rather than crash.'
  telltaleSigns:
  - Pure number theory or arithmetic framing without a natural data-structure fit
  - Coordinates, shapes, or geometric relationships between points
  - Efficient exponentiation, GCD/LCM, or modular arithmetic requirements
  - Overflow-prone computations that need long/mod handling
  templateSteps:
  - Identify the mathematical or geometric identity the problem reduces to
  - Rewrite the problem statement explicitly in terms of that identity
  - Implement carefully, watching for overflow (use long) and sign/edge cases
  - Handle degenerate inputs explicitly (zero, negative values, collinear points)
  - Verify the formula against a few small hand-computed examples before trusting it
  commonMistakes:
  - Integer overflow from not using long for intermediate products or sums
  - Missing edge cases like zero, negative numbers, or degenerate geometric shapes
  - Reimplementing a well-known formula (GCD, fast power) incorrectly instead of using the standard recursive/iterative
    form
  - Not verifying the derived identity against a small hand-worked example before coding the general case
  whenNotToUse:
  - The problem is fundamentally about data organization or search rather than a numeric/geometric identity
  - A brute-force numeric approach is already fast enough given the input constraints, so a clever identity
    adds risk without meaningful benefit
  problems:
  - id: pow-x-n
    title: Pow(x, n)
    difficulty: MEDIUM
    className: com.algoprep.patterns.math.PowXN
    summary: Compute x raised to the power n efficiently using binary exponentiation.
    whenToUse: Fast power via repeated squaring; halve the exponent each step instead of multiplying n
      times.
    timeComplexity: O(log n)
    spaceComplexity: O(1)
    hints:
    - If n is even, x^n = (x*x)^(n/2); if odd, peel off one factor of x first.
    - Handle negative n by computing 1 / x^(-n), and watch for Integer.MIN_VALUE overflow when negating.
    tags:
    - math
    companies:
    - Google
    - Amazon
    frequency: MEDIUM
  - id: gcd-of-strings
    title: Greatest Common Divisor of Strings
    difficulty: EASY
    className: com.algoprep.patterns.math.GcdOfStrings
    summary: Find the largest string that divides both of two given strings.
    whenToUse: Check str1+str2 == str2+str1 first, then take the substring of length gcd(len1, len2).
    timeComplexity: O(n)
    spaceComplexity: O(n)
    hints:
    - Two strings share a divisor string only if concatenating them in either order gives the same result.
    - If that check passes, the answer is the prefix of length gcd(str1.length(), str2.length()).
    tags:
    - math
    - string
    companies:
    - Backend
    frequency: LOW
  - id: sqrt
    title: Sqrt(x)
    difficulty: EASY
    className: com.algoprep.patterns.math.SqrtX
    summary: Integer square root of x (floor).
    whenToUse: Binary search on answer space.
    timeComplexity: O(log x)
    spaceComplexity: O(1)
    hints:
    - Search mid*mid <= x
    - Watch overflow with long
    tags:
    - math
    - binary-search
    companies:
    - Amazon
    - Apple
    frequency: MEDIUM
  - id: integer-to-roman
    title: Integer to Roman
