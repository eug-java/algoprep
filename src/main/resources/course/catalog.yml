- id: SORT_AND_SEARCH
  order: 16
  week: 3
  title: Sort and Search
  subtitle: Sort by the right key to unlock adjacent comparisons or binary search
  intuition: Many problems that look complicated become simple once you sort the data by the right key,
    because sorting exposes structure - equal or related items become adjacent, and searching within sorted
    data can drop from O(n) to O(log n). The skill here is recognizing which key to sort by (not necessarily
    the raw value) and what becomes possible - grouping, adjacent comparison, or binary search - once
    the data is ordered.
  recognition: The problem doesn't fit a specific classic pattern, but sorting by a cleverly chosen key
    (a normalized string, a coordinate, a ratio) turns it into an easy adjacent-comparison or binary-search
    problem.
  walkthrough: Ask what key, if sorted, would bring related items next to each other or expose a useful
    order - for grouping anagrams, that key is each word's letters sorted alphabetically; for scheduling,
    it might be start or end time; for search-suggestion problems, simple lexicographic order of the product
    list. Sort once using that key, accepting the O(n log n) cost up front. Then either do a single linear
    scan comparing adjacent elements (for grouping/counting problems) or run binary search for each query
    (for repeated lookups), rather than re-scanning the whole dataset per query. When a custom comparator
    is needed, write it explicitly and test it on a tricky pair of elements before wiring it into the
    full sort, since a subtly wrong comparator silently produces wrong groupings or search results without
    throwing any error.
  telltaleSigns:
  - The natural order of the input doesn't matter for the answer's correctness
  - A well-chosen sort key turns the problem into adjacent comparisons or binary search
  - Custom comparator needed (by string signature, by ratio, by a derived value)
  - Repeated lookups into a dataset that doesn't change between queries
  templateSteps:
  - Identify the key that, once sorted, groups or orders the data usefully
  - Sort once by that key (with a custom comparator if needed)
  - Scan adjacently for grouping/counting, or binary search per query for lookups
  - Use a hash map alongside the sort when grouping by the sort key
  - Validate the comparator on a hand-picked tricky pair before trusting the full sort
  commonMistakes:
  - Sorting by the raw value when a derived key (signature, ratio) is what actually matters
  - Writing a comparator with an inconsistent (non-transitive) ordering, producing subtly wrong sorts
  - Re-sorting on every query instead of sorting once and reusing the result
  - Forgetting stability requirements when the problem needs ties broken by original order
  whenNotToUse:
  - The data must remain in its original order for correctness (sorting would destroy needed information)
  - Sorting costs more than the problem's required time complexity allows (e.g., an O(n) target with no
    way to avoid a full sort)
  problems:
  - id: group-anagrams
    title: Group Anagrams
    difficulty: MEDIUM
    className: com.algoprep.patterns.sortsearch.GroupAnagrams
    summary: Group an array of strings so that all anagrams of each other end up together.
    whenToUse: Sort each word's characters to build a canonical key, then group by that key in a hash
      map.
    timeComplexity: O(n * k log k)
    spaceComplexity: O(n * k)
    hints:
    - Two strings are anagrams exactly when their sorted character sequences are equal.
    - Use the sorted string (or a character-count signature) as the hash map key.
    tags:
    - hash-map
    - sort
    companies:
    - FAANG
    - Meta
    - Amazon
    frequency: HIGH
  - id: search-suggestions
    title: Search Suggestions (sorted prefix)
    difficulty: MEDIUM
    className: com.algoprep.patterns.sortsearch.SearchSuggestions
    summary: For each prefix of a search word, return up to 3 lexicographically smallest matching products.
    whenToUse: Sort products once, then binary search each growing prefix's lower bound instead of rescanning.
    timeComplexity: O(n log n + m * log n)
    spaceComplexity: O(n)
    hints:
    - Sort the product list lexicographically up front.
    - For each prefix, binary search for its lower bound and take up to 3 matches from there.
    tags:
