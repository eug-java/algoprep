- id: GREEDY
  order: 11
  week: 2
  title: Greedy Techniques
  subtitle: Commit to the locally optimal choice that provably preserves a global invariant
  intuition: A greedy algorithm commits to the choice that looks best right now and never revisits it,
    which only works when you can argue (or recall from experience) that this local choice never rules
    out a globally optimal solution. In interviews, greedy problems usually reduce to sorting by the right
    key and then scanning once while maintaining a small running invariant, such as the farthest index
    reachable so far.
  recognition: The problem mentions scheduling, intervals, resource allocation, or reachability, and a
    locally-obvious choice (earliest deadline, farthest reach, smallest cost) seems 'safe' - often confirmed
    by trying a small counterexample and failing to break it.
  walkthrough: First state the greedy rule out loud to your interviewer in one sentence, such as 'always
    jump to the position that extends my farthest reach the most.' Sanity-check it against a small example,
    including an adversarial-looking one, to convince both yourself and the interviewer it doesn't miss
    better options. Sort the input by whatever key the rule depends on (start time, deadline, ratio, etc.)
    if it isn't already ordered that way. Finally, scan once, updating a small amount of running state
    (a farthest-reach variable, a count, a running sum) and making the greedy decision at each step without
    ever looking back - if you find yourself needing to undo a decision, the problem likely isn't greedy
    and needs DP or backtracking instead.
  telltaleSigns:
  - A locally optimal choice seems safe and doesn't appear to block better future options
  - Sorting by a key (start time, deadline, ratio, end time) then scanning once solves it
  - Reachability / jump-style problems tracking a 'farthest so far' value
  - Interval scheduling to maximize count or minimize resources
  templateSteps:
  - State the greedy rule explicitly and sanity check it against a tricky example
  - Sort the input by the key the greedy rule depends on
  - Scan once left to right, maintaining minimal running state
  - Apply the greedy decision at each step without revisiting earlier choices
  - Return the accumulated result (count, farthest reach, total cost) at the end
  commonMistakes:
  - Assuming greedy works without testing it against a counterexample first
  - Sorting by the wrong key (e.g., start time when the rule actually depends on end time)
  - Needing to 'undo' a greedy choice later - a sign the problem actually needs DP, not greedy
  - Off-by-one errors in the running invariant (e.g., updating farthest reach before checking reachability)
  whenNotToUse:
  - You can't argue the local choice preserves optimality, and a small counterexample breaks it (use DP
    instead)
  - The problem requires considering combinations of choices together, not one independent decision at
    a time
  problems:
  - id: jump-game
    title: Jump Game
    difficulty: MEDIUM
    className: com.algoprep.patterns.greedy.JumpGame
    summary: Determine whether you can reach the last index given max-jump lengths at each position.
    whenToUse: Track the farthest reachable index while scanning; if the current index ever exceeds it,
      you're stuck.
    timeComplexity: O(n)
    spaceComplexity: O(1)
    hints:
    - Update farthest = max(farthest, i + nums[i]) at each index.
    - If i ever exceeds farthest, the last index is unreachable.
    tags:
    - greedy
    companies:
    - FAANG
    - Amazon
    - Google
    frequency: HIGH
  - id: jump-game-ii
    title: Jump Game II
    difficulty: MEDIUM
    className: com.algoprep.patterns.greedy.JumpGameII
    summary: Find the minimum number of jumps required to reach the last index.
    whenToUse: 'BFS-like level expansion: track the current jump''s farthest end and the overall farthest
      reach.'
    timeComplexity: O(n)
    spaceComplexity: O(1)
    hints:
    - When i reaches the current jump's end, increment jumps and set the end to the farthest seen so far.
    - This greedily expands one 'level' at a time, similar to BFS on an implicit graph.
    tags:
    - greedy
    companies:
    - Amazon
    - Google
    frequency: MEDIUM
  - id: gas-station
    title: Gas Station
    difficulty: MEDIUM
    className: com.algoprep.patterns.greedy.GasStation
    summary: Starting station index to complete the circuit, or -1.
    whenToUse: Greedy reset of start when tank goes negative.
    timeComplexity: O(n)
    spaceComplexity: O(1)
    hints:
    - If total gas < total cost impossible
    - When tank < 0, start = i+1 and reset tank
    tags:
    - greedy
    companies:
    - Amazon
    - Meta
    frequency: MEDIUM
  - id: candy
    title: Candy
    difficulty: HARD
    className: com.algoprep.patterns.greedy.Candy
    summary: Minimum candies so higher-rated neighbors get more.
    whenToUse: Two-pass greedy left-to-right and right-to-left.
    timeComplexity: O(n)
    spaceComplexity: O(n)
    hints:
    - Ensure rising slopes left→right
    - Then enforce rising slopes right→left with max
    tags:
    - greedy
    companies:
    - Google
    - Amazon
    frequency: MEDIUM
  - id: assign-cookies
    title: Assign Cookies
    difficulty: EASY
    className: com.algoprep.patterns.greedy.AssignCookies
    summary: Maximize content children by assigning cookies greedily.
    whenToUse: Sort both arrays and assign the smallest sufficient cookie.
    timeComplexity: O(n log n)
    spaceComplexity: O(1)
    hints:
    - Sort greed and cookie sizes
    - 'Two pointers: give cookie only when it fits'
    tags:
    - greedy
    companies:
    - Backend
    frequency: LOW
- id: BACKTRACKING
  order: 12
  week: 2
  title: Backtracking
  subtitle: Choose, explore, undo - search the decision tree with pruning
  intuition: Backtracking explores a decision tree of partial solutions, committing to a choice, recursing
    deeper, and undoing ('unchoosing') that choice the moment it proves invalid or once all its children
    have been explored. The undo step is what separates backtracking from plain DFS - it lets you reuse
    the same mutable state across every branch instead of copying it.
  recognition: The problem is a constraint-satisfaction or combinatorial search task - N-Queens, Sudoku,
    word search on a grid, combination sum, or palindrome partitioning - and asks for all valid solutions,
    any one valid solution, or a count of them.
  walkthrough: 'Design your recursive function to represent one decision point: try a candidate value,
    mark whatever state needs marking (place a queen, mark a grid cell visited, add a number to the running
    combination), and recurse into the next decision. If the recursion reaches a complete, valid solution,
    record it; if it reaches a state that can never become valid, return immediately (this is your pruning).
    Either way, before trying the next sibling candidate, undo the exact state changes you made so the
    next branch starts from a clean, correct state. Add pruning as early as possible, checking partial
    constraints before recursing further rather than only checking full-board or full-combination validity
    at the leaves, since that''s what keeps runtime from exploding on larger inputs.'
  telltaleSigns:
  - Constraint-satisfaction or combinatorial search (N-Queens, Sudoku, word search)
  - Need all valid solutions, or any one valid arrangement, or a count of solutions
  - A partial candidate can be checked for validity before it's complete (enabling pruning)
  - Explicit grid/board/path exploration with a 'visited' or 'used' marker to undo
  templateSteps:
  - Choose a candidate value or move for the current decision point
  - Apply it to the shared state (mark visited, add to path, place a piece)
  - Recurse into the next decision, or record the solution if complete
  - Undo the exact change made before trying the next candidate
  - Prune early by checking partial validity, not just full-solution validity
  commonMistakes:
  - Forgetting to undo a state change, corrupting subsequent branches of the search
  - Copying large state structures at every recursive call instead of mutating and undoing in place
  - Checking validity only at the leaves instead of pruning early, causing unnecessary exponential blowup
  - Off-by-one errors in loop bounds when trying the next candidate (e.g., reusing an index already used)
  whenNotToUse:
  - The search space is provably enormous with no effective pruning, and only an approximate/greedy answer
    is needed
  - Overlapping subproblems exist and can be memoized - dynamic programming will be far faster than exhaustive
    backtracking
  problems:
  - id: combination-sum
    title: Combination Sum
    difficulty: MEDIUM
    className: com.algoprep.patterns.backtracking.CombinationSum
    summary: Find all unique combinations of candidates that sum to a target; numbers can be reused.
    whenToUse: Classic backtracking with a start index that prevents generating permutations of the same
      combination.
    timeComplexity: O(2^n) worst-case
    spaceComplexity: O(target)
    hints:
    - Pass the same start index (not start+1) when reusing a number.
    - Prune the branch as soon as the running sum exceeds the target.
    tags:
    - backtracking
    companies:
    - FAANG
    - Amazon
    - Meta
    frequency: HIGH
  - id: word-search
    title: Word Search
    difficulty: MEDIUM
    className: com.algoprep.patterns.backtracking.WordSearch
    summary: Determine whether a word exists in a grid via adjacent cells, each used at most once.
    whenToUse: DFS/backtracking from each cell, marking visited cells and unmarking them on backtrack.
    timeComplexity: O(m*n*4^L)
    spaceComplexity: O(L)
    hints:
    - Mark a cell visited before recursing into its neighbors, and unmark it right after.
    - Prune immediately if the current cell's letter doesn't match the needed character.
    tags:
    - backtracking
    - matrix
    companies:
    - FAANG
    - Amazon
    - Meta
    frequency: HIGH
  - id: n-queens
    title: N-Queens
    difficulty: HARD
    className: com.algoprep.patterns.backtracking.NQueens
    summary: All distinct solutions to the n-queens puzzle.
    whenToUse: Place row by row; prune columns/diagonals.
    timeComplexity: O(n!)
    spaceComplexity: O(n)
    hints:
    - Track cols and both diagonals
    - Build board strings at leaves
    tags:
    - backtracking
    companies:
    - Google
    - Amazon
    frequency: MEDIUM
  - id: sudoku-solver
    title: Sudoku Solver
    difficulty: HARD
    className: com.algoprep.patterns.backtracking.SudokuSolver
    summary: Fill a 9×9 sudoku board in-place.
    whenToUse: Try digits 1-9 with box/row/col constraints.
    timeComplexity: O(9^m)
    spaceComplexity: O(1)
    hints:
    - Find next empty cell
    - Check row, column, and 3x3 box
    tags:
    - backtracking
    companies:
    - Google
    - Apple
    frequency: MEDIUM
  - id: letter-case-permutation
    title: Letter Case Permutation
    difficulty: EASY
    className: com.algoprep.patterns.backtracking.LetterCasePermutation
    summary: Return all strings formed by toggling letter case.
    whenToUse: Simple backtracking / branching on letters only.
    timeComplexity: O(2^L · n)
    spaceComplexity: O(2^L · n)
    hints:
    - Digits stay fixed
    - Branch lower/upper for each letter
    tags:
    - backtracking
    companies:
    - Backend
    frequency: LOW
- id: DYNAMIC_PROGRAMMING
  order: 13
  week: 2
  title: Dynamic Programming
  subtitle: Overlapping subproblems and optimal substructure, solved once and reused
  intuition: Dynamic programming applies when a problem has optimal substructure (the best answer is built
    from the best answers to smaller subproblems) and overlapping subproblems (the same smaller subproblem
    is needed multiple times). Instead of recomputing those overlapping subproblems from scratch, you
    store each subproblem's answer once, either top-down with memoization or bottom-up by filling a table
    in dependency order.
  recognition: The problem asks for an optimal count, minimum/maximum value, or number of ways, and a
    brute-force recursive solution would revisit the exact same smaller inputs repeatedly - classic examples
    include knapsack variants, longest increasing subsequence, house robber, edit distance, and counting
    unique paths.
  walkthrough: 'Start by defining what dp[i] (or dp[i][j]) actually represents in plain English - this
    is the single most important step and should be stated before any code is written. Write the recurrence
    relating dp[i] to smaller subproblems, and identify the base case(s) that need no further recursion.
    Decide on a fill order so every value a recurrence depends on is already computed when needed, then
    implement either top-down memoized recursion or a bottom-up loop. Once correct, look for a space optimization:
    if dp[i] only depends on the last one or two rows/values, you can often collapse an O(n^2) space table
    down to O(n) or O(1) - but only after the naive version works and you''ve explained the recurrence
    clearly to your interviewer.'
  telltaleSigns:
  - Asks for an optimal (min/max) value or a count of ways, not just any valid arrangement
  - A brute-force recursive solution would recompute identical smaller subproblems repeatedly
  - Choices at each step interact with a running budget/capacity/target (knapsack-style)
  - Problem can be phrased as 'best answer using the first i elements' or similar prefix framing
  templateSteps:
  - Define the meaning of dp[i] or dp[i][j] in one clear sentence
  - Write the recurrence relating it to smaller subproblems, plus base case(s)
  - Choose an iteration order where dependencies are always computed first
  - Implement bottom-up (table) or top-down (memoized recursion)
  - Optimize space afterward if dp only depends on a small window of previous states
  commonMistakes:
  - Writing code before clearly stating what dp[i] means, leading to a wrong or unprovable recurrence
  - Missing or incorrect base cases, causing off-by-one errors throughout the table
  - Iterating in the wrong order so a dependency hasn't been computed yet when needed
  - Prematurely optimizing space before the straightforward version is verified correct
  whenNotToUse:
  - Subproblems don't actually overlap - plain divide and conquer or greedy will be simpler and just as
    fast
  - The problem only needs a single feasible answer, not an optimum, and pruned backtracking is more direct
  problems:
  - id: climbing-stairs
    title: Climbing Stairs
    difficulty: EASY
    className: com.algoprep.patterns.dp.ClimbingStairs
    summary: Count the distinct ways to climb n steps, taking 1 or 2 steps at a time.
    whenToUse: 'A Fibonacci-shaped DP intro: dp[i] = dp[i-1] + dp[i-2].'
    timeComplexity: O(n)
    spaceComplexity: O(1)
    hints:
    - The base cases are dp[1]=1 and dp[2]=2.
    - Only the last two values are ever needed, so O(1) space works.
    tags:
    - dp
    companies:
    - FAANG
    - Amazon
    - Apple
    frequency: HIGH
  - id: house-robber
    title: House Robber
    difficulty: MEDIUM
    className: com.algoprep.patterns.dp.HouseRobber
    summary: Find the maximum money you can rob without robbing two adjacent houses.
    whenToUse: dp[i] = max(dp[i-1], dp[i-2] + nums[i]) - decide to skip or take each house.
    timeComplexity: O(n)
    spaceComplexity: O(1)
    hints:
    - At each house, either skip it (keep dp[i-1]) or rob it (dp[i-2] + nums[i]).
    - Only the previous two dp values need to be kept.
    tags:
    - dp
    companies:
    - FAANG
    - Amazon
    - Google
    frequency: HIGH
  - id: 0-1-knapsack
    title: 0/1 Knapsack
    difficulty: MEDIUM
    className: com.algoprep.patterns.dp.Knapsack01
    summary: Maximize value packed into a weight capacity when each item can be used at most once.
    whenToUse: Classic 2D (or 1D reverse-iteration) knapsack DP over item index and remaining capacity.
    timeComplexity: O(n*W)
    spaceComplexity: O(W)
    hints:
    - dp[c] represents the best value achievable with capacity c.
    - Iterate capacity from high to low in the 1D version so each item is only used once.
    tags:
    - dp
    - knapsack
    companies:
    - Amazon
    - Google
    frequency: MEDIUM
  - id: coin-change
    title: Coin Change
    difficulty: MEDIUM
    className: com.algoprep.patterns.dp.CoinChange
    summary: Fewest coins to make amount, or -1.
    whenToUse: Unbounded knapsack DP on amount.
    timeComplexity: O(amount·coins)
    spaceComplexity: O(amount)
    hints:
    - dp[x] = min over coins of dp[x-c]+1
    - Init dp[0]=0, others +inf
    tags:
    - dp
    companies:
    - FAANG
    - Amazon
    - Google
    frequency: HIGH
  - id: edit-distance
    title: Edit Distance
    difficulty: HARD
