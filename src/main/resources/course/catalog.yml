    title: Word Search II
    difficulty: HARD
    className: com.algoprep.patterns.trie.WordSearchII
    summary: Find all dictionary words on the board via adjacent cells.
    whenToUse: Trie of words + DFS pruning on board.
    timeComplexity: O(m·n·4·L)
    spaceComplexity: O(dictionary)
    hints:
    - Build trie of words
    - Remove word from trie when found to dedupe
    tags:
    - trie
    - backtracking
    companies:
    - Google
    - Amazon
    frequency: MEDIUM
