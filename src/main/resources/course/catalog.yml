- id: MODIFIED_BINARY_SEARCH
  order: 9
  week: 2
  title: Modified Binary Search
  subtitle: 'Binary search beyond simple target lookup: rotated arrays, boundaries, and answer spaces'
  intuition: 'Standard binary search finds one target in a fully sorted array, but many interview problems
    bend that idea: the array is rotated, you need the first or last position of a value, or you''re searching
    an answer space rather than an array at all. The unifying trick is to keep an invariant about which
    half of the current range is ''sorted'' or ''still could contain the answer'', and always discard
    the half that provably cannot.'
  recognition: The array is sorted or rotated-sorted with a known pivot, you need the first/last occurrence
    of a value, you're searching a bitonic array, or the problem says 'find the minimum x such that condition(x)
    holds' over a monotonic predicate.
  walkthrough: 'Start with low and high pointers spanning the search range and compute mid on each iteration.
    Before deciding to move left or right, figure out extra structure: for a rotated array, check whether
    the left half or right half is the actually-sorted one by comparing nums[low] to nums[mid]. Then check
    whether the target could lie within that sorted half''s value range; if so, search there, otherwise
    search the other half. For ''find first/last occurrence'' problems, don''t stop at the first match
    - keep searching left (or right) even after finding a match, narrowing high (or low) toward the boundary.
    For ''search on answer'' problems, replace array comparisons with a boolean predicate function, and
    binary search over the range of possible answers instead of array indices.'
  telltaleSigns:
  - Sorted array that has been rotated at an unknown pivot
  - Need the first or last occurrence of a value, not just any occurrence
  - Bitonic array (increases then decreases, or vice versa)
  - Phrase "minimize/maximize x such that condition(x) is true/false" over a monotonic predicate
  - Search space is conceptually infinite or unbounded
  templateSteps:
  - Set low/high to span the search range (array indices or an answer range)
  - Compute mid and determine which half retains the useful invariant (sorted / target-range / predicate)
  - Discard the half that cannot contain the answer
  - For first/last occurrence, keep narrowing past the first match instead of returning immediately
  - Repeat until low > high, then use the last valid candidate found
  commonMistakes:
  - Assuming the whole array is sorted after rotation instead of checking which half currently is
  - Returning on the first match found instead of continuing to narrow toward first/last occurrence
  - Off-by-one errors moving low = mid vs low = mid + 1, causing infinite loops
  - Using array-index binary search logic directly on an answer-space search without adapting the predicate
  whenNotToUse:
  - The data has no monotonic or sorted structure at all to exploit
  - The array is small enough, or searched so rarely, that a linear scan is simpler and equally fast in
    practice
  problems:
  - id: order-agnostic-binary-search
    title: Order-Agnostic Binary Search
    difficulty: EASY
    className: com.algoprep.patterns.binarysearch.OrderAgnosticBinarySearch
    summary: Search for a target in an array sorted either ascending or descending.
    whenToUse: Detect the order from the two end elements once, then run standard binary search adapted
      to that order.
    timeComplexity: O(log n)
    spaceComplexity: O(1)
    hints:
    - Compare the first and last elements to decide ascending vs descending.
    - Flip the comparison direction based on which order was detected.
    tags:
    - binary-search
    companies:
    - Amazon
    frequency: MEDIUM
  - id: search-rotated-array
    title: Search in Rotated Sorted Array
    difficulty: MEDIUM
    className: com.algoprep.patterns.binarysearch.SearchRotatedArray
    summary: Find a target's index in a rotated sorted array with unique elements.
    whenToUse: At mid, one side is always sorted - search there if the target falls in its range, otherwise
      search the other side.
    timeComplexity: O(log n)
    spaceComplexity: O(1)
    hints:
    - Compare nums[low] to nums[mid] to find which half is sorted.
    - Check if target lies within the sorted half's value range before recursing into it.
    tags:
    - binary-search
    companies:
    - FAANG
    - Meta
    - Amazon
    frequency: HIGH
  - id: find-range
