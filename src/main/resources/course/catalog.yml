- id: TREE_DFS
  order: 20
  week: 3
  title: Tree Depth-First Search
  subtitle: Recurse through root-to-leaf and subtree problems
  intuition: 'Most binary tree problems are naturally recursive: process the current node, recurse into
    the left and right children, and combine their results into an answer for the current node. The recursion''s
    return value is the key design decision - deciding exactly what a subtree''s recursive call should
    hand back to its parent is what makes path-sum, diameter, and LCA problems click.'
  recognition: The problem is about a binary (or general) tree and asks about root-to-leaf paths, subtree
    properties, diameter/longest-path, lowest common ancestor, serialization, or any property naturally
    computed by combining left and right subtree results.
  walkthrough: 'Define precisely what your recursive function returns for a given node - a boolean, a
    list, or a numeric value. Write the base case first: what happens at a null node, since that''s always
    the simplest case and anchors the recursion. Then write the recursive case: call the function on the
    left and right children, and combine their two results according to the problem''s rule (sum, max,
    boolean AND/OR, list concatenation). For problems needing an answer that isn''t the direct return
    value (like diameter, a path possibly not through the root), maintain a separate ''best answer so
    far'' variable updated as a side effect during the recursion, while the return value itself stays
    focused on what the parent needs (e.g., height). Trace through a small 3-4 node tree by hand to confirm
    both the base case and the combination step before trusting the code.'
  telltaleSigns:
  - Binary tree with a path, subtree property, or combined-left-right-result question
  - Root-to-leaf path sum or path enumeration
  - Diameter, longest path, or 'max path sum' (possibly not through the root)
  - Lowest common ancestor or serialize/deserialize style problems
  templateSteps:
  - Decide exactly what the recursive call returns for a given node
  - Write the null/base case first
  - Recurse into left and right children
  - Combine the two children's results according to the problem's rule
  - Track any 'best answer so far' as a side variable when the answer isn't simply the return value
  commonMistakes:
  - Forgetting the null/base case, causing NullPointerExceptions
  - Conflating what the function returns to its parent with the actual final answer needed (e.g., diameter
    vs height)
  - Not resetting or properly scoping a 'best so far' variable when it needs to persist across the whole
    traversal
  - Recomputing subtree properties instead of reusing the values already computed in the recursive call
  whenNotToUse:
  - The tree is extremely unbalanced/deep, risking stack overflow, and an iterative approach with an explicit
    stack is safer
  - The problem needs level-by-level information (depth, level order) - tree BFS is the more natural fit
  problems:
  - id: path-sum
    title: Path Sum
    difficulty: EASY
    className: com.algoprep.patterns.treedfs.PathSum
    summary: Determine whether a root-to-leaf path exists whose values sum to a given target.
    whenToUse: DFS subtracting the current node's value from the remaining target as you descend.
    timeComplexity: O(n)
    spaceComplexity: O(h)
    hints:
    - At a leaf, check whether the remaining target equals the leaf's value.
    - Recurse into children with target minus the current node's value.
    tags:
    - tree
    - dfs
    companies:
    - Amazon
    - Microsoft
    frequency: HIGH
  - id: all-path-sum
    title: All Paths for a Sum
    difficulty: MEDIUM
    className: com.algoprep.patterns.treedfs.AllPathsForSum
    summary: Return every root-to-leaf path whose values sum to a given target.
    whenToUse: DFS while building a running path list, backtracking (removing the last element) after
      each recursive call.
    timeComplexity: O(n^2) worst-case copy
    spaceComplexity: O(n)
    hints:
    - Add the current node to a shared path list before recursing, remove it after.
    - Only copy the path into the result list when a leaf matches the remaining target exactly.
    tags:
    - tree
    - dfs
    companies:
    - Amazon
    frequency: MEDIUM
  - id: tree-diameter
    title: Binary Tree Diameter
    difficulty: MEDIUM
    className: com.algoprep.patterns.treedfs.TreeDiameter
    summary: Find the length (in edges) of the longest path between any two nodes.
    whenToUse: DFS computing subtree height while updating a separate 'best diameter' variable from left+right
      heights.
    timeComplexity: O(n)
    spaceComplexity: O(h)
    hints:
    - The function should return height, but update a side variable with left_height + right_height.
    - The diameter at a node may not pass through the root, so track the max across every node.
    tags:
    - tree
    - dfs
    companies:
    - Amazon
    - Google
    frequency: MEDIUM
  - id: lowest-common-ancestor
    title: Lowest Common Ancestor
    difficulty: MEDIUM
    className: com.algoprep.patterns.treedfs.LowestCommonAncestor
    summary: LCA of two nodes in a binary tree.
    whenToUse: 'Post-order: if both sides nonempty, root is LCA.'
    timeComplexity: O(n)
    spaceComplexity: O(h)
    hints:
    - Return non-null from subtree containing p/q
    - If both left and right non-null, root is answer
    tags:
    - tree
    - dfs
    companies:
    - FAANG
    - Amazon
    - Meta
    - Microsoft
    frequency: HIGH
  - id: max-path-sum
    title: Binary Tree Maximum Path Sum
