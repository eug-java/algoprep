    summary: Return the K most frequent elements in an array.
    whenToUse: Build a frequency map first, then run a size-K heap keyed by frequency.
    timeComplexity: O(n log k)
    spaceComplexity: O(n)
    hints:
    - Count frequencies with a hash map in one pass.
    - Push (value, frequency) pairs into a min-heap ordered by frequency, capped at size K.
    tags:
