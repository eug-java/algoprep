    whenToUse: Precompute next-greater for every value in nums2 with a monotonic stack, then map nums1's
      answers via a hash map.
    timeComplexity: O(n)
    spaceComplexity: O(n)
    hints:
    - Build the full next-greater mapping for nums2 in one monotonic-stack pass.
    - Look up each nums1 value in that mapping instead of rescanning nums2 per query.
