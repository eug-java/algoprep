    summary: Replace words with their shortest dictionary root prefix.
    whenToUse: Trie of roots; walk each word until end mark.
    timeComplexity: O(total chars)
    spaceComplexity: O(dictionary)
    hints:
    - Insert all roots
    - Stop at first isEnd along the word
    tags:
    - trie
    companies:
    - Backend
    frequency: LOW
