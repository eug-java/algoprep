challenges:
- id: trap-rain-water
  title: Trapping Rain Water
  difficulty: HARD
  prompt: Given n non-negative integers representing an elevation map where the width of each bar is 1,
    compute how much water it can trap after raining. Water sits above a bar only up to the height allowed
    by the shorter of the tallest bar to its left and the tallest bar to its right, so think carefully
    about what determines the water level at each position before reaching for a specific pattern.
  className: com.algoprep.patterns.challenge.TrapRainWater
  hiddenPattern: TWO_POINTERS
  alternatePatterns: [DYNAMIC_PROGRAMMING]
  timeComplexity: O(n)
  spaceComplexity: O(1)
  hints:
  - "What, on each side of a bar, caps the water?"
  - "Water at a bar cannot rise above the shorter of the tallest bars already seen on each side."
  - "Advance the side whose running maximum is smaller, because that side's water level is already decided."
- id: longest-repeating-replacement
  title: Longest Repeating Character Replacement
  difficulty: HARD
  prompt: You are given a string s and an integer k. You can choose any character of the string and change
    it to any other uppercase English character, and you may perform this operation at most k times. Return
    the length of the longest substring containing the same letter you can get after performing the operations.
    Think about what makes a window of the string 'achievable' with at most k replacements before deciding
    on an approach.
  className: com.algoprep.patterns.challenge.LongestRepeatingReplacement
  hiddenPattern: SLIDING_WINDOW
  timeComplexity: O(n)
  spaceComplexity: O(1)
  hints:
  - "When is a stretch still achievable with only k replacements?"
  - "A stretch is valid while its length minus its most frequent character is at most k."
  - "Grow the right edge, and do not pull the left edge back below the longest valid length already seen."
- id: employee-free-time
  title: Employee Free Time
  difficulty: HARD
  prompt: We are given a list schedule of employees, which represents the working time for each employee.
    Each employee has a list of non-overlapping Intervals, and these intervals are sorted within each
    employee's own schedule. Return the list of finite common free intervals for all employees, sorted
    by start time. Consider how you might combine multiple employees' schedules into a single timeline
    before looking for gaps.
  className: com.algoprep.patterns.challenge.EmployeeFreeTime
  hiddenPattern: INTERVALS
  timeComplexity: O(n log n)
  spaceComplexity: O(n)
  hints:
  - "Where is a gap that every employee shares?"
  - "Once every busy interval sits on one timeline, a gap between two merged busy blocks is free for everyone."
  - "Order by start, merge overlaps, and emit each positive gap between a merged end and the next start."
- id: median-of-two-sorted
  title: Median of Two Sorted Arrays
  difficulty: HARD
  prompt: Given two sorted arrays nums1 and nums2 of size m and n respectively, return the median of the
    two sorted arrays. The overall runtime complexity should be O(log (m+n)), which rules out simply merging
    the arrays. Think about what property of a valid partition point across both arrays would let you
    locate the median without ever fully merging.
  className: com.algoprep.patterns.challenge.MedianOfTwoSortedArrays
  hiddenPattern: MODIFIED_BINARY_SEARCH
  timeComplexity: O(log(min(m,n)))
  spaceComplexity: O(1)
  hints:
  - "What would a cut through both arrays have to satisfy to sit on the median?"
  - "Every value on the left of the cut is at most every value on the right."
  - "Search the cut on the shorter array until the four boundary values are in order; the median is among those boundaries."
- id: word-ladder
  title: Word Ladder
  difficulty: HARD
  prompt: A transformation sequence from word beginWord to word endWord using a dictionary wordList is
    a sequence of words beginWord -> s1 -> s2 -> ... -> sk such that every adjacent pair of words differs
    by a single letter, and every intermediate word exists in wordList. Return the number of words in
    the shortest such transformation sequence from beginWord to endWord, or 0 if no such sequence exists.
    Think about what a 'one letter different' relationship between words implies about the overall structure
    connecting them.
  className: com.algoprep.patterns.challenge.WordLadder
  hiddenPattern: GRAPHS
  timeComplexity: O(N * L^2)
  spaceComplexity: O(N * L)
  hints:
  - "What counts as one step away from the current word?"
  - "Two words are one step apart when they differ by exactly one letter, and the answer is the fewest such steps."
  - "From the current word, try each one-letter change that is still unused in the dictionary, and do not revisit a word."
- id: serialize-binary-tree
  title: Serialize and Deserialize Binary Tree
  difficulty: HARD
  prompt: Design an algorithm to serialize and deserialize a binary tree. There is no restriction on how
    your serialization/deserialization algorithm works - you just need to ensure a binary tree can be
    serialized to a string and this string can be deserialized back to the original tree structure. Think
    about which traversal order preserves enough structural information to rebuild the tree unambiguously,
    including where null children belong.
  className: com.algoprep.patterns.challenge.SerializeBinaryTree
  hiddenPattern: TREE_DFS
  alternatePatterns: [TREE_BFS]
  timeComplexity: O(n)
  spaceComplexity: O(n)
  hints:
  - "What has to be written so a missing child is not confused with the end of the tree?"
  - "A null marker occupies every missing child, so the token stream has a slot for every branch."
  - "Write values and null markers in one fixed order, then rebuild by consuming that same order."
- id: largest-rectangle-histogram
  title: Largest Rectangle in Histogram
  difficulty: HARD
  prompt: Given an array of integers heights representing a histogram's bar heights where the width of
    each bar is 1, return the area of the largest rectangle that can be formed within the histogram. Think
    about, for each bar, how far it could extend left and right while still being the shortest bar in
    that span, rather than checking every possible rectangle directly.
  className: com.algoprep.patterns.challenge.LargestRectangleHistogram
  hiddenPattern: STACKS
  timeComplexity: O(n)
  spaceComplexity: O(n)
  hints:
  - "For this bar, how far can it extend while it stays the shortest?"
  - "The rectangle that uses this bar as its shortest side stops at the first strictly shorter bar on each side."
  - "When a shorter bar arrives, the bar you set aside has its right edge at the new index and its left edge just after the previous unresolved index."
- id: alien-dictionary
  title: Alien Dictionary
  difficulty: HARD
  prompt: There is a new alien language that uses the English alphabet, but the order among the letters
    is unknown to you. You are given a list of words from the alien language's dictionary, where the words
    are sorted lexicographically according to the rules of this new language. Derive the order of letters
    in this language from that word list. If the order is invalid, return an empty string; if multiple
    valid orders exist, return any one of them. Think about what comparing each pair of adjacent words
    can tell you about individual letter ordering.
  className: com.algoprep.patterns.challenge.AlienDictionary
  hiddenPattern: TOPOLOGICAL_SORT
  timeComplexity: O(C)
  spaceComplexity: O(1) alphabet-bounded
  hints:
  - "What does the first position where two neighboring words differ tell you?"
  - "That pair of letters is a precedence: the letter in the earlier word comes first."
  - "Collect those precedences, then repeatedly take a letter that no remaining rule still places after another."
- id: sliding-window-maximum
  title: Sliding Window Maximum
  difficulty: HARD
  prompt: You are given an array of integers nums and an integer sliding window of size k which is moving
    from the very left of the array to the very right. You can only see the k numbers in the window. Each
    time the sliding window moves right by one position, return an array of the maximum value in each window.
    A nested scan of every window is too slow for interview expectations — think about how to reuse work
    as the window slides.
  className: com.algoprep.patterns.challenge.SlidingWindowMaximum
  hiddenPattern: SLIDING_WINDOW
  alternatePatterns: [TOP_K_ELEMENTS]
  timeComplexity: O(n)
  spaceComplexity: O(k)
  hints:
  - "Which earlier index can never be the maximum of any later window?"
  - "Candidates stay in decreasing value order, and the front candidate is still inside the window."
  - "Drop indexes that have fallen out of the window, and drop smaller values before accepting the new index."
- id: word-break-ii
  title: Word Break II
  difficulty: HARD
  prompt: Given a string s and a dictionary of strings wordDict, add spaces in s to construct a sentence
    where each word is a valid dictionary word. Return all such possible sentences in any order. Note that
    the same word in the dictionary may be reused multiple times in the segmentation. Before coding, decide
    how you will explore every valid cut without recomputing dead-end prefixes forever.
  className: com.algoprep.patterns.challenge.WordBreakII
  hiddenPattern: BACKTRACKING
  alternatePatterns: [DYNAMIC_PROGRAMMING]
  timeComplexity: O(2^n * n) worst-case
  spaceComplexity: O(n)
  hints:
  - "Which cut is worth continuing, and which prefix is a dead end?"
  - "A cut is legal only when the piece just taken is in the dictionary."
  - "When the end of the string is reached, join the chosen pieces with spaces."
- id: russian-doll-envelopes
  title: Russian Doll Envelopes
  difficulty: HARD
  prompt: You are given a 2D array of integers envelopes where envelopes[i] = [wi, hi] represents the width
    and the height of an envelope. One envelope can fit into another if and only if both the width and height
    of one envelope are greater than the other. Return the maximum number of envelopes you can Russian doll
    (put one inside the other). Rotation is not allowed. Think about how this relates to longest increasing
    subsequence after a careful sort.
  className: com.algoprep.patterns.challenge.RussianDollEnvelopes
  hiddenPattern: DYNAMIC_PROGRAMMING
  alternatePatterns: [MODIFIED_BINARY_SEARCH]
  timeComplexity: O(n log n)
  spaceComplexity: O(n)
  hints:
  - "After you fix an order of the envelopes, what is left to maximize?"
  - "Equal widths cannot nest, so among equal widths the heights must be taken so the remaining heights can still increase."
  - "The longest chain is the longest strictly increasing run of those heights."
- id: minimum-window-subsequence
  title: Minimum Window Subsequence
  difficulty: HARD
  prompt: Given strings s and t, return the minimum contiguous window substring of s so that t is a subsequence
    of that window. If there is no such window, return the empty string. If there are multiple minimum-length
    windows, return the one with the leftmost starting index. This is not the classic minimum window substring
    problem — t need not appear as a contiguous block inside the window.
  className: com.algoprep.patterns.challenge.MinimumWindowSubsequence
  hiddenPattern: TWO_POINTERS
  alternatePatterns: [DYNAMIC_PROGRAMMING]
  timeComplexity: O(n^2)
  spaceComplexity: O(1)
  hints:
  - "Once the pattern has been covered in order, how far back can this window start?"
  - "The best window is the shortest, and among ties the leftmost, and it ends on a match of the pattern's last character."
  - "Expand until the pattern is covered in order, then walk back to the earliest start that still covers it."

- id: count-of-smaller
  title: Count of Smaller Numbers After Self
  difficulty: HARD
  prompt: Given an integer array nums, return a new counts array where counts[i] is the number of smaller
    elements to the right of nums[i]. Interviewers often accept more than one family of solutions — think
    carefully about sorting-based divide-and-conquer versus fenwick/segment-tree approaches before committing.
  className: com.algoprep.patterns.challenge.CountOfSmallerNumbers
  hiddenPattern: SORT_AND_SEARCH
  alternatePatterns: [DYNAMIC_PROGRAMMING]
  timeComplexity: O(n log n)
  spaceComplexity: O(n)
  hints:
  - "When this value moves past others, which of those others are smaller and still to its right?"
  - "Each value's count is the number of smaller values that pass it while ordered halves are combined."
  - "As the halves are combined, add the number of already-taken smaller values to the larger value they pass."
- id: palindrome-pairs
  title: Palindrome Pairs
  difficulty: HARD
  prompt: Given a list of unique words, return all pairs of distinct indices (i, j) such that the concatenation
    words[i] + words[j] is a palindrome. There may be empty strings in the list. Consider how a hash map of
    reversed words interacts with checking palindromic prefixes and suffixes.
  className: com.algoprep.patterns.challenge.PalindromePairs
  hiddenPattern: HASH_MAPS
  alternatePatterns: [TRIE]
  timeComplexity: O(n * k^2)
  spaceComplexity: O(n * k)
  hints:
  - "Which other word would finish a palindrome on this word's unmatched side?"
  - "A pair works when the unmatched side is itself a palindrome and the other side is the reverse of a word you stored."
  - "For each cut of a word, look up the reverse of one side among the words already indexed."
- id: task-scheduler
  title: Task Scheduler
  difficulty: HARD
  prompt: Given a characters array tasks representing the tasks a CPU needs to do, where each letter stands
    for a different task. Tasks can be done in any order. Each task takes one unit of time. Between two
    same tasks there must be at least n units of non-same tasks or idle time. Return the least number of
    units of times the CPU will take to finish all the given tasks.
  className: com.algoprep.patterns.challenge.TaskScheduler
  hiddenPattern: GREEDY
  alternatePatterns: [TOP_K_ELEMENTS]
  timeComplexity: O(n)
  spaceComplexity: O(1)
  hints:
  - "What forces idle time: the number of tasks, or the one that repeats most?"
  - "The busiest task leaves a gap of n after each copy except the last, and other tasks can fill those gaps."
  - "The time taken is the larger of the task count and the length forced by the busiest task's gaps."
