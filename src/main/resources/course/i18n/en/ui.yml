courseDescription: AlgoPrep teaches coding interviews through reusable patterns, not memorized solutions.
  Each pattern comes with recognition cues, a step-by-step interview walkthrough, a Java template, common
  pitfalls, and progressively harder problems backed by JUnit tests. Work through the four-week roadmap,
  then test yourself with the unlabeled Challenge Yourself set. A bonus module covers Spring Boot interview
  topics for Java backend roles.
weeks:
  1: Week 1 — Two-pointer & heap foundations
  2: Week 2 — Search, recursion & dynamic programming
  3: Week 3 — Graphs, trees & matrices
  4: Week 4 — Tracking, design, bits & bonus Spring Boot
cheatsheet:
- q: Contiguous subarray/substring with a sum or distinct-count constraint?
  a: Sliding Window
- q: Sorted array, need a pair/triplet hitting a target, or in-place reversal?
  a: Two Pointers
- q: Linked list cycle, middle node, or a value sequence that might loop?
  a: Fast & Slow Pointers
- q: Need a running median or to balance two ordered halves of a stream?
  a: Two Heaps
- q: Merge several already-sorted lists/arrays, or find the k-th across them?
  a: K-way Merge
- q: Need only the top/largest/smallest/most-frequent K elements, not a full sort?
  a: Top K Elements
- q: Sorted or rotated array; need first/last occurrence, or search an answer space?
  a: Modified Binary Search
- q: Generate all subsets, permutations, or combinations?
  a: Subsets
- q: A locally-best choice, once sorted by the right key, seems to never backfire?
  a: Greedy
- q: Need all valid solutions/boards via choose-explore-undo?
  a: Backtracking
- q: Optimal value/count with overlapping subproblems and optimal substructure?
  a: Dynamic Programming
- q: Numbers confined to range 1..n; need missing/duplicate values in O(1) space?
  a: Cyclic Sort
- q: Tasks with prerequisites; need a valid order or cycle detection?
  a: Topological Sort
- q: Explicit or implicit graph; connectivity, components, or shortest unweighted path?
  a: Graphs
- q: Binary tree path sum, diameter, or lowest common ancestor?
  a: Tree DFS
- q: Fast complement/frequency check, or prefix-sum counting, in one pass?
  a: Hash Maps
