courseDescription: AlgoPrep is a self-contained Java interview training ground. Each pattern module teaches
  how to recognize a problem class, explain the approach out loud, apply a reusable Java template, avoid
  common traps, and practice with Easy → Medium → Hard drills backed by JUnit. Finish a pattern, then
  stress-test recognition in Blind Spot mode (no pattern labels). A bonus track covers Spring Boot topics
  for Java backend interviews.
weeks:
  1: Hash maps, two pointers, windows, lists
  2: Trees, graphs, and traversal
  3: Search, recursion, and dynamic programming
  4: Intervals, heaps, design, and Spring
cheatsheet:
- q: Contiguous subarray/substring with a sum or distinct-count constraint?
  a: Sliding Window
- q: Sorted array, need a pair/triplet hitting a target, or in-place reversal?
  a: Two Pointers
- q: Linked list cycle, middle node, or a value sequence that might loop?
  a: Fast & Slow Pointers
- q: Need a running median or to balance two ordered halves of a stream?
  a: Two Heaps
- q: Merge several already-sorted lists/arrays, or find the k-th across them?
  a: K-way Merge
- q: Need only the top/largest/smallest/most-frequent K elements, not a full sort?
  a: Top K Elements
- q: Sorted or rotated array; need first/last occurrence, or search an answer space?
  a: Modified Binary Search
- q: Generate all subsets, permutations, or combinations?
  a: Subsets
- q: A locally-best choice, once sorted by the right key, seems to never backfire?
  a: Greedy
- q: Need all valid solutions/boards via choose-explore-undo?
  a: Backtracking
- q: Optimal value/count with overlapping subproblems and optimal substructure?
  a: Dynamic Programming
- q: Numbers confined to range 1..n; need missing/duplicate values in O(1) space?
  a: Cyclic Sort
- q: Tasks with prerequisites; need a valid order or cycle detection?
  a: Topological Sort
- q: Explicit or implicit graph; connectivity, components, or shortest unweighted path?
  a: Graphs
- q: Binary tree path sum, diameter, or lowest common ancestor?
  a: Tree DFS
- q: Fast complement/frequency check, or prefix-sum counting, in one pass?
  a: Hash Maps
- q: Overlapping meetings, or a sweep of start and end times?
  a: Intervals
- q: Next greater element, daily temperatures, or a histogram rectangle?
  a: Stacks
- q: Prefix dictionary, autocomplete, or many words on a board?
  a: Trie
- q: Dynamic connectivity, or "are these two nodes in the same component?"
  a: Union Find
- q: Spiral order, rotate a matrix, or set a row and column to zero?
  a: Matrices
- q: Reverse a list, or reverse every k nodes, in place?
  a: In-place Linked List
- q: One number appears once, or you need to set and test bits?
  a: Bitwise
- q: A running balance of 0s and 1s, or a majority candidate you can track in one pass?
  a: Knowing What to Track
