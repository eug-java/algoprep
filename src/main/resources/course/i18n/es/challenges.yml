challenges:
  trap-rain-water:
    title: Atrapar agua de lluvia
    prompt: Dados n enteros no negativos que representan un mapa de elevación donde el ancho de cada barra
      es 1, calcula cuánta agua puede atrapar después de llover. El agua sobre una barra solo se mantiene
      hasta la altura permitida por la más baja entre la barra más alta a su izquierda y la más alta a
      su derecha, así que piensa con cuidado qué determina el nivel de agua en cada posición antes de
      recurrir a un patrón específico.
    hints:
    - "¿Qué, a cada lado de una barra, limita el agua?"
    - "El agua sobre una barra no sube por encima del menor de los máximos ya vistos a cada lado."
    - "Avanza el lado cuyo máximo en curso es menor, porque el nivel de agua de ese lado ya está decidido."
  longest-repeating-replacement:
    title: Reemplazo más largo de caracteres repetidos
    prompt: Se te da una cadena s y un entero k. Puedes elegir cualquier carácter de la cadena y cambiarlo
      por cualquier otra letra mayúscula del inglés, y puedes realizar esta operación como máximo k veces.
      Devuelve la longitud de la subcadena más larga con la misma letra que puedas obtener tras realizar
      las operaciones. Piensa qué hace que una ventana de la cadena sea 'alcanzable' con a lo sumo k reemplazos
      antes de decidir un enfoque.
    hints:
    - "¿Cuándo un tramo sigue siendo alcanzable con solo k reemplazos?"
    - "Un tramo es válido mientras su longitud menos su carácter más frecuente es como máximo k."
    - "Crece el borde derecho y no retires el izquierdo por debajo de la longitud válida más larga ya vista."
  employee-free-time:
    title: Tiempo libre de empleados
    prompt: Se nos da una lista de horarios de empleados, que representa el tiempo de trabajo de cada
      empleado. Cada empleado tiene una lista de intervalos sin solapamiento, ordenados dentro de su propio
      horario. Devuelve la lista de intervalos libres comunes finitos para todos los empleados, ordenados
      por hora de inicio. Considera cómo combinar los horarios de varios empleados en una sola línea de
      tiempo antes de buscar huecos.
    hints:
    - "¿Dónde hay un hueco que comparten todos los empleados?"
    - "Cuando todo intervalo ocupado está en una sola línea, un hueco entre dos bloques ocupados fusionados está libre para todos."
    - "Ordena por inicio, fusiona solapes y emite cada hueco positivo entre un fin fusionado y el siguiente inicio."
  median-of-two-sorted:
    title: Mediana de dos arreglos ordenados
    prompt: Dados dos arreglos ordenados nums1 y nums2 de tamaño m y n respectivamente, devuelve la mediana
      de los dos arreglos ordenados. La complejidad temporal general debe ser O(log (m+n)), lo cual descarta
      simplemente fusionar los arreglos. Piensa qué propiedad de un punto de partición válido en ambos
      arreglos te permitiría ubicar la mediana sin fusionarlos por completo.
    hints:
    - "¿Qué tendría que cumplir un corte por ambos arreglos para caer en la mediana?"
    - "Todo valor a la izquierda del corte es como máximo todo valor a la derecha."
    - "Busca el corte en el arreglo más corto hasta que los cuatro valores de frontera queden en orden; la mediana está entre esas fronteras."
  word-ladder:
    title: Escalera de palabras
    prompt: Una secuencia de transformación de la palabra beginWord a la palabra endWord usando un diccionario
      wordList es una secuencia de palabras beginWord -> s1 -> s2 -> ... -> sk tal que cada par de palabras
      adyacentes difiere en una sola letra, y cada palabra intermedia existe en wordList. Devuelve el
      número de palabras en la secuencia de transformación más corta de beginWord a endWord, o 0 si no
      existe tal secuencia. Piensa qué implica la relación de 'difiere en una letra' entre palabras sobre
      la estructura general que las conecta.
    hints:
    - "¿Qué cuenta como un paso desde la palabra actual?"
    - "Dos palabras están a un paso cuando difieren en exactamente una letra, y la respuesta es el menor número de esos pasos."
    - "Desde la palabra actual, prueba cada cambio de una letra que siga sin usarse en el diccionario, y no revisites una palabra."
  serialize-binary-tree:
    title: Serializar y deserializar árbol binario
    prompt: Diseña un algoritmo para serializar y deserializar un árbol binario. No hay restricción sobre
      cómo funciona tu algoritmo de serialización/deserialización -solo necesitas asegurar que un árbol
      binario pueda serializarse a una cadena y que esa cadena pueda deserializarse de vuelta a la estructura
      de árbol original. Piensa qué orden de recorrido preserva suficiente información estructural para
      reconstruir el árbol sin ambigüedad, incluyendo dónde van los hijos nulos.
    hints:
    - "¿Qué hay que escribir para que un hijo ausente no se confunda con el fin del árbol?"
    - "Un marcador nulo ocupa cada hijo ausente, así que el flujo de tokens tiene un hueco para cada rama."
    - "Escribe valores y marcadores nulos en un orden fijo, y reconstruye consumiendo ese mismo orden."
  largest-rectangle-histogram:
    title: Rectángulo más grande en un histograma
    prompt: Dado un arreglo de enteros heights que representa las alturas de las barras de un histograma
      donde el ancho de cada barra es 1, devuelve el área del rectángulo más grande que se puede formar
      dentro del histograma. Piensa, para cada barra, hasta dónde podría extenderse a la izquierda y derecha
      mientras siga siendo la barra más baja en ese tramo, en vez de verificar directamente cada rectángulo
      posible.
    hints:
    - "Para esta barra, ¿hasta dónde puede extenderse mientras sigue siendo la más baja?"
    - "El rectángulo que usa esta barra como la más baja se detiene en la primera barra estrictamente más baja a cada lado."
    - "Cuando llega una barra más baja, la barra que apartas tiene el borde derecho en el índice nuevo y el izquierdo justo después del índice pendiente anterior."
  alien-dictionary:
    title: Diccionario alienígena
    prompt: Existe un nuevo idioma alienígena que usa el alfabeto inglés, pero el orden entre las letras
      te es desconocido. Se te da una lista de palabras del diccionario de ese idioma, ordenadas lexicográficamente
      según las reglas de este nuevo idioma. Deriva el orden de las letras en este idioma a partir de
      esa lista de palabras. Si el orden es inválido, devuelve una cadena vacía; si existen múltiples
      órdenes válidos, devuelve cualquiera de ellos. Piensa qué te puede decir comparar cada par de palabras
      adyacentes sobre el orden de letras individuales.
    hints:
    - "¿Qué dice la primera posición en que dos palabras vecinas difieren?"
    - "Ese par de letras es una precedencia: la letra de la palabra anterior va primero."
    - "Recoge esas precedencias y toma repetidamente una letra que ninguna regla restante siga colocando después de otra."

  sliding-window-maximum:
    title: Máximo en ventana deslizante
    prompt: >
      Dado un array nums y una ventana de tamaño k que se mueve de izquierda a derecha, devuelve el máximo
      de cada posición de la ventana. Un escaneo anidado es demasiado lento; piensa cómo reutilizar trabajo
      al deslizar.
    hints:
    - "¿Qué índice anterior ya no puede ser el máximo de ninguna ventana posterior?"
    - "Los candidatos se quedan en orden decreciente, y el candidato del frente sigue dentro de la ventana."
    - "Tira los índices que salieron de la ventana y los valores menores antes de aceptar el índice nuevo."
  word-break-ii:
    title: Word Break II
    prompt: >
      Dada una cadena s y un diccionario wordDict, inserta espacios en s para formar frases donde cada
      palabra esté en el diccionario. Devuelve todas las frases posibles en cualquier orden.
    hints:
    - "¿Qué corte vale la pena continuar y qué prefijo es un callejón sin salida?"
    - "Un corte es legal solo cuando el trozo recién tomado está en el diccionario."
    - "Al llegar al final de la cadena, une los trozos elegidos con espacios."
  russian-doll-envelopes:
    title: Sobres matrioska
    prompt: >
      Dados sobres [wi, hi], uno cabe en otro solo si ancho y alto son estrictamente mayores. Devuelve
      el máximo número de sobres anidados. No se permite rotar.
    hints:
    - "Cuando fijas un orden de los sobres, ¿qué queda por maximizar?"
    - "Anchos iguales no se anidan, así que entre anchos iguales las alturas se toman para que las alturas restantes aún puedan crecer."
    - "La cadena más larga es la serie estrictamente creciente más larga de esas alturas."
  minimum-window-subsequence:
    title: Ventana mínima como subsecuencia
    prompt: >
      Dadas s y t, devuelve la ventana contigua mínima de s tal que t sea subsecuencia de esa ventana.
      Si no existe, cadena vacía; si hay varias, la más a la izquierda.
    hints:
    - "Cuando el patrón ya está cubierto en orden, ¿hasta dónde atrás puede empezar esta ventana?"
    - "La mejor ventana es la más corta, y en empate la más a la izquierda, y termina en una coincidencia del último carácter del patrón."
    - "Expande hasta cubrir el patrón en orden, luego retrocede hasta el inicio más temprano que aún lo cubre."

  count-of-smaller:
    title: Conteo de menores a la derecha
    prompt: >
      Dado nums, devuelve counts donde counts[i] es cuántos elementos estrictamente menores hay a la
      derecha. Merge-sort y Fenwick/segment tree son válidos en entrevista.
    hints:
    - "Cuando este valor pasa junto a otros, ¿cuáles de ellos son menores y siguen a su derecha?"
    - "El conteo de un valor es cuántos menores lo pasan mientras se combinan mitades ordenadas."
    - "Al combinar las mitades, suma la cantidad de valores menores ya tomados al valor mayor junto al que pasan."
  palindrome-pairs:
    title: Pares palíndromo
    prompt: >
      Dadas palabras únicas, devuelve pares (i, j) tales que words[i] + words[j] sea palíndromo.
      Hash map de reversos o un trie de palabras invertidas aplican.
    hints:
    - "¿Qué otra palabra completaría un palíndromo en el lado no emparejado de esta palabra?"
    - "Un par funciona cuando el lado no emparejado es él mismo un palíndromo y el otro lado es el reverso de una palabra guardada."
    - "Para cada corte de una palabra, busca el reverso de un lado entre las palabras ya indexadas."
  task-scheduler:
    title: Planificador de tareas
    prompt: >
      Programa tareas de CPU con enfriamiento n entre iguales. Devuelve el tiempo mínimo.
      Fórmula greedy por frecuencias o simulación con max-heap son aceptables.
    hints:
    - "¿Qué obliga al tiempo ocioso: el número de tareas o la que más se repite?"
    - "La tarea más ocupada deja un hueco de n tras cada copia salvo la última, y otras tareas pueden llenar esos huecos."
    - "El tiempo es el mayor entre el número de tareas y la longitud que fuerzan los huecos de la tarea más ocupada."
