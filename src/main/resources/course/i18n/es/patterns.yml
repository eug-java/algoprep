patterns:
  TWO_POINTERS:
    title: Dos punteros
    subtitle: Mueve dos índices hacia un objetivo en arreglos, cadenas o listas ordenadas
    intuition: 'Cuando una solución de fuerza bruta compara cada par con bucles anidados, conviene preguntarse
      si ordenar antes permitiría que dos índices -uno desde cada extremo, o ambos avanzando a distinta
      velocidad- reemplacen el bucle interno por completo. Dos punteros aprovechan la estructura monótona:
      mientras un extremo del rango ordenado crece, el otro solo puede reducirse, así que cada puntero
      recorre el arreglo una vez, logrando O(n) en total en vez de O(n^2).'
    recognition: La entrada está ordenada o se puede ordenar barato, buscas pares o tríos que cumplan
      un objetivo, necesitas invertir o particionar datos en el lugar, o comparas caracteres desde ambos
      extremos de una cadena.
    walkthrough: Empieza preguntando si el arreglo está ordenado; si no, decide si ordenar es válido según
      las restricciones, ya que cuesta O(n log n) pero suele habilitar O(n) después. Coloca un puntero
      al inicio y otro al final para problemas de suma objetivo, o mantén ambos avanzando a distinta velocidad
      para compactar en el lugar. En cada paso compara los valores bajo los punteros con tu objetivo y
      mueve solo el puntero que puede mejorar la comparación - este invariante garantiza que no se salte
      ninguna respuesta válida. Explica ese invariante a tu entrevistador antes de programar, implementa
      una condición de parada clara (por ejemplo, que los punteros se crucen) y recorre a mano un ejemplo
      pequeño con duplicados y casos límite como un arreglo vacío o de un solo elemento.
    telltaleSigns:
    - Entrada ordenada, o se permite y es barato ordenarla primero
    - Buscas un par, trío o cuarteto que cumpla una suma u objetivo de comparación
    - Necesitas invertir, particionar o eliminar duplicados en el lugar con espacio extra O(1)
    - Dos posiciones que avanzan una hacia la otra, o un par lento/rápido moviéndose en la misma dirección
    - El enunciado dice explícitamente "en el lugar" y prohíbe arreglos extra
    templateSteps:
    - Ordena la entrada primero si el orden no está garantizado y ordenar no rompe el problema
    - Coloca los punteros en ambos extremos (dirección opuesta) o ambos al inicio (misma dirección)
    - Compara los valores de los punteros contra el objetivo/invariante y mueve el que ayude
    - Salta valores duplicados en cada puntero para evitar resultados repetidos cuando se pide unicidad
    - Detente cuando los punteros se crucen o la ventana deje de ser válida
    commonMistakes:
    - Olvidar saltar valores duplicados, generando pares/tríos repetidos en la respuesta
    - Mover ambos punteros en cada paso en vez de solo el que corrige la comparación
    - Ordenar el arreglo cuando el problema exige preservar los índices u orden originales
    - Errores de límite en la condición de cruce (left <= right frente a left < right)
    whenNotToUse:
    - La entrada no está ordenada y no se puede ordenar porque hay que preservar índices/orden originales
      (usa un mapa hash)
    - La relación entre elementos no es monótona, por lo que mover un puntero no reduce el espacio de
      búsqueda de forma confiable
    problems:
      pair-with-target-sum:
        title: Par con suma objetivo
        summary: Encuentra los índices de dos números en un arreglo ordenado que sumen un valor objetivo.
        whenToUse: Arreglo ordenado más búsqueda de par con suma es la señal clásica de dos punteros en
          direcciones opuestas.
        hints:
        - Coloca left en el índice 0 y right en n-1.
        - Si la suma es menor que el objetivo avanza left; si es mayor retrocede right.
      remove-duplicates:
        title: Eliminar duplicados de un arreglo ordenado
        summary: Compacta un arreglo ordenado en el lugar para que cada elemento aparezca una vez y devuelve
          la nueva longitud.
        whenToUse: Compactación en el lugar con un puntero de escritura lento y uno de lectura rápido
          sobre datos ordenados.
        hints:
        - Mantén un índice de escritura que avance solo al encontrar un valor único nuevo.
        - El puntero rápido recorre todos los elementos; el lento marca el siguiente espacio libre.
      triplet-sum-zero:
        title: Trío que suma cero
        summary: Encuentra todos los tríos únicos en un arreglo cuya suma sea cero.
        whenToUse: Ordena, fija un índice como ancla y luego usa dos punteros en el resto para hallar
          su pareja complementaria.
        hints:
        - 'Ordena primero: así son posibles tanto los dos punteros como saltar duplicados.'
        - Con nums[i] fijo, busca un par que sume -nums[i] en el resto del arreglo.
        - Salta valores repetidos en i, left y right para evitar tríos duplicados.
      container-with-most-water:
        title: Contenedor con más agua
        summary: Encuentra dos líneas que formen un contenedor con el área de agua máxima.
        whenToUse: Alturas en una línea; punteros opuestos maximizan min(h)*ancho.
        hints:
        - Empieza en ambos extremos
        - Mueve hacia adentro el lado más corto
      dutch-national-flag:
        title: Bandera holandesa / Ordenar colores
        summary: Ordena un arreglo de 0/1/2 en el lugar con una sola pasada.
        whenToUse: Partición en tres vías con punteros low/mid/high.
        hints:
        - Mantén [0..low) como ceros y (high..n] como doses
        - Intercambia mid con low o high según el valor
      quadruple-sum:
        title: Suma de cuatro números objetivo
        summary: Encuentra todas las cuádruplas únicas cuya suma sea el valor objetivo.
        whenToUse: Ordena, fija dos índices y usa dos punteros para el par restante.
        hints:
        - Ordena primero y salta duplicados en cada nivel
        - El par interno usa el clásico patrón de dos punteros
  FAST_SLOW_POINTERS:
    title: Punteros rápido y lento
    subtitle: Detecta ciclos y encuentra puntos medios moviendo dos punteros a distinta velocidad
    intuition: 'Imagina a dos corredores en una pista: el rápido avanza dos pasos por cada paso del lento.
      Si la pista se cierra en un bucle, el rápido termina alcanzando al lento y se encuentran, probando
      que existe un ciclo sin contar nunca la longitud de la pista. El mismo truco de velocidad ubica
      el punto medio de una lista enlazada: cuando el puntero rápido llega al final, el lento está justo
      a la mitad.'
    recognition: El problema involucra una lista enlazada, o una secuencia definida aplicando repetidamente
      una función (como sumar cuadrados de dígitos), donde debes detectar un ciclo, hallar un punto medio
      o determinar si un valor se repite sin conocer la longitud total de antemano.
    walkthrough: Inicializa slow y fast en la cabeza, luego en cada iteración avanza slow un nodo y fast
      dos nodos. Si fast llega a null sin encontrarse con slow, no hay ciclo y puedes retornar de inmediato.
      Si se encuentran, el ciclo queda confirmado; para hallar el punto de entrada, reinicia un puntero
      a la cabeza y avanza ambos de a un nodo hasta que se encuentren de nuevo, lo cual, por la matemática
      del algoritmo de Floyd, cae exactamente en el inicio del ciclo. Para el punto medio basta con detenerse
      cuando fast llega al final; slow queda en el medio, algo que puedes verificar con un par de ejemplos
      trazados a mano.
    telltaleSigns:
    - Detección de ciclos en una lista enlazada o grafo funcional
    - Necesitas el nodo medio sin un recorrido aparte para contar la longitud
    - Una secuencia de aplicar repetidamente una función (p. ej. Happy Number) que puede ciclar
    - Verificar si una lista enlazada es palíndromo invirtiendo su segunda mitad
    - El entrevistador prohíbe espacio extra O(n) en un problema de lista enlazada
    templateSteps:
    - Inicializa slow = head y fast = head
    - Repite mientras fast y fast.next no sean null
    - Avanza slow un nodo y fast dos nodos en cada iteración
    - Al encontrarse, razona qué demuestra eso (ciclo existente / punto medio hallado)
    - Para el inicio del ciclo, reinicia un puntero a la cabeza y avanza ambos de a uno hasta encontrarse
    commonMistakes:
    - Olvidar verificar fast.next antes de usarlo, causando un NullPointerException
    - Confundir qué puntero queda en el medio según la lista tenga longitud par o impar
    - No reiniciar un puntero a la cabeza cuando se pide el punto de entrada, no solo la existencia del
      ciclo
    - Usar fast/slow en un problema que en realidad necesita acceso aleatorio (un arreglo encaja mejor)
    whenNotToUse:
    - Necesitas acceso indexado/aleatorio a los elementos, no solo recorrido secuencial
    - La estructura no tiene noción de 'siguiente paso' ni diferencia de velocidad para que los punteros
      diverjan
    problems:
      linked-list-cycle:
        title: Ciclo en lista enlazada
        summary: Detecta si una lista enlazada contiene un ciclo.
        whenToUse: La detección de Floyd da espacio O(1) donde un set hash costaría O(n).
        hints:
        - Si fast se encuentra con slow, hay un ciclo.
        - Si fast llega a null, la lista no tiene ciclo.
      middle-of-linked-list:
        title: Nodo medio de la lista enlazada
        summary: Devuelve el nodo medio (el segundo medio si la longitud es par).
        whenToUse: fast llega al final justo cuando slow está en el medio, sin necesidad de contar la
          longitud.
        hints:
        - Avanza fast de a dos y slow de a uno en el mismo bucle.
        - Cuando fast es null o fast.next es null, slow es la respuesta.
      happy-number:
        title: Número feliz
        summary: Determina si sumar repetidamente los cuadrados de los dígitos llega a 1.
        whenToUse: La transformación por cuadrados de dígitos forma un grafo funcional; un ciclo sin el
          1 significa que no es feliz.
        hints:
        - Trata el 'siguiente valor' como un paso de una estructura enlazada implícita.
        - Aplica fast/slow sobre esa secuencia para detectar un ciclo distinto de 1.
      cycle-start:
        title: Inicio del ciclo en una lista enlazada
        summary: Devuelve el nodo donde comienza el ciclo, o null si no existe.
        whenToUse: Encuentro de punteros con el algoritmo de Floyd, luego reinicia un puntero al head.
        hints:
        - Tras el encuentro, mueve un puntero de vuelta al head
        - Avanza ambos un paso a la vez hasta que se encuentren de nuevo
      palindrome-linked-list:
        title: Lista enlazada palíndroma
        summary: Comprueba si una lista enlazada se lee igual hacia adelante y hacia atrás.
        whenToUse: Encuentra el punto medio, invierte la segunda mitad y compara.
        hints:
        - Punteros rápido/lento para hallar el medio
        - Invierte la segunda mitad y luego compárala
      circular-array-loop:
        title: Bucle en arreglo circular
        summary: Detecta un ciclo de longitud mayor que 1 en un arreglo circular de saltos, en una sola
          dirección.
        whenToUse: Trata los índices como un grafo funcional; aplica punteros rápido/lento desde cada
          inicio.
        hints:
        - Descarta los saltos que cambian de dirección
        - Marca los índices visitados para no repetir trabajo
  SLIDING_WINDOW:
    title: Ventana deslizante
    subtitle: Mantén una ventana contigua que crece y se reduce para cumplir una restricción
    intuition: Cuando un problema pregunta por un subarreglo o subcadena contigua, la fuerza bruta recalcula
      el mismo rango superpuesto desde cero para cada índice de inicio. Una ventana deslizante mantiene
      un estado -una suma, conteos de caracteres, un conteo de distintos- y lo actualiza de forma incremental
      al expandir el borde derecho y contraer el izquierdo, convirtiendo un recorrido O(n^2) en un único
      paso O(n).
    recognition: Busca frases como el subarreglo/subcadena contiguo más largo/corto, 'a lo sumo K caracteres
      distintos', detección de anagramas o permutaciones dentro de una cadena mayor, o un tamaño de ventana
      K fijo.
    walkthrough: Identifica qué estado debe rastrear la ventana -una suma, un mapa de frecuencias, un
      conteo de distintos- y qué condición la hace válida o inválida. Expande la ventana moviendo el borde
      derecho un paso a la vez, actualizando el estado con cada nuevo elemento. Cuando la ventana se vuelva
      inválida (o, para tamaño fijo, alcance K), contrae desde la izquierda, quitando elementos del estado
      hasta que vuelva a ser válida, y registra la mejor respuesta hasta el momento. Repite hasta que
      el borde derecho recorra toda la entrada, y explica a tu entrevistador por qué cada elemento entra
      y sale del estado exactamente una vez, lo que da la cota O(n).
    telltaleSigns:
    - Subarreglo o subcadena contigua (no reordena elementos)
    - Lenguaje de más largo / más corto / cantidad de ventanas
    - Restricción sobre suma, cantidad de distintos, o un mapa de frecuencias ('a lo sumo K distintos')
    - Un tamaño de ventana K fijo indicado explícitamente
    - Detección de anagramas o permutaciones dentro de una cadena más larga
    templateSteps:
    - Elige el estado de la ventana (suma, mapa de frecuencias, distintos) y la condición de validez
    - Expande la ventana moviendo el borde derecho y actualizando el estado
    - Mientras la ventana sea inválida (o exceda el tamaño fijo), contrae desde la izquierda y actualiza
    - Actualiza la mejor respuesta una vez que la ventana es válida
    - Continúa hasta que el borde derecho cubra toda la entrada
    commonMistakes:
    - Usar una condición de contracción incorrecta, perdiendo ventanas válidas
    - Recalcular el mapa de frecuencias desde cero en vez de actualizar los conteos de forma incremental
    - Errores de límite al calcular la longitud de la ventana (right - left + 1)
    - Olvidar actualizar la mejor respuesta dentro del bucle de contracción, no solo después
    whenNotToUse:
    - La subsecuencia no necesita ser contigua (suele ser un problema de DP o dos punteros sobre datos
      ordenados)
    - La validez de la ventana no puede verificarse o actualizarse en O(1) al entrar y salir elementos
    problems:
      max-sum-subarray-k:
        title: Suma máxima de subarreglo de tamaño K
        summary: Encuentra la suma máxima de cualquier subarreglo contiguo de tamaño fijo K.
        whenToUse: 'Tamaño de ventana fijo K: suma el elemento que entra por la derecha y resta el que
          sale por la izquierda.'
        hints:
        - Calcula la suma de la primera ventana directamente y luego desliza de a uno.
        - Cada deslizamiento solo necesita una suma y una resta, no recalcular todo.
      longest-substring-k-distinct:
        title: Subcadena más larga con K caracteres distintos
        summary: Encuentra la longitud de la subcadena más larga con a lo sumo K caracteres distintos.
        whenToUse: Ventana de tamaño variable más un mapa de frecuencias de claves distintas, contrayendo
          cuando se supera K.
        hints:
        - Expande la ventana agregando cada nuevo carácter a un mapa de frecuencias.
        - Mientras el mapa tenga más de K claves, contrae desde la izquierda y reduce/elimina conteos.
      find-all-anagrams:
        title: Encontrar todos los anagramas en una cadena
        summary: Devuelve los índices de inicio de todos los anagramas de p dentro de s.
        whenToUse: Ventana fija igual a la longitud de p, comparando conteos de caracteres en curso contra
          los de p.
        hints:
        - Construye una vez el mapa de frecuencias objetivo para p.
        - Desliza una ventana de longitud p sobre s comparando conteos; si coinciden, ahí empieza un anagrama.
      longest-no-repeat:
        title: Subcadena más larga sin caracteres repetidos
        summary: Encuentra la subcadena más larga con todos los caracteres únicos.
        whenToUse: Ventana de tamaño variable más un mapa de la última posición vista de cada carácter.
        hints:
        - Reduce por la izquierda cuando aparece un duplicado
        - Registra la mejor longitud de ventana
      min-window-substring:
        title: Subcadena de ventana mínima
        summary: La subcadena más pequeña de s que cubre todos los caracteres de t.
        whenToUse: Ventana reducible con conteos de lo necesario y lo disponible.
        hints:
        - Expande hasta que sea válida y luego reduce con avidez
        - Registra cuántos caracteres requeridos ya se cumplen
  INTERVALS:
    title: Intervalos
    subtitle: Ordena por inicio y recorre una vez para fusionar, insertar o razonar sobre rangos
    intuition: Los problemas de intervalos se vuelven manejables en cuanto los ordenas por hora de inicio,
      porque el solapamiento solo puede darse entre un intervalo y los inmediatamente anterior o posterior
      en el orden. Una vez ordenados, un único recorrido de izquierda a derecha con una variable de 'intervalo
      actual' basta para fusionar, contar conflictos o encontrar huecos, sin necesidad de mirar más de
      un paso atrás.
    recognition: La entrada es una lista de pares [inicio, fin], y la pregunta trata de fusionar, insertar,
      detectar conflictos o solapamientos, contar salas de reuniones, o encontrar tiempo libre entre varias
      listas de intervalos.
    walkthrough: 'Ordena primero todos los intervalos por inicio - este único paso es lo que hace lineal
      el resto del algoritmo. Mantén un intervalo ''actual'' inicializado con el primero, y recorre el
      resto: si el inicio del siguiente es menor o igual al fin del actual, se solapan, así que fusiona
      extendiendo el fin del actual al máximo de ambos. Si no se solapan, agrega el actual al resultado
      y convierte al siguiente en el nuevo actual. Para variantes como insertar un intervalo o tiempo
      libre de empleados, adapta el mismo recorrido: intervalos estrictamente antes del nuevo, todos los
      que se solapan se fusionan, y luego todo lo que va estrictamente después. Verifica siempre si los
      límites son inclusivos o exclusivos, pues eso cambia el operador de comparación del solapamiento.'
    telltaleSigns:
    - Entrada como lista de pares [inicio, fin]
    - Lenguaje de solapamiento, fusión, conflicto o 'tiempo libre'
    - Problemas tipo salas de reuniones o programación de horarios
    - Necesitas insertar un nuevo intervalo en una lista ya ordenada y sin solapamientos
    templateSteps:
    - Ordena los intervalos por inicio (y por fin como desempate si hace falta)
    - Mantén un intervalo 'actual' abierto, inicializado con el primero
    - Fusiona con el actual cuando el inicio del siguiente <= fin del actual
    - Emite el intervalo actual y comienza uno nuevo cuando no hay solapamiento
    - Para insertar / tiempo libre, usa las fases antes / solapamiento / después
    commonMistakes:
    - Olvidar ordenar primero, u ordenar por fin cuando se requiere por inicio
    - Usar < en vez de <= (o viceversa) en el límite de solapamiento, manejando mal intervalos que se
      tocan
    - No fusionar el fin como max(actual.fin, siguiente.fin), sino simplemente sobrescribirlo
    - Olvidar volcar el último intervalo 'actual' después de terminar el bucle
    whenNotToUse:
    - Los intervalos ya están garantizados como disjuntos y no se necesita lógica de fusión
    - Necesitas consultas repetidas de un punto en el tiempo sobre muchos intervalos (un segment tree
      o mapa ordenado encaja mejor)
    problems:
      merge-intervals:
        title: Fusionar intervalos
        summary: Fusiona todos los intervalos solapados en un conjunto mínimo de rangos sin solapamiento.
        whenToUse: 'El clásico: ordenar por inicio más un único recorrido lineal de fusión.'
        hints:
        - Ordena por inicio antes que nada.
        - Compara el inicio de cada intervalo con el fin del último intervalo fusionado.
      insert-interval:
        title: Insertar intervalo
        summary: Inserta un nuevo intervalo en una lista ordenada sin solapamientos y fusiona donde haga
          falta.
        whenToUse: 'Tres fases: copiar los intervalos estrictamente anteriores, fusionar los que se solapan,
          copiar el resto.'
        hints:
        - 'No hace falta ordenar: la lista de entrada ya está ordenada.'
        - Sigue expandiendo los límites del nuevo intervalo mientras se solape con el actual.
      conflicting-appointments:
        title: Citas en conflicto
        summary: Verifica si dos citas cualesquiera en una lista se solapan.
        whenToUse: Ordena y luego revisa cada par adyacente en busca de solapamiento (el problema Meeting
          Rooms I).
        hints:
        - Tras ordenar por inicio, solo los pares adyacentes pueden solaparse.
        - Hay solapamiento en cuanto el inicio de una cita es anterior al fin de la previa.
      interval-intersection:
        title: Intersecciones de listas de intervalos
        summary: Devuelve las intersecciones de dos listas de intervalos ordenadas.
        whenToUse: Barrido con dos punteros sobre intervalos ordenados.
        hints:
        - El inicio de la intersección es el máximo de los inicios
        - Avanza la lista cuyo intervalo termina primero
      minimum-meeting-rooms:
        title: Mínimo de salas de reunión
        summary: Encuentra el número mínimo de salas de reunión necesarias.
        whenToUse: Ordena inicios/finales o usa un montículo mínimo de horas de fin.
        hints:
        - Ordena las reuniones por hora de inicio
        - Mantén un montículo con las horas de fin de las reuniones en curso
  IN_PLACE_LINKED_LIST:
    title: Manipulación de lista enlazada en el lugar
    subtitle: Invierte, reordena y transforma listas con espacio extra O(1)
    intuition: 'Invertir o reordenar una lista enlazada sin espacio extra es, en esencia, llevar cuidadosamente
      la cuenta de los punteros: antes de sobrescribir el next de un nodo, guarda a dónde apuntaba, o
      perderás el resto de la lista para siempre. Mantener tres referencias -previo, actual y siguiente-
      en cada paso te permite recablear los enlaces de a uno sin perder la conexión de toda la lista.'
    recognition: El problema pide invertir toda la lista, invertir una sublista entre dos posiciones,
      invertir en grupos de k, o reordenar nodos, todo bajo una restricción de espacio extra O(1).
    walkthrough: 'Define tres punteros: prev (inicialmente null), curr (inicialmente head) y un next temporal
      para recordar curr.next antes de sobrescribirlo. En cada iteración guarda next = curr.next, recablea
      curr.next = prev, y luego avanza prev = curr y curr = next. Para sublistas o grupos de k, primero
      llega al nodo límite justo antes del segmento a invertir, aplica la misma inversión de tres punteros
      solo dentro de ese segmento, y luego reconecta la nueva cabeza y cola del segmento con el resto
      de la lista -el nodo que originalmente era el inicio del segmento se convierte en la cola y debe
      apuntar a lo que seguía al segmento. Dibuja la lista en papel con 4-5 nodos antes de programar,
      ya que casi todos los errores aquí están en la reconexión en el límite del segmento, no en el bucle
      de inversión en sí.'
    telltaleSigns:
    - Invertir una lista enlazada completa, una sublista, o grupos de k nodos
    - Reordenar o intercalar nodos (por ejemplo, unir la primera y segunda mitad)
    - Requisito explícito de espacio extra O(1) en una lista enlazada
    - Combinado con punteros rápido/lento para hallar un punto medio antes de invertir
    templateSteps:
    - Mantén prev, curr y una referencia temporal next
    - Guarda next = curr.next antes de modificar nada
    - Recablea curr.next = prev, luego avanza prev y curr
    - Para sub-rangos, localiza primero los nodos límite y reconecta cabeza/cola tras invertir
    - Usa un nodo cabeza ficticio (dummy) cuando la cabeza real de la lista pueda cambiar
    commonMistakes:
    - Perder el resto de la lista al recablear curr.next antes de guardar el next original
    - Olvidar un nodo cabeza ficticio, causando casos especiales cuando la cabeza misma cambia
    - No reconectar la cola del segmento invertido con el nodo que le sigue
    - Errores de un lugar al contar k o los límites de la sublista
    whenNotToUse:
    - Se necesita acceso aleatorio o búsquedas frecuentes por valor (un arreglo o mapa hash encaja mejor)
    - La lista puede reconstruirse con espacio extra O(n) sin restricción del entrevistador, donde la
      recursión puede ser más clara
    problems:
      reverse-linked-list:
        title: Invertir lista enlazada
        summary: Invierte una lista simplemente enlazada de forma iterativa y devuelve la nueva cabeza.
        whenToUse: La plantilla fundamental de inversión con tres punteros para toda variante de este
          patrón.
        hints:
        - Guarda curr.next antes de sobrescribirlo.
        - El último curr no nulo se convierte en la nueva cabeza al terminar el bucle.
      reverse-sublist:
        title: Invertir sublista
        summary: Invierte los nodos desde la posición left hasta right (indexado desde 1) en una lista
          enlazada.
        whenToUse: Llega al nodo justo antes de 'left', invierte el segmento y luego reconecta ambos límites.
        hints:
        - Usa una cabeza ficticia para que left=1 no requiera un caso especial.
        - 'El nodo original ''left'' se vuelve la cola del segmento invertido: reconéctalo con lo que
          sigue a ''right''.'
      reverse-every-k:
        title: Invertir cada sublista de K elementos
        summary: Invierte los nodos de una lista enlazada en grupos de k; el grupo sobrante queda igual.
        whenToUse: Cuenta k nodos por adelantado para confirmar que existe un grupo completo, inviértelo
          y luego encadena los grupos.
        hints:
        - Antes de invertir un grupo, verifica que realmente quedan k nodos.
        - Conecta la cola del grupo anterior con la nueva cabeza del grupo actual tras cada inversión.
      rotate-list:
        title: Rotar lista
        summary: Rota la lista enlazada k posiciones hacia la derecha.
        whenToUse: Halla la longitud, conecta la lista en círculo y rómpela en el nuevo punto.
        hints:
        - Toma k módulo n
        - La nueva cola queda en la posición n - k - 1 desde el head tras cerrar el círculo
      reorder-list:
        title: Reordenar lista
        summary: Reordena la lista en el lugar como L0→Ln→L1→Ln-1→…
        whenToUse: Encuentra el medio, invierte la segunda mitad y entrelaza ambas.
        hints:
        - Encuentra el medio con punteros rápido/lento
        - Invierte la segunda mitad y entrelaza los nodos
  TWO_HEAPS:
    title: Dos heaps
    subtitle: Equilibra un max-heap y un min-heap para medianas y planificación voraz
    intuition: 'Todo lo que pida una mediana en curso, o equilibrar las mitades ''baja'' y ''alta'' de
      un flujo de datos, se simplifica manteniendo dos heaps: un max-heap para la mitad menor y un min-heap
      para la mitad mayor. Mantener los dos heaps con una diferencia de tamaño de a lo sumo un elemento
      hace que la mediana esté siempre disponible en O(1) en la cima de uno o ambos heaps.'
    recognition: Hallar la mediana de un flujo de números que llegan uno por uno, la mediana de una ventana
      deslizante, o problemas de planificación voraz donde debes elegir repetidamente la mejor opción
      disponible entre lo que ya se habilitó (por ejemplo, maximizar capital).
    walkthrough: 'Mantén un max-heap con la mitad menor de los números vistos y un min-heap con la mitad
      mayor. Cuando llega un número nuevo, decide a qué heap pertenece comparándolo con la cima del max-heap,
      insértalo ahí y luego reequilibra: si un heap tiene más de un elemento de ventaja sobre el otro,
      saca su cima y pásala al otro heap. La mediana es entonces la cima del heap más grande (cantidad
      total impar) o el promedio de ambas cimas (cantidad par). Para la mediana de ventana deslizante,
      además rastrea qué elementos necesitan eliminación perezosa al mover la ventana; para problemas
      tipo ''maximizar capital'', usa un heap para lo actualmente accesible y otro para elegir siempre
      la opción más rentable disponible.'
    telltaleSigns:
    - Necesitas una mediana en curso / en flujo a medida que llegan elementos uno por uno
    - Dividir números en dos mitades ordenadas (menor y mayor)
    - Mediana de ventana deslizante
    - Planificación que necesita 'la mejor opción actualmente disponible' (max heap) limitada por 'lo
      que ya se habilitó' (min heap)
    templateSteps:
    - Mantén un max-heap para la mitad inferior y un min-heap para la mitad superior
    - Inserta cada elemento nuevo en el heap correcto comparándolo con la cima del max-heap
    - Reequilibra para que los tamaños difieran en a lo sumo un elemento
    - Lee la mediana desde la(s) cima(s) de los heaps en O(1)
    - Para variantes de planificación, usa un heap como filtro de disponibilidad y otro para elegir la
      mejor opción
    commonMistakes:
    - Dejar que los dos heaps difieran en más de un elemento de tamaño
    - Comparar el nuevo elemento con el heap equivocado al decidir dónde insertarlo
    - Olvidar que PriorityQueue en Java es un min-heap por defecto y necesita un comparador personalizado
      para comportarse como max-heap
    - No manejar bien la eliminación perezosa en la variante de mediana con ventana deslizante, dejando
      elementos obsoletos en un heap
    whenNotToUse:
    - Necesitas el orden completo, no solo la mediana o los elementos superiores (un TreeMap encaja mejor)
    - 'Los datos no requieren actualizaciones incrementales: una sola ordenación es más simple que mantener
      dos heaps'
    problems:
      find-median-stream:
        title: Mediana de un flujo de números
        summary: Permite insertar números de a uno y devolver la mediana en curso.
        whenToUse: 'El problema clásico de dos heaps: equilibra un max-heap y un min-heap a medida que
          llegan números.'
        hints:
        - Inserta primero en el max-heap y luego mueve su cima al min-heap para mantener el orden.
        - Reequilibra los tamaños tras cada inserción para que difieran en a lo sumo uno.
      maximize-capital:
        title: Maximizar capital
        summary: Elige a lo sumo k proyectos para maximizar el capital final (el problema del IPO).
        whenToUse: Un min-heap por capital requerido para hallar proyectos accesibles, junto a un max-heap
          por ganancia para elegir el mejor.
        hints:
        - Coloca en un max-heap por ganancia todos los proyectos accesibles con el capital actual.
        - Toma siempre la cima del max-heap de ganancia y luego desbloquea los proyectos recién accesibles.
      sliding-window-median:
        title: Mediana de ventana deslizante
        summary: Calcula la mediana de cada ventana contigua de tamaño k.
        whenToUse: Dos montículos junto con borrado perezoso (lazy deletion).
        hints:
        - Equilibra los montículos máximo y mínimo para la ventana
        - Elimina de forma perezosa los elementos que salen de la ventana
      next-interval:
        title: Siguiente intervalo
        summary: Para cada intervalo, encuentra el siguiente intervalo cuyo inicio >= su fin, o -1 si
          no existe.
        whenToUse: Montículo máximo por inicio/fin para emparejar de forma voraz.
        hints:
        - Construye un montículo de intervalos ordenado por inicio descendente
        - Empareja contra los finales en orden descendente
      static-median:
        title: Mediana de un arreglo desordenado
        summary: Find the median of an unsorted array using two heaps.
        whenToUse: Same two-heap balance idea as the stream median, but for a fixed array.
        hints:
        - Push into max/min heaps and rebalance
        - Median is top or average of tops
  K_WAY_MERGE:
    title: Fusión de K vías
    subtitle: Fusiona múltiples entradas ordenadas con un min-heap de candidatos actuales
    intuition: 'Fusionar k listas ya ordenadas generaliza la fusión de dos listas de merge sort: en vez
      de comparar dos cabezas, mantén la cabeza actual de cada lista en un min-heap y extrae siempre la
      menor global. Como el heap solo contiene k elementos a la vez, esto convierte una fusión ingenua
      O(n*k) en O(n log k).'
    recognition: Varios arreglos o listas enlazadas ordenadas deben combinarse en una sola salida ordenada,
      o necesitas el k-ésimo elemento más pequeño/grande entre varias fuentes ordenadas, o el rango más
      pequeño que cubra al menos un elemento de cada lista.
    walkthrough: 'Inserta el primer elemento de cada una de las k listas ordenadas en un min-heap, etiquetando
      cada entrada con de qué lista (e índice/nodo) proviene para poder hallar su sucesor. Extrae repetidamente
      el elemento mínimo, agrégalo al resultado, y si su lista de origen tiene un elemento siguiente,
      insértalo en el heap. Continúa hasta vaciar el heap, lo que garantiza que la salida esté completamente
      ordenada porque solo emites siempre el candidato mínimo disponible globalmente. Para variantes como
      ''k-ésimo menor en una matriz ordenada'' o ''rango mínimo'', trata cada fila (o lista) como una
      de las k fuentes ordenadas y adapta la condición de parada: para el rango mínimo, rastrea el máximo
      actual entre todas las entradas del heap y reduce el rango cada vez que extraes y rellenas.'
    telltaleSigns:
    - Varios arreglos, listas o filas de matriz ordenados deben combinarse
    - Necesitas el k-ésimo elemento más pequeño/grande entre varias fuentes ordenadas
    - Rango mínimo que cubra al menos un elemento de cada una de k listas ordenadas
    - Mención explícita de fusionar listas enlazadas o flujos ordenados
    templateSteps:
    - Inserta el primer elemento de cada una de las k fuentes en un min-heap con metadatos de origen
    - Extrae el mínimo, agrégalo al resultado o avanza un contador
    - Inserta el sucesor del elemento extraído desde su lista de origen, si existe
    - Repite hasta que el heap se vacíe o se alcance el k-ésimo elemento buscado
    - Adapta la condición de parada/seguimiento para variantes de rango o matriz
    commonMistakes:
    - Olvidar guardar de qué fuente (lista/fila/índice) proviene una entrada del heap, perdiendo la forma
      de hallar su sucesor
    - Insertar una lista entera en el heap de una vez en vez de un elemento a la vez (dispara el espacio
      a O(n))
    - Usar un comparador incorrecto, de modo que el heap no extrae realmente el mínimo global
    - Errores de límite al convertir entre un 'k-ésimo menor' indexado desde 1 y un contador de extracciones
      desde 0
    whenNotToUse:
    - Solo hay que fusionar dos listas (una fusión simple de dos punteros evita la sobrecarga del heap)
    - Las fuentes no están ordenadas y no se pueden ordenar barato de antemano (la fusión con heap depende
      del orden local)
    problems:
      merge-k-sorted-lists:
        title: Fusionar K listas ordenadas
        summary: Fusiona k listas enlazadas ordenadas en una sola lista ordenada.
        whenToUse: Min-heap con las k cabezas actuales de las listas, extrayendo siempre la menor.
        hints:
        - Inserta el nodo cabeza de cada lista (no solo su valor) para poder avanzarlo después.
        - Tras extraer un nodo, inserta su .next en el heap si existe.
      kth-smallest-sorted-matrix:
        title: K-ésimo menor en matriz ordenada
        summary: Encuentra el k-ésimo elemento más pequeño en una matriz ordenada por filas y columnas.
        whenToUse: Trata las filas como listas ordenadas y fusiónalas con un heap, o aplica búsqueda binaria
          directamente sobre el rango de valores.
        hints:
        - Inicializa el heap con el primer elemento de cada fila (hasta k filas).
        - Extrae k veces; la k-ésima extracción es la respuesta.
      k-smallest-pairs:
        title: K pares con menor suma
        summary: Encuentra k pares (u,v) con las sumas más pequeñas a partir de dos arreglos ordenados.
        whenToUse: Montículo mínimo de pares candidatos que expande índices progresivamente.
        hints:
        - Inicializa el montículo con (i,0) para los primeros k de nums1
        - Al extraer un par, inserta (i, j+1)
      smallest-range:
        title: Rango mínimo que cubre elementos de K listas
        summary: Encuentra el rango más pequeño que incluya al menos un número de cada lista.
        whenToUse: Montículo mínimo sobre las cabezas de las listas, rastreando el máximo actual.
        hints:
        - Rastrea el máximo global entre las cimas del montículo
        - Avanza la lista de la que salió el mínimo
      merge-two-sorted-lists:
        title: Fusionar dos listas ordenadas
        summary: Merge two sorted linked lists into one sorted list.
        whenToUse: K-way merge with k=2 — compare heads and advance.
        hints:
        - Use a dummy head
        - Always attach the smaller current node
  TOP_K_ELEMENTS:
    title: Los K elementos principales
    subtitle: Conserva solo K candidatos usando un heap de tamaño K
    intuition: 'Cuando solo necesitas los K elementos más grandes, más pequeños o más frecuentes de N,
      ordenar todos los N hace trabajo innecesario: un heap de tamaño K basta, porque solo necesitas comparar
      candidatos nuevos contra el peor elemento actualmente conservado. Esto reduce el costo de O(n log
      n) a O(n log k), lo cual importa cuando K es pequeño respecto a N.'
    recognition: El problema pide explícitamente los K elementos superiores/más grandes/más pequeños/más
      frecuentes, los K puntos más cercanos, o de otro modo quiere un subconjunto acotado en vez de un
      orden completo.
    walkthrough: 'Decide la orientación del heap según qué conservas: para hallar los K elementos más
      grandes, usa un min-heap de tamaño K, ya que el elemento más pequeño de ese heap es tu peor candidato
      conservado actualmente y el que se debe descartar. Inserta cada nuevo elemento, y en cuanto el heap
      supere el tamaño K, extrae la cima (el mínimo actual) para descartarla. Al final, el heap contiene
      exactamente los K elementos más grandes vistos, aunque no necesariamente en orden - ordena el contenido
      final solo si el problema pide un resultado ordenado. Para ''K más frecuentes'', primero construye
      un mapa de frecuencias en una pasada, luego aplica la misma lógica de heap de tamaño K sobre las
      entradas del mapa usando la frecuencia como clave de comparación (o usa bucket sort por frecuencia
      como alternativa O(n)).'
    telltaleSigns:
    - Lenguaje de 'top K', 'K más grandes/pequeños/frecuentes', o 'K más cercanos'
    - Un ordenamiento completo funcionaría pero es más costoso de lo necesario
    - Se necesita un resultado de tamaño acotado a partir de una entrada mucho mayor
    - Conteo de frecuencias combinado con un límite de tamaño (top K frecuentes)
    templateSteps:
    - Elige un min-heap para 'K más grandes' o un max-heap para 'K más pequeños' (heap invertido)
    - Inserta elementos de a uno, manteniendo el tamaño del heap acotado a K
    - Extrae la cima del heap cuando el tamaño supere K, descartando el peor candidato actual
    - Lee los K elementos finales (ordénalos solo si se requiere un orden)
    - Para variantes de frecuencia, cuenta primero y luego aplica el mismo heap de tamaño K sobre los
      conteos
    commonMistakes:
    - Usar un max-heap con los N elementos en vez de un min-heap de tamaño K, perdiendo la ganancia de
      eficiencia
    - Olvidar acotar el tamaño del heap, dejándolo crecer más allá de K
    - Comparar por la clave equivocada (valor en vez de frecuencia, o distancia en vez de coordenada)
    - Asumir que el orden del heap es un orden ordenado sin hacer un ordenamiento final explícito cuando
      se requiere
    whenNotToUse:
    - K está cerca de N, así que ordenar todo es más simple y no significativamente más lento
    - Necesitas el orden exacto de todos los elementos, no solo los K principales
    problems:
      top-k-numbers:
        title: Los K números principales
        summary: Devuelve los K números más grandes de un arreglo no ordenado.
        whenToUse: Un min-heap de tamaño K es la aplicación directa del patrón.
        hints:
        - Inserta los primeros K números, luego compara cada número posterior con la cima del heap.
        - Reemplaza la cima solo si el número nuevo es mayor.
      k-closest-points:
        title: K puntos más cercanos al origen
        summary: Devuelve los K puntos con menor distancia euclidiana al origen.
        whenToUse: Un max-heap de tamaño K por distancia mantiene listo para descartar al punto más lejano
          conservado.
        hints:
        - Compara distancias al cuadrado para evitar llamadas innecesarias a sqrt.
        - Descarta la cima del max-heap cada vez que el heap supere el tamaño K.
      top-k-frequent:
        title: Los K números más frecuentes
        summary: Devuelve los K elementos más frecuentes de un arreglo.
        whenToUse: Construye primero un mapa de frecuencias y luego aplica un heap de tamaño K según la
          frecuencia.
        hints:
        - Cuenta las frecuencias con un mapa hash en una pasada.
        - Inserta pares (valor, frecuencia) en un min-heap ordenado por frecuencia, acotado a tamaño K.
      kth-largest:
        title: K-ésimo elemento más grande
        summary: Devuelve el k-ésimo elemento más grande de un arreglo desordenado.
        whenToUse: Montículo mínimo de tamaño k (o quickselect).
        hints:
        - Mantén un montículo mínimo de tamaño k
        - La cima del montículo es la respuesta
      reorganize-string:
        title: Reorganizar cadena
        summary: Reordena la cadena para que no haya dos caracteres adyacentes iguales; devuelve vacío
          si es imposible.
        whenToUse: Montículo máximo por frecuencia; coloca el siguiente carácter de forma voraz.
        hints:
        - Si la frecuencia máxima supera (n+1)/2, es imposible
        - Toma siempre el carácter disponible más frecuente
  MODIFIED_BINARY_SEARCH:
    title: Búsqueda binaria modificada
    subtitle: 'Búsqueda binaria más allá de la búsqueda simple: arreglos rotados, límites y espacios de
      respuesta'
    intuition: 'La búsqueda binaria estándar halla un objetivo en un arreglo totalmente ordenado, pero
      muchos problemas de entrevista alteran esa idea: el arreglo está rotado, necesitas la primera o
      última posición de un valor, o buscas en un espacio de respuestas en vez de en un arreglo. El truco
      unificador es mantener un invariante sobre qué mitad del rango actual está ''ordenada'' o ''todavía
      podría contener la respuesta'', y descartar siempre la mitad que demostrablemente no puede.'
    recognition: El arreglo está ordenado o rotado-ordenado con un pivote desconocido, necesitas la primera
      o última ocurrencia de un valor, buscas en un arreglo bitónico, o el problema dice 'halla el mínimo
      x tal que condition(x) sea verdadera' sobre un predicado monótono.
    walkthrough: 'Comienza con low y high abarcando el rango de búsqueda y calcula mid en cada iteración.
      Antes de decidir hacia dónde moverte, determina estructura adicional: para un arreglo rotado, verifica
      si la mitad izquierda o derecha es la que realmente está ordenada comparando nums[low] con nums[mid].
      Luego verifica si el objetivo podría estar en el rango de valores de esa mitad ordenada; si es así,
      busca ahí, si no, busca en la otra mitad. Para problemas de ''primera/última ocurrencia'', no te
      detengas en la primera coincidencia -sigue buscando hacia la izquierda (o derecha) incluso después
      de encontrar una, acercando high (o low) hacia el límite. Para problemas de ''búsqueda sobre la
      respuesta'', reemplaza las comparaciones de arreglo por una función predicado booleana, y aplica
      búsqueda binaria sobre el rango de respuestas posibles en vez de índices.'
    telltaleSigns:
    - Arreglo ordenado que ha sido rotado en un pivote desconocido
    - Necesitas la primera o última ocurrencia de un valor, no cualquiera
    - Arreglo bitónico (aumenta y luego disminuye, o viceversa)
    - Frase 'minimizar/maximizar x tal que condition(x) sea verdadera/falsa' sobre un predicado monótono
    - El espacio de búsqueda es conceptualmente infinito o no acotado
    templateSteps:
    - Define low/high para abarcar el rango de búsqueda (índices de arreglo o un rango de respuestas)
    - Calcula mid y determina qué mitad conserva el invariante útil (ordenada / rango objetivo / predicado)
    - Descarta la mitad que no puede contener la respuesta
    - Para primera/última ocurrencia, sigue acotando tras la primera coincidencia en vez de retornar de
      inmediato
    - Repite hasta que low > high, y usa el último candidato válido encontrado
    commonMistakes:
    - Asumir que todo el arreglo está ordenado tras la rotación en vez de verificar cuál mitad lo está
    - Retornar en la primera coincidencia en vez de seguir acotando hacia la primera/última ocurrencia
    - Errores de límite al mover low = mid frente a low = mid + 1, causando bucles infinitos
    - Usar la lógica de búsqueda binaria por índices directamente en una búsqueda sobre respuestas sin
      adaptar el predicado
    whenNotToUse:
    - Los datos no tienen ninguna estructura monótona u ordenada que explotar
    - El arreglo es suficientemente pequeño, o se busca tan rara vez, que un recorrido lineal es más simple
      e igual de rápido en la práctica
    problems:
      order-agnostic-binary-search:
        title: Búsqueda binaria agnóstica al orden
        summary: Busca un objetivo en un arreglo ordenado ascendente o descendentemente.
        whenToUse: Detecta el orden a partir de los elementos extremos una vez, y luego aplica la búsqueda
          binaria estándar adaptada.
        hints:
        - Compara el primer y último elemento para decidir si es ascendente o descendente.
        - Invierte la dirección de comparación según el orden detectado.
      search-rotated-array:
        title: Buscar en arreglo ordenado rotado
        summary: Encuentra el índice de un objetivo en un arreglo ordenado rotado con elementos únicos.
        whenToUse: 'En mid, un lado siempre está ordenado: busca ahí si el objetivo cae en su rango, si
          no, busca en el otro lado.'
        hints:
        - Compara nums[low] con nums[mid] para saber qué mitad está ordenada.
        - Verifica si el objetivo está en el rango de valores de la mitad ordenada antes de entrar en
          ella.
      find-range:
        title: Primera y última posición
        summary: Encuentra el primer y último índice de un valor objetivo en un arreglo ordenado.
        whenToUse: 'Ejecuta dos búsquedas binarias: una sesgada para hallar el límite inferior, otra para
          el límite superior.'
        hints:
        - Al encontrar una coincidencia buscando la primera posición, sigue acotando a la izquierda en
          vez de detenerte.
        - Haz lo mismo pero acotando a la derecha para la última posición.
      find-peak-element:
        title: Encontrar elemento pico
        summary: Devuelve el índice de cualquier elemento pico del arreglo.
        whenToUse: Búsqueda binaria hacia el vecino mayor.
        hints:
        - Si mid es menor que mid+1, avanza a la derecha
        - En caso contrario, avanza a la izquierda incluyendo mid
      search-rotated-duplicates:
        title: Buscar en arreglo rotado II
        summary: Busca un valor objetivo en un arreglo ordenado y rotado que puede contener duplicados.
        whenToUse: Búsqueda binaria con reducción de extremos ante duplicados.
        hints:
        - Si nums[lo]==nums[mid]==nums[hi], reduce ambos extremos
        - En los demás casos aplica la lógica habitual del arreglo rotado
  SUBSETS:
    title: Subconjuntos
    subtitle: Genera sistemáticamente todos los subconjuntos, permutaciones y combinaciones
    intuition: Generar todos los subconjuntos, permutaciones o combinaciones consiste, en el fondo, en
      decidir sistemáticamente, para cada elemento, si (y cómo) participa en el resultado. Un enfoque
      en anchura ('toma lo que existe y agrega una copia con el nuevo elemento') construye el conjunto
      potencia completo nivel por nivel, mientras que un backtracking en profundidad construye un candidato
      a la vez y retrocede cuando está completo o es inválido.
    recognition: El problema pide explícitamente todos los subconjuntos (conjunto potencia), todas las
      permutaciones, todas las combinaciones, permutaciones de mayúsculas/minúsculas, o versiones únicas
      de estas cuando la entrada puede tener duplicados.
    walkthrough: Para la generación de subconjuntos en anchura, empieza con una lista que contenga solo
      el subconjunto vacío, y para cada elemento de entrada recorre todos los subconjuntos actuales agregando
      uno nuevo igual al existente más el nuevo elemento -esto duplica la lista en cada paso y produce
      naturalmente los 2^n subconjuntos. Para permutaciones, usa backtracking intercambiando elementos
      en cada posición y deshaciendo el intercambio después, o construye permutaciones insertando el siguiente
      elemento en cada posición posible de cada permutación existente. Cuando hay duplicados, ordena la
      entrada primero para que los valores idénticos queden adyacentes, y luego evita generar un subconjunto/permutación
      desde un valor duplicado a menos que siga directamente a la ocurrencia ya usada en la misma profundidad
      de recursión -esto evita resultados duplicados sin un paso de deduplicación posterior.
    telltaleSigns:
    - Lenguaje de 'todos los subconjuntos', 'conjunto potencia', 'todas las permutaciones' o 'todas las
      combinaciones'
    - Permutación de mayúsculas/minúsculas o generación similar de todas las variantes posibles
    - Se necesita manejo de duplicados para evitar subconjuntos/permutaciones repetidos
    - 'No se necesita poda pesada: el objetivo es enumerar, no optimizar'
    templateSteps:
    - Empieza desde el subconjunto vacío (BFS) o un candidato parcial vacío (backtracking DFS)
    - 'Para BFS: por cada nuevo elemento, agrégalo a cada subconjunto construido hasta ahora, duplicando
      la lista'
    - 'Para DFS: elige un elemento, recurre, y deshaz la elección (retrocede) antes de probar la siguiente'
    - Ordena primero y salta hermanos duplicados en la misma profundidad de recursión para evitar resultados
      repetidos
    - Recolecta un resultado cuando un subconjunto/permutación alcance el tamaño requerido o todos los
      elementos estén colocados
    commonMistakes:
    - Olvidar saltar elementos duplicados en la misma profundidad, produciendo subconjuntos/permutaciones
      repetidos
    - No ordenar la entrada primero cuando la lógica de duplicados depende de que los valores idénticos
      sean adyacentes
    - Modificar una lista/arreglo compartido sin deshacer el cambio antes de retroceder a la siguiente
      rama
    - Confundir la generación de subconjuntos (el orden no importa) con la de permutaciones (el orden
      sí importa)
    whenNotToUse:
    - N es tan grande que enumerar 2^n o n! es computacionalmente inviable y solo se necesita un conteo
      o valor óptimo
    - El problema necesita una respuesta válida bajo restricciones, no todos los arreglos posibles
    problems:
      subsets:
        title: Subconjuntos
        summary: Devuelve todos los subconjuntos (conjunto potencia) de un arreglo de enteros distintos.
        whenToUse: 'El clásico BFS en cascada: duplica la lista de subconjuntos por cada nuevo elemento.'
        hints:
        - Empieza la lista de resultados solo con el subconjunto vacío.
        - Por cada número, agrégalo a una copia de cada subconjunto ya presente en el resultado.
      subsets-with-duplicates:
        title: Subconjuntos con duplicados
        summary: Devuelve todos los subconjuntos únicos cuando el arreglo de entrada puede tener valores
          duplicados.
        whenToUse: Ordena primero y luego, ante un valor repetido, extiende solo los subconjuntos creados
          en la ronda anterior.
        hints:
        - Ordena el arreglo para que los valores duplicados queden adyacentes.
        - Si nums[i] es igual a nums[i-1], agrégalo solo a los subconjuntos añadidos en la ronda del número
          anterior.
      permutations:
        title: Permutaciones
        summary: Devuelve todas las permutaciones de un arreglo de números distintos.
        whenToUse: Backtracking de intercambio y deshacer, o BFS insertando el siguiente número en cada
          posición.
        hints:
        - Intercambia el índice actual con cada índice posterior, recurre y luego deshaz el intercambio.
        - 'Caso base: cuando el índice actual llega al final del arreglo, registra una permutación completa.'
      generate-parentheses:
        title: Generar paréntesis
        summary: Todas las combinaciones válidas de n pares de paréntesis bien formados.
        whenToUse: Backtracking / construcción al estilo subsets con contadores.
        hints:
        - Agrega '(' si los abiertos son menos que n
        - Agrega ')' si los cerrados son menos que los abiertos
      unique-permutations:
        title: Permutaciones II
        summary: Todas las permutaciones únicas de un arreglo que puede contener duplicados.
        whenToUse: Backtracking con salto de valores idénticos consecutivos tras ordenar.
        hints:
        - Ordena el arreglo primero
        - Salta un duplicado si el idéntico anterior aún no se ha usado
      subsets-size-k:
        title: Combinaciones de tamaño K
        summary: Return all combinations of k numbers chosen from 1..n.
        whenToUse: Subset/backtracking generation with a fixed size limit.
        hints:
        - Choose or skip each number from start..n
        - Stop when path size is k
  GREEDY:
    title: Técnicas voraces (greedy)
    subtitle: Comprométete con la elección localmente óptima que preserva demostrablemente un invariante
      global
    intuition: Un algoritmo voraz se compromete con la elección que parece mejor en el momento y nunca
      la revisa, lo cual solo funciona si puedes argumentar (o recordar por experiencia) que esa elección
      local nunca descarta una solución globalmente óptima. En entrevistas, los problemas voraces suelen
      reducirse a ordenar por la clave correcta y luego recorrer una vez manteniendo un pequeño invariante
      en curso, como el índice más lejano alcanzable hasta el momento.
    recognition: El problema menciona planificación, intervalos, asignación de recursos o alcanzabilidad,
      y una elección localmente obvia (plazo más próximo, mayor alcance, menor costo) parece 'segura'
      -a menudo confirmado al intentar un contraejemplo pequeño y no lograr romperla.
    walkthrough: Primero enuncia la regla voraz en voz alta a tu entrevistador en una frase, como 'siempre
      saltar a la posición que más extiende mi alcance'. Verifícala con un ejemplo pequeño, incluyendo
      uno adversarial, para convencerte a ti mismo y al entrevistador de que no se pierden mejores opciones.
      Ordena la entrada por la clave de la que depende la regla (hora de inicio, plazo, razón, etc.) si
      no está ya en ese orden. Finalmente, recorre una vez, actualizando una pequeña cantidad de estado
      en curso (una variable de alcance máximo, un conteo, una suma acumulada) y tomando la decisión voraz
      en cada paso sin mirar atrás -si necesitas deshacer una decisión, el problema probablemente no es
      voraz y necesita DP o backtracking.
    telltaleSigns:
    - Una elección localmente óptima parece segura y no bloquea mejores opciones futuras
    - Ordenar por una clave (inicio, plazo, razón, fin) y recorrer una vez resuelve el problema
    - Problemas de alcanzabilidad/saltos que rastrean un valor de 'alcance máximo hasta ahora'
    - Programación de intervalos para maximizar la cantidad o minimizar recursos
    templateSteps:
    - Enuncia la regla voraz explícitamente y verifícala con un ejemplo complicado
    - Ordena la entrada por la clave de la que depende la regla voraz
    - Recorre una vez de izquierda a derecha, manteniendo un estado mínimo en curso
    - Aplica la decisión voraz en cada paso sin revisar elecciones anteriores
    - Devuelve el resultado acumulado (conteo, alcance máximo, costo total) al final
    commonMistakes:
    - Asumir que la estrategia voraz funciona sin probarla primero con un contraejemplo
    - Ordenar por la clave equivocada (por ejemplo, inicio cuando la regla depende del fin)
    - 'Necesitar ''deshacer'' una elección voraz después: señal de que el problema en realidad necesita
      DP'
    - Errores de límite en el invariante en curso (por ejemplo, actualizar el alcance máximo antes de
      verificar la alcanzabilidad)
    whenNotToUse:
    - No puedes argumentar que la elección local preserva la optimalidad, y un contraejemplo pequeño la
      rompe (usa DP)
    - El problema requiere considerar combinaciones de elecciones juntas, no una decisión independiente
      a la vez
    problems:
      jump-game:
        title: Juego de saltos
        summary: Determina si puedes llegar al último índice dado el salto máximo en cada posición.
        whenToUse: Rastrea el índice más lejano alcanzable mientras recorres; si el índice actual lo supera,
          estás atascado.
        hints:
        - Actualiza farthest = max(farthest, i + nums[i]) en cada índice.
        - Si i llega a superar farthest, el último índice es inalcanzable.
      jump-game-ii:
        title: Juego de saltos II
        summary: Encuentra el número mínimo de saltos necesarios para llegar al último índice.
        whenToUse: 'Expansión por niveles similar a BFS: rastrea el fin del salto actual y el alcance
          máximo general.'
        hints:
        - Cuando i llega al fin del salto actual, incrementa los saltos y fija el fin al mayor alcance
          visto.
        - Esto expande vorazmente un 'nivel' a la vez, similar a BFS sobre un grafo implícito.
      gas-station:
        title: Estación de gasolina
        summary: Índice de la estación de partida que permite completar el circuito, o -1.
        whenToUse: Reinicio voraz del punto de partida cuando el tanque se vuelve negativo.
        hints:
        - Si el gas total es menor que el costo total, es imposible
        - Cuando el tanque baja de 0, toma start = i+1 y reinicia el tanque
      candy:
        title: Caramelos
        summary: Cantidad mínima de caramelos para que el vecino con mejor calificación reciba más.
        whenToUse: Dos pasadas voraces, de izquierda a derecha y de derecha a izquierda.
        hints:
        - Asegura las pendientes ascendentes de izquierda a derecha
        - Luego aplica las ascendentes de derecha a izquierda tomando el máximo
      assign-cookies:
        title: Asignar galletas
        summary: Maximize content children by assigning cookies greedily.
        whenToUse: Sort both arrays and assign the smallest sufficient cookie.
        hints:
        - Sort greed and cookie sizes
        - 'Two pointers: give cookie only when it fits'
  BACKTRACKING:
    title: Backtracking (vuelta atrás)
    subtitle: 'Elige, explora, deshaz: recorre el árbol de decisiones con poda'
    intuition: 'El backtracking explora un árbol de decisiones de soluciones parciales, comprometiéndose
      con una elección, recurriendo más profundo, y deshaciendo esa elección en cuanto resulta inválida
      o una vez explorados todos sus hijos. El paso de deshacer es lo que distingue al backtracking de
      un DFS simple: permite reutilizar el mismo estado mutable en cada rama en vez de copiarlo.'
    recognition: El problema es de satisfacción de restricciones o búsqueda combinatoria -N-Reinas, Sudoku,
      búsqueda de palabras en una cuadrícula, suma de combinaciones, o partición en palíndromos- y pide
      todas las soluciones válidas, una cualquiera, o un conteo de ellas.
    walkthrough: 'Diseña tu función recursiva para representar un punto de decisión: prueba un valor candidato,
      marca el estado necesario (coloca una reina, marca una celda como visitada, agrega un número a la
      combinación en curso) y recurre a la siguiente decisión. Si la recursión llega a una solución completa
      y válida, regístrala; si llega a un estado que nunca podrá ser válido, retorna de inmediato (esta
      es tu poda). En cualquier caso, antes de probar el siguiente candidato hermano, deshaz exactamente
      los cambios de estado que hiciste para que la siguiente rama empiece desde un estado limpio y correcto.
      Agrega la poda lo antes posible, verificando restricciones parciales antes de seguir recurriendo,
      en vez de solo comprobar la validez completa en las hojas, ya que eso es lo que evita una explosión
      exponencial en entradas grandes.'
    telltaleSigns:
    - Satisfacción de restricciones o búsqueda combinatoria (N-Reinas, Sudoku, búsqueda de palabras)
    - Se necesitan todas las soluciones válidas, una disposición válida cualquiera, o un conteo
    - Un candidato parcial puede verificarse antes de estar completo (habilitando la poda)
    - Exploración explícita de cuadrícula/tablero/camino con un marcador de 'visitado' o 'usado' para
      deshacer
    templateSteps:
    - Elige un valor candidato o movimiento para el punto de decisión actual
    - Aplícalo al estado compartido (marca visitado, agrega al camino, coloca una pieza)
    - Recurre a la siguiente decisión, o registra la solución si está completa
    - Deshaz exactamente el cambio realizado antes de probar el siguiente candidato
    - Poda temprano verificando validez parcial, no solo la validez de la solución completa
    commonMistakes:
    - Olvidar deshacer un cambio de estado, corrompiendo ramas posteriores de la búsqueda
    - Copiar estructuras de estado grandes en cada llamada recursiva en vez de mutar y deshacer en el
      lugar
    - Verificar la validez solo en las hojas en vez de podar temprano, causando una explosión exponencial
      innecesaria
    - Errores de límite en los bucles al probar el siguiente candidato (por ejemplo, reutilizar un índice
      ya usado)
    whenNotToUse:
    - El espacio de búsqueda es demostrablemente enorme sin poda efectiva, y solo se necesita una respuesta
      aproximada/voraz
    - 'Existen subproblemas superpuestos que se pueden memoizar: la programación dinámica será mucho más
      rápida que el backtracking exhaustivo'
    problems:
      combination-sum:
        title: Suma de combinaciones
        summary: Encuentra todas las combinaciones únicas de candidatos que sumen un objetivo; los números
          pueden reutilizarse.
        whenToUse: Backtracking clásico con un índice de inicio que evita generar permutaciones de la
          misma combinación.
        hints:
        - Pasa el mismo índice de inicio (no start+1) al reutilizar un número.
        - Poda la rama en cuanto la suma acumulada supere el objetivo.
      word-search:
        title: Búsqueda de palabra
        summary: Determina si una palabra existe en una cuadrícula mediante celdas adyacentes, cada una
          usada como máximo una vez.
        whenToUse: DFS/backtracking desde cada celda, marcando celdas visitadas y desmarcándolas al retroceder.
        hints:
        - Marca una celda visitada antes de recurrir a sus vecinas y desmárcala justo después.
        - Poda de inmediato si la letra de la celda actual no coincide con el carácter necesario.
      n-queens:
        title: N reinas
        summary: Todas las soluciones distintas del rompecabezas de las n reinas.
        whenToUse: Coloca reinas fila por fila, podando columnas y diagonales ocupadas.
        hints:
        - Rastrea las columnas y ambas diagonales ocupadas
        - Construye las cadenas del tablero en las hojas de la recursión
      sudoku-solver:
        title: Resolver Sudoku
        summary: Completa un tablero de sudoku 9×9 en el lugar.
        whenToUse: Prueba los dígitos del 1 al 9 respetando las restricciones de fila, columna y caja.
        hints:
        - Encuentra la siguiente celda vacía
        - Verifica la fila, la columna y la caja 3x3 antes de colocar el dígito
      letter-case-permutation:
        title: Permutaciones de mayúsculas/minúsculas
        summary: Return all strings formed by toggling letter case.
        whenToUse: Simple backtracking / branching on letters only.
        hints:
        - Digits stay fixed
        - Branch lower/upper for each letter
  DYNAMIC_PROGRAMMING:
    title: Programación dinámica
    subtitle: Subproblemas superpuestos y subestructura óptima, resueltos una vez y reutilizados
    intuition: La programación dinámica se aplica cuando un problema tiene subestructura óptima (la mejor
      respuesta se construye a partir de las mejores respuestas a subproblemas más pequeños) y subproblemas
      superpuestos (el mismo subproblema pequeño se necesita varias veces). En vez de recalcular esos
      subproblemas superpuestos desde cero, guardas la respuesta de cada subproblema una sola vez, ya
      sea de arriba hacia abajo con memoización o de abajo hacia arriba llenando una tabla en orden de
      dependencias.
    recognition: El problema pide un conteo óptimo, un valor mínimo/máximo, o un número de formas, y una
      solución recursiva de fuerza bruta visitaría repetidamente las mismas entradas más pequeñas -ejemplos
      clásicos incluyen variantes de la mochila, subsecuencia creciente más larga, house robber, distancia
      de edición, y conteo de caminos únicos.
    walkthrough: 'Empieza definiendo qué representa exactamente dp[i] (o dp[i][j]) en palabras simples
      -este es el paso más importante y debe enunciarse antes de escribir código. Escribe la recurrencia
      que relaciona dp[i] con subproblemas más pequeños, e identifica los casos base que no requieren
      más recursión. Decide un orden de llenado para que cada valor del que depende la recurrencia ya
      esté calculado cuando se necesite, y luego implementa recursión memoizada de arriba hacia abajo
      o un bucle de abajo hacia arriba. Una vez correcto, busca una optimización de espacio: si dp[i]
      solo depende de la última fila o valor anterior, a menudo puedes reducir una tabla O(n^2) a O(n)
      o O(1) -pero solo después de que la versión ingenua funcione y hayas explicado la recurrencia claramente
      a tu entrevistador.'
    telltaleSigns:
    - Pide un valor óptimo (mín/máx) o un conteo de formas, no solo cualquier disposición válida
    - Una solución recursiva de fuerza bruta recalcularía subproblemas idénticos más pequeños repetidamente
    - Las elecciones en cada paso interactúan con un presupuesto/capacidad/objetivo en curso (estilo mochila)
    - El problema puede plantearse como 'la mejor respuesta usando los primeros i elementos' o algo similar
    templateSteps:
    - Define el significado de dp[i] o dp[i][j] en una frase clara
    - Escribe la recurrencia que lo relaciona con subproblemas más pequeños, más los casos base
    - Elige un orden de iteración donde las dependencias siempre se calculen antes
    - Implementa de abajo hacia arriba (tabla) o de arriba hacia abajo (recursión memoizada)
    - Optimiza el espacio después, si dp solo depende de una pequeña ventana de estados anteriores
    commonMistakes:
    - Escribir código antes de definir claramente qué significa dp[i], llevando a una recurrencia incorrecta
      o indemostrable
    - Casos base faltantes o incorrectos, causando errores de límite en toda la tabla
    - Iterar en el orden equivocado, de modo que una dependencia aún no se ha calculado cuando se necesita
    - Optimizar el espacio prematuramente antes de verificar que la versión directa es correcta
    whenNotToUse:
    - 'Los subproblemas en realidad no se superponen: divide y vencerás simple o un enfoque voraz serán
      más simples e igual de rápidos'
    - El problema solo necesita una respuesta factible, no un óptimo, y el backtracking podado es más
      directo
    problems:
      climbing-stairs:
        title: Subir escaleras
        summary: Cuenta las formas distintas de subir n escalones, avanzando 1 o 2 escalones a la vez.
        whenToUse: 'Una introducción a DP con forma de Fibonacci: dp[i] = dp[i-1] + dp[i-2].'
        hints:
        - Los casos base son dp[1]=1 y dp[2]=2.
        - Solo se necesitan los últimos dos valores, así que basta espacio O(1).
      house-robber:
        title: El ladrón de casas
        summary: Encuentra el máximo dinero que puedes robar sin robar dos casas adyacentes.
        whenToUse: 'dp[i] = max(dp[i-1], dp[i-2] + nums[i]): decide omitir o robar cada casa.'
        hints:
        - En cada casa, omítela (dp[i-1]) o róbala (dp[i-2] + nums[i]).
        - Solo hace falta guardar los dos valores anteriores de dp.
      0-1-knapsack:
        title: Mochila 0/1
        summary: Maximiza el valor empacado en una capacidad de peso cuando cada ítem se puede usar como
          máximo una vez.
        whenToUse: El clásico DP de mochila en 2D (o 1D con iteración inversa) sobre el índice del ítem
          y la capacidad restante.
        hints:
        - dp[c] representa el mejor valor alcanzable con capacidad c.
        - Itera la capacidad de mayor a menor en la versión 1D para que cada ítem se use solo una vez.
      coin-change:
        title: Cambio de monedas
        summary: Cantidad mínima de monedas para formar el monto, o -1 si no es posible.
        whenToUse: DP de mochila no acotada sobre el monto.
        hints:
        - dp[x] = mínimo sobre las monedas c de dp[x-c]+1
        - Inicializa dp[0]=0 y el resto en +infinito
      edit-distance:
        title: Distancia de edición
        summary: Número mínimo de operaciones de inserción, eliminación y reemplazo para transformar word1
          en word2.
        whenToUse: DP 2D clásica sobre los prefijos.
        hints:
        - Si los caracteres coinciden, toma el valor diagonal
        - Si no, 1 + el mínimo entre insertar, eliminar y reemplazar
  CYCLIC_SORT:
    title: Ordenamiento cíclico
    subtitle: Coloca cada número del rango [1..n] en su índice de origen valor-1
    intuition: Cuando los valores de un arreglo están garantizados dentro de un rango pequeño conocido
      como 1..n (o 0..n), cada valor tiene un índice de origen 'correcto'. Intercambiar repetidamente
      cada valor mal ubicado a su índice correcto ordena el arreglo en O(n) sin espacio extra, y un segundo
      recorrido revela al instante números faltantes o duplicados porque sus casillas apuntan al valor
      equivocado o contienen el conteo incorrecto.
    recognition: El arreglo contiene n (o cerca de n) números tomados de un rango pequeño conocido como
      1..n o 0..n-1, y la pregunta trata de encontrar un número faltante, números duplicados, un par corrupto,
      o el primer entero positivo faltante -todo bajo restricciones de tiempo O(n) y espacio extra O(1).
    walkthrough: 'Recorre el arreglo con un índice i, y mientras nums[i] no esté en su posición correcta
      (nums[i] - 1 != i, asumiendo valores 1..n), intercambia nums[i] con el elemento que ocupa actualmente
      el índice de origen correcto de nums[i]. Repite el intercambio en el mismo índice i hasta que el
      valor allí esté correctamente ubicado o sea un valor duplicado/fuera de rango que se intercambiaría
      consigo mismo -solo entonces avanza i. Tras esta única pasada, haz una segunda: cualquier índice
      i donde nums[i] != i + 1 revela un número faltante (falta i + 1) o, si buscas duplicados, el valor
      que aparece dos veces. Cuídate de los bucles infinitos cuando hay duplicados, ya que un duplicado
      nunca podrá llegar a una posición ''correcta'' ya ocupada por sí mismo.'
    telltaleSigns:
    - Números en un rango pequeño y conocido, estrechamente ligado a los índices del arreglo (1..n o 0..n)
    - Necesitas encontrar número(s) faltante(s), duplicado(s), o un par corrupto
    - Se exigen explícitamente tiempo O(n) y espacio extra O(1)
    - Planteamiento tipo 'primer entero positivo faltante' o mapeo similar a índices
    templateSteps:
    - Para cada índice i, verifica si nums[i] está en su índice de origen correcto (valor - 1)
    - Si no, intercambia nums[i] con el elemento en su índice de origen correcto
    - Repite el intercambio en el índice i hasta que tenga un valor correctamente ubicado o duplicado,
      luego avanza
    - Haz una segunda pasada para detectar cualquier índice cuyo valor no coincida con el esperado
    - Reporta números faltantes/duplicados según esa discrepancia
    commonMistakes:
    - Avanzar i después de un solo intercambio en vez de repetir intercambios en i hasta estabilizarse
    - Bucle infinito cuando un valor duplicado sigue intentando intercambiarse a una posición ya correcta
    - Errores de límite al convertir entre valor e índice (valor - 1 frente a valor)
    - Olvidar que el arreglo podría usar valores indexados desde 0 en vez de desde 1, cambiando la fórmula
      de mapeo
    whenNotToUse:
    - Los valores no están confinados a un rango pequeño ligado a la longitud del arreglo (se necesita
      un set hash o ordenar)
    - El arreglo no debe mutarse, y no se permite espacio extra O(n) para una copia de solo lectura
    problems:
      cyclic-sort:
        title: Ordenamiento cíclico
        summary: Ordena en el lugar un arreglo que contiene números del 1 al n.
        whenToUse: La aplicación directa y clásica del patrón.
        hints:
        - Mientras nums[i] no esté en el índice nums[i]-1, intercámbialo allí.
        - Cada elemento se intercambia como máximo una vez a su lugar final, manteniendo O(n).
      find-missing-number:
        title: Encontrar el número faltante
        summary: Dados n números distintos tomados de 0..n, encuentra el número que falta en el arreglo.
        whenToUse: Coloca los números cíclicamente (o usa suma/XOR); aquí, ordenamiento cíclico y luego
          busca la discrepancia.
        hints:
        - Coloca cada valor v en el índice v cuando v < n.
        - Tras colocar, el primer índice i donde nums[i] != i es el número faltante.
      find-all-duplicates:
        title: Encontrar todos los duplicados
        summary: Dados números de 1..n donde algunos aparecen dos veces, devuelve todos los duplicados.
        whenToUse: Coloca cada valor por índice; lo que no se puede colocar porque su casilla está ocupada
          es un duplicado.
        hints:
        - Ejecuta la colocación de ordenamiento cíclico como de costumbre.
        - Tras colocar, cualquier índice i donde nums[i] != i + 1 contiene un valor duplicado.
      find-duplicate-number:
        title: Encontrar el número duplicado
        summary: Un arreglo de n+1 enteros entre 1 y n tiene un duplicado; encuéntralo sin modificar el
          arreglo.
        whenToUse: Ciclo de Floyd sobre el grafo índice→valor (o colocación cíclica).
        hints:
        - Trátalo como una lista enlazada donde next = nums[i]
        - Encuentra la entrada del ciclo
      first-missing-positive:
        title: Primer entero positivo faltante
        summary: El menor entero positivo faltante en un arreglo desordenado.
        whenToUse: Coloca cada valor v en el índice v-1 cuando esté dentro del rango.
        hints:
        - Ignora los valores no positivos y los mayores que n
        - Busca el primer índice i tal que nums[i] != i+1
  TOPOLOGICAL_SORT:
    title: Ordenamiento topológico
    subtitle: Ordena tareas con prerrequisitos usando BFS guiado por grado de entrada en un DAG
    intuition: 'Siempre que las tareas tengan prerrequisitos, esa relación de dependencia es un grafo
      dirigido, y cualquier orden de ejecución válido es un ordenamiento topológico de ese grafo -que
      solo existe si el grafo no tiene ciclos. El algoritmo de Kahn concreta esto: retira repetidamente
      los nodos que actualmente no tienen prerrequisitos pendientes (grado de entrada cero), ya que siempre
      es seguro programarlos a continuación.'
    recognition: El problema habla de prerrequisitos, dependencias, o relaciones de 'debe ocurrir antes'
      entre elementos -horarios de cursos, sistemas de build, orden de letras en un diccionario alienígena-
      y pide un orden válido, si existe alguno, o detectar una dependencia imposible (cíclica).
    walkthrough: Construye una lista de adyacencia que represente las aristas 'A debe ir antes que B',
      y calcula simultáneamente el grado de entrada (prerrequisitos pendientes) de cada nodo. Inicializa
      una cola con todos los nodos de grado de entrada cero, ya que no tienen prerrequisitos pendientes
      y pueden programarse de inmediato. Extrae repetidamente un nodo, agrégalo al orden de salida, y
      luego decrementa el grado de entrada de cada uno de sus vecinos -cualquier vecino cuyo grado llegue
      a cero se agrega a la cola. Si el número de nodos procesados termina siendo menor que el total,
      existe un ciclo y no hay orden válido posible -exactamente la respuesta para preguntas tipo '¿se
      pueden terminar todos los cursos?'. Para problemas tipo diccionario alienígena, primero deriva las
      aristas comparando cada par de palabras adyacentes carácter por carácter hasta la primera letra
      distinta, y luego aplica el mismo ordenamiento topológico sobre el alfabeto.
    telltaleSigns:
    - Prerrequisitos, dependencias, o relaciones de 'debe ir antes' entre elementos
    - Se necesita un orden de procesamiento válido, o detectar si existe alguno
    - Grafo dirigido donde los ciclos hacen imposible la tarea
    - Problemas de derivación de orden lexicográfico tipo diccionario alienígena
    templateSteps:
    - Construye una lista de adyacencia de aristas 'antes de' y un conteo de grado de entrada por nodo
    - Inicializa una cola con todos los nodos que actualmente tienen grado de entrada cero
    - Extrae un nodo, agrégalo al orden, y decrementa el grado de entrada de sus vecinos
    - Agrega a la cola cualquier vecino cuyo grado de entrada llegue a cero
    - Si se procesaron menos nodos de los que existen, reporta un ciclo / orden imposible
    commonMistakes:
    - Construir las aristas en la dirección equivocada, invirtiendo la relación 'antes de' pretendida
    - Olvidar verificar si se procesaron todos los nodos, perdiendo por completo la detección de ciclos
    - No inicializar el grado de entrada de nodos sin aristas entrantes antes de sembrar la cola
    - En problemas de diccionario alienígena, pasar por alto el caso donde una palabra es prefijo de otra
      pero aparece después (orden inválido)
    whenNotToUse:
    - 'El grafo está garantizado como acíclico y el acceso sin orden es aceptable: basta un recorrido
      DFS/BFS simple'
    - Las relaciones no son realmente un grafo de dependencia/precedencia, solo conectividad general (BFS/DFS
      simple o union-find encajan mejor)
    problems:
      course-schedule:
        title: Horario de cursos
        summary: Determina si puedes terminar todos los cursos dada una lista de pares de prerrequisitos.
        whenToUse: 'Detección de ciclos mediante ordenamiento topológico: si no se procesan todos los
          nodos, un ciclo bloquea la finalización.'
        hints:
        - Construye el grafo como prerrequisito -> curso.
        - Si el conteo de nodos procesados es menor que el total de cursos, existe un ciclo.
      course-schedule-order:
        title: Orden del horario de cursos
        summary: Devuelve un orden de cursos válido, o un arreglo vacío si no existe ninguno.
        whenToUse: El algoritmo de Kahn, recolectando los nodos extraídos directamente en el orden de
          salida.
        hints:
        - Inicializa la cola con todos los cursos de grado de entrada cero.
        - Si la longitud del orden final es menor que el conteo de cursos, devuelve un arreglo vacío.
      tasks-scheduling:
        title: Planificación de tareas
        summary: ¿Se pueden completar todas las tareas dados sus requisitos previos?
        whenToUse: Igual que la programación de cursos — detección de ciclos mediante orden topológico.
        hints:
        - Construye el grafo con el grado de entrada de cada nodo
        - BFS de Kahn; falla si el número procesado es menor que el total de tareas
      alien-dictionary-order:
        title: Diccionario alienígena
        summary: Deriva el orden de las letras de un alfabeto alienígena a partir de palabras ordenadas
          del diccionario.
        whenToUse: Extrae las aristas comparando palabras adyacentes y aplica orden topológico.
        hints:
        - Compara pares adyacentes buscando la primera diferencia
        - Es inválido si la palabra más larga aparece antes que su propio prefijo
      verify-alien-dictionary:
        title: Verificar diccionario alienígena
        summary: Check whether words are sorted by a given alien alphabet order.
        whenToUse: Compare adjacent words using a custom alphabet ranking.
        hints:
        - Map each letter to its rank
        - Invalid if longer word is a prefix after a shorter equal prefix
  SORT_AND_SEARCH:
    title: Ordenar y buscar
    subtitle: Ordena por la clave correcta para habilitar comparaciones adyacentes o búsqueda binaria
    intuition: Muchos problemas que parecen complicados se simplifican en cuanto ordenas los datos por
      la clave correcta, porque ordenar expone estructura -los elementos iguales o relacionados quedan
      adyacentes, y buscar en datos ordenados puede bajar de O(n) a O(log n). La habilidad aquí es reconocer
      por qué clave ordenar (no necesariamente el valor bruto) y qué se vuelve posible -agrupar, comparar
      adyacentes, o búsqueda binaria- una vez ordenados los datos.
    recognition: El problema no encaja en un patrón clásico específico, pero ordenar por una clave ingeniosamente
      elegida (una cadena normalizada, una coordenada, una razón) lo convierte en un problema fácil de
      comparación adyacente o búsqueda binaria.
    walkthrough: Pregúntate qué clave, al ordenar, acercaría elementos relacionados o expondría un orden
      útil -para agrupar anagramas, esa clave son las letras de cada palabra ordenadas alfabéticamente;
      para programación, podría ser la hora de inicio o fin; para sugerencias de búsqueda, el simple orden
      lexicográfico de la lista de productos. Ordena una vez usando esa clave, aceptando el costo O(n
      log n) por adelantado. Luego haz un único recorrido lineal comparando elementos adyacentes (para
      agrupar/contar) o ejecuta búsqueda binaria por cada consulta (para búsquedas repetidas), en vez
      de re-recorrer todo el conjunto de datos en cada consulta. Cuando se necesite un comparador personalizado,
      escríbelo explícitamente y pruébalo con un par de elementos complicado antes de integrarlo en la
      ordenación completa, ya que un comparador sutilmente incorrecto produce agrupaciones o resultados
      de búsqueda erróneos sin lanzar ningún error.
    telltaleSigns:
    - El orden natural de la entrada no importa para la corrección de la respuesta
    - Una clave de ordenación bien elegida convierte el problema en comparaciones adyacentes o búsqueda
      binaria
    - Se necesita un comparador personalizado (por firma de cadena, por razón, por un valor derivado)
    - Búsquedas repetidas en un conjunto de datos que no cambia entre consultas
    templateSteps:
    - Identifica la clave que, al ordenar, agrupa u ordena los datos de forma útil
    - Ordena una vez por esa clave (con un comparador personalizado si hace falta)
    - Recorre adyacentemente para agrupar/contar, o aplica búsqueda binaria por consulta
    - Usa un mapa hash junto con la ordenación al agrupar por la clave de orden
    - Valida el comparador con un par complicado elegido a mano antes de confiar en la ordenación completa
    commonMistakes:
    - Ordenar por el valor bruto cuando en realidad importa una clave derivada (firma, razón)
    - Escribir un comparador con un orden inconsistente (no transitivo), produciendo ordenaciones sutilmente
      incorrectas
    - Reordenar en cada consulta en vez de ordenar una vez y reutilizar el resultado
    - Olvidar los requisitos de estabilidad cuando el problema necesita desempatar por el orden original
    whenNotToUse:
    - Los datos deben permanecer en su orden original para ser correctos (ordenar destruiría información
      necesaria)
    - Ordenar cuesta más de lo que permite la complejidad temporal requerida (por ejemplo, un objetivo
      O(n) sin forma de evitar ordenar todo)
    problems:
      group-anagrams:
        title: Agrupar anagramas
        summary: Agrupa un arreglo de cadenas de modo que todos los anagramas entre sí queden juntos.
        whenToUse: Ordena los caracteres de cada palabra para formar una clave canónica y agrupa por esa
          clave en un mapa hash.
        hints:
        - Dos cadenas son anagramas exactamente cuando sus secuencias de caracteres ordenadas son iguales.
        - Usa la cadena ordenada (o una firma de conteo de caracteres) como clave del mapa hash.
      search-suggestions:
        title: Sugerencias de búsqueda (prefijo ordenado)
        summary: Para cada prefijo de una palabra de búsqueda, devuelve hasta 3 productos coincidentes
          lexicográficamente menores.
        whenToUse: Ordena los productos una vez y luego aplica búsqueda binaria del límite inferior de
          cada prefijo creciente en vez de recorrer todo de nuevo.
        hints:
        - Ordena la lista de productos lexicográficamente de antemano.
        - Para cada prefijo, busca con binaria el límite inferior y toma hasta 3 coincidencias desde ahí.
      wiggle-sort:
        title: Ordenamiento en zigzag (Wiggle Sort)
        summary: Reordena el arreglo para que nums[0] <= nums[1] >= nums[2] <= nums[3] …
        whenToUse: Intercambios en una sola pasada según la paridad de la posición.
        hints:
        - Para i par, asegura que nums[i] <= nums[i+1]
        - Para i impar, asegura que nums[i] >= nums[i+1]
      count-smaller-after-self:
        title: Contar números menores a la derecha
        summary: Para cada elemento, cuenta cuántos elementos menores hay a su derecha.
        whenToUse: Merge sort de índices contando inversiones durante la fusión.
        hints:
        - Aplica merge sort sobre los índices del arreglo
        - Al tomar un elemento de la mitad derecha, suma mid-i+1 a los conteos de la izquierda
      intersection-two-arrays:
        title: Intersección de dos arreglos
        summary: Return unique intersection of two arrays.
        whenToUse: Sort + two pointers, or hash set membership.
        hints:
        - Put one array into a set
        - Filter unique hits from the other
  MATRICES:
    title: Matrices
    subtitle: Recorre, transforma y busca en cuadrículas 2D de forma sistemática
    intuition: Los problemas de cuadrículas y matrices suelen tratarse de controlar exactamente cómo recorres
      -orden espiral, capa por capa, o mediante vectores de dirección- y las matrices también pueden tratarse
      como un grafo implícito donde cada celda es un nodo conectado a sus (hasta cuatro) vecinos. Acertar
      la aritmética de índices para los límites (arriba/abajo/izquierda/derecha, o deltas de fila/columna)
      es la mayor parte del trabajo.
    recognition: La entrada es una cuadrícula o matriz 2D, y la tarea implica recorrerla en un orden específico
      (espiral, diagonal, zigzag), transformarla en el lugar (rotar, poner ceros), o buscar/inundar celdas
      conectadas.
    walkthrough: 'Primero aclara qué se requiere: ¿recorrido basado en índices (espiral, rotación, diagonal)
      o basado en conectividad (inundación, búsqueda)? Para el recorrido por índices, mantén variables
      explícitas de límite (arriba, abajo, izquierda, derecha) y redúcelas al consumir cada capa, o usa
      un pequeño arreglo de vectores de dirección que cicles al chocar con una pared. Para transformaciones
      en el lugar como rotar 90 grados, busca una descomposición en dos pasos (transponer y luego invertir
      cada fila) en vez de calcular la posición final de cada celda directamente. Para problemas de conectividad,
      trata la cuadrícula como un grafo: ejecuta DFS o BFS desde cada celda ''interesante'' no visitada,
      marcando las celdas visitadas para evitar reprocesarlas, y siempre verifica los límites de fila/columna
      antes de recurrir o encolar un vecino.'
    telltaleSigns:
    - La entrada es una cuadrícula o matriz 2D que requiere recorrido o transformación sistemática
    - Requisitos de orden espiral, recorrido diagonal, o rotación en el lugar
    - Problemas tipo inundación / componentes conectados en una cuadrícula
    - Búsqueda dentro de una matriz ordenada por filas y columnas
    templateSteps:
    - Decide si la tarea es recorrido por índices o conectividad estilo grafo
    - 'Para índices: rastrea límites que se reducen o cicla vectores de dirección'
    - 'Para rotación en el lugar: descompón en transponer + invertir (u otra transformación equivalente
      de dos pasos)'
    - 'Para conectividad: ejecuta DFS/BFS con marcador de visitados y verificación de límites en cada
      vecino'
    - Aclara si la cuadrícula puede mutarse en el lugar o necesita una estructura de visitados separada
    commonMistakes:
    - Errores de límite al reducir los bordes de la espiral, saltando o duplicando una celda de borde
    - Olvidar verificar los límites de fila/columna antes de acceder a un vecino, causando errores fuera
      de rango
    - Usar la propia cuadrícula como marcador de visitados sin restaurarla cuando se debe preservar la
      original
    - Intentar calcular las posiciones de una matriz rotada directamente en vez de usar el truco de transponer+invertir
    whenNotToUse:
    - La cuadrícula es efectivamente 1D o dispersa, y un enfoque más simple de arreglo/hash evita contabilidad
      2D innecesaria
    - La cuadrícula es demasiado grande para la memoria, requiriendo un enfoque en flujo o en disco en
      vez de un recorrido completo
    problems:
      spiral-order:
        title: Matriz espiral
        summary: Devuelve todos los elementos de una matriz en orden espiral en sentido horario.
        whenToUse: Reduce los límites superior/inferior/izquierdo/derecho tras consumir completamente
          cada borde de la capa actual.
        hints:
        - Recorre la fila superior, la columna derecha, la fila inferior y la columna izquierda, en ese
          orden cíclico.
        - Tras cada borde, mueve el límite correspondiente hacia adentro en uno.
      rotate-image:
        title: Rotar imagen
        summary: Rota una matriz n x n 90 grados en sentido horario, en el lugar.
        whenToUse: 'Transpón la matriz primero y luego invierte cada fila: dos pasadas simples O(n^2)
          en vez de aritmética de índices complicada.'
        hints:
        - Transponer intercambia matrix[i][j] con matrix[j][i] para i < j.
        - Invertir cada fila tras transponer produce la rotación en sentido horario.
      set-matrix-zeroes:
        title: Poner ceros en la matriz
        summary: Si una celda es 0, pon toda su fila y columna en 0, en el lugar.
        whenToUse: Usa la primera fila y la primera columna como marcadores en vez de reservar arreglos
          extra.
        hints:
        - Usa dos banderas booleanas para recordar si la primera fila/columna tenía originalmente un cero.
        - Marca la fila i y la columna j mediante matrix[i][0] y matrix[0][j] mientras recorres el resto
          de la cuadrícula.
      search-2d-matrix:
        title: Buscar en una matriz 2D II
        summary: Busca un valor en una matriz ordenada por filas y columnas.
        whenToUse: Empieza en la esquina superior derecha y muévete a la izquierda o hacia abajo según
          la comparación.
        hints:
        - Comienza en la esquina superior derecha
        - Si es muy grande, ve a la izquierda; si es muy pequeño, baja
      shortest-path-binary-matrix:
        title: Camino más corto en matriz binaria
        summary: Encuentra el camino libre más corto de (0,0) a (n-1,n-1) con movimientos en 8 direcciones.
        whenToUse: BFS sobre el grafo de la cuadrícula.
        hints:
        - Camina solo por celdas con valor 0
        - Usa BFS para calcular la distancia desde el inicio
      matrix-diagonal-sum:
        title: Suma de diagonales de matriz
        summary: Sum primary and secondary diagonals without double-counting the center.
        whenToUse: Direct index walk on a square matrix.
        hints:
        - Add mat[i][i] and mat[i][n-1-i]
        - Subtract center once if n is odd
  STACKS:
    title: Pilas (stacks)
    subtitle: LIFO para pares coincidentes, el siguiente elemento mayor y estructuras monótonas
    intuition: Una pila encaja naturalmente cuando la respuesta a '¿qué resuelve este elemento?' depende
      del candidato no resuelto visto más recientemente -como el paréntesis de apertura sin emparejar
      más reciente, o el elemento anterior más cercano que aún espera que aparezca algo mayor. Mantener
      la pila monótona (siempre creciente o siempre decreciente) permite resolver muchos elementos en
      un único paso amortizado O(n) en vez de comparar cada par.
    recognition: El problema involucra emparejar pares (paréntesis/corchetes), hallar el siguiente/anterior
      elemento mayor o menor, calcular tramos hasta que cambie una condición (temperaturas diarias), o
      calcular áreas/alturas que dependen de elementos vecinos más altos/bajos (rectángulo más grande
      en un histograma).
    walkthrough: 'Para problemas de emparejamiento, apila los símbolos de apertura y, en cada símbolo
      de cierre, verifica que coincida con la cima de la pila antes de extraerlo -una discrepancia o una
      pila vacía en el momento equivocado significa que la entrada es inválida. Para problemas de ''siguiente
      elemento mayor'', recorre el arreglo manteniendo una pila monótona de índices: antes de apilar el
      elemento actual, extrae todo lo que sea menor que él, ya que el elemento actual es precisamente
      la respuesta de ''siguiente mayor'' para cada índice extraído. Registra esa resolución al extraer,
      y luego apila el índice actual. Para problemas de área tipo histograma, usa la misma idea de pila
      monótona pero además calcula un ancho cada vez que extraigas, usando la nueva cima de la pila (o
      -1) como límite izquierdo y el índice actual como límite derecho. Termina siempre vaciando los elementos
      que queden en la pila tras el bucle principal, ya que pueden representar candidatos no resueltos
      que llegan hasta el final del arreglo.'
    telltaleSigns:
    - Emparejamiento de símbolos (paréntesis, corchetes, etiquetas)
    - Lenguaje de 'siguiente/anterior elemento mayor/menor'
    - Días/posiciones hasta que cambie una condición (estilo temperaturas diarias)
    - Cálculos de rectángulo más grande, área o tramo dependientes de elementos cercanos
    - Oportunidad explícita de pila monótona en un arreglo/secuencia
    templateSteps:
    - 'Para emparejar: apila los aperturas y valida/extrae contra la cima en cada cierre'
    - 'Para siguiente/anterior mayor: mantén una pila monótona de índices, extrayendo y resolviendo cuando
      el elemento actual supere la cima'
    - Registra la resolución (distancia, valor, área) en el momento de extraer, no antes
    - Para problemas de área/ancho, usa la nueva cima tras extraer como límite
    - Vacía las entradas restantes de la pila tras el bucle principal para resolver candidatos pendientes
    commonMistakes:
    - Extraer sin registrar primero la resolución del elemento extraído
    - Usar una pila de valores en vez de índices cuando se necesitan distancias/tramos
    - Olvidar vaciar la pila tras el bucle, dejando algunos elementos sin resolver
    - Invertir la dirección monótona (creciente frente a decreciente) para la variante específica
    whenNotToUse:
    - La relación entre elementos no trata sobre el 'candidato no resuelto más reciente' (un mapa hash
      o dos punteros puede ser más simple)
    - Se necesita acceso aleatorio al medio de la secuencia de candidatos pendientes (una pila solo expone
      la cima)
    problems:
      valid-parentheses:
        title: Paréntesis válidos
        summary: Verifica si una cadena de paréntesis está correctamente emparejada y anidada.
        whenToUse: La plantilla clásica de pila para cualquier pregunta de validez de paréntesis.
        hints:
        - Apila los paréntesis de apertura; en uno de cierre, extrae y verifica que coincida.
        - La cadena es válida solo si la pila está vacía al final.
      daily-temperatures:
        title: Temperaturas diarias
        summary: Para cada día, encuentra cuántos días faltan hasta que ocurra una temperatura más cálida.
        whenToUse: Una pila monótona decreciente de índices resuelve cada día en cuanto aparece uno más
          cálido.
        hints:
        - Guarda índices en la pila, no temperaturas, para poder calcular diferencias de días.
        - Extrae y resuelve cada índice apilado cuya temperatura sea menor que la del día actual.
      next-greater-element:
        title: Siguiente elemento mayor
        summary: Para cada elemento de nums1, encuentra su siguiente elemento mayor en nums2 (nums1 es
          subconjunto de nums2).
        whenToUse: Precalcula el siguiente mayor para cada valor de nums2 con una pila monótona, y luego
          mapea las respuestas de nums1 con un mapa hash.
        hints:
        - Construye el mapeo completo de 'siguiente mayor' para nums2 en una sola pasada con pila monótona.
        - Busca cada valor de nums1 en ese mapeo en vez de recorrer nums2 en cada consulta.
      decode-string:
        title: Decodificar cadena
        summary: Decodifica una cadena codificada como 3[a2[c]] → accaccacc.
        whenToUse: Pila de contadores y cadenas parciales.
        hints:
        - Apila al encontrar '['
        - Desapila y repite la cadena al encontrar ']'
      basic-calculator:
        title: Calculadora básica
        summary: Evalúa una expresión con +, -, paréntesis y espacios.
        whenToUse: Pila de signos para manejar paréntesis anidados.
        hints:
        - Mantén el resultado acumulado y el signo actual
        - En '(' apila resultado/signo; en ')' desapílalos
  GRAPHS:
    title: Grafos
    subtitle: Recorrido BFS/DFS en grafos explícitos o implícitos
    intuition: Cualquier problema que involucre nodos conectados por relaciones -aristas explícitas o
      adyacencia implícita, como celdas de cuadrícula contiguas- es en el fondo un problema de grafos.
      Construir o imaginar la estructura de adyacencia y luego elegir BFS (camino más corto en un grafo
      no ponderado, o exploración nivel por nivel) frente a DFS (conectividad, existencia de caminos,
      exploración exhaustiva) cubre la gran mayoría de las preguntas de grafos en entrevistas.
    recognition: El problema menciona nodos y aristas explícitos, o un grafo implícito como una cuadrícula
      donde las celdas están conectadas a sus vecinas, y pregunta sobre conectividad, componentes, caminos
      más cortos (no ponderados), clonación, o alcanzabilidad.
    walkthrough: 'Primero determina si el grafo se da explícitamente (lista/matriz de adyacencia, lista
      de aristas) o implícitamente (vecinos de cuadrícula, transformaciones de palabras); construye una
      representación explícita de adyacencia si aún no existe, ya que casi todo algoritmo de grafos asume
      búsqueda de vecinos en O(1). Decide BFS o DFS según lo que necesites: BFS si necesitas la longitud
      del camino más corto o estructura por niveles en un grafo no ponderado, DFS si necesitas explorar
      completamente, detectar componentes, o el problema es naturalmente recursivo (como clonar). Mantén
      un conjunto de visitados para evitar revisitar nodos y bucles infinitos, y procesa los nodos sistemáticamente
      -una cola para BFS, una pila o recursión para DFS. Para problemas de ''número de componentes'',
      recorre cada nodo no visitado, lanzando un nuevo BFS/DFS desde cada uno e incrementando un contador.'
    telltaleSigns:
    - Nodos/aristas explícitos, o un grafo implícito como una cuadrícula de celdas conectadas
    - Preguntas de conectividad, número de componentes conectados, o alcanzabilidad
    - Camino más corto en un grafo no ponderado (BFS) o necesidad de exploración completa (DFS)
    - Clonar, copiar, o transformar una estructura de grafo
    templateSteps:
    - Construye una lista/mapa de adyacencia explícito si el grafo aún no está representado así
    - Elige BFS para camino más corto/estructura por niveles, DFS para exploración exhaustiva/componentes
    - Mantén un conjunto de visitados (o marcado en la propia cuadrícula) para evitar revisitar nodos
    - Procesa con una cola (BFS) o recursión/pila (DFS), encolando/recurriendo a vecinos no visitados
    - Para problemas de 'conteo de componentes', recorre todos los nodos e inicia un nuevo recorrido desde
      cada uno no visitado
    commonMistakes:
    - Olvidar marcar un nodo como visitado antes (no después) de encolarlo en BFS, causando encolados
      duplicados
    - Confundir BFS y DFS cuando el problema específicamente necesita el camino más corto no ponderado
      (debe ser BFS)
    - No manejar componentes desconectados, explorando solo desde un único nodo inicial
    - 'Desbordamiento de pila por recursión DFS profunda en grafos grandes: considera convertir a una
      pila explícita'
    whenNotToUse:
    - Las aristas tienen pesos y necesitas el camino más corto ponderado (usa Dijkstra o Bellman-Ford
      en vez de BFS/DFS simples)
    - La estructura es en realidad un árbol o DAG con un patrón más especializado disponible (recorrido
      de árbol u ordenamiento topológico)
    problems:
      number-of-islands:
        title: Número de islas
        summary: Cuenta el número de componentes de tierra ('1') en una cuadrícula 2D de agua y tierra.
        whenToUse: Inundación DFS o BFS desde cada celda de tierra no visitada, contando cuántas inundaciones
          se necesitan.
        hints:
        - Marca una celda de tierra como visitada (o conviértela en '0') en cuanto la encoles/visites.
        - Cada inundación desde una celda de tierra nueva no visitada representa exactamente una isla.
      clone-graph:
        title: Clonar grafo
        summary: Crea una copia profunda de un grafo no dirigido y conectado a partir de un nodo de referencia.
        whenToUse: Un mapa hash del nodo original a su clon, llenado mientras se hace BFS o DFS.
        hints:
        - Crea el clon de un nodo la primera vez que lo veas y guárdalo de inmediato en el mapa.
        - Al conectar vecinos, busca (o crea) sus clones a través del mismo mapa para evitar recursión
          infinita.
      pacific-atlantic:
        title: Flujo de agua al Pacífico y al Atlántico
        summary: Encuentra las celdas desde las cuales el agua puede fluir hacia ambos océanos.
        whenToUse: DFS/BFS multi-origen tierra adentro desde los bordes de cada océano.
        hints:
        - El agua solo fluye hacia vecinos con altura >= la actual
        - Calcula la intersección de los conjuntos alcanzables desde cada océano
      critical-connections:
        title: Conexiones críticas en una red
        summary: Encuentra todos los puentes en un grafo no dirigido.
        whenToUse: DFS de Tarjan con tiempos de descubrimiento y valores low-link.
        hints:
        - Hay un puente cuando low[vecino] > disc[u]
        - Ignora la arista hacia el padre
      find-center-star:
        title: Centro de grafo estrella
        summary: Find the center node of a star graph given edges.
        whenToUse: Center appears in every edge — compare first two edges.
        hints:
        - Look at edges[0] and edges[1]
        - The shared node is the center
  TREE_DFS:
    title: DFS en árboles
    subtitle: Recorre recursivamente caminos raíz-hoja y propiedades de subárboles
    intuition: 'La mayoría de los problemas de árboles binarios son naturalmente recursivos: procesar
      el nodo actual, recurrir en los hijos izquierdo y derecho, y combinar sus resultados en una respuesta
      para el nodo actual. El valor de retorno de la recursión es la decisión de diseño clave: decidir
      exactamente qué debe devolver la llamada recursiva de un subárbol a su padre es lo que hace que
      problemas de suma de caminos, diámetro y LCA tengan sentido.'
    recognition: El problema trata de un árbol binario (o general) y pregunta sobre caminos raíz-hoja,
      propiedades de subárboles, diámetro/camino más largo, ancestro común más bajo, serialización, o
      cualquier propiedad calculada naturalmente combinando resultados de los subárboles izquierdo y derecho.
    walkthrough: 'Define con precisión qué devuelve tu función recursiva para un nodo dado -un booleano,
      una lista, o un valor numérico. Escribe primero el caso base: qué ocurre en un nodo null, ya que
      siempre es el caso más simple y ancla la recursión. Luego escribe el caso recursivo: llama a la
      función en los hijos izquierdo y derecho, y combina sus dos resultados según la regla del problema
      (suma, máximo, AND/OR booleano, concatenación de listas). Para problemas que necesitan una respuesta
      que no es el valor de retorno directo (como el diámetro, un camino posiblemente no a través de la
      raíz), mantén una variable separada de ''mejor respuesta hasta ahora'' actualizada como efecto secundario
      durante la recursión, mientras el valor de retorno en sí se mantiene enfocado en lo que necesita
      el padre (por ejemplo, la altura). Recorre a mano un árbol pequeño de 3-4 nodos para confirmar tanto
      el caso base como el paso de combinación antes de confiar en el código.'
    telltaleSigns:
    - Árbol binario con una pregunta de camino, propiedad de subárbol, o resultado combinado izquierda-derecha
    - Suma de camino raíz-hoja o enumeración de caminos
    - Diámetro, camino más largo, o 'suma de camino máxima' (posiblemente no a través de la raíz)
    - Ancestro común más bajo o problemas tipo serializar/deserializar
    templateSteps:
    - Decide exactamente qué devuelve la llamada recursiva para un nodo dado
    - Escribe primero el caso null/base
    - Recurre en los hijos izquierdo y derecho
    - Combina los resultados de ambos hijos según la regla del problema
    - Rastrea cualquier 'mejor respuesta hasta ahora' como variable auxiliar cuando la respuesta no es
      simplemente el valor de retorno
    commonMistakes:
    - Olvidar el caso null/base, causando NullPointerException
    - Confundir lo que la función devuelve a su padre con la respuesta final realmente necesaria (por
      ejemplo, diámetro vs altura)
    - No reiniciar o delimitar correctamente una variable de 'mejor hasta ahora' cuando debe persistir
      durante todo el recorrido
    - Recalcular propiedades de subárbol en vez de reutilizar los valores ya calculados en la llamada
      recursiva
    whenNotToUse:
    - El árbol es extremadamente desbalanceado/profundo, arriesgando un desbordamiento de pila, y un enfoque
      iterativo con pila explícita es más seguro
    - 'El problema necesita información por niveles (profundidad, orden por nivel): BFS en árboles encaja
      mejor'
    problems:
      path-sum:
        title: Suma de camino
        summary: Determina si existe un camino raíz-hoja cuyos valores sumen un objetivo dado.
        whenToUse: DFS restando el valor del nodo actual del objetivo restante mientras desciendes.
        hints:
        - En una hoja, verifica si el objetivo restante es igual al valor de la hoja.
        - Recurre a los hijos con el objetivo menos el valor del nodo actual.
      all-path-sum:
        title: Todos los caminos para una suma
        summary: Devuelve cada camino raíz-hoja cuyos valores sumen un objetivo dado.
        whenToUse: DFS construyendo una lista de camino en curso, retrocediendo (quitando el último elemento)
          tras cada llamada recursiva.
        hints:
        - Agrega el nodo actual a una lista de camino compartida antes de recurrir, y quítalo después.
        - Copia el camino al resultado solo cuando una hoja coincide exactamente con el objetivo restante.
      tree-diameter:
        title: Diámetro del árbol binario
        summary: Encuentra la longitud (en aristas) del camino más largo entre dos nodos cualesquiera.
        whenToUse: DFS calculando la altura del subárbol mientras actualiza una variable aparte de 'mejor
          diámetro' con izquierda+derecha.
        hints:
        - La función debe devolver la altura, pero actualizar una variable auxiliar con left_height +
          right_height.
        - El diámetro en un nodo puede no pasar por la raíz, así que rastrea el máximo en todos los nodos.
      lowest-common-ancestor:
        title: Ancestro común más bajo
        summary: Encuentra el ancestro común más bajo de dos nodos en un árbol binario.
        whenToUse: 'Recorrido postorden: si ambos lados devuelven algo no nulo, la raíz es el LCA.'
        hints:
        - Devuelve un resultado no nulo desde el subárbol que contiene p o q
        - Si tanto la izquierda como la derecha son no nulas, la respuesta es el nodo actual
      max-path-sum:
        title: Suma máxima de camino en árbol binario
        summary: Suma máxima de un camino entre dos nodos cualesquiera (el camino puede no pasar por la
          raíz).
        whenToUse: DFS que devuelve la mejor ganancia hacia abajo; actualiza el máximo global con left+right+node.
        hints:
        - Ignora las ganancias negativas de los hijos
        - El máximo global considera left+node+right
  TREE_BFS:
    title: BFS en árboles
    subtitle: Recorrido por niveles con una cola, un nivel completo a la vez
    intuition: 'Cuando un problema de árboles habla de niveles, profundidad, o ''el X más cercano'', el
      recorrido por niveles con una cola es la solución natural: procesa un nivel completo a la vez capturando
      el tamaño de la cola al inicio de cada iteración, ya que ese tamaño indica exactamente cuántos nodos
      pertenecen al nivel actual antes de encolar hijos.'
    recognition: El problema pide recorrido por niveles, valores agrupados por profundidad, orden en zigzag,
      el nodo visible más a la derecha/izquierda por nivel, o conectar nodos del mismo nivel mediante
      punteros.
    walkthrough: Inicializa una cola que contenga solo la raíz, y repite mientras la cola no esté vacía.
      Al inicio de cada iteración, registra el tamaño actual de la cola -este es el número exacto de nodos
      en el nivel actual, y es el truco clave que distingue el BFS de árboles del BFS genérico de grafos.
      Extrae exactamente esa cantidad de nodos, procesa cada uno (agrégalo a la lista de resultados del
      nivel actual, rastrea el último para la vista lateral derecha, etc.), y encola los hijos no nulos
      de cada nodo extraído. Una vez procesada por completo la cantidad fija de nodos del nivel, pasa
      a la siguiente iteración del bucle externo, que ahora maneja el siguiente nivel. Para el recorrido
      en zigzag, mantén una bandera de dirección e invierte las listas de resultado de niveles alternos;
      para la vista lateral derecha, simplemente conserva el último nodo procesado en el bucle interno
      de cada nivel.
    telltaleSigns:
    - Lenguaje de recorrido por niveles, profundidad, o 'por nivel'
    - Recorrido en zigzag / dirección alternante
    - Nodo visible más a la derecha o izquierda por nivel
    - Conectar nodos hermanos de la misma profundidad mediante punteros next
    templateSteps:
    - Inicializa una cola con el nodo raíz
    - Al inicio de cada iteración del bucle externo, captura el tamaño actual de la cola como el ancho
      del nivel
    - Extrae exactamente esa cantidad de nodos, procesando cada uno y encolando sus hijos no nulos
    - Recolecta o usa los resultados del nivel (lista, último nodo, orden invertido) según se requiera
    - Repite hasta que la cola esté vacía
    commonMistakes:
    - No capturar el tamaño del nivel antes del bucle interno, difuminando los límites entre niveles
    - Encolar hijos nulos, requiriendo verificaciones extra después en vez de verificar antes de encolar
    - Olvidar invertir niveles alternos para el recorrido en zigzag, o invertir cada nivel en vez de uno
      de cada dos
    - Usar recursión con un parámetro de profundidad cuando un enfoque con cola es más claro para preguntas
      genuinamente por niveles
    whenNotToUse:
    - El problema trata de caminos o agregados de subárboles en vez de niveles (DFS en árboles encaja
      mejor y suele ser más simple)
    - 'El árbol es extremadamente ancho, haciendo que el tamaño de la cola por nivel sea potencialmente
      muy grande: considera si DFS con un contador de profundidad evita ese pico de memoria'
    problems:
      level-order:
        title: Recorrido por niveles del árbol binario
        summary: Devuelve los valores de los nodos agrupados nivel por nivel, de arriba hacia abajo.
        whenToUse: 'La plantilla clásica de BFS en árboles: capturar el tamaño de la cola por nivel.'
        hints:
        - Captura queue.size() antes del bucle interno para conocer el ancho del nivel actual.
        - Construye una lista por nivel y agrégala a la lista de resultado externa.
      zigzag-level-order:
        title: Recorrido en zigzag por niveles
        summary: Recorre nivel por nivel, alternando de izquierda a derecha y de derecha a izquierda.
        whenToUse: BFS estándar por niveles, más una bandera de dirección que invierte la lista de un
          nivel de cada dos.
        hints:
        - Construye la lista de cada nivel normalmente, y luego invriértela cuando la bandera indique
          derecha a izquierda.
        - Cambia la bandera de dirección al terminar cada nivel.
      right-side-view:
        title: Vista lateral derecha del árbol binario
        summary: Devuelve los valores de los nodos visibles desde el lado derecho del árbol.
        whenToUse: BFS estándar por niveles, conservando solo el último nodo procesado en cada nivel.
        hints:
        - Dentro del bucle interno de cada nivel, sobrescribe una variable 'lastInLevel' en cada extracción.
        - Al terminar el bucle interno de un nivel, agrega 'lastInLevel' al resultado.
      min-depth:
        title: Profundidad mínima de un árbol binario
        summary: Número de nodos en el camino más corto de la raíz a una hoja.
        whenToUse: BFS; la primera hoja encontrada determina la profundidad mínima.
        hints:
        - Recorre por niveles hasta encontrar una hoja
        - La profundidad aumenta en cada nivel
      vertical-order:
        title: Recorrido de orden vertical
        summary: Valores por columna de arriba hacia abajo, ordenados dentro de cada celda.
        whenToUse: BFS con claves (fila, columna) almacenadas en un TreeMap.
        hints:
        - Rastrea el índice de columna de cada nodo
        - Ordena cada columna primero por fila y luego por valor
  TRIE:
    title: Trie (árbol de prefijos)
    subtitle: Árbol de prefijos para diccionarios de palabras, autocompletado y búsqueda por prefijo compartido
    intuition: Un trie comparte prefijos comunes entre muchas palabras en una sola estructura de árbol,
      así que las palabras con el mismo inicio literalmente comparten el mismo camino desde la raíz -esto
      hace que la búsqueda por prefijo, el autocompletado y las búsquedas en diccionario tomen un tiempo
      proporcional a la longitud de la palabra en vez de a la cantidad de palabras almacenadas.
    recognition: 'El problema necesita consultas repetidas de prefijo contra un diccionario fijo de palabras:
      implementar un Trie, búsqueda de palabras II (varias palabras en una cuadrícula), reemplazar palabras
      por su raíz más corta, o sugerencias de autocompletado.'
    walkthrough: Diseña un nodo de trie con un mapa de hijos (o un arreglo de tamaño fijo indexado por
      carácter) y una bandera booleana que marque si una palabra completa termina en ese nodo. Para insertar
      una palabra, recorre carácter por carácter desde la raíz, creando un nuevo nodo hijo cuando el carácter
      actual no existe aún, y marca la bandera de fin de palabra del nodo final como verdadera. Para buscar
      una palabra exacta, recorre de la misma forma, pero solo devuelve verdadero si llegas al final de
      la palabra Y esa bandera de fin de palabra está activada -llegar solo al último carácter prueba
      que el prefijo existe, no la palabra completa. Para consultas startsWith/prefijo, la verificación
      es idéntica excepto que omites por completo la verificación de la bandera de fin de palabra. Para
      problemas de búsqueda de palabras en cuadrícula, construye primero un trie con todas las palabras
      objetivo, luego haz DFS por la cuadrícula mientras recorres el trie simultáneamente, podando cualquier
      camino de la cuadrícula cuyo camino correspondiente en el trie no exista -esto comparte trabajo
      entre todas las palabras objetivo en vez de buscar cada una por separado.
    telltaleSigns:
    - Muchas consultas repetidas de prefijo contra el mismo diccionario fijo
    - Implementar Trie / funcionalidad de autocompletado
    - Búsqueda de palabras en una cuadrícula para varias palabras del diccionario simultáneamente
    - Reemplazar palabras por su raíz de diccionario coincidente más corta
    templateSteps:
    - Diseña un nodo con un mapa/arreglo de hijos y una bandera de fin de palabra
    - 'Insertar: recorre carácter por carácter, creando nodos hijos faltantes, y luego marca la bandera
      de fin'
    - 'Buscar: recorre igual, pero exige tanto el recorrido completo como que la bandera de fin sea verdadera'
    - 'StartsWith: recorre igual pero omite la verificación de la bandera de fin'
    - Para búsqueda en cuadrícula, haz DFS en la cuadrícula y el trie juntos, podando caminos sin nodo
      de trie correspondiente
    commonMistakes:
    - Confundir search() (necesita la bandera de fin de palabra) con startsWith() (no la necesita)
    - No compartir el trie entre varias palabras objetivo en problemas de búsqueda de palabras, perdiendo
      el beneficio principal del patrón
    - Usar un arreglo fijo de 26 letras cuando el alfabeto en realidad es mayor (unicode, mayúsculas y
      minúsculas)
    - Olvidar marcar o verificar la bandera de fin de palabra, causando que los prefijos se reporten como
      coincidencias completas
    whenNotToUse:
    - 'Solo se necesitan unas pocas comparaciones de cadenas puntuales: construir un trie tiene más sobrecarga
      que una simple búsqueda en un set/mapa'
    - La memoria está muy restringida y el diccionario es grande, ya que los tries pueden usar significativamente
      más memoria que un set hash de las mismas palabras
    problems:
      implement-trie:
        title: Implementar Trie (árbol de prefijos)
        summary: Implementa las operaciones insert, search y startsWith para un trie.
        whenToUse: El TDA central de Trie sobre el que se construyen todos los demás problemas de trie.
        hints:
        - Cada nodo necesita un mapa de hijos y una bandera booleana de fin de palabra.
        - search() requiere que la bandera de fin sea verdadera; startsWith() no.
      word-break-dict:
        title: Caracteres extra en una cadena (diccionario Trie)
        summary: Encuentra el mínimo número de caracteres sobrantes tras dividir una cadena usando palabras
          del diccionario.
        whenToUse: DP sobre posiciones de la cadena, usando un trie para verificar rápidamente qué palabras
          del diccionario comienzan en cada posición.
        hints:
        - dp[i] = mínimo de caracteres extra para la subcadena que empieza en i.
        - En cada posición, prueba cada palabra del diccionario que coincida como prefijo vía el trie,
          y luego recurre más allá.
      replace-words:
        title: Reemplazar palabras
        summary: Reemplaza las palabras por su raíz más corta del diccionario.
        whenToUse: Trie de raíces; recorre cada palabra hasta la marca de fin.
        hints:
        - Inserta todas las raíces en el Trie
        - Detente en la primera marca de fin encontrada en la palabra
      word-search-ii:
        title: Búsqueda de palabras II
        summary: Encuentra todas las palabras del diccionario en el tablero mediante celdas adyacentes.
        whenToUse: Trie de palabras combinado con DFS y poda sobre el tablero.
        hints:
        - Construye un Trie con todas las palabras del diccionario
        - Elimina la palabra del Trie al encontrarla para evitar duplicados
      longest-common-prefix:
        title: Prefijo común más largo
        summary: Find the longest common prefix among strings.
        whenToUse: Trie of words or vertical scan until mismatch.
        hints:
        - Compare characters column by column
        - Stop at first mismatch or end of a word
  HASH_MAPS:
    title: Mapas hash
    subtitle: Búsqueda promedio O(1) para complementos, frecuencias y sumas de prefijo
    intuition: Un mapa hash intercambia algo de memoria por búsqueda promedio O(1), permitiéndote recordar
      lo que ya viste (o necesitas) y verificarlo al instante contra elementos futuros mientras recorres,
      en vez de recorrer toda la entrada de nuevo por cada consulta. Este único truco -almacenar mientras
      recorres, verificar lo que necesitas contra lo almacenado- resuelve una fracción sorprendentemente
      grande de problemas de entrevista de dificultad fácil a media.
    recognition: El problema necesita una verificación rápida de complemento/pertenencia (two sum), un
      conteo o agrupación en curso (suma de subarreglo igual a K, agrupar anagramas), o un mapeo entre
      dos valores relacionados (cadenas isomorfas), típicamente resoluble en una sola pasada lineal.
    walkthrough: Decide, antes de escribir código, exactamente qué deben representar la clave y el valor
      del mapa para este problema -esta única decisión determina casi todo lo demás. Para problemas de
      búsqueda de pares como two sum, la clave es el valor visto y el valor es su índice, verificado contra
      'objetivo menos elemento actual' en cada paso. Para problemas de conteo/frecuencia, la clave es
      el valor o una firma derivada y el valor es un conteo en curso, incrementado al recorrer. Para problemas
      tipo suma de prefijos como 'suma de subarreglo igual a K', la clave es una suma de prefijo en curso
      y el valor es cuántas veces ha ocurrido esa suma, permitiendo responder 'cuántos prefijos anteriores
      son iguales a currentSum - K' en O(1) por paso. En todos los casos, decide deliberadamente el orden
      verificar-luego-actualizar -normalmente verificar primero, luego insertar, para evitar que el elemento
      actual coincida consigo mismo.
    telltaleSigns:
    - Necesitas verificaciones rápidas de pertenencia, frecuencia o complemento en una sola pasada
    - Preguntas tipo two sum sobre '¿existe el complemento?'
    - Problemas de suma de prefijos + conteo de ocurrencias (suma de subarreglo igual a K)
    - Agrupar o mapear entre valores relacionados (cadenas isomorfas, agrupar anagramas)
    templateSteps:
    - Decide con precisión qué representan la clave y el valor del mapa para este problema
    - Recorre la entrada una vez, verificando primero el elemento actual contra el mapa
    - Actualiza el mapa con la contribución del elemento actual (conteo, índice, suma de prefijo)
    - Decide bien el orden verificar-luego-actualizar para evitar errores de autocoincidencia
    - Devuelve la respuesta acumulada al terminar el recorrido
    commonMistakes:
    - Actualizar el mapa antes de verificar, causando que un elemento coincida incorrectamente consigo
      mismo
    - Usar la clave equivocada (valor bruto en vez de una firma derivada, o viceversa)
    - Olvidar inicializar mapas tipo suma de prefijos con una entrada base (por ejemplo, suma de prefijo
      0 ocurriendo una vez)
    - Asumir operaciones de mapa hash O(1) en el peor caso cuando una función hash pobre o muchas colisiones
      podrían degradar el rendimiento
    whenNotToUse:
    - El problema necesita elementos en orden o consultas por rango, donde un TreeMap encaja mejor que
      un mapa hash simple
    - La memoria está muy restringida y el rango de valores es lo bastante pequeño para que un arreglo
      de tamaño fijo funcione igual de bien
    problems:
      two-sum:
        title: Two Sum
        summary: Devuelve los índices de dos números en un arreglo que sumen un objetivo.
        whenToUse: Mapa de valor a índice mientras recorres; verifica el complemento antes de insertar
          el valor actual.
        hints:
        - Para cada número, verifica si objetivo - número ya está en el mapa.
        - Inserta el índice del número actual solo después de verificar, para evitar que un elemento coincida
          consigo mismo.
      subarray-sum-equals-k:
        title: Suma de subarreglo igual a K
        summary: Cuenta el número de subarreglos contiguos cuyos elementos suman K.
        whenToUse: Suma de prefijo en curso más un mapa de cuántas veces ha ocurrido cada valor de suma
          de prefijo.
        hints:
        - Inicializa el mapa con la suma de prefijo 0 ocurriendo una vez, para manejar subarreglos que
          empiezan en el índice 0.
        - En cada paso, suma map.get(currentSum - K) a la respuesta antes de actualizar el mapa con currentSum.
      isomorphic-strings:
        title: Cadenas isomorfas
        summary: Comprueba si s y t son isomorfas mediante una biyección de caracteres.
        whenToUse: Dos mapas (o un mapa más un conjunto) para el mapeo directo e inverso.
        hints:
        - Mapea s→t y verifica que sea consistente
        - Asegúrate también de que dos caracteres de s no mapeen al mismo carácter de t
      longest-consecutive-already:
        title: Arreglo contiguo
        summary: Longitud máxima de un subarreglo contiguo con igual cantidad de ceros y unos.
        whenToUse: Balance de prefijos más un mapa de la primera posición vista de cada balance.
        hints:
        - Trata el 0 como -1
        - Si ese balance ya se vio antes, actualiza la longitud máxima
      four-sum-ii:
        title: 4Sum II
        summary: Cuenta las tuplas (i,j,k,l) cuya suma es cero entre cuatro arreglos.
        whenToUse: Hashea todas las sumas de A+B y luego busca -(C+D).
        hints:
        - Construye un mapa suma→cantidad para los primeros dos arreglos
        - Para cada suma c+d, busca -(c+d) en el mapa
  KNOWING_WHAT_TO_TRACK:
    title: Saber qué rastrear
    subtitle: Resuelve problemas de una pasada identificando los contadores en curso correctos
    intuition: 'Sorprendentemente, muchos problemas de entrevista no se tratan de un algoritmo elaborado
      en absoluto: se resuelven en el momento en que identificas la una o dos estadísticas en curso que
      importan y las actualizas incrementalmente mientras recorres, en vez de recalcular algo desde cero.
      Este patrón trata menos de una plantilla fija y más del hábito de preguntar ''¿qué pequeño fragmento
      de estado, actualizado en O(1) por paso, me permitiría responder esto en una pasada?'''
    recognition: El problema puede resolverse en una sola pasada si rastreas los contadores o el estado
      correctos -elemento mayoritario (un candidato y un conteo), la secuencia consecutiva más larga (empezar
      a contar solo desde los inicios de secuencia), o el seguimiento tipo 'fruit into baskets' de 'a
      lo sumo K tipos'.
    walkthrough: 'Antes de recurrir a un patrón conocido, pregúntate explícitamente qué pequeña cantidad
      de estado, si se rastrea y actualiza mientras recorres, te permitiría responder la pregunta sin
      mirar nunca hacia atrás. Para el elemento mayoritario, eso es un único valor candidato y un conteo
      en curso (votación de Boyer-Moore): incrementa al ver el candidato, decrementa en caso contrario,
      y cambia de candidato cuando el conteo llega a cero. Para la secuencia consecutiva más larga, la
      clave es empezar a contar una secuencia solo desde un número que no tenga predecesor en el conjunto,
      de modo que cada número se visite un número acotado de veces en total pese a parecer bucles anidados.
      Una vez identificado el estado a rastrear, verifica con un par de ejemplos trazados a mano que actualizarlo
      incrementalmente realmente preserva suficiente información para responder correctamente, ya que
      el principal riesgo de este patrón es descubrir a mitad de camino que falta una pieza más de estado.'
    telltaleSigns:
    - Una sola pasada lineal funcionaría si rastrearas el pequeño fragmento de estado correcto
    - Preguntas de mayoría/umbral de frecuencia (aparece más de n/2 veces, etc.)
    - '''Racha consecutiva más larga'' o conteo similar basado en secuencias'
    - Seguimiento de 'a lo sumo K tipos' / 'a lo sumo K distintos' sin un planteamiento explícito de ventana
      deslizante
    templateSteps:
    - Identifica el estado mínimo que se necesita rastrear para responder la pregunta
    - Decide la regla de actualización O(1) para ese estado al procesar cada elemento
    - Recorre una vez, aplicando la regla de actualización y verificando/registrando la respuesta según
      se necesite
    - Verifica con ejemplos trazados a mano que no se necesita silenciosamente estado adicional
    - 'Evita recalcular desde cero: actualiza siempre de forma incremental'
    commonMistakes:
    - Recalcular conteos o estado desde cero en cada iteración en vez de actualizar incrementalmente
    - Pasar por alto un caso límite que requiere una pieza más de estado rastreado de la originalmente
      planeada
    - Aplicar la votación de Boyer-Moore sin una pasada de verificación requerida cuando no está garantizada
      la existencia de mayoría
    - Confundir 'inicios de secuencias' con 'todos los elementos' cuando el truco depende de visitar cada
      número un número acotado de veces
    whenNotToUse:
    - Las relaciones entre elementos no son lo bastante simples para reducirse a un pequeño conjunto fijo
      de contadores en curso
    - Ordenar o una estructura de datos (heap, mapa hash) captura el estado necesario de forma más natural
      que contadores ad hoc
    problems:
      majority-element:
        title: Elemento mayoritario
        summary: Encuentra el elemento que aparece más de n/2 veces en un arreglo.
        whenToUse: 'Votación de Boyer-Moore: rastrea un único candidato y un conteo en vez de un mapa
          de frecuencias completo.'
        hints:
        - Incrementa el conteo cuando el número actual coincide con el candidato, decreméntalo si no.
        - Cuando el conteo llegue a cero, cambia el candidato al número actual.
      longest-consecutive:
        title: Secuencia consecutiva más larga
        summary: Encuentra la longitud de la racha más larga de enteros consecutivos en un arreglo no
          ordenado.
        whenToUse: Coloca todo en un set hash, y luego empieza a contar una racha solo desde números sin
          predecesor presente.
        hints:
        - Solo empieza a extender una secuencia desde un número x donde x-1 no está en el set.
        - Desde cada inicio válido, sigue verificando x+1, x+2, ... para medir la longitud de la racha.
      majority-element-ii:
        title: Elemento mayoritario II
        summary: Todos los elementos que aparecen más de ⌊n/3⌋ veces.
        whenToUse: Algoritmo de Boyer-Moore con dos candidatos.
        hints:
        - Puede haber como máximo dos respuestas
        - Verifica los conteos reales en una segunda pasada
      max-points-on-line:
        title: Máximo de puntos en una línea
        summary: El número máximo de puntos que se encuentran sobre una misma línea recta.
        whenToUse: Para cada punto de origen, rastrea las pendientes como fracciones reducidas.
        hints:
        - Normaliza la pendiente dividiendo por el MCD
        - Maneja aparte las líneas verticales y los puntos duplicados
  UNION_FIND:
    title: Union-Find (DSU)
    subtitle: Conectividad dinámica con uniones casi O(1) mediante compresión de caminos y rango
    intuition: 'Union-Find (conjuntos disjuntos) responde ''¿están conectadas estas dos cosas?'' y ''fusiona
      estos dos grupos'' en tiempo casi constante, manteniendo un puntero padre para cada elemento y dejando
      que la ''raíz'' final de cada elemento represente su grupo. Dos optimizaciones lo hacen rápido en
      la práctica: compresión de caminos (aplanar el camino hacia la raíz cada vez que se consulta) y
      unión por rango/tamaño (siempre unir el árbol más pequeño bajo la raíz del más grande).'
    recognition: El problema implica fusionar o conectar cosas dinámicamente y luego necesita responder
      preguntas de conectividad -número de provincias/componentes conectados, detectar una conexión redundante
      que crea un ciclo, o fusionar cuentas/grupos por atributos compartidos.
    walkthrough: Inicializa un arreglo de padres donde cada elemento es su propio padre, representando
      n grupos unitarios separados inicialmente. Para cada conexión o arista dada, halla la raíz de ambos
      extremos; si las raíces difieren, únelas colocando una raíz bajo la otra (usando rango o tamaño
      para decidir cuál queda arriba, por balance), y decrementa tu conteo de componentes distintos. Para
      find, sigue siempre los punteros padre hasta la raíz, aplicando compresión de caminos en el trayecto
      -apunta cada nodo visitado directamente a la raíz- lo que acelera futuras consultas desde ese nodo.
      Para problemas tipo 'conexión redundante', procesa las aristas en el orden dado y la primera arista
      cuyos dos extremos ya comparten raíz es tu respuesta. Para problemas de agrupación/fusión como fusionar
      cuentas, une por el atributo compartido que define la relación, y luego agrupa los resultados finales
      por la raíz de cada elemento.
    telltaleSigns:
    - Fusionar o conectar elementos dinámicamente, y luego responder preguntas de conectividad
    - Número de componentes conectados / provincias en un grafo
    - Detectar la arista que crea un ciclo (conexión redundante) en un grafo de árbol-más-una-arista
    - Fusionar grupos por un atributo compartido (fusión de cuentas, grupos de cadenas similares)
    templateSteps:
    - Inicializa cada elemento como su propio padre/raíz, rastreando un conteo de componentes
    - Implementa find() con compresión de caminos (apunta los nodos directamente a la raíz)
    - Implementa union() por rango/tamaño, decrementando el conteo de componentes en una fusión exitosa
    - Procesa aristas/relaciones de a una, uniendo los elementos conectados
    - Usa el mapeo final de raíz por elemento para responder consultas de conectividad o agrupación
    commonMistakes:
    - Olvidar la compresión de caminos, degradando find() hacia O(n) en árboles sesgados
    - Unir sin verificar si los dos elementos ya comparten raíz, contando componentes dos veces
    - Ignorar la unión por rango/tamaño, llevando a un árbol alto y sesgado en órdenes de entrada adversos
    - Errores de límite entre numeración de elementos indexada desde 1 y desde 0 en el arreglo de padres
    whenNotToUse:
    - La estructura de conectividad nunca cambia después de construirse (un recorrido de grafo simple
      calculado una vez es más sencillo)
    - 'Necesitas el camino más corto entre dos nodos conectados, no solo si están conectados: union-find
      no rastrea la longitud del camino'
    problems:
      number-of-provinces:
        title: Número de provincias
        summary: Cuenta los componentes conectados en un grafo no dirigido dado como matriz de adyacencia.
        whenToUse: Une cada conexión directa de la matriz y luego cuenta cuántas raíces distintas quedan.
        hints:
        - Solo hace falta recorrer el triángulo superior (o inferior) de la matriz simétrica.
        - La respuesta final es el número de elementos que son su propia raíz.
      redundant-connection:
        title: Conexión redundante
        summary: Encuentra la arista que se puede eliminar para que el grafo vuelva a ser un árbol (árbol
          más una arista extra).
        whenToUse: Procesa las aristas en orden; la primera cuyos extremos ya comparten raíz es la redundante.
        hints:
        - Une los extremos de a una arista a la vez, en el orden de entrada dado.
        - En cuanto find(u) == find(v) antes de unir, esa arista es la respuesta.
      accounts-merge:
        title: Combinar cuentas
        summary: Combina las cuentas que comparten direcciones de correo.
        whenToUse: Une los correos con Union-Find y agrupa por raíz.
        hints:
        - Construye un mapa correo→nombre
        - Une los correos consecutivos dentro de una misma cuenta
      number-of-islands-ii:
        title: Número de islas II
        summary: Después de agregar cada celda de tierra, devuelve el número actual de islas.
        whenToUse: Union-Find en línea a medida que las celdas se convierten en tierra.
        hints:
        - Agrega la tierra y luego une con los 4 vecinos
        - Incrementa el contador al agregar y decrementa en cada unión exitosa
      path-exists:
        title: ¿Existe un camino en el grafo?
        summary: Return whether a path exists between source and destination.
        whenToUse: Union all edges, then check same component.
        hints:
        - Union endpoints of each edge
        - find(source)==find(destination)
  CUSTOM_DATA_STRUCTURES:
    title: Estructuras de datos personalizadas
    subtitle: Combina bloques de construcción conocidos para cumplir restricciones de complejidad por
      operación
    intuition: Muchas preguntas de 'diseño' en entrevistas en realidad preguntan si puedes descomponer
      un conjunto de operaciones requeridas y sus límites de complejidad en una combinación de bloques
      de construcción simples y conocidos -un mapa hash para búsqueda O(1), una lista doblemente enlazada
      para reordenar en O(1), un heap para acceso prioritario- conectados de modo que cada operación solo
      toque las estructuras que necesita.
    recognition: La pregunta pide diseñar una estructura de datos o clase que soporte múltiples operaciones
      (get/put, push/pop/getMin, insert/delete/getRandom) bajo restricciones específicas de complejidad
      temporal, como cachés LRU/LFU, min stacks, o almacenes clave-valor basados en tiempo.
    walkthrough: 'Empieza listando cada operación requerida y su complejidad temporal objetivo exactamente
      como se indica en el problema -esta lista guía todas las decisiones de diseño siguientes. Para cada
      operación, pregunta qué única estructura de datos te da esa complejidad de forma natural: búsqueda
      promedio O(1) usualmente significa un mapa hash, inserción/eliminación O(1) en ambos extremos usualmente
      significa una lista doblemente enlazada, acceso O(1) a un mínimo/máximo usualmente significa una
      pila o heap auxiliar. Combina estructuras de modo que cada una sea responsable solo de las operaciones
      en las que es naturalmente buena -para una caché LRU, el mapa hash da búsqueda O(1) por clave mientras
      que la lista doblemente enlazada da reordenamiento O(1) para marcar uso reciente, con el mapa guardando
      referencias directas a nodos de la lista para evitar cualquier búsqueda O(n). Una vez que la combinación
      maneja cada operación listada con su complejidad requerida, recorre a mano una secuencia corta de
      operaciones para confirmar que el estado se mantiene consistente entre las estructuras combinadas,
      especialmente en casos límite como una estructura vacía o capacidad de uno.'
    telltaleSigns:
    - '''Diseña una estructura de datos que soporte...'' con múltiples operaciones y objetivos de complejidad'
    - Caché LRU/LFU, min stack, almacén clave-valor basado en tiempo, arreglo de snapshots
    - Múltiples operaciones que aparentemente necesitan estructuras de datos distintas a la vez
    - Requisitos explícitos de Big-O por operación en vez de para todo el algoritmo
    templateSteps:
    - Lista cada operación requerida y su complejidad temporal objetivo
    - Para cada operación, identifica la única estructura que da esa complejidad de forma natural
    - Combina estructuras para que el estado se mantenga consistente (por ejemplo, un mapa que guarda
      referencias a una lista enlazada)
    - Conecta las actualizaciones para que cada operación toque solo las estructuras que realmente necesita
    - Recorre a mano una secuencia corta de operaciones, incluyendo casos límite (vacío, capacidad uno)
    commonMistakes:
    - Usar una sola estructura para todo, sacrificando la complejidad de al menos una operación requerida
    - Dejar que dos estructuras combinadas se desincronicen (por ejemplo, un mapa apuntando a un nodo
      obsoleto de la lista)
    - No manejar explícitamente los casos límite de capacidad/desalojo (estructura vacía, inserción a
      plena capacidad)
    - Sobrecomplicar el diseño en vez de componer bloques de construcción bien conocidos
    whenNotToUse:
    - Una única estructura incorporada existente ya cumple la complejidad de cada operación requerida
    - Las operaciones en realidad no tienen necesidades de complejidad significativamente distintas, así
      que basta una estructura unificada más simple
    problems:
      min-stack:
        title: Pila con mínimo
        summary: Diseña una pila que soporte push, pop, top y getMin, todo en O(1).
        whenToUse: Una pila auxiliar (o pares de valores codificados) rastrea el mínimo en curso junto
          a la pila principal.
        hints:
        - Apila el nuevo mínimo en una pila auxiliar cada vez que cambie (o en cada push, rastreando duplicados).
        - Extrae de ambas pilas juntas para mantenerlas sincronizadas.
      lru-cache:
        title: Caché LRU
        summary: Diseña una caché con get y put en O(1) que desaloje la entrada usada menos recientemente
          cuando esté llena.
        whenToUse: Un mapa hash para búsqueda de clave en O(1), combinado con una lista doblemente enlazada
          para reordenar por uso reciente en O(1).
        hints:
        - Guarda los valores del mapa como referencias directas a nodos de la lista doblemente enlazada,
          no solo valores crudos.
        - En cada get/put, mueve el nodo tocado al frente (o al final) de la lista para marcarlo como
          el más recientemente usado.
      time-map:
        title: Almacén clave-valor con marcas de tiempo
        summary: Guarda valores por marca de tiempo y obtén el último valor en o antes de una marca dada.
        whenToUse: Tabla hash más búsqueda binaria sobre listas de marcas de tiempo.
        hints:
        - Las marcas de tiempo solo se agregan al final, por lo que ya están ordenadas
        - Usa búsqueda binaria del límite superior
      lfu-cache:
        title: Caché LFU
        summary: get/put en O(1) con expulsión del menos frecuentemente usado (empate → LRU).
        whenToUse: Mapas más listas doblemente enlazadas agrupadas por frecuencia.
        hints:
        - Rastrea la frecuencia mínima actual
        - En cada get, mueve el elemento al siguiente cubo de frecuencia
      design-hashmap:
        title: Diseñar un HashMap
        summary: Implement a simple HashMap without built-in map libraries.
        whenToUse: Array of buckets + chaining for interview design warmup.
        hints:
        - Use an array of linked lists
        - Hash with key % bucketCount
  BITWISE:
    title: Manipulación de bits
    subtitle: Usa XOR, desplazamientos y máscaras para conjuntos, paridad y trucos de espacio constante
    intuition: 'Los trucos de manipulación de bits provienen de un pequeño conjunto de identidades básicas:
      hacer XOR de un número consigo mismo da cero (útil para encontrar elementos sin pareja), desplazar
      a la izquierda/derecha multiplica/divide por potencias de dos, y hacer AND con una máscara aísla
      bits específicos o verifica banderas. Reconocer qué identidad se aplica a un problema suele convertir
      una solución de espacio extra O(n) en una de espacio extra O(1).'
    recognition: El problema implica encontrar un único elemento distinto entre duplicados, contar bits
      activados, verificar si un número es potencia de dos, o de otro modo sugiere que existe un truco
      aritmético de espacio constante en vez de un set hash o arreglo.
    walkthrough: 'Primero identifica qué identidad bit a bit aplica: si cada elemento aparece un número
      par de veces excepto uno, hacer XOR de todos aísla al impar, ya que a XOR a es igual a cero para
      cualquier a. Si necesitas contar bits activados, recuerda que n & (n - 1) limpia exactamente el
      bit activado más bajo, así que repetir esa operación hasta que n llegue a cero cuenta los bits en
      un número de iteraciones igual al popcount. Si necesitas verificar una potencia de dos, nota que
      las potencias de dos tienen exactamente un bit activado, así que n & (n - 1) igual a cero (para
      n positivo) lo confirma directamente. Una vez identificada, impleméntala con cuidado específicamente
      en Java, atento al comportamiento del bit de signo en números negativos y al desbordamiento de int,
      ya que >> es un desplazamiento aritmético (que extiende el signo) mientras que >>> es lógico -elegir
      el incorrecto produce silenciosamente resultados erróneos para entradas negativas.'
    telltaleSigns:
    - Cada elemento aparece en pares excepto exactamente uno (o un patrón de paridad similar)
    - Contar bits activados ('peso de Hamming') o verificar potencias de dos
    - Generar o iterar sobre máscaras de bits de subconjuntos
    - Existe una solución con set hash/arreglo pero se pide o implica espacio extra O(1)
    templateSteps:
    - Identifica qué identidad bit a bit básica encaja (cancelación XOR, enmascarado AND, desplazamientos)
    - Mapea explícitamente el requisito del problema a esa identidad antes de programar
    - Implementa con cuidado, atento a los enteros con signo de Java y al comportamiento de >> frente
      a >>>
    - Verifica con un ejemplo pequeño que incluya números negativos o valores límite (0, Integer.MIN_VALUE)
    - Recurre a un enfoque de set hash/arreglo si en realidad no encaja ninguna identidad bit a bit limpia
    commonMistakes:
    - Usar >> cuando se necesitaba >>> (desplazamiento sin signo), o viceversa, rompiendo casos con números
      negativos
    - Olvidar la precedencia de operadores, mezclando incorrectamente operadores bit a bit con aritméticos
    - Asumir que un truco bit a bit se generaliza cuando la restricción real del problema no coincide
      con la identidad
    - No probar casos límite como 0, números negativos, o Integer.MIN_VALUE donde los desplazamientos
      y máscaras se comportan de forma inesperada
    whenNotToUse:
    - 'Ninguna identidad a nivel de bits conveniente encaja realmente con la estructura del problema:
      forzar una produce código oscuro y difícil de verificar sin beneficio real'
    - Al entrevistador o al problema le importa más la legibilidad que el último factor constante de espacio,
      y un set hash es más claro
    problems:
      single-number:
        title: Número único
        summary: Cada elemento de un arreglo aparece dos veces excepto uno - encuentra ese.
        whenToUse: Aplica XOR a todos los elementos; los valores emparejados se cancelan a cero, dejando
          solo el sin pareja.
        hints:
        - a XOR a = 0 y a XOR 0 = a, así que los pares desaparecen sin importar el orden.
        - No se necesita espacio extra ni ordenar - basta una pasada de XOR.
      number-of-1-bits:
        title: Número de bits en 1
        summary: Cuenta el número de bits activados (peso de Hamming) en un entero.
        whenToUse: n &= n-1 limpia el bit activado más bajo cada vez, así que iterar hasta que n sea cero
          cuenta los bits directamente.
        hints:
        - Cada iteración de n &= (n - 1) elimina exactamente un bit activado.
        - El bucle se ejecuta exactamente popcount(n) veces, lo cual ya es eficiente sin revisar cada
          posición de bit.
      single-number-ii:
        title: Número único II
        summary: Cada elemento aparece tres veces excepto uno — encuéntralo.
        whenToUse: Conteo de bits módulo 3, o una máquina de estados ones/twos.
        hints:
        - Cuenta cada bit módulo 3
        - O bien mantén máscaras ones y twos
      sum-of-two-integers:
        title: Suma de dos enteros
        summary: Suma dos enteros sin usar los operadores + o -.
        whenToUse: XOR da los bits de la suma sin acarreo, (AND)<<1 da el acarreo — repite en bucle.
        hints:
        - a^b es la suma sin considerar el acarreo
        - (a&b)<<1 es el acarreo que se debe sumar después
      reverse-bits:
        title: Invertir bits
        summary: Invierte los bits de un entero sin signo de 32 bits.
        whenToUse: Desplaza y acumula el resultado bit a bit.
        hints:
        - Repite el ciclo 32 veces
        - result = (result<<1) | (n&1); n>>>=1
      bitwise-and-range:
        title: AND bit a bit de un rango
        summary: Bitwise AND of all numbers in [left, right].
        whenToUse: Shift until left==right to clear differing low bits.
        hints:
        - While left < right, right &= right-1 or shift both
        - Common prefix bits survive
  MATH_GEOMETRY:
    title: Matemáticas y geometría
    subtitle: Identidades de teoría de números y geometría de coordenadas para entrevistas
    intuition: Una parte significativa de los problemas de entrevista tratan en realidad de conocer una
      identidad matemática o fórmula geométrica específica en vez de un truco de estructura de datos -relaciones
      de MCD/MCM, aritmética modular, factorización prima, o fórmulas de coordenadas para área, distancia
      y rotación. Detectar qué identidad aplica y reducir el problema a ella antes de programar suele
      ahorrar mucho más tiempo que depurar un enfoque numérico improvisado.
    recognition: El problema se plantea en términos de números puros o coordenadas en vez de una estructura
      de datos -números palíndromos, MCD de cadenas, cálculo eficiente de potencias, geometría de rectángulos/puntos,
      o determinar si unos puntos forman una figura válida.
    walkthrough: 'Antes de escribir código, pregúntate si el problema se reduce a una identidad conocida:
      ¿implica divisibilidad (MCD/MCM), exponenciación (potencia rápida mediante elevación al cuadrado
      repetida), aritmética modular (mod para ciclar o evitar desbordamiento), o geometría de coordenadas
      (fórmula de distancia, producto cruzado para orientación, fórmula del cordón de zapato para área)?
      Una vez identificada, reduce explícitamente el enunciado del problema a esa identidad -por ejemplo,
      ''la cadena a es el MCD de dos cadenas'' se reduce a verificar str1+str2 == str2+str1 y luego tomar
      el MCD de las dos longitudes. Implementa la identidad con cuidado, prestando atención al desbordamiento
      (usa long en vez de int para productos intermedios), el manejo de signos para exponentes o coordenadas
      negativas, y casos límite como cero, números negativos, o figuras degeneradas. Finalmente, verifica
      tu fórmula contra dos o tres ejemplos pequeños calculados a mano antes de confiar en ella con la
      entrada completa, ya que una solución matemática sutilmente incorrecta tiende a fallar en silencio
      en vez de colapsar.'
    telltaleSigns:
    - Planteamiento de teoría de números o aritmética pura sin un encaje natural en estructuras de datos
    - Coordenadas, figuras, o relaciones geométricas entre puntos
    - Requisitos de exponenciación eficiente, MCD/MCM, o aritmética modular
    - Cálculos propensos a desbordamiento que necesitan manejo de long/mod
    templateSteps:
    - Identifica la identidad matemática o geométrica a la que se reduce el problema
    - Reescribe el enunciado del problema explícitamente en términos de esa identidad
    - Implementa con cuidado, atento al desbordamiento (usa long) y a casos de signo/límite
    - Maneja explícitamente entradas degeneradas (cero, valores negativos, puntos colineales)
    - Verifica la fórmula contra unos pocos ejemplos pequeños calculados a mano antes de confiar en ella
    commonMistakes:
    - Desbordamiento de enteros por no usar long para productos o sumas intermedias
    - Pasar por alto casos límite como cero, números negativos, o figuras geométricas degeneradas
    - Reimplementar incorrectamente una fórmula bien conocida (MCD, potencia rápida) en vez de usar la
      forma recursiva/iterativa estándar
    - No verificar la identidad derivada contra un ejemplo pequeño trabajado a mano antes de programar
      el caso general
    whenNotToUse:
    - El problema trata fundamentalmente de organización de datos o búsqueda, no de una identidad numérica/geométrica
    - Un enfoque numérico de fuerza bruta ya es suficientemente rápido dadas las restricciones de entrada,
      así que una identidad ingeniosa añade riesgo sin beneficio real
    problems:
      pow-x-n:
        title: Pow(x, n)
        summary: Calcula x elevado a la potencia n de forma eficiente usando exponenciación binaria.
        whenToUse: Potencia rápida mediante elevación al cuadrado repetida; reduce a la mitad el exponente
          en cada paso en vez de multiplicar n veces.
        hints:
        - Si n es par, x^n = (x*x)^(n/2); si es impar, separa primero un factor de x.
        - Maneja n negativo calculando 1 / x^(-n), y cuida el desbordamiento de Integer.MIN_VALUE al negar.
      gcd-of-strings:
        title: Máximo común divisor de cadenas
        summary: Encuentra la cadena más grande que divide a ambas de dos cadenas dadas.
        whenToUse: Verifica primero str1+str2 == str2+str1, y luego toma la subcadena de longitud gcd(len1,
          len2).
        hints:
        - Dos cadenas comparten una cadena divisora solo si concatenarlas en cualquier orden da el mismo
          resultado.
        - Si esa verificación pasa, la respuesta es el prefijo de longitud gcd(str1.length(), str2.length()).
      sqrt:
        title: Sqrt(x)
        summary: Raíz cuadrada entera de x (redondeada hacia abajo).
        whenToUse: Búsqueda binaria sobre el espacio de posibles respuestas.
        hints:
        - Busca mid tal que mid*mid <= x
        - Cuidado con el desbordamiento; usa long
      integer-to-roman:
        title: Entero a número romano
        summary: Convierte un entero en su numeral romano.
        whenToUse: Resta voraz de los valores romanos más grandes, incluyendo las combinaciones sustractivas.
        hints:
        - Usa la tabla de valores 1000, 900, 500, 400, ...
        - Añade el símbolo mientras num >= el valor actual
      max-points-line-math:
        title: Cuadrado válido
        summary: Comprueba si cuatro puntos forman un cuadrado.
        whenToUse: 'Distancias: 2 diagonales iguales, 4 lados iguales, ninguna distancia cero.'
        hints:
        - Calcula las 6 distancias al cuadrado entre pares de puntos
        - Se necesitan 4 lados iguales y 2 diagonales iguales
      max-points-on-a-line:
        title: Máximo de puntos en una línea
        summary: Maximum number of points that lie on the same line.
        whenToUse: For each origin count slopes with reduced fractions.
        hints:
        - Normalize slope by GCD
        - Handle duplicates and vertical lines
  SPRING_BOOT_INTERVIEW:
    title: Laboratorio de entrevistas de Spring Boot
    subtitle: Temas de backend en Java que aparecen junto a algoritmos en las entrevistas
    intuition: 'Las entrevistas de backend en Java combinan cada vez más el DSA clásico con conocimientos
      prácticos de Spring Boot: ¿puedes diseñar un pequeño recurso REST, razonar sobre el ciclo de vida
      y los alcances de los beans, explicar cuándo @Transactional realmente confirma o revierte, y construir
      comportamiento seguro para concurrencia o idempotente para una API concurrida? Este módulo trata
      esas preguntas de la misma forma que un patrón algorítmico -reconocible, enseñable, y practicado
      con código ejecutable.'
    recognition: 'La entrevista es para un rol de backend Java/Spring y mezcla programación con preguntas
      de diseño de sistemas ligero: diseñar un endpoint, discutir caché/desalojo, explicar límites de
      transacciones, o implementar limitación de tasa/idempotencia para confiabilidad.'
    walkthrough: 'Trata cada pregunta de diseño de backend igual que tratarías un problema algorítmico:
      aclara primero los requisitos (volumen de solicitudes esperado, necesidades de consistencia, modos
      de falla), y luego mapea esos requisitos a bloques de construcción conocidos de Spring/Java en vez
      de inventar algo desde cero. Para un limitador de tasa, reconócelo como un problema de token bucket
      o contador de ventana deslizante y discute dónde vive el estado (en memoria para una sola instancia,
      o un almacén compartido como Redis para múltiples instancias). Para idempotencia, reconoce la necesidad
      de guardar un mapeo de clave a resultado con un TTL para que las solicitudes reintentadas devuelvan
      el resultado original en vez de reejecutar un efecto secundario. Para preguntas sobre @Transactional
      o alcances de beans, prepárate para explicar el mecanismo subyacente (proxies, propagación, reglas
      de rollback) en vez de solo nombrar la anotación. Conecta siempre la preocupación de concurrencia
      o confiabilidad con una elección de implementación concreta -un ConcurrentHashMap, un contador atómico,
      o una tarea de limpieza programada- de la misma forma en que justificarías la elección de una estructura
      de datos en una entrevista puramente algorítmica.'
    telltaleSigns:
    - Ciclo de entrevista enfocado en backend Java o Spring
    - Mezcla de 'diseña una pequeña API' de diseño de sistemas ligero con programación
    - Preguntas sobre el ciclo de vida de beans, @Transactional, o alcances de inyección de dependencias
    - 'Preocupaciones de confiabilidad: idempotencia, limitación de tasa, caché con desalojo'
    templateSteps:
    - Aclara los requisitos (escala, consistencia, una vs varias instancias) antes de diseñar
    - Mapea el requisito a un bloque de construcción conocido (token bucket, mapa con TTL, ConcurrentHashMap)
    - Explica el mecanismo subyacente de Spring, no solo el nombre de la anotación, cuando se pregunte
    - Mantén los servicios testeables con efectos secundarios claros, separados de la infraestructura
      del framework
    - Justifica las elecciones de concurrencia/confiabilidad de la misma forma en que justificarías una
      estructura de datos
    commonMistakes:
    - Nombrar una anotación (@Transactional, @Cacheable) sin explicar el mecanismo detrás de ella
    - Diseñar para una sola instancia cuando la pregunta implica un despliegue distribuido/multi-instancia
    - Ignorar la seguridad ante concurrencia en estado compartido en memoria (HashMap simple en vez de
      ConcurrentHashMap)
    - Saltarse la aclaración de requisitos y pasar directo a una implementación que no coincide con las
      restricciones reales
    whenNotToUse:
    - La entrevista es puramente algorítmica sin componente de backend/diseño de sistemas (enfócate en
      los patrones centrales de DSA)
    - 'El rol no usa Spring específicamente: los conceptos subyacentes siguen aplicando, pero los detalles
      de anotaciones específicas del framework no'
    problems:
      rate-limiter:
        title: Limitador de tasa con token bucket
        summary: Permite como máximo N solicitudes por ventana de tiempo por clave usando semántica de
          token bucket.
        whenToUse: Una pregunta clásica de diseño de API gateway / concurrencia en entrevistas sobre controlar
          la tasa de solicitudes por cliente.
        hints:
        - Rastrea los tokens disponibles y una marca de tiempo del último relleno por clave.
        - Rellena los tokens de forma perezosa según el tiempo transcurrido en vez de ejecutar un temporizador
          en segundo plano.
      idempotency-store:
        title: Almacén de claves de idempotencia
        summary: Guarda resultados de solicitudes indexados por una clave de idempotencia con semántica
          TTL para reintentos seguros.
        whenToUse: Reintentos seguros de POST en APIs tipo pagos, donde reenviar una solicitud no debe
          duplicar un efecto secundario.
        hints:
        - Guarda pares (resultado, marca de expiración) indexados por la clave de idempotencia proporcionada
          por el cliente.
        - Ante una clave repetida dentro de la ventana TTL, devuelve el resultado guardado en vez de reejecutar
          la operación.
      circuit-breaker:
        title: Circuit Breaker (interruptor de circuito)
        summary: Un interruptor de circuito simple con umbral de fallos y tiempo de espera en estado abierto.
        whenToUse: Protege a quienes llaman de fallos en cascada.
        hints:
        - Pasa a estado abierto tras N fallos
        - Tras el tiempo de espera, permite un intento en estado HALF_OPEN
      lru-http-cache:
        title: Caché de respuestas HTTP
        summary: Caché con TTL para respuestas GET idempotentes, con expulsión por capacidad.
        whenToUse: Patrón cache-aside para endpoints REST de lectura intensiva.
        hints:
        - Guarda la marca de tiempo de expiración
        - Elimina las entradas caducadas en el get; expulsa por LRU cuando esté llena
      config-store:
        title: Almacén de configuración en memoria
        summary: Thread-safe in-memory configuration key/value store.
        whenToUse: Simple Spring-style config bean for interviews.
        hints:
        - ConcurrentHashMap under the hood
        - getOrDefault for missing keys
      request-id-filter:
        title: Filtro de Request Id
        summary: Genera o propaga un X-Request-Id por cada solicitud entrante y lo expone a las llamadas
          descendentes y a los logs.
        whenToUse: Toda solicitud necesita un id de correlación estable para trazabilidad entre servicios,
          sin importar si quien llama ya lo proporcionó.
        hints:
        - Si el encabezado entrante está presente y no está en blanco, reutilízalo; si no, genera un
          id nuevo.
        - Guarda el id resuelto en un ámbito de la solicitud para que el código posterior pueda leerlo
          sin pasarlo como parámetro en cada llamada.
      transactional-outbox:
        title: Outbox transaccional
        summary: Cola outbox en memoria que encola eventos junto con una escritura en BD y publica solo
          los que ya están listos.
        whenToUse: Publica un evento de forma confiable tras una escritura transaccional sin una transacción
          distribuida, escribiendo el evento en una tabla/cola outbox dentro de la misma transacción
          y publicándolo por separado.
        hints:
        - enqueue guarda el evento con un estado y una marca de tiempo de elegibilidad en vez de publicarlo
          de inmediato.
        - publishDue busca eventos PENDING que ya sean elegibles, se los pasa al publicador, y luego
          los marca como PUBLISHED (o los deja PENDING para reintentar si el publicador lanza una excepción).
      optimistic-lock-service:
        title: Servicio de bloqueo optimista
        summary: Actualización de un registro versionado que falla cuando la versión esperada por quien
          llama está desactualizada.
        whenToUse: Actualizaciones concurrentes sobre la misma fila sin tomar un bloqueo de base de
          datos, análogo a una columna @Version de JPA y a OptimisticLockException.
        hints:
        - Guarda un número de versión junto al valor de cada registro; cada actualización exitosa lo
          incrementa.
        - Rechaza una actualización cuya versión esperada no coincida con la versión guardada, en vez
          de sobrescribir en silencio.
      concurrent-login-tracker:
        title: Rastreador de inicios de sesión concurrentes
        summary: Rastrea las sesiones activas por usuario y aplica un número máximo de inicios de sesión
          concurrentes.
        whenToUse: 'Aplica una política de "máximo N dispositivos conectados": un nuevo inicio de sesión
          debe ser rechazado o debe desalojar la sesión más antigua, según la política, al alcanzar el
          límite por usuario.'
        hints:
        - Mantén una colección ordenada de ids de sesión activos por usuario para encontrar fácilmente
          la sesión más antigua.
        - Ante un nuevo inicio de sesión que supera el límite, recházalo o desaloja y reemplaza la sesión
          más antigua según la política configurada; haz que el desalojo y la inserción sean atómicos
          bajo un bloqueo por usuario.
      sql-injection-safe-query:
        title: Constructor de consultas seguro frente a inyección SQL
        summary: Construye marcadores de posición parametrizados a partir de un mapa columna-valor,
          validando identificadores en vez de concatenar entrada sin procesar.
        whenToUse: Discute/implementa cómo una capa de repositorio construye cláusulas WHERE dinámicas
          de forma segura - valida los nombres de columna contra una lista blanca y siempre vincula
          los valores como parámetros, nunca los concatenes como texto en el SQL.
        hints:
        - Valida cada identificador (nombre de columna) contra un patrón de lista blanca antes de usarlo
          en el texto SQL generado.
        - Nunca insertes el valor directamente - siempre emite un marcador `?` y devuelve la lista de
          valores por separado para que un PreparedStatement los vincule.
