courseDescription: AlgoPrep es un campo de entrenamiento autónomo para entrevistas en Java. Cada módulo
  de patrón enseña a reconocer una clase de problema, explicar el enfoque en voz alta, aplicar una plantilla
  reutilizable en Java, evitar trampas comunes y practicar Easy → Medium → Hard con pruebas JUnit. Tras
  un patrón, pon a prueba el reconocimiento en modo Blind Spot (sin etiquetas de patrón). Una pista extra
  cubre temas de Spring Boot para roles backend en Java.
weeks:
  1: Mapas hash, dos punteros, ventanas, listas
  2: Árboles, grafos y recorridos
  3: Búsqueda, recursión y programación dinámica
  4: Intervalos, heaps, diseño y Spring
cheatsheet:
- q: ¿Subarreglo/subcadena contigua con restricción de suma o de distintos?
  a: Ventana deslizante
- q: ¿Arreglo ordenado, necesitas un par/trío con un objetivo, o inversión en el lugar?
  a: Dos punteros
- q: ¿Ciclo en lista enlazada, nodo medio, o una secuencia que pueda ciclar?
  a: Punteros rápido y lento
- q: ¿Necesitas una mediana en curso o equilibrar dos mitades ordenadas de un flujo?
  a: Dos heaps
- q: ¿Fusionar varias listas/arreglos ya ordenados, o hallar el k-ésimo entre ellos?
  a: Fusión K vías
- q: ¿Solo los K elementos top/mayores/menores/más frecuentes, no un sort completo?
  a: Top K elementos
- q: ¿Arreglo ordenado o rotado; primera/última aparición, o búsqueda en el espacio de respuesta?
  a: Búsqueda binaria modificada
- q: ¿Generar todos los subconjuntos, permutaciones o combinaciones?
  a: Subconjuntos
- q: ¿Una elección localmente óptima, tras ordenar por la clave correcta, parece segura?
  a: Voraz
- q: ¿Todas las soluciones/tableros válidos vía elegir-explorar-deshacer?
  a: Backtracking
- q: ¿Valor/conteo óptimo con subproblemas solapados y subestructura óptima?
  a: Programación dinámica
- q: ¿Números en 1..n; faltantes/duplicados en O(1) de espacio?
  a: Ordenación cíclica
- q: ¿Tareas con prerrequisitos; orden válido o detección de ciclo?
  a: Orden topológico
- q: ¿Grafo explícito o implícito; conectividad, componentes o camino más corto no ponderado?
  a: Grafos
- q: ¿Suma de camino en árbol binario, diámetro o ancestro común más bajo?
  a: DFS en árbol
- q: ¿Complemento/frecuencia rápida, o conteo con prefijos, en una pasada?
  a: Mapas hash
- q: ¿Reuniones que se solapan, o un barrido de inicios y finales?
  a: Intervalos
- q: ¿Siguiente mayor, temperaturas diarias, o un rectángulo en un histograma?
  a: Pilas
- q: ¿Diccionario de prefijos, autocompletar, o muchas palabras en un tablero?
  a: Trie
- q: ¿Conectividad dinámica, o «estos dos nodos están en el mismo componente»?
  a: Union Find
- q: ¿Orden en espiral, rotar una matriz, o poner a cero una fila y una columna?
  a: Matrices
- q: ¿Invertir una lista, o cada k nodos, en el lugar?
  a: Lista enlazada in-place
- q: ¿Un número aparece una vez, o hay que poner y probar bits?
  a: Bits
- q: ¿Un balance corrido de ceros y unos, o un candidato a mayoría?
  a: Saber qué seguir
