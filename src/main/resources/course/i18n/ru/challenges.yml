challenges:
  trap-rain-water:
    title: Сбор дождевой воды
    prompt: Дано n неотрицательных целых чисел, представляющих карту высот, где ширина каждого столбца
      равна 1. Вычислите, сколько воды сможет удержать эта карта после дождя. Вода над столбцом держится
      только до высоты, ограниченной меньшим из максимумов слева и справа от него, поэтому сначала подумайте,
      что определяет уровень воды в каждой позиции, прежде чем применять конкретный паттерн.
    hints:
    - "Что с каждой стороны столбика ограничивает воду?"
    - "Вода над столбиком не выше меньшего из самых высоких столбиков, уже увиденных слева и справа."
    - "Сдвигайте сторону с меньшим текущим максимумом: уровень воды на ней уже определён."
  longest-repeating-replacement:
    title: Самая длинная замена повторяющихся символов
    prompt: Дана строка s и целое число k. Вы можете выбрать любой символ строки и заменить его на любую
      другую заглавную английскую букву, и можете выполнить эту операцию не более k раз. Верните длину
      самой длинной подстроки, состоящей из одной и той же буквы, которую можно получить после этих операций.
      Подумайте, что делает окно строки 'достижимым' при не более чем k заменах, прежде чем выбирать подход.
    hints:
    - "Когда отрезок ещё достижим не более чем k заменами?"
    - "Отрезок допустим, пока его длина минус самый частый символ не больше k."
    - "Растите правым краем и не отводите левый ниже самой длинной уже виденной допустимой длины."
  employee-free-time:
    title: Свободное время сотрудников
    prompt: Дан список расписаний сотрудников, представляющий рабочее время каждого сотрудника. У каждого
      сотрудника есть список непересекающихся интервалов, отсортированных внутри его собственного расписания.
      Верните список конечных общих свободных интервалов для всех сотрудников, отсортированный по времени
      начала. Подумайте, как объединить расписания нескольких сотрудников в единую временную шкалу перед
      поиском пробелов.
    hints:
    - "Где промежуток, общий для всех сотрудников?"
    - "Когда все занятые интервалы на одной шкале, щель между двумя слитыми занятыми блоками свободна для всех."
    - "Упорядочьте по началу, слейте перекрытия и отдайте каждую положительную щель между концом слитого блока и следующим началом."
  median-of-two-sorted:
    title: Медиана двух отсортированных массивов
    prompt: Даны два отсортированных массива nums1 и nums2 размерами m и n соответственно. Верните медиану
      двух отсортированных массивов. Общая временная сложность должна быть O(log (m+n)), что исключает
      простое слияние массивов. Подумайте, какое свойство корректной точки разбиения обоих массивов позволило
      бы найти медиану без полного слияния.
    hints:
    - "Каким должен быть разрез через оба массива, чтобы сесть на медиану?"
    - "Каждое значение слева от разреза не больше каждого значения справа."
    - "Ищите разрез по более короткому массиву, пока четыре граничных значения не встанут по порядку; медиана среди этих границ."
  word-ladder:
    title: Лестница слов
    prompt: Последовательность преобразования от слова beginWord к слову endWord с использованием словаря
      wordList - это последовательность слов beginWord -> s1 -> s2 -> ... -> sk, где каждая соседняя пара
      слов отличается ровно одной буквой, и каждое промежуточное слово есть в wordList. Верните число
      слов в кратчайшей такой последовательности от beginWord до endWord, или 0, если такой последовательности
      не существует. Подумайте, что отношение 'отличается на одну букву' между словами говорит об общей
      структуре, связывающей их.
    hints:
    - "Что считается одним шагом от текущего слова?"
    - "Два слова в одном шаге, когда различаются ровно одной буквой, и ответ — наименьшее число таких шагов."
    - "От текущего слова пробуйте каждую замену одной буквы, которая ещё не использована в словаре, и не возвращайтесь к слову."
  serialize-binary-tree:
    title: Сериализация и десериализация бинарного дерева
    prompt: Спроектируйте алгоритм сериализации и десериализации бинарного дерева. Нет ограничений на
      то, как работает ваш алгоритм сериализации/десериализации - нужно лишь гарантировать, что бинарное
      дерево можно сериализовать в строку, а эту строку - десериализовать обратно в исходную структуру
      дерева. Подумайте, какой порядок обхода сохраняет достаточно структурной информации для однозначного
      восстановления дерева, включая места null-потомков.
    hints:
    - "Что нужно записать, чтобы отсутствующий ребёнок не спутался с концом дерева?"
    - "Маркер пустоты занимает место каждого отсутствующего ребёнка, поэтому в потоке есть слот на каждую ветку."
    - "Пишите значения и маркеры пустоты в одном фиксированном порядке и восстанавливайте, читая тот же порядок."
  largest-rectangle-histogram:
    title: Наибольший прямоугольник в гистограмме
    prompt: Дан массив целых чисел heights, представляющий высоты столбцов гистограммы шириной 1 каждый.
      Верните площадь наибольшего прямоугольника, который можно построить внутри гистограммы. Подумайте,
      для каждого столбца, насколько далеко он мог бы протянуться влево и вправо, оставаясь самым низким
      столбцом в этом промежутке, вместо прямой проверки каждого возможного прямоугольника.
    hints:
    - "Как далеко этот столбик может тянуться, оставаясь самым низким?"
    - "Прямоугольник, где этот столбик самый низкий, кончается у первого строго более низкого столбика с каждой стороны."
    - "Когда приходит более низкий столбик, у отложенного правый край на новом индексе, а левый — сразу за предыдущим нерешённым индексом."
  alien-dictionary:
    title: Инопланетный словарь
    prompt: Существует новый инопланетный язык, использующий английский алфавит, но порядок букв в нём
      вам неизвестен. Дан список слов из словаря этого языка, отсортированный лексикографически по правилам
      этого нового языка. Выведите порядок букв в этом языке из данного списка слов. Если порядок недопустим,
      верните пустую строку; если допустимых порядков несколько, верните любой из них. Подумайте, что
      сравнение каждой пары соседних слов может сказать об упорядочении отдельных букв.
    hints:
    - "Что говорит первая позиция, где два соседних слова различаются?"
    - "Эта пара букв — порядок: буква более раннего слова идёт первой."
    - "Соберите эти порядки и каждый раз берите букву, которую ни одно оставшееся правило не ставит после другой."

  sliding-window-maximum:
    title: Максимум в скользящем окне
    prompt: >
      Дан массив nums и окно размера k, которое движется слева направо. Верните массив максимумов
      для каждого положения окна. Полный пересчёт каждого окна слишком медленный — подумайте, как
      переиспользовать работу при сдвиге.
    hints:
    - "Какой более ранний индекс уже не может быть максимумом никакого будущего окна?"
    - "Кандидаты остаются в порядке убывания, и передний кандидат всё ещё внутри окна."
    - "Выбрасывайте индексы, вышедшие из окна, и меньшие значения, прежде чем принять новый индекс."
  word-break-ii:
    title: Разбиение слова II
    prompt: >
      Дана строка s и словарь wordDict. Добавьте пробелы в s так, чтобы каждое слово было из словаря.
      Верните все возможные предложения в любом порядке.
    hints:
    - "Какой разрез стоит продолжать, а какой префикс — тупик?"
    - "Разрез законен, только когда только что взятый кусок есть в словаре."
    - "Когда дошли до конца строки, соедините выбранные куски пробелами."
  russian-doll-envelopes:
    title: Русские матрёшки (конверты)
    prompt: >
      Даны конверты [wi, hi]. Один конверт влезает в другой только если и ширина, и высота строго больше.
      Верните максимальное число конвертов в цепочке. Поворот запрещён.
    hints:
    - "Когда порядок конвертов зафиксирован, что осталось максимизировать?"
    - "Равные ширины не вкладываются, поэтому при равной ширине высоты берутся так, чтобы оставшиеся высоты ещё могли расти."
    - "Самая длинная цепочка — самая длинная строго растущая серия этих высот."
  minimum-window-subsequence:
    title: Минимальное окно-подпоследовательность
    prompt: >
      Даны строки s и t. Верните минимальное непрерывное окно s, в котором t является подпоследовательностью.
      Если такого нет — пустая строка; при нескольких — самое левое.
    hints:
    - "Когда образец покрыт по порядку, как далеко назад может начаться это окно?"
    - "Лучшее окно — самое короткое, при равенстве самое левое, и оно кончается на совпадении последнего символа образца."
    - "Расширяйтесь, пока образец не покрыт по порядку, затем идите назад к самому раннему началу, которое всё ещё его покрывает."

  count-of-smaller:
    title: Число меньших справа
    prompt: >
      Дан массив nums. Верните counts, где counts[i] — число строго меньших элементов справа от nums[i].
      И merge-sort, и Fenwick/segment tree допустимы на интервью.
    hints:
    - "Когда это значение проходит мимо других, какие из них меньше и всё ещё справа?"
    - "Счётчик значения — сколько меньших прошло мимо него, пока упорядоченные половины соединялись."
    - "Пока половины соединяются, прибавляйте число уже взятых меньших значений к большему, мимо которого они проходят."
  palindrome-pairs:
    title: Палиндромные пары
    prompt: >
      Дан список уникальных слов. Верните все пары индексов (i, j), для которых words[i] + words[j]
      — палиндром. Подходят и hash map обращений, и trie обратных слов.
    hints:
    - "Какое другое слово достроило бы палиндром на непарной стороне этого слова?"
    - "Пара работает, когда непарная сторона сама палиндром, а другая сторона — переворот уже сохранённого слова."
    - "Для каждого разреза слова ищите переворот одной стороны среди уже проиндексированных слов."
  task-scheduler:
    title: Планировщик задач
    prompt: >
      Расписание задач CPU с интервалом охлаждения n между одинаковыми. Верните минимальное время.
      Жадная формула по частотам или max-heap — оба варианта ок.
    hints:
    - "Что создаёт простой: число задач или та, что повторяется чаще всех?"
    - "Самая частая задача оставляет щель n после каждой копии, кроме последней, и другие задачи могут эти щели заполнить."
    - "Время — это большее из числа задач и длины, которую вынуждают щели самой частой задачи."
