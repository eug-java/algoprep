questions:
  q-rain-water:
    prompt: >
      Дана высота столбцов рельефа. Посчитайте, сколько дождевой воды может задержаться между ними.
    explanation: >
      Два встречных указателя отслеживают максимумы слева и справа, сжимая границы — классическая задача на два указателя.
  q-min-window:
    prompt: >
      Найдите наименьшую подстроку s, содержащую все символы t (с учётом повторов).
    explanation: >
      Расширяйте и сжимайте непрерывное окно, поддерживая счётчики нужных символов — Скользящее окно.
  q-course-order:
    prompt: >
      Есть n курсов и пары предпосылок между ними. Верните допустимый порядок прохождения всех курсов или определите, что это невозможно.
    explanation: >
      Предпосылки образуют задачу упорядочивания в ориентированном ациклическом графе — Топологическая сортировка (и обнаружение циклов).
  q-median-stream:
    prompt: >
      Спроектируйте структуру данных, которая эффективно поддерживает вставку чисел и получение текущей медианы.
    explanation: >
      Балансируйте max-heap и min-heap для двух половин набора данных — Две кучи.
  q-islands:
    prompt: >
      Посчитайте количество связных групп клеток суши ('1') в двумерной сетке из воды и суши.
    explanation: >
      Соседство клеток сетки — это неявный граф; заливкой обойдите каждую компоненту — Графы (DFS/BFS).
  q-lca:
    prompt: >
      Найдите наименьшего общего предка двух узлов в бинарном дереве (не обязательно дереве поиска).
    explanation: >
      Рекурсивно обходите левое и правое поддеревья и объединяйте результаты — DFS по дереву.
  q-level-order:
    prompt: >
      Верните значения бинарного дерева, сгруппированные по уровням сверху вниз.
    explanation: >
      Обрабатывайте узлы с помощью очереди, по одному уровню за раз — BFS по дереву.
  q-word-search-ii:
    prompt: >
      Дана доска и словарь слов; верните все слова, которые можно составить из соседних клеток.
    explanation: >
      Множество запросов по префиксам на доске требуют структуры Trie в сочетании с отсечением при DFS.
  q-merge-intervals:
    prompt: >
      Объедините все пересекающиеся интервалы [start, end] в минимальный список непересекающихся интервалов.
    explanation: >
      Отсортируйте по началу и пройдитесь, объединяя пересечения — Интервалы.
  q-n-queens:
    prompt: >
      Расставьте n ферзей на доске n×n так, чтобы никакие два не били друг друга по строке, столбцу или диагонали. Верните все расстановки.
    explanation: >
      Перебирайте расстановки с отсечением заведомо неверных вариантов — Backtracking.
  q-edit-distance:
    prompt: >
      Вычислите минимальное количество операций вставки, удаления и замены для превращения word1 в word2.
    explanation: >
      Оптимальная подструктура на префиксах строк — Динамическое программирование.
  q-first-missing-positive:
    prompt: >
      Найдите наименьшее отсутствующее положительное число в неотсортированном массиве, используя константную дополнительную память.
    explanation: >
      Размещайте каждое значение v по индексу v-1, если оно попадает в диапазон — индексация в стиле циклической сортировки.
  q-accounts-merge:
    prompt: >
      Объедините учётные записи пользователей, у которых совпадает хотя бы один email, вернув сгруппированные адреса по каждому человеку.
    explanation: >
      Email-адреса — это элементы, которые нужно объединить в компоненты связности — Система непересекающихся множеств (Union-Find).
  q-lru:
    prompt: >
      Спроектируйте кэш с операциями get/put за O(1), который вытесняет наименее недавно использованный ключ при переполнении.
    explanation: >
      Совместите хеш-таблицу с упорядоченным списком — Пользовательские структуры данных.
  q-next-greater:
    prompt: >
      Для каждого дня определите, через сколько дней потеплеет. Верните 0, если такого дня нет.
    explanation: >
      Монотонный стек ещё не разрешённых индексов — Стек.
  q-kth-largest:
    prompt: >
      Найдите k-й по величине элемент в неотсортированном массиве, по возможности не сортируя его полностью.
    explanation: >
      Поддерживайте кучу размера k — Top K элементов.
  q-search-rotated:
    prompt: >
      Найдите целевое значение в повёрнутом отсортированном массиве за логарифмическое время.
    explanation: >
      Определите, какая половина отсортирована, и отбрасывайте другую — Модифицированный бинарный поиск.
  q-permutations:
    prompt: >
      Сгенерируйте все уникальные перестановки массива целых чисел (возможно, с повторами).
    explanation: >
      Каскадная генерация или backtracking для построения расстановок — семейство паттернов Subsets.
  q-gas-station:
    prompt: >
      На круговом маршруте найдите заправку, с которой можно начать и завершить круг, либо определите, что это невозможно.
    explanation: >
      Локальный сброс стартовой точки при уходе бака в минус — Жадный алгоритм.
  q-cycle-list:
    prompt: >
      Определите, содержит ли односвязный список цикл, используя константную дополнительную память.
    explanation: >
      Быстрый и медленный указатели встретятся, если цикл существует — Быстрый и медленный указатели.
  q-subarray-sum-k:
    prompt: >
      Посчитайте количество непрерывных подмассивов, сумма элементов которых равна k (массив может содержать отрицательные числа).
    explanation: >
      Префиксные суммы с хеш-таблицей частот уже встреченных префиксов — Хеш-таблицы.
  q-majority:
    prompt: >
      Найдите элемент, встречающийся более n/2 раз (гарантированно существует), за линейное время и O(1) памяти.
    explanation: >
      Отслеживайте кандидата и текущий счётчик — Знать, что отслеживать (алгоритм Бойера-Мура).
  q-single-number:
    prompt: >
      Каждое число встречается дважды, кроме одного. Найдите это число, используя O(1) памяти.
    explanation: >
      XOR взаимно уничтожает пары одинаковых чисел — Битовые операции.
  q-pow:
    prompt: >
      Эффективно вычислите x в степени n (включая отрицательные n).
    explanation: >
      Быстрое возведение в степень — приём из области математических техник.
  q-merge-k-lists:
    prompt: >
      Эффективно слейте k отсортированных связных списков в один отсортированный список.
    explanation: >
      На каждом шаге берите текущий минимум среди k голов списков — K-way Merge (слияние k списков).
  q-spiral:
    prompt: >
      Верните все элементы матрицы в порядке спирали, начиная с верхнего левого угла.
    explanation: >
      Обход сетки по слоям/границам — Матрицы.
  q-reverse-k-group:
    prompt: >
      Разворачивайте узлы связного списка группами по k; оставшиеся узлы не трогайте.
    explanation: >
      Перестроение указателей на месте группами — Работа со связным списком на месте.
  q-rate-limiter:
    prompt: >
      Спроектируйте компонент API, который допускает не более N запросов на клиента за временное окно.
    explanation: >
      Проектирование бэкенда/системы для Spring-сервисов — Spring Boot Interview Lab.
  q-group-anagrams:
    prompt: >
      Сгруппируйте слова, которые являются анаграммами друг друга. Порядок внутри группы не важен.
    explanation: >
      Отсортируйте каждое слово и сложите в корзину по ключу — Sort and Search. Сигнатура из счётчиков букв в хеш-таблице — тот же приём и тоже засчитывается.
  q-coin-not-greedy:
    prompt: >
      Монеты [1,3,4], сумма 6. Нужно минимум монет. Если каждый раз брать самую крупную, получится три монеты.
    explanation: >
      Жадный выбор здесь неверен. dp[x] = минимум по монетам от dp[x-coin]+1 — динамическое программирование.
  q-longest-substring:
    prompt: >
      Самая длинная подстрока без повторяющихся символов. Массив не отсортирован, нужен непрерывный кусок.
    explanation: >
      Расширяйте правый край и сжимайте левый, когда символ повторился — скользящее окно, не два указателя с концов.
  q-bipartite:
    prompt: >
      Можно ли разбить вершины неориентированного графа на два множества так, чтобы каждое ребро шло между множествами.
    explanation: >
      Раскрасьте BFS. Сосед уже вашего цвета — нечётный цикл. Это графы.
