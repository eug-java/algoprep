    title: Графы
    subtitle: Обход BFS/DFS по явным или неявным графам
    intuition: Любая задача про узлы, связанные отношениями - явными рёбрами или неявной смежностью, как
      соседние клетки сетки, - это задача на граф. Построение или представление структуры смежности с
      последующим выбором BFS (кратчайший путь в невзвешенном графе, или обход по уровням) против DFS
      (связность, существование пути, исчерпывающий обход) покрывает подавляющее большинство задач на
