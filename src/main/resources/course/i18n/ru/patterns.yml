    title: Модифицированный бинарный поиск
    subtitle: 'Бинарный поиск за пределами простого поиска цели: повороты, границы, пространства ответов'
    intuition: 'Обычный бинарный поиск находит одну цель в полностью отсортированном массиве, но многие
      задачи на интервью меняют условия: массив повёрнут, нужна первая или последняя позиция значения,
      или вы ищете не в массиве, а в пространстве возможных ответов. Общий приём - поддерживать инвариант
      о том, какая половина текущего диапазона ''отсортирована'' или ''ещё может содержать ответ'', и
      всегда отбрасывать ту половину, где ответа точно нет.'
    recognition: Массив отсортирован или повёрнут в неизвестной точке, нужна первая/последняя позиция
      значения, поиск в бирюзообразном (сначала растёт, потом убывает) массиве, либо формулировка 'найдите
      минимальное x, при котором condition(x) верно' с монотонным предикатом.
    walkthrough: 'Начните с low и high, охватывающих диапазон поиска, и вычисляйте mid на каждой итерации.
      Перед выбором направления определите дополнительную структуру: для повёрнутого массива проверьте,
      какая половина (левая или правая) на самом деле отсортирована, сравнив nums[low] и nums[mid]. Затем
      проверьте, может ли цель лежать в диапазоне значений этой отсортированной половины; если да - ищите
      там, иначе - в другой половине. Для задач ''первое/последнее вхождение'' не останавливайтесь на
      первом совпадении - продолжайте сужать high (или low) в сторону границы. Для задач ''поиск по ответу''
      замените сравнения массива булевой функцией-предикатом и выполняйте бинарный поиск по диапазону
      возможных ответов, а не по индексам массива.'
    telltaleSigns:
    - Отсортированный массив, повёрнутый в неизвестной точке
    - Нужна первая или последняя позиция значения, а не любое вхождение
    - Бирюзообразный массив (сначала растёт, потом убывает, или наоборот)
    - Формулировка 'минимизировать/максимизировать x при условии condition(x)' с монотонным предикатом
    - Пространство поиска концептуально бесконечно или неограничено
    templateSteps:
    - Задайте low/high, охватывающие диапазон поиска (индексы массива или диапазон ответов)
    - Вычислите mid и определите, какая половина сохраняет полезный инвариант (отсортирована / диапазон
      цели / предикат)
    - Отбросьте половину, которая не может содержать ответ
    - Для первого/последнего вхождения продолжайте сужать диапазон после первого совпадения, а не возвращайте
      сразу
    - Повторяйте, пока low > high, затем используйте последнего найденного валидного кандидата
    commonMistakes:
    - Считать весь массив отсортированным после поворота вместо проверки, какая половина такова сейчас
    - Возвращать результат при первом совпадении вместо продолжения сужения к первому/последнему вхождению
    - Ошибка на единицу при low = mid против low = mid + 1, приводящая к бесконечному циклу
    - Применять логику индексного бинарного поиска напрямую к поиску по ответу без адаптации предиката
    whenNotToUse:
    - У данных нет никакой монотонной или отсортированной структуры для использования
    - Массив достаточно мал или поиск выполняется настолько редко, что линейный проход проще и не медленнее
      на практике
    problems:
      order-agnostic-binary-search:
        title: Бинарный поиск независимо от порядка
        summary: Найдите цель в массиве, отсортированном по возрастанию или по убыванию.
        whenToUse: Определите порядок по крайним элементам один раз, затем выполните обычный бинарный
          поиск с учётом порядка.
        hints:
        - "После взгляда на середину какая половина точно не содержит ответ?"
        - "На каждом шаге ответ, если он есть, остаётся внутри отрезка, который вы ещё не отбросили."
        - "Сравните первый и последний элементы, чтобы понять возрастание это или убывание. Меняйте направление сравнения в зависимости от определённого порядка."
      search-rotated-array:
        title: Поиск в повёрнутом отсортированном массиве
        summary: Найдите индекс цели в повёрнутом отсортированном массиве с уникальными элементами.
        whenToUse: В точке mid одна половина всегда отсортирована - ищите там, если цель попадает в её
          диапазон, иначе в другой половине.
        hints:
        - "После взгляда на середину какая половина точно не содержит ответ?"
        - "На каждом шаге ответ, если он есть, остаётся внутри отрезка, который вы ещё не отбросили."
        - "Сравните nums[low] и nums[mid], чтобы понять, какая половина отсортирована. Проверьте, попадает ли цель в диапазон значений отсортированной половины, прежде чем идти туда."
      find-range:
        title: Первая и последняя позиция
        summary: Найдите первый и последний индекс целевого значения в отсортированном массиве.
        whenToUse: 'Выполните два бинарных поиска: один смещён к нижней границе, другой - к верхней.'
        hints:
        - "После взгляда на середину какая половина точно не содержит ответ?"
        - "На каждом шаге ответ, если он есть, остаётся внутри отрезка, который вы ещё не отбросили."
        - "Найдя совпадение при поиске первой позиции, продолжайте сужать влево вместо остановки. Аналогично, но сужайте вправо при поиске последней позиции."
      find-peak-element:
        title: Поиск пикового элемента
        summary: Верните индекс любого пикового элемента массива.
        whenToUse: Бинарный поиск в сторону большего соседа.
        hints:
        - "После взгляда на середину какая половина точно не содержит ответ?"
        - "На каждом шаге ответ, если он есть, остаётся внутри отрезка, который вы ещё не отбросили."
        - "Если mid меньше mid+1 — идите вправо Иначе идите влево, включая mid"
      search-rotated-duplicates:
        title: Поиск в повёрнутом массиве II
        summary: Найдите целевое значение в повёрнутом отсортированном массиве, который может содержать
          дубликаты.
        whenToUse: Бинарный поиск со сжатием границ при равенстве крайних значений.
        hints:
        - "После взгляда на середину какая половина точно не содержит ответ?"
        - "На каждом шаге ответ, если он есть, остаётся внутри отрезка, который вы ещё не отбросили."
        - "Если nums[lo]==nums[mid]==nums[hi] — сожмите обе границы В остальных случаях действует обычная логика повёрнутого массива"
  SUBSETS:
    constraints: "Выбор, обход, откат. Картинка — дерево включить/исключить."
    followUp: "А если во входе дубликаты, а в ответе нужны уникальные наборы?"
    title: Подмножества
    subtitle: Систематически генерируйте все подмножества, перестановки и сочетания
    intuition: Генерация всех подмножеств, перестановок или сочетаний - это по сути систематическое решение
      для каждого элемента, участвует ли он (и как) в результате. Обход в ширину по принципу 'взять существующее
      и добавить копию с новым элементом' строит весь булеан уровень за уровнем, а поиск с возвратом (backtracking)
      в глубину строит по одному кандидату за раз и откатывается, когда тот завершён или недопустим.
    recognition: Задача явно просит все подмножества (булеан), все перестановки, все сочетания, перестановки
      регистра букв, либо уникальные версии этого при наличии дубликатов во входе.
    walkthrough: Для генерации подмножеств в ширину начните со списка, содержащего только пустое подмножество,
      затем для каждого элемента входа пройдитесь по всем текущим подмножествам и добавьте новое подмножество,
      равное существующему плюс новый элемент - это удваивает список на каждом шаге и естественно даёт
      все 2^n подмножеств. Для перестановок либо используйте backtracking с обменом элементов по позициям
      и отменой обмена после, либо стройте перестановки, вставляя следующий элемент во все возможные позиции
      каждой существующей перестановки. При наличии дубликатов сначала отсортируйте вход, чтобы одинаковые
      значения оказались рядом, затем пропускайте генерацию из повторного значения, если оно не идёт сразу
      за уже использованным на той же глубине рекурсии - это предотвращает дубликаты в результате без
      постобработки.
    telltaleSigns:
    - Формулировки 'все подмножества', 'булеан', 'все перестановки' или 'все сочетания'
    - Перестановки регистра букв или похожая генерация всех возможных вариантов
    - Нужна обработка дубликатов, чтобы избежать повторяющихся подмножеств/перестановок
    - Не требуется серьёзное отсечение - цель в переборе, а не в оптимизации
    templateSteps:
    - Начните с пустого подмножества (BFS) или пустого частичного кандидата (backtracking DFS)
    - 'Для BFS: для каждого нового элемента добавляйте его ко всем построенным подмножествам, удваивая
      список'
    - 'Для DFS: выберите элемент, рекурсия, затем отмените выбор (откат) перед следующим вариантом'
    - Сначала отсортируйте и пропускайте дублирующихся соседей на одной глубине рекурсии, чтобы избежать
      повторов
    - Собирайте результат, когда подмножество/перестановка достигает нужного размера или все элементы
      размещены
    commonMistakes:
    - Забыть пропустить дублирующиеся элементы на одной глубине, получив повторяющиеся подмножества/перестановки
    - Не отсортировать вход сначала, хотя логика обработки дубликатов зависит от соседства одинаковых
      значений
    - Изменять общий список/массив, не отменяя изменение перед откатом к следующей ветке
    - Путать генерацию подмножеств (порядок не важен) с генерацией перестановок (порядок важен)
    whenNotToUse:
    - N настолько велико, что перебор 2^n или n! вычислительно неосуществим, а нужно лишь количество или
      оптимальное значение
    - Задаче нужен один допустимый ответ при ограничениях, а не все возможные расстановки
    problems:
      subsets:
        title: Подмножества
        summary: Верните все подмножества (булеан) массива уникальных чисел.
        whenToUse: 'Классическая каскадная BFS: удваивайте список подмножеств для каждого нового элемента.'
        hints:
        - "Какой выбор вы добавляете в текущий путь и что откатываете, если он не подошёл?"
        - "Текущий путь — один частичный ответ; его записывают до следующего выбора и откатывают на обратном пути."
        - "Начните результат со списка, содержащего только пустое подмножество. Для каждого числа добавляйте его к копии каждого уже имеющегося подмножества."
      subsets-with-duplicates:
        title: Подмножества с дубликатами
        summary: Верните все уникальные подмножества, если входной массив может содержать повторяющиеся
          значения.
        whenToUse: Сначала отсортируйте, затем при повторяющемся значении расширяйте только подмножества,
          созданные на предыдущем шаге.
        hints:
        - "Какой выбор вы добавляете в текущий путь и что откатываете, если он не подошёл?"
        - "Текущий путь — один частичный ответ; его записывают до следующего выбора и откатывают на обратном пути."
        - "Отсортируйте массив, чтобы одинаковые значения оказались рядом. Если nums[i] равно nums[i-1], добавляйте его только к подмножествам, добавленным на предыдущем шаге."
      permutations:
        title: Перестановки
        summary: Верните все перестановки массива уникальных чисел.
        whenToUse: Backtracking с обменом и отменой, либо BFS со вставкой следующего числа во все позиции.
        hints:
        - "Какой выбор вы добавляете в текущий путь и что откатываете, если он не подошёл?"
        - "Текущий путь — один частичный ответ; его записывают до следующего выбора и откатывают на обратном пути."
        - "Меняйте текущий индекс местами с каждым последующим, рекурсия, затем верните обмен обратно. Базовый случай: когда текущий индекс достиг конца массива, зафиксируйте полную перестановку."
      generate-parentheses:
        title: Генерация скобочных последовательностей
        summary: Сгенерируйте все правильные комбинации из n пар скобок.
        whenToUse: 'Backtracking со счётчиками open/close — отсекайте любой префикс, который уже не станет валидным.'
        hints:
        - "Какой выбор вы добавляете в текущий путь и что откатываете, если он не подошёл?"
        - "Текущий путь — один частичный ответ; его записывают до следующего выбора и откатывают на обратном пути."
        - "Добавляйте '(' только пока open_used < n. Добавляйте ')' только пока close_used < open_used — так каждый префикс остаётся сбалансированным. Записывайте строку только при open_used == close_used == n. Генерация подмножеств без этих ограничений взрывается и даёт невалидные строки."
      unique-permutations:
        title: Перестановки II
        summary: Все уникальные перестановки массива, который может содержать дубликаты.
        whenToUse: Backtracking с пропуском одинаковых соседних значений после сортировки.
        hints:
        - "Какой выбор вы добавляете в текущий путь и что откатываете, если он не подошёл?"
        - "Текущий путь — один частичный ответ; его записывают до следующего выбора и откатывают на обратном пути."
        - "Сначала отсортируйте массив Пропускайте дубликат, если такой же предыдущий элемент ещё не использован"
      subsets-size-k:
        title: Сочетания размера K
        summary: Return all combinations of k numbers chosen from 1..n.
        whenToUse: Subset/backtracking generation with a fixed size limit.
        hints:
        - "Какой выбор вы добавляете в текущий путь и что откатываете, если он не подошёл?"
        - "Текущий путь — один частичный ответ; его записывают до следующего выбора и откатывают на обратном пути."
        - "Choose or skip each number from start..n Stop when path size is k"
  GREEDY:
    constraints: "Назовите ключ сортировки и почему локальный выбор не придётся отменять."
    followUp: "Приведите контрпример, где жадный выбор проигрывает DP, до того как выберете его."
    title: Жадные алгоритмы
    subtitle: Фиксируйте локально оптимальный выбор, доказуемо сохраняющий глобальный инвариант
    intuition: Жадный алгоритм делает выбор, который выглядит лучшим прямо сейчас, и никогда не пересматривает
      его - это работает только если можно доказать (или знать по опыту), что этот локальный выбор никогда
      не исключает глобально оптимальное решение. На интервью жадные задачи обычно сводятся к сортировке
      по правильному ключу и одному проходу с небольшим текущим инвариантом, например, самым дальним достижимым
      индексом.
    recognition: Задача про расписание, интервалы, распределение ресурсов или достижимость, и локально
      очевидный выбор (ближайший дедлайн, наибольший охват, наименьшая стоимость) кажется 'безопасным'
      - это часто подтверждается попыткой построить контрпример, которая не удаётся.
    walkthrough: Сначала сформулируйте жадное правило вслух интервьюеру одним предложением, например 'всегда
      прыгать туда, откуда достижимо дальше всего'. Проверьте его на небольшом, в том числе провокационном
      примере, чтобы убедить и себя, и интервьюера, что лучшие варианты не упускаются. Отсортируйте вход
      по ключу, от которого зависит правило (время начала, дедлайн, соотношение и т.д.), если он ещё не
      в таком порядке. Наконец, пройдитесь один раз, обновляя небольшое количество состояния (переменную
      наибольшего охвата, счётчик, текущую сумму) и применяя жадное решение на каждом шаге без оглядки
      назад - если вам нужно 'отменить' решение, задача, вероятно, не жадная и требует DP или backtracking.
    telltaleSigns:
    - Локально оптимальный выбор кажется безопасным и не блокирует лучшие варианты в будущем
    - Сортировка по ключу (время начала, дедлайн, соотношение, время конца) и один проход решают задачу
    - Задачи на достижимость/прыжки с отслеживанием 'наибольшего охвата на текущий момент'
    - Планирование интервалов для максимизации количества или минимизации ресурсов
    templateSteps:
    - Явно сформулируйте жадное правило и проверьте его на хитром примере
    - Отсортируйте вход по ключу, от которого зависит жадное правило
    - Пройдитесь один раз слева направо, поддерживая минимальное текущее состояние
    - Применяйте жадное решение на каждом шаге, не пересматривая прошлые выборы
    - В конце верните накопленный результат (количество, наибольший охват, суммарную стоимость)
    commonMistakes:
    - Считать, что жадный подход работает, не проверив его на контрпримере
    - Сортировать не по тому ключу (например, по началу, когда правило зависит от конца)
    - Необходимость 'отменить' жадное решение позже - признак того, что нужен DP, а не жадный алгоритм
    - Ошибка на единицу в текущем инварианте (например, обновление наибольшего охвата до проверки достижимости)
    whenNotToUse:
    - Нельзя доказать, что локальный выбор сохраняет оптимальность, и контрпример его ломает (используйте
      DP)
    - Задача требует рассматривать комбинации выборов вместе, а не одно независимое решение за раз
    problems:
      jump-game:
        title: Игра в прыжки
        summary: Определите, можно ли достичь последнего индекса, зная максимальную длину прыжка в каждой
          позиции.
        whenToUse: Отслеживайте наибольший достижимый индекс при проходе; если текущий индекс превысит
          его - тупик.
        hints:
        - "Какой локальный выбор после сортировки по верному ключу уже не придётся отменять?"
        - "Ключ сортировки делает следующий выбор безопасным для всех дальнейших шагов."
        - "На каждом индексе обновляйте farthest = max(farthest, i + nums[i]). Если i превысит farthest, последний индекс недостижим."
      jump-game-ii:
