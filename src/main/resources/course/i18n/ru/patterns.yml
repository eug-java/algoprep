        failureNote: "Ведро в памяти сбрасывается при деплое и не видит другие инстансы. Скажите, где жили бы токены, если процессов больше одного, и что делать, когда это хранилище лежит."
        title: Ограничитель частоты запросов (token bucket)
        summary: Разрешайте не более N запросов за временное окно на ключ по семантике token bucket.
        whenToUse: Классический вопрос про API-шлюз / конкурентный дизайн на интервью об ограничении частоты
          запросов на клиента.
        hints:
        - "Сколько жетонов у этого ключа прямо сейчас, без фоновых часов?"
        - "Жетоны пополняются из времени с прошлого вызова, и вызов тратит один, только если жетон остался."
        - "Отслеживайте доступные токены и метку времени последнего пополнения для каждого ключа. Пополняйте токены лениво на основе прошедшего времени вместо фонового таймера."
      idempotency-store:
        example: "Вход: put(K, R) с TTL 5 минут. Повтор K возвращает R. После TTL ключ K выполняется снова."
        failureNote: "TTL, который истекает посреди повтора, снова выполняет побочный эффект. Ключ только в памяти пропадает при рестарте, и следующий повтор уже не идемпотентен."
        title: Хранилище ключей идемпотентности
        summary: Храните результаты запросов по ключу идемпотентности с семантикой TTL для безопасных
          повторов.
        whenToUse: Безопасные повторы POST в API вроде платёжных, где повторная отправка запроса не должна
          дублировать побочный эффект.
        hints:
        - "Что должен увидеть повтор и чего он не должен делать?"
        - "Ключ помнит результат и срок; внутри TTL возвращается сохранённый результат, а не повтор побочного эффекта."
        - "Храните пары (результат, время истечения) по ключу идемпотентности, предоставленному клиентом. При повторении ключа в пределах TTL возвращайте сохранённый результат вместо повторного выполнения операции."
      circuit-breaker:
        example: "Операции: getState(), recordFailure(), getState(), allowRequest(), recordFailure(), allowRequest() → [\"CLOSED\", null, \"CLOSED\", true, null, false, \"OPEN\"]"
        failureNote: "Предохранитель в одном процессе не защищает флот. Если все поды одновременно станут half-open, они устроят лавину на зависимость, от которой вы только что отступили."
        title: Автоматический выключатель (Circuit Breaker)
        summary: Простой автоматический выключатель с порогом отказов и тайм-аутом в открытом состоянии.
        whenToUse: Защищает вызывающий код от каскадных сбоев.
        hints:
        - "В каком вы состоянии после слишком многих сбоев и что разрешено после таймаута?"
        - "Closed считает сбои, open падает сразу, а после таймаута одна проба — half-open."
        - "Переходите в открытое состояние после N отказов После тайм-аута разрешайте пробный запрос в состоянии HALF_OPEN"
      lru-http-cache:
        example: "Вход: GET /a кладётся в кэш как B на 30 с. Второй GET в эти 30 с возвращает B. После срока записи нет."
        failureNote: "Кеш одного процесса устаревает, как только пишет другой инстанс. GET, зависящий от вызывающего, или забытый TTL отдают чужое тело."
        title: Кэш HTTP-ответов
        summary: TTL-кэш для идемпотентных GET-ответов с вытеснением при переполнении.
        whenToUse: Паттерн cache-aside для эндпоинтов REST с интенсивным чтением.
        hints:
        - "Что делает закешированный ответ непригодным, даже если он всё ещё самый новый?"
        - "Запись — это тело плюс срок; get выбрасывает её, когда срок прошёл, а полный кеш выбрасывает наименее свежую."
        - "Храните метку времени истечения срока действия Удаляйте устаревшие записи при get; при переполнении вытесняйте по LRU"
      config-store:
        example: "Операции: set(theme, dark), get(theme), get(missing), getOrDefault(missing, light) → [null, \"dark\", null, \"light\"]"
        failureNote: "ConcurrentHashMap — не сервис конфигурации. Другой процесс запись не увидит, рестарт её сотрёт."
        title: In-memory хранилище конфигов
        summary: "Потокобезопасное хранилище пар ключ/значение в памяти."
        whenToUse: "Простой конфиг-бин в духе Spring для собеседования."
        hints:
        - "Что вы возвращаете, если ключ ни разу не записан?"
        - "Карта — это всё хранилище, и отсутствующий ключ возвращает значение по умолчанию от вызывающего."
        - "Под капотом ConcurrentHashMap. Для отсутствующего ключа — getOrDefault."
      request-id-filter:
        example: "Вход: запрос без X-Request-Id получает новый id. Запрос, у которого id уже есть, сохраняет его."
        failureNote: "Идентификатор, рождённый внутри одного сервиса, не связывает вызов, вошедший через шлюз. Доверие к id клиента без границ даёт поддельные трассы."
        title: Фильтр Request Id
        summary: Генерирует или распространяет X-Request-Id для каждого входящего запроса и делает
          его доступным для нижестоящих вызовов и логов.
        whenToUse: Каждому запросу нужен стабильный идентификатор корреляции для трассировки между
          сервисами, независимо от того, передал ли его вызывающий.
        hints:
        - "Когда входящий заголовок и есть id, а когда вы создаёте новый?"
        - "Непустой входящий id сохраняется; иначе создаётся новый и кладётся на этот запрос."
        - "Если входящий заголовок присутствует и не пуст, используйте его повторно; иначе сгенерируйте новый идентификатор. Сохраните полученный идентификатор в области видимости запроса, чтобы последующий код мог прочитать его без передачи через параметры."
      transactional-outbox:
        example: "Вход: enqueue пишет PENDING. publishDue отправляет только строки, чей срок наступил, и помечает их отправленными."
        failureNote: "Строка outbox и бизнес-запись должны закоммититься вместе. Публикация до коммита или падение после коммита и до публикации — это и есть баг. Очередь в памяти рестарт не переживает."
        title: Транзакционный outbox
        summary: In-memory очередь outbox, которая ставит события в очередь вместе с записью в БД и
          публикует только те, что уже готовы к публикации.
        whenToUse: Надёжная публикация события после транзакционной записи без распределённой транзакции
          - событие записывается в таблицу/очередь outbox в той же транзакции, а публикуется отдельно.
        hints:
        - "Что сохраняется вместо немедленной публикации?"
        - "Строка ждёт до своего времени, и publishDue отправляет только подошедшие строки, затем помечает их отправленными."
        - "enqueue сохраняет событие со статусом и меткой времени готовности вместо немедленной публикации. publishDue находит события со статусом PENDING, готовые сейчас, передаёт каждое издателю, затем помечает его как PUBLISHED (или оставляет PENDING для повтора, если издатель выбросил исключение)."
      optimistic-lock-service:
        example: "Вход: обновление с версией 3 проходит и становится 4. Второе обновление всё ещё с версией 3 отклоняется."
        failureNote: "Версия, проверенная только в этой JVM, не согласует второй инстанс. Два пода могут прочитать версию 3 и оба записать."
        title: Сервис оптимистичной блокировки
        summary: Обновление версионированной записи, которое завершается ошибкой, если ожидаемая версия
          вызывающего устарела.
        whenToUse: Конкурентные обновления одной и той же записи без взятия блокировки БД, аналог колонки
          JPA @Version и OptimisticLockException.
        hints:
        - "Что доказывает, что обновление всё ещё про ту запись, которую вы прочитали?"
        - "Сохранённая версия должна равняться присланной; успех её увеличивает, а несовпадение — конфликт."
        - "Храните номер версии вместе со значением каждой записи; каждое успешное обновление увеличивает его. Отклоняйте обновление, если ожидаемая версия не совпадает с сохранённой, вместо молчаливой перезаписи."
      concurrent-login-tracker:
        example: "Вход: лимит 2. Третий вход в этом процессе вытесняет самую старую сессию. Другой экземпляр этот набор не видит."
        failureNote: "Множество сессий этого процесса пусто на следующем поде. Нельзя посчитать или отозвать вход, который пришёл в другое место."
        title: Трекер конкурентных входов
        summary: Отслеживает активные сессии для каждого пользователя и ограничивает максимальное число
          одновременных входов.
        whenToUse: 'Реализация политики "не более N устройств одновременно": новый вход должен либо
          быть отклонён, либо вытеснять самую старую сессию, в зависимости от политики, при достижении
          лимита на пользователя.'
        hints:
        - "Какую сессию сбросить, когда пользователь уже на пределе?"
        - "Этот процесс помнит активные сессии по порядку, и вход сверх предела снимает здесь только самую старую."
        - "Храните упорядоченную коллекцию активных идентификаторов сессий на пользователя, чтобы легко находить самую старую сессию. При новом входе сверх лимита либо отклоняйте его, либо вытесняйте самую старую сессию в зависимости от настроенной политики; сделайте вытеснение и добавление атомарными под одной блокировкой на пользователя."
      sql-injection-safe-query:
        example: "Вход: buildSelect(\"users\", {id: 7}) связывает 7. Имя столбца, которое не является простым идентификатором, отклоняется."
        failureNote: "Список разрешённых имён, собранный из запроса, — не список разрешённых. Значения связывайте параметрами. Идентификаторы, которые нельзя связать, остаются в списке, который написали вы."
        title: Безопасный от SQL-инъекций построитель запросов
        summary: Строит параметризованные плейсхолдеры запроса из карты колонка-значение, проверяя
          идентификаторы вместо конкатенации сырого ввода.
        whenToUse: Обсуждение/реализация того, как слой репозитория безопасно строит динамические условия
          WHERE - проверяйте имена колонок по белому списку и всегда привязывайте значения как параметры,
          никогда не подставляйте их строкой в SQL.
        hints:
        - "Какая часть оператора может быть текстом, а какая обязана быть привязанным значением?"
        - "Имена проверяются по правилу простого идентификатора, прежде чем попасть в SQL, а значения — параметры."
        - "Проверяйте каждый идентификатор (имя колонки) по шаблону белого списка перед использованием в сгенерированном тексте SQL. Никогда не подставляйте само значение - всегда выводите плейсхолдер `?` и возвращайте список значений отдельно для привязки через PreparedStatement."
