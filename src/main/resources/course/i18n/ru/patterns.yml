  CUSTOM_DATA_STRUCTURES:
    constraints: "Назовите две структуры и какую операцию каждая делает за O(1)."
    followUp: "А если ёмкость не ограничена или каждая операция должна быть потокобезопасной?"
    title: Пользовательские структуры данных
    subtitle: Комбинируйте известные строительные блоки под требования сложности каждой операции
    intuition: Многие вопросы на 'проектирование' на интервью на самом деле проверяют, можете ли вы разложить
      набор требуемых операций и их сложность на комбинацию простых известных строительных блоков - хеш-карту
      для O(1) поиска, двусвязный список для O(1) перестановки, кучу для доступа по приоритету - соединённых
      так, чтобы каждая операция затрагивала только нужные ей структуры.
    recognition: Вопрос просит спроектировать структуру данных или класс, поддерживающий несколько операций
      (get/put, push/pop/getMin, insert/delete/getRandom) с конкретными ограничениями по временной сложности,
      например LRU/LFU кэш, min stack, или хранилище ключ-значение с временными метками.
    walkthrough: 'Начните с перечисления каждой требуемой операции и её целевой временной сложности точно
      как указано в задаче - этот список определяет все последующие проектные решения. Для каждой операции
      спросите, какая одна структура данных даёт эту сложность бесплатно: O(1) поиск в среднем обычно
      означает хеш-карту, O(1) вставку/удаление с обоих концов - обычно двусвязный список, O(1) доступ
      к минимуму/максимуму - обычно вспомогательный стек или кучу. Комбинируйте структуры так, чтобы каждая
      отвечала только за операции, в которых она естественно хороша - для LRU-кэша хеш-карта даёт O(1)
      поиск по ключу, а двусвязный список даёт O(1) перестановку для отметки недавности использования,
      при этом карта хранит прямые ссылки на узлы списка, избегая поиска O(n). Как только комбинация покрывает
      каждую перечисленную операцию с нужной сложностью, прогоните короткую последовательность операций
      вручную, чтобы убедиться, что состояние остаётся согласованным между комбинированными структурами,
      особенно в краевых случаях вроде пустой структуры или вместимости в один элемент.'
    telltaleSigns:
    - '''Спроектируйте структуру данных, поддерживающую...'' с несколькими операциями и целями по сложности'
    - LRU/LFU кэш, min stack, хранилище ключ-значение с временными метками, снапшот-массив
    - Несколько операций, для которых на первый взгляд нужны разные отдельные структуры данных сразу
    - Явные требования Big-O для каждой операции, а не для алгоритма в целом
    templateSteps:
    - Перечислите каждую требуемую операцию и её целевую временную сложность
    - Для каждой операции определите единственную структуру, дающую эту сложность естественным образом
    - Комбинируйте структуры так, чтобы состояние оставалось согласованным (например, карта хранит ссылки
      в связный список)
    - Настройте обновления так, чтобы каждая операция затрагивала только действительно нужные ей структуры
    - Прогоните короткую последовательность операций вручную, включая краевые случаи (пусто, вместимость
      один)
    commonMistakes:
    - Использовать одну структуру для всего, жертвуя сложностью хотя бы одной требуемой операции
    - Позволить двум комбинированным структурам разойтись (например, карта указывает на устаревший узел
      списка)
    - Не обработать явно краевые случаи вместимости/вытеснения (пустая структура, вставка при полной вместимости)
    - Излишне усложнять проект вместо композиции известных строительных блоков
    whenNotToUse:
    - Уже существующая встроенная структура сама по себе удовлетворяет сложности каждой требуемой операции
    - У операций на самом деле нет значимо различающихся требований к сложности, так что достаточно более
      простой единой структуры
    problems:
      min-stack:
        example: "Операции: push(-2), push(0), push(-3), getMin(), pop(), top() → [null, null, null, -3, null, 0, -2]"
        title: Стек с минимумом
        summary: Спроектируйте стек с операциями push, pop, top и getMin, все за O(1).
        whenToUse: Вспомогательный стек (или закодированные пары значений) отслеживает текущий минимум
          наряду с основным стеком.
        hints:
        - "Что вы храните, чтобы минимум не пришлось сканировать?"
        - "Второй стек хранит минимум, который был текущим при каждом push, и снимается вместе со значениями."
        - "Помещайте новый минимум во вспомогательный стек при каждом изменении (или при каждом push, отслеживая дубликаты). Извлекайте из обоих стеков вместе, чтобы они оставались синхронизированы."
      lru-cache:
        example: "Операции: put(1, 1), put(2, 2), get(1), put(3, 3), get(2), put(4, 4) → [null, null, 1, null, -1, null, -1, 3, 4]"
        title: LRU-кэш
        summary: Спроектируйте кэш с get и put за O(1), вытесняющий давно неиспользуемую запись при заполнении.
        whenToUse: 'Ограниченный кэш с get/put за O(1) — LinkedHashMap в access-order (или HashMap + двусвязный список).'
        hints:
        - "Какую запись выбросить, когда кеш полон?"
        - "Порядок свежести ставит использованный ключ вперёд, и наименее свежий ключ вытесняется при переполнении."
        - "Используйте LinkedHashMap в режиме access-order (или эквивалентную упорядоченную map). На get/put обновляйте ключ, чтобы он стал самым недавно использованным. При превышении capacity удаляйте eldest (least recently used). Альтернатива на интервью: HashMap<node> + двусвязный список для явного splice-to-front / evict-tail."
      time-map:
        example: "Операции: set(foo, bar, 1), get(foo, 1), get(foo, 3), set(foo, bar2, 4), get(foo, 4), get(foo, 5) → [null, \"bar\", \"bar\", null, \"bar2\", \"bar2\"]"
        title: Хранилище ключ-значение с метками времени
        summary: Сохраняйте значения по меткам времени и получайте последнее значение на момент времени
          или ранее.
        whenToUse: Map ключ → append-only список (timestamp, value); бинарный поиск последнего stamp ≤ query.
        hints:
        - "Для метки времени какое сохранённое значение — самое позднее, которое можно вернуть?"
        - "Значения ключа дописываются по времени, поэтому ответ — самая правая метка, которая всё ещё ≤ запроса."
        - "Timestamp для ключа вставляются неубывающе, поэтому список остаётся отсортированным для бинарного поиска. get возвращает самое правое значение с timestamp ≤ query (upper_bound − 1) или пусто, если нет. Храните пары или параллельные массивы; не пересортируйте на каждом get."
      lfu-cache:
        example: "Операции: put(1, 1), put(2, 2), get(1), put(3, 3), get(2), get(3) → [null, null, 1, null, -1, 3]"
        title: LFU-кэш
        summary: get/put за O(1) с вытеснением наименее часто используемого элемента (при равенстве —
          по LRU).
        whenToUse: Хеш-таблицы плюс группы по частоте из двусвязных списков.
        hints:
        - "Когда два ключа одинаково редки, какой уходит?"
        - "У каждой частоты свой список свежести, и жертва — наименее свежий ключ в самой низкой частоте."
        - "Отслеживайте минимальную частоту использования При get переносите элемент в группу со следующей частотой"
      design-hashmap:
        example: "Операции: put(1, 1), put(2, 2), get(1), get(3), put(2, 1), get(2) → [null, null, 1, -1, null, 1, null, -1]"
        title: Спроектировать HashMap
        summary: "Простая HashMap без библиотечной карты."
        whenToUse: "Массив корзин и цепочки — разминка по проектированию."
        hints:
        - "Куда попадает ключ и что, если слот уже занят?"
        - "Ключ живёт в корзине key по модулю числа корзин, а столкновение — ещё один узел в цепи этой корзины."
        - "Массив связных списков. Хеш — key % число корзин."
  BITWISE:
    constraints: "Скажите свойство битов: XOR гасит пары, маска выделяет бит."
    followUp: "А если числа отрицательные и вы сдвигаете знаковый int?"
    title: Битовые манипуляции
    subtitle: Используйте XOR, сдвиги и маски для множеств, чётности и трюков с константной памятью
    intuition: 'Приёмы битовых манипуляций основаны на небольшом наборе базовых тождеств: XOR числа с
      самим собой даёт ноль (полезно для поиска непарного элемента), сдвиг влево/вправо умножает/делит
      на степени двойки, а AND с маской выделяет конкретные биты или проверяет флаги. Распознав, какое
      тождество подходит к задаче, обычно можно превратить решение с O(n) дополнительной памяти в решение
      с O(1).'
    recognition: Задача про поиск единственного уникального элемента среди дубликатов, подсчёт установленных
      битов, проверку числа на степень двойки, либо иначе намекает на арифметический трюк с константной
      памятью вместо хеш-множества или массива.
    walkthrough: 'Сначала определите, какое битовое тождество применимо: если каждый элемент встречается
      чётное число раз кроме одного, XOR всех элементов выделяет непарный, ведь a XOR a равно нулю для
      любого a. Если нужно посчитать установленные биты, помните, что n & (n - 1) сбрасывает ровно младший
      установленный бит, поэтому повторение этой операции до обнуления n даёт число итераций, равное количеству
      единичных битов. Если нужно проверить степень двойки, заметьте, что у степеней двойки ровно один
      установленный бит, поэтому n & (n - 1) равное нулю (для положительного n) прямо это подтверждает.
      После сопоставления реализуйте аккуратно, учитывая специфику Java: поведение знакового бита у отрицательных
      чисел и переполнение int, ведь >> - это арифметический (с расширением знака) сдвиг, а >>> - логический;
      выбор не того оператора незаметно даёт неверные результаты для отрицательных входов.'
    telltaleSigns:
    - Каждый элемент встречается парами, кроме ровно одного (или похожий паттерн чётности)
    - Подсчёт установленных битов ('вес Хэмминга') или проверка степеней двойки
    - Генерация или перебор битовых масок подмножеств
    - Решение через хеш-множество/массив существует, но запрошена или подразумевается O(1) дополнительная
      память
    templateSteps:
    - Определите, какое базовое битовое тождество подходит (отмена через XOR, маскирование AND, сдвиги)
    - Явно свяжите требование задачи с этим тождеством до написания кода
    - Реализуйте аккуратно, учитывая знаковые целые Java и поведение >> против >>>
    - Проверьте на небольшом примере, включающем отрицательные числа или краевые значения (0, Integer.MIN_VALUE)
    - Вернитесь к подходу с хеш-множеством/массивом, если чистое битовое тождество на самом деле не подходит
    commonMistakes:
    - Использовать >> там, где нужен был >>> (беззнаковый сдвиг), или наоборот, ломая случаи с отрицательными
      числами
    - Забыть про приоритет операторов, неверно смешивая битовые операторы с арифметическими
    - Считать, что битовый трюк обобщается, когда реальное ограничение задачи не соответствует тождеству
    - Не протестировать краевые случаи вроде 0, отрицательных чисел или Integer.MIN_VALUE, где сдвиги
      и маски ведут себя неожиданно
    whenNotToUse:
    - Никакое удобное битовое тождество на самом деле не подходит структуре задачи - его насильственное
      применение даёт неясный, трудно проверяемый код без реальной выгоды
    - Интервьюер или задача больше ценят читаемость, чем последний константный множитель памяти, и хеш-множество
      нагляднее
    problems:
      single-number:
        example: "Вход: [4, 1, 2, 1, 2] → 4"
        title: Единственное число
        summary: Каждый элемент массива встречается дважды, кроме одного - найдите его.
        whenToUse: Примените XOR ко всем элементам; парные значения обнуляются, остаётся только непарное.
        hints:
        - "Что остаётся, когда каждое парное значение погасло?"
        - "XOR стирает значение, которое встретилось дважды, и оставляет то, которое встретилось один раз."
        - "a XOR a = 0 и a XOR 0 = a, поэтому пары исчезают независимо от порядка. Дополнительная память или сортировка не нужны - достаточно одного прохода с XOR."
      number-of-1-bits:
        example: "Вход: -1 → 32"
        title: Число единичных битов
        summary: Посчитайте число установленных битов (вес Хэмминга) в целом числе.
        whenToUse: n &= n-1 сбрасывает младший установленный бит каждый раз, поэтому цикл до обнуления
          n напрямую считает биты.
        hints:
        - "Что меняет в счётчике стирание младшего установленного бита?"
        - "Каждый шаг снимает ровно один установленный бит, поэтому число шагов — число единичных битов."
        - "Каждая итерация n &= (n - 1) убирает ровно один установленный бит. Цикл выполняется ровно popcount(n) раз, что уже эффективно без проверки каждой битовой позиции."
      single-number-ii:
        example: "Вход: [2, 2, 3, 2] → 3"
        title: Единственное число II
        summary: Каждый элемент встречается трижды, кроме одного — найдите его.
