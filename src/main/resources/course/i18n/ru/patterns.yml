  UNION_FIND:
    constraints: "Ранг и сжатие пути — причина, почему это почти O(1)."
    followUp: "А если последнюю операцию union нужно отменить?"
    title: Система непересекающихся множеств (DSU)
    subtitle: Динамическая связность с почти-O(1) объединениями через сжатие путей и ранг
    intuition: 'Union-Find (система непересекающихся множеств) отвечает на вопросы ''связаны ли эти два
      элемента?'' и ''объедини эти две группы'' почти за константное время, храня указатель на родителя
      для каждого элемента и позволяя итоговому ''корню'' элемента представлять его группу. Две оптимизации
      делают это быстрым на практике: сжатие путей (уплощение пути к корню при каждом обращении) и объединение
      по рангу/размеру (всегда присоединять меньшее дерево под корень большего).'
    recognition: Задача про динамическое объединение или соединение элементов, а затем нужно отвечать
      на вопросы связности - число провинций/компонент связности, обнаружение избыточного соединения,
      создающего цикл, или объединение аккаунтов/групп по общим атрибутам.
    walkthrough: Инициализируйте массив родителей, где каждый элемент - сам себе родитель, представляя
      n отдельных одноэлементных групп изначально. Для каждого заданного соединения или ребра найдите
      корень обеих вершин; если корни различны, объедините их, присоединив один корень под другой (используя
      ранг или размер, чтобы решить, кто останется сверху для баланса), и уменьшите текущий счётчик числа
      компонент. Для find всегда следуйте по указателям родителя до корня, применяя сжатие пути по дороге
      - указывайте каждый посещённый узел прямо на корень - это ускоряет будущие обращения от этого узла.
      Для задач типа 'избыточное соединение' обрабатывайте рёбра в заданном порядке, и первое ребро, обе
      вершины которого уже имеют общий корень, и есть ответ. Для задач группировки/объединения вроде слияния
      аккаунтов объединяйте по общему атрибуту, определяющему отношение, затем группируйте итоговые результаты
      по корню каждого элемента.
    telltaleSigns:
    - Динамическое объединение или соединение элементов с последующими вопросами о связности
    - Число компонент связности / провинций в графе
    - Обнаружение ребра, создающего цикл (избыточное соединение) в графе 'дерево плюс одно ребро'
    - Объединение групп по общему атрибуту (слияние аккаунтов, группы похожих строк)
    templateSteps:
    - Инициализируйте каждый элемент как своего родителя/корень, отслеживая счётчик компонент
    - Реализуйте find() со сжатием путей (указывайте узлы прямо на корень)
    - Реализуйте union() по рангу/размеру, уменьшая счётчик компонент при успешном объединении
    - Обрабатывайте рёбра/отношения по одному, объединяя связанные элементы
    - Используйте итоговое отображение корень-на-элемент для ответа на запросы связности или группировки
    commonMistakes:
    - Забыть сжатие путей, из-за чего find() деградирует к O(n) на перекошенных деревьях
    - Объединять, не проверив, есть ли уже общий корень у двух элементов, дважды считая компоненты
    - Игнорировать объединение по рангу/размеру, приводящее к высокому перекошенному дереву на неудачном
      порядке входа
    - Ошибка на единицу между 1-индексацией и 0-индексацией элементов в массиве родителей
    whenNotToUse:
    - Структура связности никогда не меняется после построения (проще один раз вычислить обычный обход
      графа)
    - Нужен кратчайший путь между двумя связанными узлами, а не просто факт связности - union-find не
      отслеживает длину пути
    problems:
      number-of-provinces:
        title: Число провинций
        summary: Посчитайте компоненты связности в неориентированном графе, заданном матрицей смежности.
        whenToUse: Объедините каждое прямое соединение в матрице, затем посчитайте число оставшихся уникальных
          корней.
        hints:
        - "Эти два элемента уже в одной компоненте, или это ребро должно их соединить?"
        - "Каждый элемент указывает на родителя; корень — компонента, а объединение связывает два корня."
        - "Достаточно сканировать верхний (или нижний) треугольник симметричной матрицы. Итоговый ответ - число элементов, являющихся собственным корнем."
      redundant-connection:
        title: Избыточное соединение
        summary: Найдите ребро, которое можно удалить, чтобы граф снова стал деревом (дерево плюс одно
          лишнее ребро).
        whenToUse: Обрабатывайте рёбра по порядку; первое ребро, чьи концы уже имеют общий корень, и есть
          избыточное.
        hints:
        - "Эти два элемента уже в одной компоненте, или это ребро должно их соединить?"
        - "Каждый элемент указывает на родителя; корень — компонента, а объединение связывает два корня."
        - "Объединяйте концы по одному ребру за раз, в заданном порядке входа. Как только find(u) == find(v) перед объединением, это ребро и есть ответ."
      accounts-merge:
        title: Объединение учётных записей
        summary: Объедините учётные записи, у которых совпадают email-адреса.
        whenToUse: Объединяйте email-адреса в Union-Find и группируйте по корню.
        hints:
        - "Эти два элемента уже в одной компоненте, или это ребро должно их соединить?"
        - "Каждый элемент указывает на родителя; корень — компонента, а объединение связывает два корня."
        - "Постройте карту email→имя Объединяйте последовательные email-адреса внутри одной учётной записи"
      number-of-islands-ii:
        title: Количество островов II
        summary: После каждого добавления суши верните текущее количество островов.
        whenToUse: Онлайн Union-Find по мере превращения клеток в сушу.
        hints:
        - "Эти два элемента уже в одной компоненте, или это ребро должно их соединить?"
        - "Каждый элемент указывает на родителя; корень — компонента, а объединение связывает два корня."
        - "Добавьте сушу, затем объедините с 4 соседями Увеличивайте счётчик при добавлении и уменьшайте при каждом успешном объединении"
      path-exists:
        title: Существует ли путь в графе
        summary: Return whether a path exists between source and destination.
        whenToUse: Union all edges, then check same component.
        hints:
        - "Эти два элемента уже в одной компоненте, или это ребро должно их соединить?"
        - "Каждый элемент указывает на родителя; корень — компонента, а объединение связывает два корня."
        - "Union endpoints of each edge find(source)==find(destination)"
  CUSTOM_DATA_STRUCTURES:
    constraints: "Назовите две структуры и какую операцию каждая делает за O(1)."
    followUp: "А если ёмкость не ограничена или каждая операция должна быть потокобезопасной?"
    title: Пользовательские структуры данных
    subtitle: Комбинируйте известные строительные блоки под требования сложности каждой операции
    intuition: Многие вопросы на 'проектирование' на интервью на самом деле проверяют, можете ли вы разложить
      набор требуемых операций и их сложность на комбинацию простых известных строительных блоков - хеш-карту
      для O(1) поиска, двусвязный список для O(1) перестановки, кучу для доступа по приоритету - соединённых
      так, чтобы каждая операция затрагивала только нужные ей структуры.
    recognition: Вопрос просит спроектировать структуру данных или класс, поддерживающий несколько операций
      (get/put, push/pop/getMin, insert/delete/getRandom) с конкретными ограничениями по временной сложности,
      например LRU/LFU кэш, min stack, или хранилище ключ-значение с временными метками.
    walkthrough: 'Начните с перечисления каждой требуемой операции и её целевой временной сложности точно
      как указано в задаче - этот список определяет все последующие проектные решения. Для каждой операции
      спросите, какая одна структура данных даёт эту сложность бесплатно: O(1) поиск в среднем обычно
      означает хеш-карту, O(1) вставку/удаление с обоих концов - обычно двусвязный список, O(1) доступ
      к минимуму/максимуму - обычно вспомогательный стек или кучу. Комбинируйте структуры так, чтобы каждая
      отвечала только за операции, в которых она естественно хороша - для LRU-кэша хеш-карта даёт O(1)
      поиск по ключу, а двусвязный список даёт O(1) перестановку для отметки недавности использования,
      при этом карта хранит прямые ссылки на узлы списка, избегая поиска O(n). Как только комбинация покрывает
      каждую перечисленную операцию с нужной сложностью, прогоните короткую последовательность операций
      вручную, чтобы убедиться, что состояние остаётся согласованным между комбинированными структурами,
      особенно в краевых случаях вроде пустой структуры или вместимости в один элемент.'
    telltaleSigns:
    - '''Спроектируйте структуру данных, поддерживающую...'' с несколькими операциями и целями по сложности'
    - LRU/LFU кэш, min stack, хранилище ключ-значение с временными метками, снапшот-массив
    - Несколько операций, для которых на первый взгляд нужны разные отдельные структуры данных сразу
    - Явные требования Big-O для каждой операции, а не для алгоритма в целом
    templateSteps:
    - Перечислите каждую требуемую операцию и её целевую временную сложность
    - Для каждой операции определите единственную структуру, дающую эту сложность естественным образом
    - Комбинируйте структуры так, чтобы состояние оставалось согласованным (например, карта хранит ссылки
      в связный список)
    - Настройте обновления так, чтобы каждая операция затрагивала только действительно нужные ей структуры
    - Прогоните короткую последовательность операций вручную, включая краевые случаи (пусто, вместимость
      один)
    commonMistakes:
    - Использовать одну структуру для всего, жертвуя сложностью хотя бы одной требуемой операции
    - Позволить двум комбинированным структурам разойтись (например, карта указывает на устаревший узел
      списка)
    - Не обработать явно краевые случаи вместимости/вытеснения (пустая структура, вставка при полной вместимости)
    - Излишне усложнять проект вместо композиции известных строительных блоков
    whenNotToUse:
    - Уже существующая встроенная структура сама по себе удовлетворяет сложности каждой требуемой операции
    - У операций на самом деле нет значимо различающихся требований к сложности, так что достаточно более
      простой единой структуры
    problems:
      min-stack:
        title: Стек с минимумом
        summary: Спроектируйте стек с операциями push, pop, top и getMin, все за O(1).
        whenToUse: Вспомогательный стек (или закодированные пары значений) отслеживает текущий минимум
          наряду с основным стеком.
        hints:
        - "Какая операция обязана остаться быстрой, и какая дополнительная связь это покупает?"
        - "Структура держит и нужный порядок, и прямой доступ к узлу, который вы будете обновлять."
        - "Помещайте новый минимум во вспомогательный стек при каждом изменении (или при каждом push, отслеживая дубликаты). Извлекайте из обоих стеков вместе, чтобы они оставались синхронизированы."
      lru-cache:
        title: LRU-кэш
        summary: Спроектируйте кэш с get и put за O(1), вытесняющий давно неиспользуемую запись при заполнении.
        whenToUse: 'Ограниченный кэш с get/put за O(1) — LinkedHashMap в access-order (или HashMap + двусвязный список).'
        hints:
        - "Какая операция обязана остаться быстрой, и какая дополнительная связь это покупает?"
        - "Структура держит и нужный порядок, и прямой доступ к узлу, который вы будете обновлять."
        - "Используйте LinkedHashMap в режиме access-order (или эквивалентную упорядоченную map). На get/put обновляйте ключ, чтобы он стал самым недавно использованным. При превышении capacity удаляйте eldest (least recently used). Альтернатива на интервью: HashMap<node> + двусвязный список для явного splice-to-front / evict-tail."
      time-map:
        title: Хранилище ключ-значение с метками времени
        summary: Сохраняйте значения по меткам времени и получайте последнее значение на момент времени
          или ранее.
        whenToUse: Map ключ → append-only список (timestamp, value); бинарный поиск последнего stamp ≤ query.
        hints:
        - "Какая операция обязана остаться быстрой, и какая дополнительная связь это покупает?"
        - "Структура держит и нужный порядок, и прямой доступ к узлу, который вы будете обновлять."
        - "Timestamp для ключа вставляются неубывающе, поэтому список остаётся отсортированным для бинарного поиска. get возвращает самое правое значение с timestamp ≤ query (upper_bound − 1) или пусто, если нет. Храните пары или параллельные массивы; не пересортируйте на каждом get."
      lfu-cache:
        title: LFU-кэш
        summary: get/put за O(1) с вытеснением наименее часто используемого элемента (при равенстве —
