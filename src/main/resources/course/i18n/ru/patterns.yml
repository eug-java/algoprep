        - "Клетку обрабатывают от соседей или от границы, а пометка не даёт сделать это дважды."
        - "Транспонирование меняет местами matrix[i][j] и matrix[j][i] для i < j. Разворот каждой строки после транспонирования даёт поворот по часовой стрелке."
      set-matrix-zeroes:
        title: Обнуление строк и столбцов матрицы
        summary: Если клетка равна 0, обнулите всю её строку и столбец, на месте.
        whenToUse: Используйте саму первую строку и первый столбец как маркеры вместо выделения дополнительных
