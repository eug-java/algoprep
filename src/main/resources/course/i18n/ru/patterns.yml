  MATRICES:
    constraints: "Помечайте визит на месте, если условие позволяет. Иначе скажите, зачем множество."
    followUp: "А если входную сетку менять нельзя?"
    title: Матрицы
    subtitle: Систематически обходите, трансформируйте и ищите в 2D-сетках
    intuition: Задачи с сетками и матрицами обычно про то, как именно вы обходите данные - по спирали,
      слой за слоем, или через векторы направлений; матрицу также можно рассматривать как неявный граф,
      где каждая клетка - узел, связанный с до четырёх соседей. Правильная индексная арифметика для границ
      (верх/низ/лево/право или дельты строки/столбца) - основная часть работы.
    recognition: Вход - 2D-сетка или матрица, и задача требует обхода в определённом порядке (спираль,
      диагональ, зигзаг), трансформации на месте (поворот, обнуление) или поиска/заливки по связным клеткам.
    walkthrough: 'Сначала уточните, что требуется: обход по индексам (спираль, поворот, диагональ) или
      обход по связности (заливка, поиск)? Для индексного обхода держите явные переменные границ (верх,
      низ, лево, право) и сужайте их по мере прохождения каждого слоя, либо используйте небольшой массив
      векторов направлений, циклически переключаемых при упоре в стену. Для трансформаций на месте, вроде
      поворота на 90 градусов, ищите разложение из двух шагов (транспонирование, затем разворот каждой
      строки), а не вычисляйте конечную позицию каждой клетки напрямую. Для задач по связности рассматривайте
      сетку как граф: запускайте DFS или BFS из каждой непосещённой ''интересной'' клетки, отмечая посещённые
      клетки во избежание повторной обработки, и всегда проверяйте границы строки/столбца перед рекурсией
      или добавлением соседа в очередь.'
    telltaleSigns:
    - Вход - 2D-сетка или матрица, требующая систематического обхода или трансформации
    - Требования обхода по спирали, диагонали или поворота на месте
    - Задачи типа заливки/поиска связных компонент на сетке
    - Поиск в матрице, отсортированной по строкам и столбцам
    templateSteps:
    - 'Решите, что требуется: индексный обход или обход по связности в стиле графа'
    - 'Для индексного: отслеживайте сужающиеся границы или циклически переключайте векторы направлений'
    - 'Для поворота на месте: разложите на транспонирование + разворот (или эквивалентное преобразование
      из двух шагов)'
    - 'Для связности: запускайте DFS/BFS с маркером посещённости и проверкой границ у каждого соседа'
    - Уточните, можно ли изменять сетку на месте или нужна отдельная структура посещённости
    commonMistakes:
    - Ошибка на единицу при сужении границ спирали, пропуск или дублирование граничной клетки
    - Забыть проверить границы строки/столбца перед обращением к соседу, вызывая выход за пределы
    - Использовать саму сетку как маркер посещённости, не восстанавливая её, когда исходная сетка должна
      сохраниться
    - Пытаться вычислить позиции повёрнутой матрицы напрямую вместо приёма транспонирование+разворот
    whenNotToUse:
    - Сетка фактически одномерна или разрежена, и проще подойдёт массив/хеш-подход без лишнего 2D-учёта
    - Сетка слишком велика для памяти, и нужен потоковый или дисковый подход вместо полного обхода
    problems:
      spiral-order:
        title: Спиральная матрица
        summary: Верните все элементы матрицы в порядке спирали по часовой стрелке.
        whenToUse: Сужайте границы верх/низ/лево/право после полного прохождения каждой стороны текущего
