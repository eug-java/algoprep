        - "Каждый город начинает как свой корень, и успешное объединение уменьшает число компонент на один."
        - "Достаточно сканировать верхний (или нижний) треугольник симметричной матрицы. Итоговый ответ - число элементов, являющихся собственным корнем."
      redundant-connection:
        example: "Вход: [[1, 2], [1, 3], [2, 3]] → [2, 3]"
        title: Избыточное соединение
        summary: Найдите ребро, которое можно удалить, чтобы граф снова стал деревом (дерево плюс одно
          лишнее ребро).
        whenToUse: Обрабатывайте рёбра по порядку; первое ребро, чьи концы уже имеют общий корень, и есть
          избыточное.
        hints:
        - "Что истинно для ребра, чьи концы уже делят корень?"
        - "Рёбра объединяются в порядке входа, и первое ребро, соединяющее два узла одной компоненты, — лишнее."
        - "Объединяйте концы по одному ребру за раз, в заданном порядке входа. Как только find(u) == find(v) перед объединением, это ребро и есть ответ."
      accounts-merge:
        example: "Вход: John через johnsmith и john_newyork, John через johnsmith и john00, Mary → [[John, john00@mail.com, john_newyork@mail.com, johnsmith@mail.com], [Mary, mary@mail.com]]"
        title: Объединение учётных записей
        summary: Объедините учётные записи, у которых совпадают email-адреса.
        whenToUse: Объединяйте email-адреса в Union-Find и группируйте по корню.
