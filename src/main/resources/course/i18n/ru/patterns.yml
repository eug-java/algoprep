        hints:
        - "Эта клетка зависит от соседа, от границы или от пометки, которую можно записать на месте?"
        - "Клетку обрабатывают от соседей или от границы, а пометка не даёт сделать это дважды."
        - "Используйте два булевых флага, чтобы запомнить, был ли ноль изначально в первой строке/столбце. Отмечайте строку i и столбец j через matrix[i][0] и matrix[0][j] при сканировании остальной сетки."
      search-2d-matrix:
        title: Поиск в двумерной матрице II
        summary: Найдите значение в матрице, отсортированной по строкам и столбцам.
        whenToUse: Начните с верхнего правого угла и двигайтесь влево или вниз в зависимости от сравнения.
        hints:
        - "Эта клетка зависит от соседа, от границы или от пометки, которую можно записать на месте?"
        - "Клетку обрабатывают от соседей или от границы, а пометка не даёт сделать это дважды."
        - "Начните с верхнего правого угла матрицы Если значение слишком большое — идите влево, если слишком маленькое — вниз"
      shortest-path-binary-matrix:
        title: Кратчайший путь в бинарной матрице
        summary: Найдите кратчайший свободный путь из (0,0) в (n-1,n-1), допускающий движение в 8 направлениях.
