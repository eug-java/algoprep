  TREE_DFS:
    constraints: "Скажите, что возвращает рекурсивный вызов, до того как складывать детей."
    followUp: "А если дерево вырождено и стек вызовов — это и есть память?"
    title: Обход дерева в глубину (DFS)
    subtitle: Рекурсия по путям от корня к листу и свойствам поддеревьев
    intuition: 'Большинство задач с бинарным деревом естественно рекурсивны: обработать текущий узел,
      рекурсивно перейти к левому и правому потомкам и объединить их результаты в ответ для текущего узла.
      Возвращаемое значение рекурсии - ключевое проектное решение: именно точное определение того, что
      рекурсивный вызов поддерева должно вернуть родителю, делает понятными задачи на сумму пути, диаметр
      и LCA.'
    recognition: Задача про бинарное (или общее) дерево и спрашивает про пути от корня к листу, свойства
      поддерева, диаметр/самый длинный путь, наименьшего общего предка, сериализацию, или любое свойство,
      естественно вычисляемое объединением результатов левого и правого поддеревьев.
    walkthrough: 'Точно определите, что возвращает ваша рекурсивная функция для данного узла - булево
      значение, список или числовое значение. Сначала напишите базовый случай: что происходит на null-узле,
      ведь это всегда простейший случай, закрепляющий рекурсию. Затем напишите рекурсивный случай: вызовите
      функцию для левого и правого потомков и объедините их два результата по правилу задачи (сумма, максимум,
      логическое И/ИЛИ, конкатенация списков). Для задач, где нужен ответ, не являющийся напрямую возвращаемым
      значением (как диаметр - путь, возможно, не через корень), держите отдельную переменную ''лучший
      ответ на текущий момент'', обновляемую побочным эффектом во время рекурсии, при этом само возвращаемое
      значение остаётся сфокусированным на том, что нужно родителю (например, высота). Прогоните вручную
      небольшое дерево из 3-4 узлов, чтобы подтвердить и базовый случай, и шаг объединения, прежде чем
      доверять коду.'
    telltaleSigns:
    - Бинарное дерево с вопросом о пути, свойстве поддерева или объединённом результате левого и правого
    - Сумма пути от корня к листу или перечисление путей
    - Диаметр, самый длинный путь или 'максимальная сумма пути' (возможно, не через корень)
    - Наименьший общий предок или задачи в стиле сериализации/десериализации
    templateSteps:
    - Точно определите, что возвращает рекурсивный вызов для данного узла
    - Сначала напишите null/базовый случай
    - Рекурсивно перейдите к левому и правому потомкам
    - Объедините результаты двух потомков по правилу задачи
    - Отслеживайте 'лучший ответ на текущий момент' отдельной переменной, если ответ не совпадает с возвращаемым
      значением
    commonMistakes:
    - Забыть null/базовый случай, вызывая NullPointerException
    - Путать то, что функция возвращает родителю, с фактическим итоговым ответом (например, диаметр против
      высоты)
    - Не сбрасывать или неверно ограничивать область видимости переменной 'лучший на текущий момент',
      когда она должна сохраняться на весь обход
    - Пересчитывать свойства поддерева вместо переиспользования уже вычисленных значений из рекурсивного
      вызова
    whenNotToUse:
    - Дерево крайне несбалансированно/глубоко, рискуя переполнением стека - безопаснее итеративный подход
      с явным стеком
    - Задаче нужна информация по уровням (глубина, обход по уровням) - для этого больше подходит BFS по
      дереву
    problems:
      path-sum:
        title: Сумма пути
        summary: Определите, существует ли путь от корня к листу, сумма значений которого равна заданной
          цели.
        whenToUse: DFS с вычитанием значения текущего узла из оставшейся цели по мере спуска.
        hints:
        - "Чем становится ответ узла, когда оба ребёнка уже ответили?"
        - "Результат узла собирается только из его поддеревьев."
        - "На листе проверьте, равен ли оставшийся target значению листа. Рекурсивно переходите к потомкам с target минус значение текущего узла."
      all-path-sum:
        title: Все пути с заданной суммой
        summary: Верните все пути от корня к листу, сумма значений которых равна заданной цели.
        whenToUse: DFS с построением текущего списка пути, откат (удаление последнего элемента) после
          каждого рекурсивного вызова.
        hints:
        - "Чем становится ответ узла, когда оба ребёнка уже ответили?"
        - "Результат узла собирается только из его поддеревьев."
        - "Добавляйте текущий узел в общий список пути перед рекурсией, удаляйте после. Копируйте путь в результат, только когда лист точно совпадает с оставшейся целью."
      tree-diameter:
        title: Диаметр бинарного дерева
        summary: Найдите длину (в рёбрах) самого длинного пути между любыми двумя узлами.
        whenToUse: DFS с вычислением высоты поддерева и обновлением отдельной переменной 'лучший диаметр'
          из left+right высот.
        hints:
        - "Чем становится ответ узла, когда оба ребёнка уже ответили?"
        - "Результат узла собирается только из его поддеревьев."
        - "Функция должна возвращать высоту, но обновлять побочную переменную суммой left_height + right_height. Диаметр в узле может не проходить через корень, поэтому отслеживайте максимум по всем узлам."
      lowest-common-ancestor:
        title: Наименьший общий предок
        summary: Найдите наименьшего общего предка двух узлов бинарного дерева.
        whenToUse: 'Постпорядковый обход: если результаты обоих поддеревьев не пусты, корень — искомый
          предок.'
        hints:
        - "Чем становится ответ узла, когда оба ребёнка уже ответили?"
        - "Результат узла собирается только из его поддеревьев."
        - "Возвращайте ненулевой результат из поддерева, содержащего p или q Если результаты и слева, и справа не пусты — ответ находится в текущем узле"
      max-path-sum:
        title: Максимальная сумма пути в бинарном дереве
        summary: Максимальная сумма пути между любыми двумя узлами (путь может не проходить через корень).
        whenToUse: 'DFS возвращает лучший вклад вниз через узел; глобальный максимум — путь, который может ''согнуться'' через узел.'
        hints:
        - "Чем становится ответ узла, когда оба ребёнка уже ответили?"
        - "Результат узла собирается только из его поддеревьев."
        - "Для каждого ребёнка берите max(0, child_gain) — отрицательный ребёнок путь не улучшит. Путь через узел может взять обоих детей: candidate = node.val + left_gain + right_gain; обновляйте глобальный max. Родителю возвращайте только одну ветвь: node.val + max(left_gain, right_gain), чтобы путь оставался простым."
  TREE_BFS:
    constraints: "Обход по уровням — очередь и снимок её размера."
    followUp: "А если нужен номер уровня, а не только порядок визита?"
    title: Обход дерева в ширину (BFS)
    subtitle: Обход по уровням с очередью, по одному полному уровню за раз
    intuition: 'Когда задача про дерево говорит об уровнях, глубине или ''ближайшем X'', обход по уровням
      с очередью - естественное решение: обрабатывайте один полный уровень за раз, фиксируя размер очереди
      в начале каждой итерации, ведь этот размер точно говорит, сколько узлов принадлежит текущему уровню
      до добавления потомков.'
    recognition: Задача просит обход по уровням, значения, сгруппированные по глубине, зигзагообразный
      порядок, самый правый/левый видимый узел на уровне, либо соединение узлов одного уровня указателями.
    walkthrough: Инициализируйте очередь, содержащую только корень, затем выполняйте цикл, пока очередь
      не пуста. В начале каждой итерации запомните текущий размер очереди - это точное число узлов текущего
      уровня, и это ключевой приём, отличающий BFS дерева от обычного BFS графа. Извлеките ровно столько
      узлов, обработайте каждый (добавьте в список результата текущего уровня, отслеживайте последний
      для правого обзора и т.д.) и добавляйте ненулевых потомков каждого извлечённого узла в очередь.
      Когда фиксированное число узлов уровня полностью обработано, переходите к следующей итерации внешнего
      цикла, которая теперь обрабатывает следующий уровень. Для зигзагообразного обхода держите флаг направления
      и разворачивайте списки результатов чередующихся уровней; для правого обзора просто запоминайте
      последний обработанный узел во внутреннем цикле каждого уровня.
    telltaleSigns:
    - Формулировки 'обход по уровням', 'глубина' или 'на каждом уровне'
    - Зигзагообразный/чередующийся по направлению обход
    - Самый правый или левый видимый узел на уровне
    - Соединение соседних узлов одной глубины указателями next
    templateSteps:
    - Инициализируйте очередь корневым узлом
    - В начале каждой итерации внешнего цикла зафиксируйте текущий размер очереди как ширину уровня
    - Извлеките ровно столько узлов, обрабатывая каждый и добавляя его ненулевых потомков
    - Собирайте или используйте результаты уровня (список, последний узел, обратный порядок) по необходимости
    - Повторяйте, пока очередь не опустеет
    commonMistakes:
    - Не зафиксировать размер уровня перед внутренним циклом, из-за чего границы уровней размываются
    - Добавлять в очередь null-потомков, требуя лишних проверок вместо проверки перед добавлением
    - Забыть развернуть чередующиеся уровни для зигзага, либо разворачивать каждый уровень вместо через
      один
    - Использовать рекурсию с параметром глубины, когда для действительно уровневых задач нагляднее подход
      с очередью
    whenNotToUse:
    - Задача про пути или агрегаты поддеревьев, а не про уровни (лучше и часто проще подходит DFS дерева)
    - Дерево крайне широкое, из-за чего размер очереди на уровень может быть очень большим - подумайте,
      избегает ли DFS со счётчиком глубины этого скачка памяти
    problems:
      level-order:
        title: Обход дерева по уровням
        summary: Верните значения узлов, сгруппированные по уровням сверху вниз.
        whenToUse: 'Классический шаблон BFS дерева: фиксация размера очереди на каждом уровне.'
        hints:
        - "Какие узлы на одном расстоянии от корня, и когда это расстояние увеличивается?"
        - "Очередь держит один уровень; её размер в начале цикла — весь этот уровень."
        - "Зафиксируйте queue.size() перед внутренним циклом, чтобы знать ширину текущего уровня. Стройте по одному списку на уровень и добавляйте его во внешний список результата."
      zigzag-level-order:
        title: Зигзагообразный обход по уровням
        summary: Обходите по уровням, чередуя направление слева-направо и справа-налево.
        whenToUse: Обычный BFS по уровням плюс флаг направления, разворачивающий список через уровень.
        hints:
        - "Какие узлы на одном расстоянии от корня, и когда это расстояние увеличивается?"
        - "Очередь держит один уровень; её размер в начале цикла — весь этот уровень."
