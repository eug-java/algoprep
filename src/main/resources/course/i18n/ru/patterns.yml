  TOP_K_ELEMENTS:
    constraints: "Куча размера k лучше полной сортировки, когда k заметно меньше n."
    followUp: "А если поток бесконечный, а top-k нужен на каждый момент?"
    title: Топ K элементов
    subtitle: Держите только K кандидатов с помощью кучи размера K
    intuition: 'Когда нужны только K наибольших, наименьших или самых частых элементов из N, сортировать
      все N - лишняя работа: достаточно кучи размера K, ведь новых кандидатов нужно сравнивать только
      с текущим худшим из уже сохранённых. Это снижает стоимость с O(n log n) до O(n log k), что важно,
      когда K намного меньше N.'
    recognition: Задача явно просит топ/наибольшие/наименьшие/самые частые K элементов, K ближайших точек,
      либо иначе требует ограниченное подмножество, а не полный порядок всех элементов.
    walkthrough: 'Выберите ориентацию кучи исходя из того, что вы храните: чтобы найти K наибольших элементов,
      используйте min-heap размера K, ведь наименьший элемент в ней - это текущий ''худший из оставленных''
      кандидат, который нужно вытеснить. Добавляйте каждый новый элемент, и как только куча превышает
      размер K, извлекайте вершину (текущий минимум), отбрасывая её. В итоге куча содержит ровно K наибольших
      увиденных элементов, хотя не обязательно в отсортированном порядке - отсортируйте содержимое кучи
      в конце, только если задача требует упорядоченный результат. Для ''K самых частых'' сначала постройте
      частотную карту за один проход, затем примените ту же логику кучи размера K к записям карты, используя
      частоту как ключ сравнения (либо используйте поразрядную сортировку по частоте для варианта за O(n)).'
    telltaleSigns:
    - Формулировки 'топ K', 'K наибольших/наименьших/частых' или 'K ближайших'
    - Полная сортировка сработала бы, но это дороже, чем нужно
    - Нужен результат ограниченного размера из значительно большего входа
    - Подсчёт частоты в сочетании с ограничением размера (топ K частых)
    templateSteps:
    - Выберите min-heap для 'K наибольших' или max-heap для 'K наименьших' (перевёрнутая обычная куча)
    - Добавляйте элементы по одному, удерживая размер кучи не больше K
    - Извлекайте вершину кучи, как только размер превышает K, отбрасывая текущего худшего кандидата
    - Считайте итоговые K элементов (сортируйте их, только если требуется порядок)
    - Для вариантов с частотой сначала посчитайте частоты, затем примените ту же кучу размера K к значениям
      частот
    commonMistakes:
    - Использовать max-heap из всех N элементов вместо min-heap размера K, теряя выигрыш в эффективности
    - Забыть ограничить размер кучи, позволяя ей расти больше K
    - Сравнивать не по тому ключу (например, по значению вместо частоты, или по координате вместо расстояния)
    - Считать, что порядок в куче равен отсортированному порядку, без явной финальной сортировки, когда
      она нужна
    whenNotToUse:
    - K близко к N, поэтому полная сортировка проще и не намного медленнее
    - Нужен точный отсортированный порядок всех элементов, а не только топ K
    problems:
