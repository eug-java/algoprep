  BITWISE:
    constraints: "Скажите свойство битов: XOR гасит пары, маска выделяет бит."
    followUp: "А если числа отрицательные и вы сдвигаете знаковый int?"
    title: Битовые манипуляции
    subtitle: Используйте XOR, сдвиги и маски для множеств, чётности и трюков с константной памятью
    intuition: 'Приёмы битовых манипуляций основаны на небольшом наборе базовых тождеств: XOR числа с
      самим собой даёт ноль (полезно для поиска непарного элемента), сдвиг влево/вправо умножает/делит
      на степени двойки, а AND с маской выделяет конкретные биты или проверяет флаги. Распознав, какое
      тождество подходит к задаче, обычно можно превратить решение с O(n) дополнительной памяти в решение
      с O(1).'
    recognition: Задача про поиск единственного уникального элемента среди дубликатов, подсчёт установленных
      битов, проверку числа на степень двойки, либо иначе намекает на арифметический трюк с константной
      памятью вместо хеш-множества или массива.
    walkthrough: 'Сначала определите, какое битовое тождество применимо: если каждый элемент встречается
      чётное число раз кроме одного, XOR всех элементов выделяет непарный, ведь a XOR a равно нулю для
      любого a. Если нужно посчитать установленные биты, помните, что n & (n - 1) сбрасывает ровно младший
      установленный бит, поэтому повторение этой операции до обнуления n даёт число итераций, равное количеству
      единичных битов. Если нужно проверить степень двойки, заметьте, что у степеней двойки ровно один
      установленный бит, поэтому n & (n - 1) равное нулю (для положительного n) прямо это подтверждает.
      После сопоставления реализуйте аккуратно, учитывая специфику Java: поведение знакового бита у отрицательных
      чисел и переполнение int, ведь >> - это арифметический (с расширением знака) сдвиг, а >>> - логический;
      выбор не того оператора незаметно даёт неверные результаты для отрицательных входов.'
    telltaleSigns:
    - Каждый элемент встречается парами, кроме ровно одного (или похожий паттерн чётности)
    - Подсчёт установленных битов ('вес Хэмминга') или проверка степеней двойки
    - Генерация или перебор битовых масок подмножеств
    - Решение через хеш-множество/массив существует, но запрошена или подразумевается O(1) дополнительная
      память
    templateSteps:
    - Определите, какое базовое битовое тождество подходит (отмена через XOR, маскирование AND, сдвиги)
    - Явно свяжите требование задачи с этим тождеством до написания кода
    - Реализуйте аккуратно, учитывая знаковые целые Java и поведение >> против >>>
    - Проверьте на небольшом примере, включающем отрицательные числа или краевые значения (0, Integer.MIN_VALUE)
    - Вернитесь к подходу с хеш-множеством/массивом, если чистое битовое тождество на самом деле не подходит
    commonMistakes:
    - Использовать >> там, где нужен был >>> (беззнаковый сдвиг), или наоборот, ломая случаи с отрицательными
      числами
    - Забыть про приоритет операторов, неверно смешивая битовые операторы с арифметическими
    - Считать, что битовый трюк обобщается, когда реальное ограничение задачи не соответствует тождеству
    - Не протестировать краевые случаи вроде 0, отрицательных чисел или Integer.MIN_VALUE, где сдвиги
      и маски ведут себя неожиданно
    whenNotToUse:
    - Никакое удобное битовое тождество на самом деле не подходит структуре задачи - его насильственное
      применение даёт неясный, трудно проверяемый код без реальной выгоды
    - Интервьюер или задача больше ценят читаемость, чем последний константный множитель памяти, и хеш-множество
      нагляднее
    problems:
      single-number:
        title: Единственное число
        summary: Каждый элемент массива встречается дважды, кроме одного - найдите его.
        whenToUse: Примените XOR ко всем элементам; парные значения обнуляются, остаётся только непарное.
        hints:
        - "Какой бит можно решить, не глядя на остальные?"
        - "Маска или сдвиг выделяет один бит; остальное число не меняется."
        - "a XOR a = 0 и a XOR 0 = a, поэтому пары исчезают независимо от порядка. Дополнительная память или сортировка не нужны - достаточно одного прохода с XOR."
      number-of-1-bits:
        title: Число единичных битов
        summary: Посчитайте число установленных битов (вес Хэмминга) в целом числе.
        whenToUse: n &= n-1 сбрасывает младший установленный бит каждый раз, поэтому цикл до обнуления
          n напрямую считает биты.
        hints:
        - "Какой бит можно решить, не глядя на остальные?"
        - "Маска или сдвиг выделяет один бит; остальное число не меняется."
        - "Каждая итерация n &= (n - 1) убирает ровно один установленный бит. Цикл выполняется ровно popcount(n) раз, что уже эффективно без проверки каждой битовой позиции."
      single-number-ii:
        title: Единственное число II
        summary: Каждый элемент встречается трижды, кроме одного — найдите его.
        whenToUse: Подсчёт битов по модулю 3 или автомат состояний ones/twos.
        hints:
        - "Какой бит можно решить, не глядя на остальные?"
        - "Маска или сдвиг выделяет один бит; остальное число не меняется."
        - "Считайте каждый бит по модулю 3 Либо ведите маски ones и twos"
      sum-of-two-integers:
        title: Сумма двух чисел
        summary: Сложите два целых числа без операторов + и -.
        whenToUse: XOR даёт биты суммы без переноса, (AND)<<1 даёт перенос — повторяйте в цикле.
        hints:
        - "Какой бит можно решить, не глядя на остальные?"
        - "Маска или сдвиг выделяет один бит; остальное число не меняется."
        - "a^b — сумма без учёта переноса (a&b)<<1 — перенос, который нужно прибавить далее"
      reverse-bits:
        title: Разворот битов
        summary: Разверните биты 32-битного беззнакового числа.
        whenToUse: Сдвигайте и накапливайте результат побитово.
        hints:
        - "Какой бит можно решить, не глядя на остальные?"
        - "Маска или сдвиг выделяет один бит; остальное число не меняется."
        - "Повторите цикл 32 раза result = (result<<1) | (n&1); n>>>=1"
      bitwise-and-range:
        title: Побитовое AND диапазона
        summary: Bitwise AND of all numbers in [left, right].
        whenToUse: Shift until left==right to clear differing low bits.
        hints:
        - "Какой бит можно решить, не глядя на остальные?"
        - "Маска или сдвиг выделяет один бит; остальное число не меняется."
        - "While left < right, right &= right-1 or shift both Common prefix bits survive"
  MATH_GEOMETRY:
    constraints: "Упростите формулу до кода. Переполнение — часть ответа."
    followUp: "А если координаты так велики, что наклон обязан быть сокращённой дробью, а не double?"
    title: Математика и геометрия
    subtitle: Тождества теории чисел и координатной геометрии для интервью
    intuition: Значительная часть задач на интервью на самом деле про знание конкретного математического
      тождества или геометрической формулы, а не про трюк со структурой данных - отношения НОД/НОК, модульная
      арифметика, разложение на простые множители, либо координатные формулы для площади, расстояния и
      поворота. Распознавание подходящего тождества и сведение задачи к нему до написания кода обычно
      экономит намного больше времени, чем отладка импровизированного числового подхода.
    recognition: Задача сформулирована в терминах чисел или координат, а не структуры данных - числа-палиндромы,
      НОД строк, эффективное вычисление степеней, геометрия прямоугольников/точек, либо определение, образуют
      ли точки допустимую фигуру.
    walkthrough: 'Перед написанием кода спросите, сводится ли задача к известному тождеству: касается
      ли она делимости (НОД/НОК), возведения в степень (быстрое возведение через повторное возведение
      в квадрат), модульной арифметики (mod для цикличности или избежания переполнения), или координатной
      геометрии (формула расстояния, векторное произведение для ориентации, формула шнурков для площади)?
      Определив тождество, явно сведите к нему формулировку задачи - например, ''строка a - это НОД двух
      строк'' сводится к проверке str1+str2 == str2+str1 и затем взятию НОД их длин. Реализуйте тождество
      аккуратно, обращая внимание на переполнение (используйте long вместо int для промежуточных произведений),
      обработку знака для отрицательных степеней или координат, и краевые случаи вроде нуля, отрицательных
      чисел или вырожденных фигур. Наконец, проверьте формулу на двух-трёх небольших примерах, посчитанных
      вручную, прежде чем доверять ей на полном входе, ведь едва заметно неверное математическое решение
      обычно молча выдаёт неверный ответ, а не падает с ошибкой.'
    telltaleSigns:
    - Формулировка в чистых числах или арифметике без естественного соответствия структуре данных
    - Координаты, фигуры или геометрические отношения между точками
    - Требования эффективного возведения в степень, НОД/НОК или модульной арифметики
    - Вычисления, склонные к переполнению, требующие long/mod
    templateSteps:
    - Определите математическое или геометрическое тождество, к которому сводится задача
    - Явно перепишите формулировку задачи в терминах этого тождества
    - Реализуйте аккуратно, следя за переполнением (используйте long) и знаком/краевыми случаями
    - Явно обработайте вырожденные входы (ноль, отрицательные значения, коллинеарные точки)
    - Проверьте формулу на нескольких небольших вручную посчитанных примерах, прежде чем доверять ей
    commonMistakes:
    - Переполнение целых чисел из-за неиспользования long для промежуточных произведений или сумм
    - Пропущенные краевые случаи вроде нуля, отрицательных чисел или вырожденных геометрических фигур
    - Неверное переизобретение известной формулы (НОД, быстрое возведение в степень) вместо использования
      стандартной рекурсивной/итеративной формы
    - Не проверить выведенное тождество на небольшом примере вручную перед кодированием общего случая
    whenNotToUse:
    - Задача фундаментально про организацию данных или поиск, а не про числовое/геометрическое тождество
    - Прямолинейный числовой подход уже достаточно быстр при заданных ограничениях входа, так что хитрое
      тождество добавляет риск без реальной выгоды
    problems:
      pow-x-n:
        title: Pow(x, n)
        summary: Эффективно вычислите x в степени n через быстрое возведение в степень.
        whenToUse: Быстрое возведение в степень повторным возведением в квадрат; уменьшайте показатель
          вдвое на каждом шаге вместо n умножений.
        hints:
        - "Какая величина не меняется, так что её можно посчитать вместо симуляции каждого шага?"
        - "Замкнутая форма, gcd или наклон заменяют цикл."
        - "Если n чётно, x^n = (x*x)^(n/2); если нечётно, сначала выделите один множитель x. Обрабатывайте отрицательное n как 1 / x^(-n), и следите за переполнением Integer.MIN_VALUE при смене знака."
      gcd-of-strings:
        title: НОД строк
        summary: Найдите наибольшую строку, которая делит обе из двух заданных строк.
        whenToUse: Сначала проверьте str1+str2 == str2+str1, затем возьмите подстроку длиной gcd(len1,
          len2).
        hints:
        - "Какая величина не меняется, так что её можно посчитать вместо симуляции каждого шага?"
        - "Замкнутая форма, gcd или наклон заменяют цикл."
        - "Две строки имеют общую строку-делитель, только если их конкатенация в любом порядке даёт одинаковый результат. Если проверка пройдена, ответ - префикс длиной gcd(str1.length(), str2.length())."
      sqrt:
        title: Sqrt(x)
        summary: Целочисленный квадратный корень из x (округление вниз).
        whenToUse: Бинарный поиск по пространству возможных ответов.
        hints:
        - "Какая величина не меняется, так что её можно посчитать вместо симуляции каждого шага?"
        - "Замкнутая форма, gcd или наклон заменяют цикл."
        - "Ищите такое mid, что mid*mid <= x Следите за переполнением, используя long"
      integer-to-roman:
        title: Число в римскую запись
        summary: Преобразуйте целое число в римскую запись.
        whenToUse: Жадное вычитание наибольших римских значений, включая вычитаемые комбинации.
        hints:
        - "Какая величина не меняется, так что её можно посчитать вместо симуляции каждого шага?"
        - "Замкнутая форма, gcd или наклон заменяют цикл."
        - "Используйте таблицу значений 1000, 900, 500, 400, ... Добавляйте символ, пока num >= текущего значения"
      max-points-line-math:
        title: Проверка квадрата
        summary: Проверьте, образуют ли четыре точки квадрат.
        whenToUse: 'Расстояния: две равные диагонали, четыре равные стороны, ни одно расстояние не равно
          нулю.'
        hints:
        - "Какая величина не меняется, так что её можно посчитать вместо симуляции каждого шага?"
        - "Замкнутая форма, gcd или наклон заменяют цикл."
        - "Вычислите все 6 попарных квадратов расстояний Нужны 4 равные стороны и 2 равные диагонали"
      max-points-on-a-line:
        title: Максимум точек на прямой
        summary: Maximum number of points that lie on the same line.
        whenToUse: For each origin count slopes with reduced fractions.
        hints:
        - "Какая величина не меняется, так что её можно посчитать вместо симуляции каждого шага?"
        - "Замкнутая форма, gcd или наклон заменяют цикл."
        - "Normalize slope by GCD Handle duplicates and vertical lines"
  SPRING_BOOT_INTERVIEW:
    constraints: "Скажите, процесс один или их много, до выбора структуры в памяти."
    followUp: "Что будет при рестарте и что будет, если второй инстанс эту память не видит?"
    title: Лаборатория интервью по Spring Boot
    subtitle: Темы Java backend, встречающиеся вместе с алгоритмами на собеседованиях
    intuition: 'Интервью на Java backend всё чаще сочетают классический DSA с практическими знаниями Spring
      Boot: можете ли вы спроектировать небольшой REST-ресурс, рассуждать о жизненном цикле и областях
      видимости бинов, объяснить, когда @Transactional действительно коммитит или откатывает, и построить
      потокобезопасное или идемпотентное поведение для нагруженного API? Этот модуль трактует такие вопросы
      так же, как алгоритмический паттерн - узнаваемый, обучаемый и отрабатываемый на запускаемом коде.'
    recognition: 'Собеседование на Java/Spring backend роль сочетает написание кода с вопросами в стиле
      лёгкого системного дизайна: проектирование эндпоинта, обсуждение кэширования/вытеснения, объяснение
      границ транзакций, либо реализация ограничения частоты запросов/идемпотентности для надёжности.'
    walkthrough: 'Относитесь к каждому вопросу по backend-дизайну так же, как к алгоритмической задаче:
      сначала уточните требования (ожидаемый объём запросов, требования к согласованности, режимы отказа),
      затем отобразите эти требования на известные строительные блоки Spring/Java, а не изобретайте что-то
      с нуля. Для ограничителя частоты запросов распознайте задачу как token bucket или счётчик со скользящим
      окном и обсудите, где хранится состояние (в памяти для одного инстанса, либо общее хранилище вроде
      Redis для нескольких инстансов). Для идемпотентности распознайте необходимость хранить отображение
      ключ-результат с TTL, чтобы повторные запросы возвращали исходный результат вместо повторного выполнения
      побочного эффекта. Для вопросов про @Transactional или области видимости бинов будьте готовы объяснить
      лежащий в основе механизм (проксирование, распространение, правила отката), а не просто назвать
      аннотацию. Всегда связывайте вопрос конкурентности или надёжности с конкретным решением реализации
      - ConcurrentHashMap, атомарный счётчик, или задача периодической очистки - так же, как вы обосновывали
      бы выбор структуры данных на чисто алгоритмическом интервью.'
    telltaleSigns:
    - Собеседование, сфокусированное на Java backend или Spring
    - Сочетание 'спроектируйте небольшой API' в стиле лёгкого системного дизайна с написанием кода
    - Вопросы о жизненном цикле бинов, @Transactional или областях видимости внедрения зависимостей
    - 'Вопросы надёжности: идемпотентность, ограничение частоты запросов, кэширование с вытеснением'
    templateSteps:
    - Уточните требования (масштаб, согласованность, один или несколько инстансов) перед проектированием
    - Отобразите требование на известный строительный блок (token bucket, карта с TTL, ConcurrentHashMap)
    - Объясните лежащий в основе механизм Spring, а не просто название аннотации, когда спрашивают
    - Держите сервисы тестируемыми с явными побочными эффектами, отделёнными от инфраструктуры фреймворка
    - Обосновывайте выбор конкурентности/надёжности так же, как обосновывали бы выбор структуры данных
    commonMistakes:
    - Назвать аннотацию (@Transactional, @Cacheable) без объяснения лежащего в основе механизма
    - Проектировать для одного инстанса, когда вопрос подразумевает распределённое/многоинстансное развёртывание
    - Игнорировать потокобезопасность в общем состоянии в памяти (обычный HashMap вместо ConcurrentHashMap)
    - Пропустить уточнение требований и сразу перейти к реализации, не соответствующей реальным ограничениям
    whenNotToUse:
    - Собеседование чисто алгоритмическое без компонента backend/системного дизайна (сосредоточьтесь на
      базовых паттернах DSA)
    - Роль не использует конкретно Spring - базовые концепции всё ещё применимы, но специфичные для фреймворка
      детали аннотаций - нет
    problems:
      rate-limiter:
        failureNote: "Ведро в памяти сбрасывается при деплое и не видит другие инстансы. Скажите, где жили бы токены, если процессов больше одного, и что делать, когда это хранилище лежит."
        title: Ограничитель частоты запросов (token bucket)
        summary: Разрешайте не более N запросов за временное окно на ключ по семантике token bucket.
        whenToUse: Классический вопрос про API-шлюз / конкурентный дизайн на интервью об ограничении частоты
          запросов на клиента.
        hints:
        - "Что ломается первым, когда появляется второй инстанс, повтор или рестарт?"
        - "Назовите общее состояние и замок, транзакцию или ключ, из-за которого побочный эффект не выполняется дважды."
        - "Отслеживайте доступные токены и метку времени последнего пополнения для каждого ключа. Пополняйте токены лениво на основе прошедшего времени вместо фонового таймера."
      idempotency-store:
        failureNote: "TTL, который истекает посреди повтора, снова выполняет побочный эффект. Ключ только в памяти пропадает при рестарте, и следующий повтор уже не идемпотентен."
        title: Хранилище ключей идемпотентности
        summary: Храните результаты запросов по ключу идемпотентности с семантикой TTL для безопасных
          повторов.
        whenToUse: Безопасные повторы POST в API вроде платёжных, где повторная отправка запроса не должна
          дублировать побочный эффект.
        hints:
        - "Что ломается первым, когда появляется второй инстанс, повтор или рестарт?"
        - "Назовите общее состояние и замок, транзакцию или ключ, из-за которого побочный эффект не выполняется дважды."
        - "Храните пары (результат, время истечения) по ключу идемпотентности, предоставленному клиентом. При повторении ключа в пределах TTL возвращайте сохранённый результат вместо повторного выполнения операции."
      circuit-breaker:
        failureNote: "Предохранитель в одном процессе не защищает флот. Если все поды одновременно станут half-open, они устроят лавину на зависимость, от которой вы только что отступили."
        title: Автоматический выключатель (Circuit Breaker)
        summary: Простой автоматический выключатель с порогом отказов и тайм-аутом в открытом состоянии.
        whenToUse: Защищает вызывающий код от каскадных сбоев.
        hints:
        - "Что ломается первым, когда появляется второй инстанс, повтор или рестарт?"
        - "Назовите общее состояние и замок, транзакцию или ключ, из-за которого побочный эффект не выполняется дважды."
        - "Переходите в открытое состояние после N отказов После тайм-аута разрешайте пробный запрос в состоянии HALF_OPEN"
      lru-http-cache:
        failureNote: "Кеш одного процесса устаревает, как только пишет другой инстанс. GET, зависящий от вызывающего, или забытый TTL отдают чужое тело."
        title: Кэш HTTP-ответов
        summary: TTL-кэш для идемпотентных GET-ответов с вытеснением при переполнении.
        whenToUse: Паттерн cache-aside для эндпоинтов REST с интенсивным чтением.
        hints:
        - "Что ломается первым, когда появляется второй инстанс, повтор или рестарт?"
        - "Назовите общее состояние и замок, транзакцию или ключ, из-за которого побочный эффект не выполняется дважды."
        - "Храните метку времени истечения срока действия Удаляйте устаревшие записи при get; при переполнении вытесняйте по LRU"
      config-store:
        failureNote: "ConcurrentHashMap — не сервис конфигурации. Другой процесс запись не увидит, рестарт её сотрёт."
        title: In-memory хранилище конфигов
        summary: Thread-safe in-memory configuration key/value store.
        whenToUse: Simple Spring-style config bean for interviews.
        hints:
        - "Что ломается первым, когда появляется второй инстанс, повтор или рестарт?"
        - "Назовите общее состояние и замок, транзакцию или ключ, из-за которого побочный эффект не выполняется дважды."
        - "ConcurrentHashMap under the hood getOrDefault for missing keys"
      request-id-filter:
        failureNote: "Идентификатор, рождённый внутри одного сервиса, не связывает вызов, вошедший через шлюз. Доверие к id клиента без границ даёт поддельные трассы."
        title: Фильтр Request Id
        summary: Генерирует или распространяет X-Request-Id для каждого входящего запроса и делает
          его доступным для нижестоящих вызовов и логов.
        whenToUse: Каждому запросу нужен стабильный идентификатор корреляции для трассировки между
          сервисами, независимо от того, передал ли его вызывающий.
        hints:
        - "Что ломается первым, когда появляется второй инстанс, повтор или рестарт?"
        - "Назовите общее состояние и замок, транзакцию или ключ, из-за которого побочный эффект не выполняется дважды."
        - "Если входящий заголовок присутствует и не пуст, используйте его повторно; иначе сгенерируйте новый идентификатор. Сохраните полученный идентификатор в области видимости запроса, чтобы последующий код мог прочитать его без передачи через параметры."
      transactional-outbox:
        failureNote: "Строка outbox и бизнес-запись должны закоммититься вместе. Публикация до коммита или падение после коммита и до публикации — это и есть баг. Очередь в памяти рестарт не переживает."
        title: Транзакционный outbox
        summary: In-memory очередь outbox, которая ставит события в очередь вместе с записью в БД и
          публикует только те, что уже готовы к публикации.
        whenToUse: Надёжная публикация события после транзакционной записи без распределённой транзакции
          - событие записывается в таблицу/очередь outbox в той же транзакции, а публикуется отдельно.
        hints:
        - "Что ломается первым, когда появляется второй инстанс, повтор или рестарт?"
        - "Назовите общее состояние и замок, транзакцию или ключ, из-за которого побочный эффект не выполняется дважды."
        - "enqueue сохраняет событие со статусом и меткой времени готовности вместо немедленной публикации. publishDue находит события со статусом PENDING, готовые сейчас, передаёт каждое издателю, затем помечает его как PUBLISHED (или оставляет PENDING для повтора, если издатель выбросил исключение)."
      optimistic-lock-service:
        failureNote: "Версия, проверенная только в этой JVM, не согласует второй инстанс. Два пода могут прочитать версию 3 и оба записать."
        title: Сервис оптимистичной блокировки
        summary: Обновление версионированной записи, которое завершается ошибкой, если ожидаемая версия
          вызывающего устарела.
        whenToUse: Конкурентные обновления одной и той же записи без взятия блокировки БД, аналог колонки
          JPA @Version и OptimisticLockException.
        hints:
        - "Что ломается первым, когда появляется второй инстанс, повтор или рестарт?"
        - "Назовите общее состояние и замок, транзакцию или ключ, из-за которого побочный эффект не выполняется дважды."
        - "Храните номер версии вместе со значением каждой записи; каждое успешное обновление увеличивает его. Отклоняйте обновление, если ожидаемая версия не совпадает с сохранённой, вместо молчаливой перезаписи."
      concurrent-login-tracker:
        failureNote: "Множество сессий этого процесса пусто на следующем поде. Нельзя посчитать или отозвать вход, который пришёл в другое место."
        title: Трекер конкурентных входов
        summary: Отслеживает активные сессии для каждого пользователя и ограничивает максимальное число
          одновременных входов.
        whenToUse: 'Реализация политики "не более N устройств одновременно": новый вход должен либо
          быть отклонён, либо вытеснять самую старую сессию, в зависимости от политики, при достижении
          лимита на пользователя.'
        hints:
        - "Что ломается первым, когда появляется второй инстанс, повтор или рестарт?"
        - "Назовите общее состояние и замок, транзакцию или ключ, из-за которого побочный эффект не выполняется дважды."
        - "Храните упорядоченную коллекцию активных идентификаторов сессий на пользователя, чтобы легко находить самую старую сессию. При новом входе сверх лимита либо отклоняйте его, либо вытесняйте самую старую сессию в зависимости от настроенной политики; сделайте вытеснение и добавление атомарными под одной блокировкой на пользователя."
      sql-injection-safe-query:
        failureNote: "Список разрешённых имён, собранный из запроса, — не список разрешённых. Значения связывайте параметрами. Идентификаторы, которые нельзя связать, остаются в списке, который написали вы."
        title: Безопасный от SQL-инъекций построитель запросов
        summary: Строит параметризованные плейсхолдеры запроса из карты колонка-значение, проверяя
          идентификаторы вместо конкатенации сырого ввода.
        whenToUse: Обсуждение/реализация того, как слой репозитория безопасно строит динамические условия
          WHERE - проверяйте имена колонок по белому списку и всегда привязывайте значения как параметры,
          никогда не подставляйте их строкой в SQL.
        hints:
        - "Что ломается первым, когда появляется второй инстанс, повтор или рестарт?"
        - "Назовите общее состояние и замок, транзакцию или ключ, из-за которого побочный эффект не выполняется дважды."
        - "Проверяйте каждый идентификатор (имя колонки) по шаблону белого списка перед использованием в сгенерированном тексте SQL. Никогда не подставляйте само значение - всегда выводите плейсхолдер `?` и возвращайте список значений отдельно для привязки через PreparedStatement."
