        hints:
        - "Нужен полный порядок или только K значений, которые лучше остальных?"
        - "Куча размера K забывает всё, что уже не может попасть в ответ."
        - "Посчитайте частоты хеш-картой за один проход. Помещайте пары (значение, частота) в min-heap, упорядоченную по частоте, ограниченную размером K."
