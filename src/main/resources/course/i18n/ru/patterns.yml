        hints:
        - "Какое одно число, если обновлять его на каждом шаге, делает остальную историю ненужной?"
        - "Отслеживаемого значения хватает для ответа; весь проход хранить не нужно."
        - "Начинайте расширять последовательность только с числа x, для которого x-1 отсутствует в множестве. От каждого валидного начала проверяйте x+1, x+2, ... чтобы измерить длину последовательности."
