        - "Точки от одного начала лежат на одной прямой, когда их наклоны сокращаются к одной дроби, а вертикали и повторы считаются отдельно."
        - "Нормируйте наклон через НОД. Отдельно обработайте совпадающие точки и вертикаль."
  SPRING_BOOT_INTERVIEW:
    constraints: "Скажите, процесс один или их много, до выбора структуры в памяти."
    followUp: "Что будет при рестарте и что будет, если второй инстанс эту память не видит?"
    title: Лаборатория интервью по Spring Boot
    subtitle: Темы Java backend, встречающиеся вместе с алгоритмами на собеседованиях
    intuition: 'Интервью на Java backend всё чаще сочетают классический DSA с практическими знаниями Spring
      Boot: можете ли вы спроектировать небольшой REST-ресурс, рассуждать о жизненном цикле и областях
      видимости бинов, объяснить, когда @Transactional действительно коммитит или откатывает, и построить
      потокобезопасное или идемпотентное поведение для нагруженного API? Этот модуль трактует такие вопросы
      так же, как алгоритмический паттерн - узнаваемый, обучаемый и отрабатываемый на запускаемом коде.'
    recognition: 'Собеседование на Java/Spring backend роль сочетает написание кода с вопросами в стиле
      лёгкого системного дизайна: проектирование эндпоинта, обсуждение кэширования/вытеснения, объяснение
      границ транзакций, либо реализация ограничения частоты запросов/идемпотентности для надёжности.'
    walkthrough: 'Относитесь к каждому вопросу по backend-дизайну так же, как к алгоритмической задаче:
      сначала уточните требования (ожидаемый объём запросов, требования к согласованности, режимы отказа),
      затем отобразите эти требования на известные строительные блоки Spring/Java, а не изобретайте что-то
      с нуля. Для ограничителя частоты запросов распознайте задачу как token bucket или счётчик со скользящим
      окном и обсудите, где хранится состояние (в памяти для одного инстанса, либо общее хранилище вроде
      Redis для нескольких инстансов). Для идемпотентности распознайте необходимость хранить отображение
      ключ-результат с TTL, чтобы повторные запросы возвращали исходный результат вместо повторного выполнения
      побочного эффекта. Для вопросов про @Transactional или области видимости бинов будьте готовы объяснить
      лежащий в основе механизм (проксирование, распространение, правила отката), а не просто назвать
      аннотацию. Всегда связывайте вопрос конкурентности или надёжности с конкретным решением реализации
      - ConcurrentHashMap, атомарный счётчик, или задача периодической очистки - так же, как вы обосновывали
      бы выбор структуры данных на чисто алгоритмическом интервью.'
    telltaleSigns:
    - Собеседование, сфокусированное на Java backend или Spring
    - Сочетание 'спроектируйте небольшой API' в стиле лёгкого системного дизайна с написанием кода
    - Вопросы о жизненном цикле бинов, @Transactional или областях видимости внедрения зависимостей
    - 'Вопросы надёжности: идемпотентность, ограничение частоты запросов, кэширование с вытеснением'
    templateSteps:
    - Уточните требования (масштаб, согласованность, один или несколько инстансов) перед проектированием
    - Отобразите требование на известный строительный блок (token bucket, карта с TTL, ConcurrentHashMap)
    - Объясните лежащий в основе механизм Spring, а не просто название аннотации, когда спрашивают
    - Держите сервисы тестируемыми с явными побочными эффектами, отделёнными от инфраструктуры фреймворка
    - Обосновывайте выбор конкурентности/надёжности так же, как обосновывали бы выбор структуры данных
    commonMistakes:
    - Назвать аннотацию (@Transactional, @Cacheable) без объяснения лежащего в основе механизма
    - Проектировать для одного инстанса, когда вопрос подразумевает распределённое/многоинстансное развёртывание
    - Игнорировать потокобезопасность в общем состоянии в памяти (обычный HashMap вместо ConcurrentHashMap)
    - Пропустить уточнение требований и сразу перейти к реализации, не соответствующей реальным ограничениям
    whenNotToUse:
