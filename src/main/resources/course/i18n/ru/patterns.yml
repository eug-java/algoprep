        whenToUse: Хеш-таблицы плюс группы по частоте из двусвязных списков.
        hints:
        - "Какая операция обязана остаться быстрой, и какая дополнительная связь это покупает?"
        - "Структура держит и нужный порядок, и прямой доступ к узлу, который вы будете обновлять."
        - "Отслеживайте минимальную частоту использования При get переносите элемент в группу со следующей частотой"
      design-hashmap:
