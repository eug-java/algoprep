        - "Как запомнить бит, увиденный один раз, и бит, увиденный дважды?"
        - "Каждый бит считается по модулю 3, поэтому биты, увиденные трижды, исчезают, а увиденные один раз остаются."
        - "Считайте каждый бит по модулю 3 Либо ведите маски ones и twos"
