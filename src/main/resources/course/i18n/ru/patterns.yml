    title: Слияние K источников
    subtitle: Сливайте несколько отсортированных источников с помощью min-heap текущих кандидатов
    intuition: 'Слияние k уже отсортированных списков обобщает слияние двух списков из merge sort: вместо
      сравнения двух голов держите в min-heap текущую голову каждого списка и всегда извлекайте глобально
      наименьшую. Так как куча хранит не более k элементов одновременно, наивное слияние O(n*k) превращается
      в O(n log k).'
    recognition: Нужно объединить несколько отсортированных массивов или списков в один отсортированный
      вывод, найти k-й наименьший/наибольший элемент среди нескольких отсортированных источников, либо
      найти минимальный диапазон, включающий хотя бы один элемент из каждого списка.
    walkthrough: Поместите первый элемент каждого из k отсортированных списков в min-heap, помечая каждую
      запись тем, из какого списка (и индекса/узла) она пришла, чтобы потом найти следующий элемент. Извлекайте
      минимум, добавляйте его в результат, и если в списке-источнике есть следующий элемент - поместите
      его в кучу. Продолжайте, пока куча не опустеет; результат гарантированно отсортирован, так как вы
      всегда выдаёте глобально наименьшего доступного кандидата. Для вариантов вроде 'k-й наименьший в
      отсортированной матрице' или 'минимальный диапазон' считайте каждую строку (или список) одним из
      k источников и адаптируйте условие остановки - для минимального диапазона отслеживайте текущий максимум
      по всем записям кучи и сужайте диапазон при каждом извлечении и пополнении.
    telltaleSigns:
    - Нужно объединить несколько отсортированных массивов, списков или строк матрицы
    - Нужен k-й наименьший/наибольший элемент среди нескольких отсортированных источников
    - Минимальный диапазон, включающий хотя бы один элемент из каждого из k списков
    - Явное упоминание слияния связных списков или отсортированных потоков
    templateSteps:
    - Поместите первый элемент каждого из k источников в min-heap с метаданными источника
    - Извлекайте минимум, добавляя его в результат или продвигая счётчик
    - Помещайте в кучу следующий элемент из источника извлечённого элемента, если он есть
    - Повторяйте, пока куча не опустеет или не будет достигнут искомый k-й элемент
    - Адаптируйте условие остановки/отслеживания для вариантов с диапазоном или матрицей
    commonMistakes:
    - Забыть сохранить, из какого источника (список/строка/индекс) пришла запись кучи, потеряв возможность
      найти следующий элемент
    - Поместить весь список в кучу сразу вместо одного элемента за раз (память раздувается до O(n))
    - Использовать неверный компаратор, из-за чего куча не извлекает настоящий глобальный минимум
    - Ошибка на единицу при переходе между 1-индексированным 'k-м наименьшим' и счётчиком извлечений с
      нуля
    whenNotToUse:
    - Нужно слить всего два списка (простое слияние двумя указателями обойдётся без накладных расходов
      кучи)
    - Источники не отсортированы и их нельзя дёшево отсортировать заранее (слияние через кучу опирается
      на локальный порядок)
    problems:
