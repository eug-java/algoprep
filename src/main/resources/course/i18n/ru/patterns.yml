        summary: Сложите два целых числа без операторов + и -.
        whenToUse: XOR даёт биты суммы без переноса, (AND)<<1 даёт перенос — повторяйте в цикле.
        hints:
        - "Где сумма и где перенос, если нельзя использовать +?"
        - "XOR — сумма без переноса, а AND со сдвигом влево — перенос, который ещё надо прибавить."
        - "a^b — сумма без учёта переноса (a&b)<<1 — перенос, который нужно прибавить далее"
      reverse-bits:
        example: "Вход: 43261596 → 964176192"
        title: Разворот битов
        summary: Разверните биты 32-битного беззнакового числа.
        whenToUse: Сдвигайте и накапливайте результат побитово.
        hints:
