        - "Адреса одного аккаунта объединяются, и готовые группы — адреса с общим корнем."
        - "Постройте карту email→имя Объединяйте последовательные email-адреса внутри одной учётной записи"
      number-of-islands-ii:
        example: "Вход: 3, 3, [[0, 0], [0, 1], [1, 2], [2, 1], [1, 1]] → [1, 1, 2, 3, 1]"
