        - "Остаётся только общий префикс left и right; каждый бит, который ещё меняется внутри диапазона, становится 0."
        - "Пока left < right, делайте right &= right-1 или сдвигайте оба. Выживает общий префикс битов."
  MATH_GEOMETRY:
    constraints: "Упростите формулу до кода. Переполнение — часть ответа."
    followUp: "А если координаты так велики, что наклон обязан быть сокращённой дробью, а не double?"
    title: Математика и геометрия
    subtitle: Тождества теории чисел и координатной геометрии для интервью
    intuition: Значительная часть задач на интервью на самом деле про знание конкретного математического
      тождества или геометрической формулы, а не про трюк со структурой данных - отношения НОД/НОК, модульная
      арифметика, разложение на простые множители, либо координатные формулы для площади, расстояния и
      поворота. Распознавание подходящего тождества и сведение задачи к нему до написания кода обычно
      экономит намного больше времени, чем отладка импровизированного числового подхода.
    recognition: Задача сформулирована в терминах чисел или координат, а не структуры данных - числа-палиндромы,
      НОД строк, эффективное вычисление степеней, геометрия прямоугольников/точек, либо определение, образуют
      ли точки допустимую фигуру.
    walkthrough: 'Перед написанием кода спросите, сводится ли задача к известному тождеству: касается
      ли она делимости (НОД/НОК), возведения в степень (быстрое возведение через повторное возведение
      в квадрат), модульной арифметики (mod для цикличности или избежания переполнения), или координатной
      геометрии (формула расстояния, векторное произведение для ориентации, формула шнурков для площади)?
      Определив тождество, явно сведите к нему формулировку задачи - например, ''строка a - это НОД двух
      строк'' сводится к проверке str1+str2 == str2+str1 и затем взятию НОД их длин. Реализуйте тождество
      аккуратно, обращая внимание на переполнение (используйте long вместо int для промежуточных произведений),
      обработку знака для отрицательных степеней или координат, и краевые случаи вроде нуля, отрицательных
      чисел или вырожденных фигур. Наконец, проверьте формулу на двух-трёх небольших примерах, посчитанных
      вручную, прежде чем доверять ей на полном входе, ведь едва заметно неверное математическое решение
      обычно молча выдаёт неверный ответ, а не падает с ошибкой.'
    telltaleSigns:
    - Формулировка в чистых числах или арифметике без естественного соответствия структуре данных
    - Координаты, фигуры или геометрические отношения между точками
    - Требования эффективного возведения в степень, НОД/НОК или модульной арифметики
    - Вычисления, склонные к переполнению, требующие long/mod
    templateSteps:
    - Определите математическое или геометрическое тождество, к которому сводится задача
    - Явно перепишите формулировку задачи в терминах этого тождества
    - Реализуйте аккуратно, следя за переполнением (используйте long) и знаком/краевыми случаями
    - Явно обработайте вырожденные входы (ноль, отрицательные значения, коллинеарные точки)
    - Проверьте формулу на нескольких небольших вручную посчитанных примерах, прежде чем доверять ей
    commonMistakes:
    - Переполнение целых чисел из-за неиспользования long для промежуточных произведений или сумм
    - Пропущенные краевые случаи вроде нуля, отрицательных чисел или вырожденных геометрических фигур
    - Неверное переизобретение известной формулы (НОД, быстрое возведение в степень) вместо использования
      стандартной рекурсивной/итеративной формы
    - Не проверить выведенное тождество на небольшом примере вручную перед кодированием общего случая
    whenNotToUse:
    - Задача фундаментально про организацию данных или поиск, а не про числовое/геометрическое тождество
    - Прямолинейный числовой подход уже достаточно быстр при заданных ограничениях входа, так что хитрое
      тождество добавляет риск без реальной выгоды
    problems:
      pow-x-n:
        example: "Вход: 2, 10 → 1024"
        title: Pow(x, n)
        summary: Эффективно вычислите x в степени n через быстрое возведение в степень.
        whenToUse: Быстрое возведение в степень повторным возведением в квадрат; уменьшайте показатель
          вдвое на каждом шаге вместо n умножений.
        hints:
        - "Как чётный показатель сжимается и что вы снимаете, когда он нечётный?"
        - "Возведение базы в квадрат делит чётный показатель пополам, а отрицательный показатель — это обратная величина положительного."
        - "Если n чётно, x^n = (x*x)^(n/2); если нечётно, сначала выделите один множитель x. Обрабатывайте отрицательное n как 1 / x^(-n), и следите за переполнением Integer.MIN_VALUE при смене знака."
      gcd-of-strings:
        example: "Вход: \\\"ABCABC\\\", \\\"ABC\\\" → ABC"
        title: НОД строк
        summary: Найдите наибольшую строку, которая делит обе из двух заданных строк.
        whenToUse: Сначала проверьте str1+str2 == str2+str1, затем возьмите подстроку длиной gcd(len1,
          len2).
        hints:
        - "Что должно быть истинным, прежде чем общий префикс сможет делить обе строки?"
        - "Строки делят строку-делитель, только когда любой порядок склейки даёт одну и ту же строку."
        - "Две строки имеют общую строку-делитель, только если их конкатенация в любом порядке даёт одинаковый результат. Если проверка пройдена, ответ - префикс длиной gcd(str1.length(), str2.length())."
      sqrt:
        example: "Вход: 8 → 2"
        title: Sqrt(x)
        summary: Целочисленный квадратный корень из x (округление вниз).
        whenToUse: Бинарный поиск по пространству возможных ответов.
        hints:
        - "Какое наибольшее целое, чей квадрат не превосходит x?"
        - "Поиск держит наибольшую середину, чей квадрат всё ещё ≤ x."
        - "Ищите такое mid, что mid*mid <= x Следите за переполнением, используя long"
      integer-to-roman:
        example: "Вход: 1994 → MCMXCIV"
        title: Число в римскую запись
        summary: Преобразуйте целое число в римскую запись.
        whenToUse: Жадное вычитание наибольших римских значений, включая вычитаемые комбинации.
        hints:
        - "Какое значение символа — наибольшее, которое ещё можно вычесть?"
        - "Число уменьшается на наибольшее табличное значение, которое ещё влезает, и этот символ дописывается."
        - "Используйте таблицу значений 1000, 900, 500, 400, ... Добавляйте символ, пока num >= текущего значения"
      max-points-line-math:
        example: "Вход: [0, 1], [1, 0], [0, -1], [-1, 0] → true"
        title: Проверка квадрата
        summary: Проверьте, образуют ли четыре точки квадрат.
        whenToUse: 'Расстояния: две равные диагонали, четыре равные стороны, ни одно расстояние не равно
          нулю.'
        hints:
        - "Какие расстояния должны совпасть, чтобы четыре точки были квадратом?"
        - "Четыре равные стороны и две равные диагонали, измеренные квадратом длины, достаточны, и порядок точек не важен."
        - "Вычислите все 6 попарных квадратов расстояний Нужны 4 равные стороны и 2 равные диагонали"
      max-points-on-a-line:
        example: "Вход: [[1, 1], [2, 2], [3, 3], [4, 4], [1, 2]] → 4"
        title: Максимум точек на прямой
        summary: "Сколько максимум точек лежит на одной прямой."
        whenToUse: "Для каждой точки-начала считайте наклоны сокращёнными дробями."
