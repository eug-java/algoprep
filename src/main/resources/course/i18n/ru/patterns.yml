  TRIE:
    constraints: "Ребро — один символ. Дальше обход insert и search."
    followUp: "А если алфавит — Unicode, а не 26 букв?"
    title: Бор (Trie)
    subtitle: Префиксное дерево для словарей, автодополнения и поиска по общим префиксам
    intuition: Бор объединяет общие префиксы многих слов в единой древовидной структуре, поэтому слова
      с одинаковым началом буквально разделяют один и тот же путь от корня - это делает поиск по префиксу,
      автодополнение и поиск в словаре зависящими по времени от длины слова, а не от количества хранимых
      слов.
    recognition: Задаче нужны повторяющиеся запросы по префиксу к фиксированному словарю слов - реализация
      бора, поиск слов II (несколько слов в сетке), замена слов их кратчайшим корнем в словаре, либо подсказки
      автодополнения.
    walkthrough: Спроектируйте узел бора с картой потомков (или массивом фиксированного размера по символу)
      и булевым флагом, отмечающим, заканчивается ли на этом узле полное слово. Для вставки слова проходите
      посимвольно от корня, создавая новый дочерний узел, когда текущего символа ещё нет, и отмечайте
      флаг конца слова у последнего узла как true. Для поиска точного слова проходите так же, но возвращайте
      true, только если и дошли до конца слова, и флаг конца слова установлен - одно лишь достижение последнего
      символа доказывает существование префикса, но не всего слова. Для запросов startsWith/префикса проверка
      идентична, но флаг конца слова полностью пропускается. Для задач поиска слов в сетке сначала постройте
      бор из всех целевых слов, затем выполняйте DFS по сетке одновременно с продвижением по бору, отсекая
      любой путь по сетке, для которого нет соответствующего пути в боре - это разделяет работу между
      всеми целевыми словами вместо поиска каждого независимо.
    telltaleSigns:
    - Много повторяющихся запросов по префиксу к одному фиксированному словарю
    - Реализация бора / автодополнения / подсказок при вводе
    - Поиск слов в сетке сразу для нескольких словарных слов
    - Замена слов их кратчайшим совпадающим корнем из словаря
    templateSteps:
    - Спроектируйте узел с картой/массивом потомков и флагом конца слова
    - 'Вставка: проходите посимвольно, создавая недостающие дочерние узлы, затем отметьте флаг конца'
    - 'Поиск: проходите так же, но требуйте и полного прохода, и установленного флага конца'
    - 'StartsWith: проходите так же, но пропускайте проверку флага конца'
    - Для поиска в сетке выполняйте DFS по сетке и бору одновременно, отсекая пути без соответствующего
      узла бора
    commonMistakes:
    - Путать search() (нужен флаг конца слова) с startsWith() (флаг не нужен)
    - Не разделять бор между несколькими целевыми словами в задачах поиска слов, теряя главное преимущество
      паттерна
    - Использовать массив фиксированных 26 букв, когда алфавит на самом деле больше (юникод, разный регистр)
    - Забыть отметить или проверить флаг конца слова, из-за чего префиксы засчитываются как полные совпадения
    whenNotToUse:
    - Нужно всего несколько разовых сравнений строк - построение бора даёт больше накладных расходов,
      чем простой поиск в множестве/карте
    - Память сильно ограничена, а словарь большой, ведь бор может использовать значительно больше памяти,
      чем хеш-множество тех же слов
    problems:
      implement-trie:
        title: Реализация бора (Trie)
        summary: Реализуйте операции insert, search и startsWith для бора.
        whenToUse: Базовый АТД бора, на котором строятся все остальные задачи с бором.
        hints:
        - "Какой префикс общий, и где это слово ответвляется?"
        - "Каждое ребро — один символ; слово кончается только в узле с пометкой конца."
        - "Каждому узлу нужна карта потомков и булев флаг конца слова. search() требует, чтобы флаг конца был true; startsWith() - нет."
      word-break-dict:
        title: Лишние символы в строке (словарь-бор)
        summary: Найдите минимальное число лишних символов, оставшихся после разбиения строки на слова
          из словаря.
        whenToUse: DP по позициям строки, использующий бор для быстрой проверки, какие слова словаря начинаются
          в каждой позиции.
        hints:
        - "Какой префикс общий, и где это слово ответвляется?"
        - "Каждое ребро — один символ; слово кончается только в узле с пометкой конца."
        - "dp[i] = минимальное число лишних символов для подстроки, начинающейся с i. В каждой позиции пробуйте каждое слово словаря, совпадающее как префикс через бор, затем рекурсия дальше."
      replace-words:
        title: Замена слов корнями
        summary: Замените слова их кратчайшим корнем из словаря.
        whenToUse: Trie из корней слов; проходите по каждому слову до метки конца.
        hints:
        - "Какой префикс общий, и где это слово ответвляется?"
        - "Каждое ребро — один символ; слово кончается только в узле с пометкой конца."
        - "Вставьте все корни в Trie Остановитесь на первой встреченной метке конца слова"
      word-search-ii:
        title: Поиск слов II
        summary: Найдите все слова словаря на доске, составляемые из соседних клеток.
        whenToUse: Trie из слов словаря вместе с DFS-обходом доски и отсечением.
        hints:
        - "Какой префикс общий, и где это слово ответвляется?"
        - "Каждое ребро — один символ; слово кончается только в узле с пометкой конца."
        - "Постройте Trie из всех слов словаря Удаляйте найденное слово из Trie, чтобы избежать повторов"
      longest-common-prefix:
        title: Наибольший общий префикс
        summary: Find the longest common prefix among strings.
        whenToUse: Trie of words or vertical scan until mismatch.
        hints:
        - "Какой префикс общий, и где это слово ответвляется?"
        - "Каждое ребро — один символ; слово кончается только в узле с пометкой конца."
        - "Compare characters column by column Stop at first mismatch or end of a word"
  HASH_MAPS:
    constraints: "Обычно n до 1e5, вложенный перебор уже не ответ."
    followUp: "А если массив — поток и хранить каждое значение нельзя?"
    title: Хеш-карты
    subtitle: O(1) в среднем на поиск дополнений, частот и префиксных сумм
    intuition: Хеш-карта обменивает немного памяти на поиск за O(1) в среднем, позволяя запомнить уже
      увиденное (или нужное) и мгновенно сравнить это с будущими элементами при проходе, вместо пересканирования
      всего входа на каждый запрос. Этот единственный приём - сохранять при сканировании, проверять нужное
      по сохранённому - решает удивительно большую долю задач лёгкой и средней сложности.
    recognition: Задаче нужна быстрая проверка дополнения/принадлежности (two sum), текущий подсчёт или
      группировка (сумма подмассива равна K, группировка анаграмм), либо отображение между двумя связанными
      значениями (изоморфные строки) - обычно решается за один линейный проход.
    walkthrough: Прежде чем писать код, решите, что именно должны представлять ключ и значение карты для
      этой задачи - именно это решение определяет почти всё остальное. Для задач поиска пары вроде two
      sum ключ - это увиденное значение, а значение - его индекс, проверяемый против 'target минус текущий
      элемент' на каждом шаге. Для задач подсчёта/частоты ключ - это значение или производная сигнатура,
      а значение - текущий счётчик, увеличиваемый при сканировании. Для задач в стиле префиксных сумм,
      как 'сумма подмассива равна K', ключ - текущая префиксная сумма, а значение - сколько раз эта сумма
      встречалась, что позволяет ответить 'сколько более ранних префиксов равны currentSum - K' за O(1)
      на шаг. Во всех случаях осознанно выбирайте правильный порядок 'сначала проверить, потом обновить'
      - обычно сначала проверка, затем вставка, чтобы избежать использования текущего элемента как ответа
      для самого себя.
    telltaleSigns:
    - Нужна быстрая проверка принадлежности, частоты или дополнения при одном проходе
    - Вопросы в стиле two sum - 'существует ли дополнение'
    - Задачи с префиксной суммой и подсчётом вхождений (сумма подмассива равна K)
    - Группировка или отображение между связанными значениями (изоморфные строки, группировка анаграмм)
    templateSteps:
    - Точно определите, что представляют ключ и значение карты для этой задачи
    - Пройдите вход один раз, сначала проверяя текущий элемент по карте
    - Обновите карту вкладом текущего элемента (счётчик, индекс, префиксная сумма)
    - Осознанно выберите порядок 'проверка-затем-обновление', чтобы избежать ошибок самосовпадения
    - Верните накопленный ответ по завершении прохода
    commonMistakes:
    - Обновлять карту до проверки, из-за чего элемент неверно совпадает сам с собой
    - Использовать не тот ключ (сырое значение вместо производной сигнатуры, или наоборот)
    - Забыть инициализировать карты в стиле префиксных сумм базовой записью (например, префиксная сумма
      0 встречается один раз)
    - Считать операции хеш-карты гарантированно O(1) в худшем случае, хотя плохая хеш-функция или сильные
      коллизии могут снизить производительность
    whenNotToUse:
    - Задаче нужны элементы в отсортированном порядке или запросы по диапазону - тогда TreeMap подходит
      лучше обычной хеш-карты
    - Память сильно ограничена, а диапазон значений достаточно мал, чтобы массив фиксированного размера
      работал не хуже
    problems:
      two-sum:
        title: Two Sum
        summary: Верните индексы двух чисел в массиве, дающих в сумме target.
        whenToUse: Карта значение-индекс при сканировании; проверяйте дополнение перед вставкой текущего
          значения.
        hints:
        - "Что вы уже видели такого, что ответит на текущий элемент за константное время?"
        - "Таблица хранит дополнение или счётчик всего, что встретилось до текущего индекса."
        - "Для каждого числа проверьте, есть ли уже target - число в карте. Вставляйте индекс текущего числа только после проверки, чтобы избежать совпадения элемента с самим собой."
      subarray-sum-equals-k:
        title: Сумма подмассива равна K
        summary: Посчитайте число непрерывных подмассивов, элементы которых суммируются в K.
        whenToUse: Текущая префиксная сумма плюс карта, сколько раз встречалось каждое значение префиксной
          суммы.
        hints:
        - "Что вы уже видели такого, что ответит на текущий элемент за константное время?"
        - "Таблица хранит дополнение или счётчик всего, что встретилось до текущего индекса."
        - "Инициализируйте карту записью 'префиксная сумма 0 встретилась один раз' для подмассивов, начинающихся с индекса 0. На каждом шаге прибавляйте map.get(currentSum - K) к ответу перед обновлением карты значением currentSum."
      isomorphic-strings:
        title: Изоморфные строки
        summary: Проверьте, изоморфны ли строки s и t через биекцию символов.
        whenToUse: Две хеш-таблицы (или таблица плюс множество) для прямого и обратного отображения.
        hints:
        - "Что вы уже видели такого, что ответит на текущий элемент за константное время?"
        - "Таблица хранит дополнение или счётчик всего, что встретилось до текущего индекса."
        - "Стройте отображение s→t и следите за его согласованностью Также следите, чтобы два разных символа s не отображались в один и тот же символ t"
      longest-consecutive-already:
        title: Непрерывный массив
        summary: Максимальная длина непрерывного подмассива с равным количеством нулей и единиц.
        whenToUse: Префиксный баланс плюс карта первых позиций встреченных значений баланса.
        hints:
        - "Что вы уже видели такого, что ответит на текущий элемент за константное время?"
        - "Таблица хранит дополнение или счётчик всего, что встретилось до текущего индекса."
        - "Считайте 0 как -1 Если такой баланс уже встречался — обновите максимальную длину"
      four-sum-ii:
        title: 4Sum II
        summary: Посчитайте количество кортежей (i,j,k,l) с нулевой суммой по четырём массивам.
        whenToUse: Захешируйте все суммы A+B, затем ищите -(C+D).
        hints:
        - "Что вы уже видели такого, что ответит на текущий элемент за константное время?"
        - "Таблица хранит дополнение или счётчик всего, что встретилось до текущего индекса."
        - "Постройте карту сумма→количество для первых двух массивов Для каждой суммы c+d ищите значение -(c+d) в карте"
  KNOWING_WHAT_TO_TRACK:
    constraints: "Назовите одно число или запись в словаре, из-за которой остальной проход O(1)."
    followUp: "А если гарантию убрали: большинства нет, значения не только 0 и 1?"
    title: Знание, что отслеживать
    subtitle: Решайте задачи за один проход, определив правильные текущие счётчики
    intuition: 'Удивительно много задач на интервью решаются вовсе не хитрым алгоритмом - они решаются,
      как только вы определите одну-две важные текущие статистики и будете обновлять их инкрементально
      при сканировании, вместо пересчёта с нуля. Этот паттерн меньше про фиксированный шаблон и больше
      про привычку спрашивать: ''какой небольшой кусочек состояния, обновляемый за O(1) на шаг, позволил
      бы ответить за один проход?'''
    recognition: Задачу можно решить за один проход, если отслеживать правильные счётчики или состояние
      - мажоритарный элемент (кандидат и счётчик), самая длинная последовательность подряд идущих чисел
      (начинать подсчёт только с начал последовательностей), или отслеживание 'не более K типов' в стиле
      'фрукты в корзины'.
    walkthrough: 'Прежде чем обращаться к известному паттерну, явно спросите, какое небольшое состояние,
      если отслеживать и обновлять его при сканировании, позволило бы ответить без оглядки назад. Для
      мажоритарного элемента это одно значение-кандидат и текущий счётчик (голосование Бойера-Мура): увеличивайте
      при виде кандидата, уменьшайте иначе, и меняйте кандидата, когда счётчик достигает нуля. Для самой
      длинной последовательности подряд идущих чисел суть в том, чтобы начинать подсчёт последовательности
      только с числа, у которого нет предшественника в множестве - так каждое число посещается ограниченное
      число раз в целом, несмотря на вид вложенных циклов. Определив отслеживаемое состояние, проверьте
      на паре примеров вручную, что его инкрементальное обновление действительно сохраняет достаточно
      информации для верного ответа, ведь главный риск этого паттерна - обнаружить на середине пути, что
      не хватает ещё одного кусочка состояния.'
    telltaleSigns:
    - Один линейный проход сработал бы, если отслеживать правильный небольшой кусочек состояния
    - Вопросы про большинство/порог частоты (встречается более n/2 раз и т.п.)
    - '''Самая длинная последовательность подряд'' или похожий подсчёт на основе последовательностей'
    - Отслеживание 'не более K типов'/'не более K уникальных' без явной формулировки скользящего окна
    templateSteps:
    - Определите минимальное состояние, которое нужно отслеживать для ответа на вопрос
    - Решите правило обновления за O(1) для этого состояния при обработке каждого элемента
    - Пройдите один раз, применяя правило обновления и проверяя/фиксируя ответ по необходимости
    - Проверьте на примерах вручную, что дополнительное состояние незаметно не требуется
    - Избегайте пересчёта с нуля - всегда обновляйте инкрементально
    commonMistakes:
    - Пересчитывать счётчики или состояние с нуля на каждой итерации вместо инкрементального обновления
    - Пропустить краевой случай, требующий ещё одного кусочка отслеживаемого состояния сверх изначально
      запланированного
    - Применять голосование Бойера-Мура без обязательного проверочного прохода, когда большинство не гарантировано
      существует
    - Путать 'начала последовательностей' со 'всеми элементами', когда трюк опирается на ограниченное
      число посещений каждого числа
    whenNotToUse:
    - Связи между элементами недостаточно просты, чтобы свестись к небольшому фиксированному набору текущих
      счётчиков
    - Сортировка или структура данных (куча, хеш-карта) более естественно захватывают нужное состояние,
      чем импровизированные счётчики
    problems:
      majority-element:
        title: Мажоритарный элемент
        summary: Найдите элемент, встречающийся более n/2 раз в массиве.
        whenToUse: 'Голосование Бойера-Мура: отслеживайте один кандидат и счётчик вместо полной частотной
          карты.'
        hints:
        - "Какое одно число, если обновлять его на каждом шаге, делает остальную историю ненужной?"
        - "Отслеживаемого значения хватает для ответа; весь проход хранить не нужно."
        - "Увеличивайте счётчик, когда текущее число совпадает с кандидатом, иначе уменьшайте. Когда счётчик достигает нуля, смените кандидата на текущее число."
      longest-consecutive:
        title: Самая длинная последовательность подряд
        summary: Найдите длину самой длинной последовательности идущих подряд целых чисел в неотсортированном
