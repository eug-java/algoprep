        hints:
        - "Сколько кандидатов могут одновременно превышать n/3?"
        - "Два слота кандидатов и их счётчики гасят третье отличное значение, а выживших всё равно нужно точно пересчитать."
        - "Ответов может быть не больше двух Проверьте фактические счётчики за второй проход"
      maximum-gap:
