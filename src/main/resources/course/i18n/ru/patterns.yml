        whenToUse: Извлеките рёбра графа из соседних слов и примените топологическую сортировку.
        hints:
        - "У какой вершины не осталось предусловий, и что освобождается, когда вы её завершаете?"
        - "Вершина попадает в порядок только когда её входная степень становится нулём."
        - "Сравнивайте соседние пары слов по первому отличающемуся символу Недопустимо, если более длинное слово стоит перед своим префиксом"
      verify-alien-dictionary:
        title: Проверка инопланетного словаря
        summary: Check whether words are sorted by a given alien alphabet order.
        whenToUse: Compare adjacent words using a custom alphabet ranking.
        hints:
        - "У какой вершины не осталось предусловий, и что освобождается, когда вы её завершаете?"
        - "Вершина попадает в порядок только когда её входная степень становится нулём."
