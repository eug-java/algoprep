  SORT_AND_SEARCH:
    constraints: "Сортировка законна, только если исходный порядок не нужен."
    followUp: "Сколько стоит сортировка и убирает ли её хеш-таблица?"
    title: Сортировка и поиск
    subtitle: Сортируйте по правильному ключу, чтобы открыть путь к сравнению соседей или бинарному поиску
    intuition: 'Многие на вид сложные задачи упрощаются, стоит отсортировать данные по правильному ключу:
      сортировка выявляет структуру - равные или связанные элементы оказываются рядом, а поиск в отсортированных
      данных падает с O(n) до O(log n). Навык здесь - распознать, по какому ключу сортировать (не обязательно
      по сырому значению) и что это открывает - группировку, сравнение соседей или бинарный поиск.'
    recognition: Задача не подходит под конкретный классический паттерн, но сортировка по удачно выбранному
      ключу (нормализованная строка, координата, соотношение) превращает её в простую задачу сравнения
      соседей или бинарного поиска.
    walkthrough: Спросите себя, какой ключ при сортировке сблизит связанные элементы или откроет полезный
      порядок - для группировки анаграмм это отсортированные по алфавиту буквы каждого слова; для расписаний
      - время начала или конца; для подсказок поиска - простой лексикографический порядок списка товаров.
      Отсортируйте один раз по этому ключу, приняв стоимость O(n log n) заранее. Затем либо выполните
      один линейный проход со сравнением соседних элементов (для группировки/подсчёта), либо запустите
      бинарный поиск для каждого запроса (для повторных поисков), а не пересканируйте весь набор данных
      при каждом запросе. Когда нужен пользовательский компаратор, напишите его явно и проверьте на хитрой
      паре элементов перед встраиванием в полную сортировку, так как едва заметно неверный компаратор
      молча выдаёт неверные группировки или результаты поиска.
    telltaleSigns:
    - Естественный порядок входа не важен для корректности ответа
    - Удачно выбранный ключ сортировки превращает задачу в сравнение соседей или бинарный поиск
    - Нужен пользовательский компаратор (по сигнатуре строки, по соотношению, по производному значению)
    - Повторные поиски в наборе данных, не меняющемся между запросами
    templateSteps:
    - Определите ключ, который при сортировке полезно группирует или упорядочивает данные
    - Отсортируйте один раз по этому ключу (с пользовательским компаратором при необходимости)
    - Сканируйте соседей для группировки/подсчёта, либо выполняйте бинарный поиск для каждого запроса
    - Используйте хеш-карту вместе с сортировкой при группировке по ключу сортировки
    - Проверьте компаратор на специально подобранной хитрой паре, прежде чем доверять полной сортировке
    commonMistakes:
    - Сортировать по сырому значению, когда на самом деле важен производный ключ (сигнатура, соотношение)
    - Написать компаратор с непоследовательным (нетранзитивным) порядком, дающий едва заметно неверную
      сортировку
    - Пересортировывать при каждом запросе вместо однократной сортировки и переиспользования результата
    - Забыть про требования стабильности, когда задача требует сохранения исходного порядка при равенстве
    whenNotToUse:
    - Данные должны оставаться в исходном порядке для корректности (сортировка уничтожит нужную информацию)
    - Сортировка стоит дороже, чем допускает требуемая временная сложность (например, цель O(n) без способа
      избежать полной сортировки)
    problems:
      group-anagrams:
        title: Группировка анаграмм
        summary: Сгруппируйте массив строк так, чтобы все взаимные анаграммы оказались вместе.
