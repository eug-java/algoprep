patterns:
  TWO_POINTERS:
    constraints: "После допустимой сортировки интересная граница — линейная, не квадрат."
    followUp: "А если нужны исходные индексы и сортировать нельзя?"
    title: Два указателя
    subtitle: Двигайте два индекса навстречу цели в отсортированных массивах, строках или списках
    intuition: 'Если наивное решение сравнивает все пары вложенными циклами, стоит спросить: не позволит
      ли предварительная сортировка заменить внутренний цикл двумя индексами - идущими навстречу друг
      другу или в одну сторону с разной скоростью? Два указателя используют монотонность отсортированных
      данных: пока один конец диапазона растёт, другой может только сжиматься, поэтому каждый указатель
      проходит массив один раз, и суммарно получается O(n) вместо O(n^2).'
    recognition: Массив отсортирован или его дёшево отсортировать, нужно найти пару/тройку с заданной
      суммой, требуется развернуть или разбить данные на месте, либо сравниваются символы с обоих концов
      строки.
    walkthrough: Сначала выясните, отсортирован ли массив; если нет - решите, допустима ли сортировка
      при заданных ограничениях, ведь она стоит O(n log n), но часто открывает путь к O(n) далее. Для
      задач на сумму пары поставьте один указатель в начало, другой в конец; для сжатия на месте используйте
      два указателя, идущих вперёд с разной скоростью. На каждом шаге сравнивайте значения под указателями
      с целью и двигайте только тот указатель, который приближает к ответу - это и есть инвариант, гарантирующий,
      что верный ответ не будет пропущен. Проговорите этот инвариант интервьюеру перед кодом, реализуйте
      чёткое условие остановки (например, пересечение указателей) и прогоните вручную небольшой пример
      с дубликатами и краевыми случаями.
    telltaleSigns:
    - Массив отсортирован, либо сортировка заранее допустима и недорога
    - Нужно найти пару, тройку или четвёрку элементов с заданной суммой или соотношением
    - Требуется развернуть, разбить или убрать дубликаты на месте с O(1) дополнительной памяти
    - Две позиции движутся навстречу друг другу, либо пара медленный/быстрый указатель идёт в одну сторону
    - В условии прямо сказано "на месте" и запрещены дополнительные массивы
    templateSteps:
    - Отсортируйте вход, если порядок не гарантирован и сортировка не ломает условие задачи
    - Поставьте указатели на оба конца (встречное движение) или оба в начало (движение в одну сторону)
    - Сравнивайте значения под указателями с целью/инвариантом и двигайте только полезный указатель
    - Пропускайте повторяющиеся значения у каждого указателя, если результат должен быть уникальным
    - Остановитесь, когда указатели пересеклись или окно стало недопустимым
    commonMistakes:
    - Забыть пропустить дубликаты значений, из-за чего в ответе появляются повторяющиеся пары/тройки
    - Двигать оба указателя на каждом шаге вместо только того, что исправляет сравнение
    - Сортировать массив, когда задача требует сохранить исходные индексы или порядок
    - Ошибка на единицу в условии пересечения (left <= right вместо left < right и наоборот)
    whenNotToUse:
    - Массив нельзя сортировать, так как нужно сохранить исходные индексы/порядок (лучше хеш-таблица)
    - Связь между элементами немонотонна, поэтому движение указателя не сужает пространство поиска надёжно
    problems:
      pair-with-target-sum:
        example: "Вход: [1, 2, 3, 4], 6 → [1, 3]"
        title: Пара с заданной суммой
        summary: Найдите индексы двух чисел в отсортированном массиве, дающих в сумме целевое значение.
        whenToUse: Отсортированный массив плюс поиск пары с суммой - классический сигнал для встречных
          двух указателей.
        hints:
        - "Какой конец можно отбросить, если эта пара не попала в цель?"
        - "Подходящая пара, если она есть, всё ещё строго между двумя индексами."
        - "Поставьте left на индекс 0, а right - на n-1. Если сумма меньше цели - сдвиньте left вправо; если больше - сдвиньте right влево."
      remove-duplicates:
        example: "Вход: [2, 3, 3, 6, 9, 9] → 4"
        title: Удаление дубликатов из отсортированного массива
        summary: Сожмите отсортированный массив на месте так, чтобы каждый элемент встречался один раз,
          и верните новую длину.
        whenToUse: 'Сжатие на месте: медленный указатель записи и быстрый указатель сканирования по отсортированным
          данным.'
        hints:
        - "Где следующий свободный слот для значения, которое ещё не записано?"
        - "Индекс записи стоит сразу за последним сохранённым уникальным значением."
        - "Ведите индекс записи, который двигается только при находке нового уникального значения. Быстрый указатель просматривает все элементы; медленный отмечает следующий свободный слот."
      triplet-sum-zero:
        example: "Вход: [-3, 0, 1, 2, -1, 1, -2] → [[-3, 1, 2], [-2, 0, 2], [-2, 1, 1], [-1, 0, 1]]"
        title: Тройка с суммой ноль
        summary: Найдите все уникальные тройки чисел в массиве, сумма которых равна нулю.
        whenToUse: Отсортируйте, зафиксируйте один индекс как якорь, затем ищите пару двумя указателями
          в оставшейся части.
        hints:
        - "Когда одно число зафиксировано, какую цель должны дать два других?"
        - "Для фиксированного якоря подходящая пара всё ещё лежит справа от него."
        - "Сначала отсортируйте массив - это делает возможными и два указателя, и пропуск дубликатов. Зафиксировав nums[i], ищите пару с суммой -nums[i] в оставшейся части массива. Пропускайте повторяющиеся значения для i, left и right, чтобы избежать дублирующихся троек."
      container-with-most-water:
        example: "Вход: [1, 8, 6, 2, 5, 4, 8, 3, 7] → 49"
        title: Сосуд с наибольшим количеством воды
        summary: Найдите две линии, образующие сосуд с максимальной площадью воды.
        whenToUse: 'Два конца линии высот; площадь = min(высота)*ширина, поэтому сдвигайте более короткий указатель внутрь.'
        hints:
        - "Какая сторона уже не может увеличить площадь?"
        - "Лучшая площадь не меньше любого сосуда, который ещё использует короткую сторону, которую вы собираетесь покинуть."
        - "Начните с left=0 и right=n-1 — самый широкий контейнер как первый кандидат. Площадь = min(h[left], h[right]) * (right-left). Запоминайте максимум. Только сдвиг более короткой стороны может улучшить min-высоту; сдвиг высокой стороны не помогает."
      dutch-national-flag:
        example: "Вход: [1, 0, 2, 1, 0] → [0, 0, 1, 1, 2]"
        title: Голландский флаг / Сортировка цветов
        summary: Отсортируйте массив из 0/1/2 на месте за один проход.
        whenToUse: Трёхстороннее разбиение с указателями low/mid/high.
        hints:
        - "Какая область уже готова и какой индекс ещё неизвестен?"
        - "Всё до low — нули, всё после high — двойки, mid — первый неразобранный индекс."
        - "Поддерживайте инвариант: [0..low) — нули, (high..n] — двойки Меняйте mid местами с low или high в зависимости от значения"
      quadruple-sum:
        example: "Вход: [4, 1, 2, -1, 1, -3], 1 → [[-3, -1, 1, 4], [-3, 1, 1, 2]]"
        title: Четвёрка чисел с заданной суммой
        summary: Найдите все уникальные четвёрки чисел, сумма которых равна целевому значению.
        whenToUse: Отсортируйте массив, зафиксируйте два индекса, а оставшуюся пару ищите двумя указателями.
        hints:
        - "Когда два числа зафиксированы, какую парную сумму ещё искать?"
        - "Оставшаяся пара, если она есть, лежит между внутренними индексами, а повторы на каждом уровне пропускаются."
        - "Сначала отсортируйте и пропускайте дубликаты на каждом уровне Для внутренней пары используйте классические два указателя"
  FAST_SLOW_POINTERS:
    constraints: "Вслух стоит сказать ограничение O(1) дополнительной памяти."
    followUp: "А если список можно менять, и если нельзя?"
    title: Быстрый и медленный указатели
    subtitle: Находите циклы и середины, двигая два указателя с разной скоростью
    intuition: 'Представьте двух бегунов на круговой трассе: быстрый пробегает два шага за каждый шаг
      медленного. Если трасса замкнута в цикл, быстрый рано или поздно догонит медленного - это докажет
      наличие цикла без подсчёта длины трассы. Тот же трюк со скоростью находит середину связного списка:
      когда быстрый указатель достигает конца, медленный стоит ровно посередине.'
    recognition: Задача про связный список или про последовательность, заданную повторным применением
      функции (например, сумма квадратов цифр), где нужно найти цикл, середину или понять, повторяется
      ли значение, не зная заранее длину.
    walkthrough: Инициализируйте slow и fast головой списка, затем на каждой итерации двигайте slow на
      один узел, а fast - на два. Если fast достигает null, не встретив slow, цикла нет - возвращайте
      результат сразу. Если указатели встретились, цикл подтверждён; для поиска точки входа в цикл сбросьте
      один указатель к голове и двигайте оба по одному узлу до новой встречи - по математике алгоритма
      Флойда это будет ровно начало цикла. Для поиска середины просто остановитесь, когда fast дойдёт
      до конца - slow окажется на середине; проверьте это на паре примеров вручную.
    telltaleSigns:
    - Обнаружение цикла в связном списке или функциональном графе
    - Нужно найти середину без отдельного прохода для подсчёта длины
    - Последовательность от повторного применения функции (например, Happy Number), которая может зациклиться
    - Проверка палиндромности связного списка через разворот второй половины
    - Интервьюер запрещает O(n) дополнительной памяти для задачи со связным списком
    templateSteps:
    - Инициализируйте slow = head и fast = head
    - Цикл, пока fast и fast.next не равны null
    - На каждой итерации двигайте slow на один узел, а fast - на два
    - При встрече указателей сделайте вывод (цикл найден / середина найдена)
    - Для точки входа в цикл сбросьте один указатель к голове и двигайте оба по одному узлу до встречи
    commonMistakes:
    - Забыть проверить fast.next на null перед обращением к нему - NullPointerException
    - Перепутать, какой указатель окажется в середине для чётной и нечётной длины списка
    - Не сбросить указатель к голове, когда нужна именно точка входа в цикл, а не факт его наличия
    - Применять быстрый/медленный указатель там, где на самом деле нужен произвольный доступ (лучше массив)
    whenNotToUse:
    - Нужен индексированный/произвольный доступ к элементам, а не последовательный обход
    - У структуры нет понятия 'следующий шаг' или разницы скоростей, чтобы указатели расходились
    problems:
      linked-list-cycle:
        example: "Вход: [1, 2, 3, 4] → false"
        title: Цикл в связном списке
        summary: Определите, содержит ли связный список цикл.
        whenToUse: Алгоритм Флойда даёт O(1) памяти там, где хеш-множество стоило бы O(n).
        hints:
        - "Что докажет встреча двух обходчиков и что докажет null?"
        - "Если быстрый дошёл до null, цикла нет; встреча значит, что ссылки замыкаются."
        - "Если fast встречает slow - цикл есть. Если fast достигает null - список без цикла."
      middle-of-linked-list:
        example: "Вход: [1, 2, 3, 4, 5] → [3, 4, 5]"
        title: Середина связного списка
        summary: Верните средний узел (второй из двух середин при чётной длине).
        whenToUse: fast достигает конца ровно тогда, когда slow оказывается в середине - подсчёт длины
          не нужен.
        hints:
        - "Когда быстрый обходчик кончает узлы, где стоит медленный?"
        - "Медленный сделал вдвое меньше шагов, чем быстрый, и стоит на середине."
        - "В одном цикле двигайте fast на два узла, slow - на один. Когда fast равен null или fast.next равен null, ответом будет slow."
      happy-number:
        example: "Вход: 23 → true"
        title: Счастливое число
        summary: Определите, приводит ли повторное суммирование квадратов цифр к 1.
        whenToUse: Преобразование через квадраты цифр образует функциональный граф; цикл без 1 означает
          'несчастливое' число.
        hints:
        - "Что повторится, если цепочка квадратов цифр так и не дойдёт до 1?"
        - "Последовательность сумм квадратов цифр либо приходит в 1, либо зацикливается."
        - "Считайте 'следующее значение' одним шагом по неявной структуре. Примените fast/slow к этой последовательности, чтобы найти цикл без 1."
      cycle-start:
        example: "Вход: 1 → 2 → (назад к 2) → 2"
        title: Начало цикла в связном списке
        summary: Верните узел, с которого начинается цикл, либо null, если цикла нет.
        whenToUse: Встреча указателей по алгоритму Флойда, затем сброс одного указателя в начало.
        hints:
        - "После встречи какой узел одинаково далеко от головы и от точки встречи?"
        - "Если вернуть одного к голове и шагать обоим по одному, они встретятся у входа в цикл."
        - "После встречи переставьте один указатель в начало списка Двигайте оба указателя по одному шагу, пока они снова не встретятся"
      palindrome-linked-list:
        example: "Вход: 1 → 2 → 2 → 1 → true"
        title: Список-палиндром
        summary: Проверьте, читается ли связный список одинаково вперёд и назад.
        whenToUse: Найдите середину, разверните вторую половину и сравните обе части.
        hints:
        - "Какую половину можно развернуть, чтобы сравнить половины за один проход?"
        - "Первая половина остаётся, развёрнутая вторая стыкуется с ней снаружи внутрь."
        - "Быстрый и медленный указатели для поиска середины Разверните вторую половину и сравните её с первой"
      circular-array-loop:
        example: "Вход: [1, 2, -1, 2, 2] → true"
        title: Цикл в кольцевом массиве
        summary: Обнаружьте цикл длиной больше 1 в кольцевом массиве прыжков, идущий в одном направлении.
        whenToUse: Рассматривайте индексы как функциональный граф; для каждого старта применяйте быстрый
          и медленный указатели.
        hints:
        - "Что делает прыжок незаконным, даже если индекс возвращается?"
        - "Цикл считается, только если все прыжки одного знака и длина больше одного."
        - "Отбрасывайте прыжки, меняющие направление на противоположное Помечайте посещённые индексы, чтобы не повторять работу"
  SLIDING_WINDOW:
    constraints: "Окно непрерывно. Если ограничение немонотонно, этот приём не подходит."
    followUp: "Что меняется, если в массиве есть отрицательные и сжатие окна уже не чинит сумму?"
    title: Скользящее окно
    subtitle: Поддерживайте непрерывное окно, которое растёт и сжимается под ограничение
    intuition: Когда задача касается непрерывного подмассива или подстроки, наивный подход пересчитывает
      одно и то же перекрывающееся окно с нуля для каждого начального индекса. Скользящее окно хранит
      текущее состояние - сумму, счётчики символов, число уникальных элементов - и обновляет его инкрементально
      при расширении правой границы и сжатии левой, превращая O(n^2) в один проход O(n).
    recognition: Формулировки вроде самый длинный/короткий/максимальный непрерывный подмассив или подстрока,
      'не более K уникальных символов', поиск анаграммы/перестановки внутри строки, или фиксированный
      размер окна K.
    walkthrough: Определите, какое состояние нужно хранить - сумму, частотную карту символов или число
      уникальных элементов - и какое условие делает окно допустимым. Расширяйте окно, двигая правую границу
      и обновляя состояние на каждом шаге. Когда окно становится недопустимым (или для фиксированного
      размера - достигает K), сжимайте слева, убирая элементы из состояния, пока окно снова не станет
      допустимым, и фиксируйте лучший ответ. Повторяйте, пока правая граница не пройдёт весь вход, и явно
      объясните интервьюеру, почему каждый элемент входит и выходит из состояния ровно один раз - именно
      это даёт оценку O(n).
    telltaleSigns:
    - Непрерывный подмассив или подстрока (порядок элементов не меняется)
    - Формулировки про самое длинное/короткое/количество окон
    - Ограничение на сумму, число уникальных символов или частотную карту ('не более K уникальных')
    - В условии явно задан фиксированный размер окна K
    - Поиск анаграммы или перестановки внутри более длинной строки
    templateSteps:
    - Выберите состояние окна (сумма, частотная карта, число уникальных) и условие допустимости
    - Расширяйте окно, двигая правую границу и обновляя состояние
    - Пока окно недопустимо (или превышает фиксированный размер) - сжимайте слева и обновляйте состояние
    - Обновляйте лучший ответ, когда окно допустимо
    - Продолжайте, пока правая граница не пройдёт весь вход
    commonMistakes:
    - Неверное условие сжатия, из-за которого пропускаются допустимые окна
    - Пересчёт частотной карты с нуля вместо инкрементального обновления счётчиков
    - Ошибка на единицу при вычислении длины окна (right - left + 1)
    - Забыть обновлять лучший ответ внутри цикла сжатия, а не только после него
    whenNotToUse:
    - Подпоследовательность не обязана быть непрерывной (обычно это задача на DP или два указателя по
      отсортированным данным)
    - Допустимость окна нельзя проверить или обновить за O(1) при входе и выходе элементов
    problems:
      max-sum-subarray-k:
        example: "Вход: [2, 1, 5, 1, 3, 2], k = 3 → 9"
        title: Максимальная сумма подмассива размера K
        summary: Найдите максимальную сумму непрерывного подмассива фиксированного размера K.
        whenToUse: 'Фиксированный размер окна K: прибавляйте входящий справа элемент, убирайте уходящий
          слева.'
        hints:
        - "Что меняется, когда окно сдвигается на шаг, и что остаётся?"
        - "Сумма окна теряет уходящее значение и получает входящее; ответ — лучшая сумма."
        - "Посчитайте сумму первого окна напрямую, затем сдвигайтесь на один элемент. На каждом сдвиге достаточно одного сложения и одного вычитания, а не пересчёта суммы."
      longest-substring-k-distinct:
        example: "Вход: \\\"araaci\\\", 2 → 4"
        title: Самая длинная подстрока с K уникальными символами
        summary: Найдите длину самой длинной подстроки, содержащей не более K уникальных символов.
        whenToUse: Окно переменного размера плюс частотная карта уникальных ключей; сжимайте, когда число
          уникальных превышает K.
        hints:
        - "Когда в окне на один различный символ больше, какая сторона должна что-то отдать?"
        - "Окно допустимо ровно пока в карте частот не больше K ключей."
        - "Расширяйте окно, добавляя каждый новый символ в частотную карту. Пока в карте больше K ключей, сжимайте слева и уменьшайте/удаляйте счётчики."
      find-all-anagrams:
        example: "Вход: \\\"cbaebabacd\\\", \\\"abc\\\" → [0, 6]"
        title: Все анаграммы в строке
        summary: Верните начальные индексы всех вхождений анаграмм строки p в строке s.
        whenToUse: Фиксированное окно длины p, сравнение текущих счётчиков символов со счётчиками p.
        hints:
        - "Что одинаково в каждом окне, которое является анаграммой образца?"
        - "Окно длины образца совпадает, когда его счётчики равны счётчикам образца."
        - "Один раз постройте частотную карту для p. Двигайте окно длины p по s, сравнивая счётчики; совпадение означает начало анаграммы."
      longest-no-repeat:
        example: "Вход: \"aabccbb\" → 3"
        title: Самая длинная подстрока без повторяющихся символов
        summary: Найдите самую длинную подстроку, все символы которой уникальны.
        whenToUse: Переменное окно с картой последнего индекса символа, чтобы прыгать left мимо дубликата за O(1).
        hints:
        - "Куда должен прыгнуть левый край, если новый символ уже внутри окна?"
        - "Left стоит сразу за предыдущей копией символа справа, ответ — самая широкая такая щель."
        - "Храните map: символ → последний индекс внутри (или сразу перед) текущим окном. Если s[right] уже встречался на j ≥ left, поставьте left = j+1, чтобы окно осталось без повторов. После каждого расширения обновляйте best = max(best, right-left+1)."
      min-window-substring:
        example: "Вход: \\\"ADOBECODEBANC\\\", \\\"ABC\\\" → BANC"
        title: Минимальное окно-подстрока
        summary: Найдите наименьшую подстроку s, покрывающую все символы t.
        whenToUse: Сжимаемое окно с картами need/have, пока все нужные символы не будут удовлетворены.
        hints:
        - "Что должно стать истинным, прежде чем можно сужать?"
        - "Окно допустимо, только пока закрыт счётчик каждого нужного символа."
        - "Постройте need для t и считайте, сколько различных требуемых символов уже удовлетворено. Расширяйте right, пока окно не станет валидным (satisfied == need.size), затем сжимайте left, пока оно остаётся валидным. На каждом валидном окне сравнивайте длину с лучшим ответом и оставляйте самое короткое. При сжатии аккуратно уменьшайте have: satisfied падает только когда счётчик нужного символа стал ниже need."
  INTERVALS:
    constraints: "Сортируйте по началу, если задача не про концы. Скажите, какой вариант."
    followUp: "А если интервалы полуоткрытые или касание концов не должно сливаться?"
    title: Интервалы
    subtitle: Отсортируйте по началу и пройдите один раз, чтобы объединить, вставить или сравнить диапазоны
    intuition: 'Задачи с интервалами становятся простыми, как только вы сортируете их по началу: пересечение
      теперь может быть только между интервалом и соседними с ним в отсортированном порядке. После сортировки
      одного прохода слева направо с одной переменной ''текущий интервал'' достаточно, чтобы объединять,
      считать конфликты или искать пробелы - назад заглядывать не нужно.'
    recognition: Вход задан списком пар [начало, конец], а вопрос касается объединения, вставки, обнаружения
      конфликтов/пересечений, подсчёта переговорных комнат или поиска свободного времени между несколькими
      списками интервалов.
    walkthrough: 'Сначала отсортируйте все интервалы по началу - именно этот шаг делает остальной алгоритм
      линейным. Держите переменную ''текущий'' интервал, инициализированную первым; для остальных: если
      начало следующего интервала меньше или равно концу текущего - они пересекаются, объедините, расширив
      конец текущего до максимума обоих концов. Если пересечения нет - добавьте текущий в результат и
      сделайте следующий интервал новым текущим. Для вариантов вроде вставки интервала или свободного
      времени сотрудников адаптируйте тот же проход: интервалы строго до нового, все пересекающиеся объединяются,
      затем всё строго после. Всегда уточняйте, включены ли границы, так как это меняет оператор сравнения
      при проверке пересечения.'
    telltaleSigns:
    - Вход в виде списка пар [начало, конец]
    - Слова 'пересечение', 'объединение', 'конфликт' или 'свободное время'
    - Задачи про переговорные комнаты / расписания
    - Нужно вставить новый интервал в уже отсортированный непересекающийся список
    templateSteps:
    - Отсортируйте интервалы по началу (и по концу при равенстве начал, если нужно)
    - Держите 'текущий' открытый интервал, инициализированный первым интервалом
    - Объединяйте с текущим, когда начало следующего <= концу текущего
    - Фиксируйте текущий интервал и начинайте новый, если пересечения нет
    - Для вставки/свободного времени используйте фазы 'до' / 'пересечение' / 'после'
    commonMistakes:
    - Забыть отсортировать сначала, либо отсортировать по концу вместо начала
    - Использовать < вместо <= (или наоборот) на границе пересечения, неверно обрабатывая касающиеся интервалы
    - Не брать конец как max(current.end, next.end), а просто перезаписывать его
    - Забыть добавить последний 'текущий' интервал после завершения цикла
    whenNotToUse:
    - Интервалы уже гарантированно не пересекаются, и логика объединения не нужна
    - Нужны частые запросы 'что происходит в момент времени X' по многим интервалам (лучше дерево отрезков
      или отсортированная карта)
    problems:
      merge-intervals:
        example: "Вход: [[2, 5], [1, 3], [7, 9]] → [[1, 5], [7, 9]]"
        title: Объединение интервалов
        summary: Объедините все пересекающиеся интервалы в минимальный набор непересекающихся диапазонов.
        whenToUse: 'Классика: сортировка по началу плюс один линейный проход слияния.'
        hints:
        - "После сортировки какой предыдущий интервал текущий ещё может задеть?"
        - "Перекрываться с текущим может только последний уже слитый интервал."
        - "Прежде всего отсортируйте по началу. Сравнивайте начало каждого интервала с концом последнего объединённого."
      insert-interval:
        example: "Вход: [[1, 3], [6, 9]], [2, 5] → [[1, 5], [6, 9]]"
        title: Вставка интервала
        summary: Вставьте новый интервал в отсортированный непересекающийся список и объедините при необходимости.
        whenToUse: 'Три фазы: копирование интервалов строго до, объединение всех пересекающихся, копирование
          остальных.'
        hints:
        - "Где новый интервал начинает поглощать соседей?"
        - "До перекрытия список копируется как есть; во время перекрытия границы нового только растут."
        - "Сортировка не нужна - список уже отсортирован. Расширяйте границы нового интервала, пока он пересекается с текущим."
      conflicting-appointments:
        example: "Вход: [1,4], [2,5], [7,9] → false"
        title: Пересекающиеся встречи
        summary: Проверьте, пересекаются ли какие-либо две встречи в списке.
        whenToUse: 'Отсортируйте по началу и проверьте каждую соседнюю пару — после сортировки пересечься могут только соседи.'
        hints:
        - "После сортировки по началу какая пара единственная может столкнуться?"
        - "Столкновение есть ровно когда встреча начинается раньше, чем кончилась предыдущая."
        - "После сортировки по start пересечься могут только соседние пары. Пересечение есть, как только start следующего раньше end предыдущего."
      interval-intersection:
        example: "Вход: [[0, 2], [5, 10]], [[1, 5], [8, 12]] → [[1, 2], [5, 5], [8, 10]]"
        title: Пересечения списков интервалов
        summary: Верните пересечения двух отсортированных списков интервалов.
        whenToUse: Два указателя по двум уже отсортированным спискам интервалов; выдать пересечение и сдвинуть тот, что кончается раньше.
        hints:
        - "Какое начало и какой конец задают пересечение двух текущих интервалов?"
        - "Пересечение идёт от более позднего начала до более раннего конца и пусто, если этот отрезок задом наперёд."
        - "Начало пересечения — max(starts); конец — min(ends). Выдавайте только если start < end (или ≤ при inclusive). Сдвигайте указатель интервала, который закончился раньше — он не пересечётся с более поздними из другого списка."
      minimum-meeting-rooms:
        example: "Вход: [0,30], [5,10], [15,20] → 2"
        title: Минимальное количество переговорных
        summary: Найдите минимальное количество переговорных комнат, необходимое для всех встреч.
        whenToUse: 'Считайте одновременные встречи: сортировка по start и min-куча текущих end (или sweep starts/ends).'
        hints:
        - "Когда встреча начинается, какая более ранняя уже могла освободить комнату?"
        - "Число комнат — сколько встреч открыто сразу; это концы, которые ещё в будущем."
        - "Отсортируйте встречи по start, чтобы всегда брать самую раннюю следующую. Держите min-кучу концов занятых комнат; освобождайте комнату, когда heap.min ≤ next.start. Если свободной нет — выделяйте новую (push end). Размер кучи — сколько комнат нужно сейчас. Альтернатива: отдельно отсортировать starts и ends и sweep — +1 на start, −1 на end."
  IN_PLACE_LINKED_LIST:
    constraints: "Нарисуйте перестановку указателей на трёх узлах до цикла."
    followUp: "А если k больше длины или список пуст?"
    title: Манипуляции со связным списком на месте
    subtitle: Разворачивайте и переставляйте узлы списка с O(1) дополнительной памяти
    intuition: 'Разворот или перестановка связного списка без лишней памяти - это аккуратный учёт указателей:
      прежде чем перезаписать next узла, сохраните, куда он указывал раньше, иначе остаток списка будет
      потерян навсегда. Держа три ссылки - previous, current и next - на каждом шаге, вы перепрошиваете
      связи по одной, не теряя связность всего списка.'
    recognition: Задача просит развернуть весь список, подсписок между двумя позициями, группы по k узлов,
      или переставить узлы - и всё это при ограничении O(1) дополнительной памяти.
    walkthrough: 'Заведите три указателя: prev (изначально null), curr (изначально head) и временный next,
      чтобы запомнить curr.next перед перезаписью. На каждой итерации сохраните next = curr.next, перепрошейте
      curr.next = prev, затем сдвиньте prev = curr и curr = next. Для подсписков или групп по k сначала
      дойдите до узла-границы перед нужным сегментом, выполните тот же разворот тремя указателями только
      внутри сегмента, а затем соедините новую голову и хвост сегмента с остальным списком - узел, бывший
      началом сегмента, станет хвостом и должен указывать на то, что шло после сегмента. Нарисуйте список
      из 4-5 узлов на бумаге перед кодом: почти все ошибки здесь - в соединении на границе сегмента, а
      не в самом цикле разворота.'
    telltaleSigns:
    - Развернуть весь связный список, подсписок или группы по k узлов
    - Переставить или чередовать узлы (например, склейка первой и второй половины)
    - Явное требование O(1) дополнительной памяти для связного списка
    - Сочетается с быстрым/медленным указателем для поиска середины перед разворотом
    templateSteps:
    - Ведите prev, curr и временную ссылку next
    - Сохраните next = curr.next перед любыми изменениями
    - Перепрошейте curr.next = prev, затем сдвиньте prev и curr
    - Для поддиапазонов сначала найдите узлы-границы, затем соедините голову/хвост после разворота
    - Используйте фиктивный head-узел, если настоящая голова списка может измениться
    commonMistakes:
    - Потерять остаток списка, перепрошив curr.next до сохранения исходного next
    - Забыть фиктивный head-узел, из-за чего появляются особые случаи при смене головы списка
    - Не соединить хвост развёрнутого сегмента со следующим за ним узлом
    - Ошибиться на одну позицию при подсчёте k или границ подсписка
    whenNotToUse:
    - Нужен произвольный доступ или частый поиск по значению (лучше массив или хеш-таблица)
    - Список можно пересобрать с O(n) памяти без ограничений интервьюера, и рекурсия будет нагляднее
    problems:
      reverse-linked-list:
        example: "Вход: [1, 2, 3, 4] → [4, 3, 2, 1]"
        title: Разворот связного списка
        summary: Разверните односвязный список итеративно и верните новую голову.
        whenToUse: Базовый шаблон разворота тремя указателями для всех вариантов этого паттерна.
        hints:
        - "Что нужно запомнить, прежде чем перезаписать указатель next?"
        - "Развёрнутый префикс кончается узлом, который вы только что перевязали, а хвост — ещё старая цепь."
        - "Сохраните curr.next перед перезаписью. Последний ненулевой curr станет новой головой после завершения цикла."
      reverse-sublist:
        example: "Вход: [1, 2, 3, 4, 5], 2, 4 → [1, 4, 3, 2, 5]"
        title: Разворот подсписка
        summary: Разверните узлы от позиции left до right (нумерация с 1) в связном списке.
        whenToUse: Дойдите до узла перед 'left', разверните сегмент, затем соедините обе границы.
        hints:
        - "Какой узел становится хвостом развёрнутого куска?"
        - "Узел, который был на левой границе, замыкает развёрнутый кусок и должен связаться с тем, что шло за правой границей."
        - "Используйте фиктивную голову, чтобы left=1 не требовал особого случая. Исходный узел 'left' станет хвостом развёрнутого сегмента - соедините его с тем, что идёт после 'right'."
      reverse-every-k:
        example: "Вход: [1, 2, 3, 4, 5], 2 → [2, 1, 4, 3, 5]"
        title: Разворот каждой группы из K элементов
        summary: Разверните узлы связного списка группами по k; неполная последняя группа остаётся как
          есть.
        whenToUse: Сначала проверьте, что впереди есть полные k узлов, разверните группу, затем соедините
          группы между собой.
        hints:
        - "Что должно быть истинным, прежде чем разворачивать следующую группу из k?"
        - "Группа разворачивается, только если осталось k узлов; её новая голова вяжется к хвосту предыдущей группы."
        - "Перед разворотом группы убедитесь, что действительно осталось k узлов. После каждого разворота соединяйте хвост предыдущей группы с новой головой текущей."
      rotate-list:
        example: "Вход: [1, 2, 3, 4, 5], 2 → [4, 5, 1, 2, 3]"
        title: Поворот списка
        summary: Поверните связный список вправо на k позиций.
        whenToUse: Найдите длину списка, замкните его в кольцо и разорвите в новом месте.
        hints:
        - "После k шагов какой узел — новый хвост?"
        - "Список на одно сшивание — кольцо: новый хвост в n - (k mod n) шагах от старой головы."
        - "Возьмите k по модулю n Новый хвост находится на позиции n - k - 1 от начала после замыкания в кольцо"
      reorder-list:
        example: "Вход: [1, 2, 3, 4] → [1, 4, 2, 3]"
        title: Переупорядочивание списка
        summary: Переупорядочьте список на месте в виде L0→Ln→L1→Ln-1→…
        whenToUse: Найдите середину, разверните вторую половину и сплетите их вместе.
        hints:
        - "Какую половину нужно развернуть, прежде чем сплести половины?"
        - "Первая половина остаётся по порядку; развёрнутая вторая вплетается через узел."
        - "Найдите середину быстрым и медленным указателями Разверните вторую половину и сплетите узлы поочерёдно"
  TWO_HEAPS:
    constraints: "Две кучи делят данные так, что медиана всегда на вершине одной из них."
    followUp: "А если нужно удалять произвольное значение, не только медиану?"
    title: Две кучи
    subtitle: Балансируйте max-heap и min-heap для медианы и жадного планирования
    intuition: 'Всё, что требует текущей медианы или баланса ''нижней'' и ''верхней'' половин потока данных,
      решается просто, если держать две кучи: max-heap для меньшей половины и min-heap для большей. Удерживая
      размеры куч в пределах разницы в один элемент, медиану всегда можно получить за O(1) с вершины одной
      или обеих куч.'
    recognition: Поиск медианы потока чисел, поступающих по одному, медиана скользящего окна, либо жадные
      задачи планирования, где нужно раз за разом выбирать лучший вариант из уже доступных (например,
      максимизация капитала).
    walkthrough: 'Держите max-heap для меньшей половины уже увиденных чисел и min-heap для большей половины.
      При поступлении нового числа определите, в какую кучу оно идёт, сравнив с вершиной max-heap, вставьте
      его туда, затем сбалансируйте: если одна куча больше другой более чем на один элемент, перенесите
      её вершину в другую кучу. Медиана - это вершина большей кучи (при нечётном общем количестве) или
      среднее вершин обеих куч (при чётном). Для медианы скользящего окна дополнительно отслеживайте элементы
      для ленивого удаления при движении окна; для задач вроде максимизации капитала используйте одну
      кучу для отслеживания доступного, а другую - для выбора самого выгодного варианта.'
    telltaleSigns:
    - Нужна текущая/потоковая медиана по мере поступления элементов
    - Разделение чисел на две упорядоченные половины (меньшая и большая)
    - Медиана скользящего окна
    - Планирование, где нужен 'лучший из доступных сейчас' (max heap), ограниченный тем, 'что уже стало
      доступно' (min heap)
    templateSteps:
    - Держите max-heap для нижней половины и min-heap для верхней
    - Вставляйте каждый новый элемент в нужную кучу по сравнению с вершиной max-heap
    - Балансируйте так, чтобы размеры куч отличались не более чем на один элемент
    - Читайте медиану с вершины(вершин) куч за O(1)
    - Для задач планирования используйте одну кучу как фильтр доступности, другую - для выбора лучшего
      варианта
    commonMistakes:
    - Позволить кучам разойтись по размеру более чем на один элемент
    - Сравнивать новый элемент не с той кучей при выборе, куда его вставить
    - Забыть, что PriorityQueue в Java по умолчанию min-heap и для max-heap нужен свой компаратор
    - Неверно обрабатывать ленивое удаление в варианте с медианой скользящего окна, оставляя устаревшие
      элементы в куче
    whenNotToUse:
    - Нужен полный отсортированный порядок, а не только медиана или верхние элементы (лучше TreeMap)
    - Данные не требуют инкрементальных обновлений - разовая сортировка проще, чем поддержка двух куч
    problems:
      find-median-stream:
        example: "Операции: addNum(3), findMedian(), addNum(1), findMedian(), addNum(5), findMedian() → [null, 3.0, null, 2.0, null, 3.0]"
        title: Медиана потока чисел
        summary: Поддерживайте вставку чисел по одному и возврат текущей медианы.
        whenToUse: 'Классическая задача на две кучи: балансировка max-heap и min-heap по мере поступления
