    recognition: Задача упоминает явные узлы и рёбра, либо неявный граф вроде сетки, где клетки связаны
      с соседями, и спрашивает про связность, компоненты, кратчайшие пути (невзвешенные), клонирование
      или достижимость.
    walkthrough: 'Сначала определите, задан ли граф явно (список/матрица смежности, список рёбер) или
      неявно (соседи в сетке, преобразования слов); постройте явное представление смежности, если его
      ещё нет, так как почти все алгоритмы на графах предполагают доступ к соседям за O(1). Выберите BFS
      или DFS исходя из потребности: BFS - если нужна длина кратчайшего пути или структура по уровням
      в невзвешенном графе, DFS - для полного обхода, поиска компонент, или если задача естественно рекурсивна
      (например, клонирование). Держите множество посещённых узлов, чтобы избежать повторных посещений
      и бесконечных циклов, и обрабатывайте узлы систематически - очередь для BFS, стек или рекурсия для
      DFS. Для задач ''число компонент'' проходите по всем непосещённым узлам, запуская новый BFS/DFS
      из каждого и увеличивая счётчик.'
    telltaleSigns:
    - Явные узлы/рёбра, либо неявный граф вроде сетки связанных клеток
    - Вопросы о связности, числе компонент связности или достижимости
    - Кратчайший путь в невзвешенном графе (BFS) или необходимость полного обхода (DFS)
    - Клонирование, копирование или трансформация структуры графа
    templateSteps:
    - Постройте явный список/карту смежности, если граф ещё не представлен так
    - Выберите BFS для кратчайшего пути/структуры по уровням, DFS для исчерпывающего обхода/компонент
    - Держите множество посещённых (или пометку прямо на сетке), чтобы не посещать узлы повторно
    - Обрабатывайте очередью (BFS) или рекурсией/стеком (DFS), добавляя непосещённых соседей
    - Для задач 'подсчёт компонент' проходите по всем узлам и запускайте новый обход с каждого непосещённого
    commonMistakes:
    - Забыть отметить узел посещённым до (а не после) добавления в очередь при BFS, вызывая дублирующиеся
      добавления
    - Перепутать BFS и DFS, когда задаче конкретно нужен кратчайший невзвешенный путь (нужен именно BFS)
    - Не обрабатывать несвязные компоненты, исследуя только от одного стартового узла
    - Переполнение стека из-за глубокой рекурсии DFS на больших графах - рассмотрите явный стек
    whenNotToUse:
    - У рёбер есть веса и нужен кратчайший взвешенный путь (используйте Дейкстру или Беллмана-Форда вместо
      обычных BFS/DFS)
    - Структура на самом деле дерево или DAG, для которых есть более специализированный паттерн (обход
      дерева или топологическая сортировка)
    problems:
