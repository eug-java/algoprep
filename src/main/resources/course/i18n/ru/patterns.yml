        - "Он становится новым старшим битом результата, и так по разу для каждой из 32 позиций."
        - "Повторите цикл 32 раза result = (result<<1) | (n&1); n>>>=1"
      bitwise-and-range:
        example: "Вход: 5, 7 → 4"
        title: Побитовое AND диапазона
        summary: "Побитовое И всех чисел от left до right."
        whenToUse: "Сдвигайте, пока left == right, чтобы сбросить различающиеся младшие биты."
        hints:
