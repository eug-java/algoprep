        whenToUse: Алгоритм Кана с прямым сбором извлекаемых узлов в порядок вывода.
        hints:
        - "У какой вершины не осталось предусловий, и что освобождается, когда вы её завершаете?"
        - "Вершина попадает в порядок только когда её входная степень становится нулём."
        - "Заполните очередь всеми курсами с нулевой входящей степенью. Если длина итогового порядка меньше числа курсов, верните пустой массив."
      tasks-scheduling:
        title: Планирование задач
        summary: Можно ли выполнить все задачи с учётом заданных предпосылок?
        whenToUse: Аналогично расписанию курсов — обнаружение циклов через топологическую сортировку.
        hints:
        - "У какой вершины не осталось предусловий, и что освобождается, когда вы её завершаете?"
        - "Вершина попадает в порядок только когда её входная степень становится нулём."
        - "Постройте граф с подсчётом входящих степеней BFS по алгоритму Кана; если обработано меньше задач, чем всего — цикл есть"
