        hints:
        - "Какие ссылки можно переписать, держа в руках всего несколько узлов?"
        - "Уже пройденный префикс перевязан, хвост списка ещё не тронут."
        - "Перед разворотом группы убедитесь, что действительно осталось k узлов. После каждого разворота соединяйте хвост предыдущей группы с новой головой текущей."
      rotate-list:
        title: Поворот списка
        summary: Поверните связный список вправо на k позиций.
        whenToUse: Найдите длину списка, замкните его в кольцо и разорвите в новом месте.
        hints:
        - "Какие ссылки можно переписать, держа в руках всего несколько узлов?"
        - "Уже пройденный префикс перевязан, хвост списка ещё не тронут."
        - "Возьмите k по модулю n Новый хвост находится на позиции n - k - 1 от начала после замыкания в кольцо"
      reorder-list:
        title: Переупорядочивание списка
        summary: Переупорядочьте список на месте в виде L0→Ln→L1→Ln-1→…
        whenToUse: Найдите середину, разверните вторую половину и сплетите их вместе.
        hints:
        - "Какие ссылки можно переписать, держа в руках всего несколько узлов?"
        - "Уже пройденный префикс перевязан, хвост списка ещё не тронут."
        - "Найдите середину быстрым и медленным указателями Разверните вторую половину и сплетите узлы поочерёдно"
  TWO_HEAPS:
    constraints: "Две кучи делят данные так, что медиана всегда на вершине одной из них."
    followUp: "А если нужно удалять произвольное значение, не только медиану?"
    title: Две кучи
    subtitle: Балансируйте max-heap и min-heap для медианы и жадного планирования
    intuition: 'Всё, что требует текущей медианы или баланса ''нижней'' и ''верхней'' половин потока данных,
      решается просто, если держать две кучи: max-heap для меньшей половины и min-heap для большей. Удерживая
      размеры куч в пределах разницы в один элемент, медиану всегда можно получить за O(1) с вершины одной
      или обеих куч.'
    recognition: Поиск медианы потока чисел, поступающих по одному, медиана скользящего окна, либо жадные
      задачи планирования, где нужно раз за разом выбирать лучший вариант из уже доступных (например,
      максимизация капитала).
    walkthrough: 'Держите max-heap для меньшей половины уже увиденных чисел и min-heap для большей половины.
      При поступлении нового числа определите, в какую кучу оно идёт, сравнив с вершиной max-heap, вставьте
      его туда, затем сбалансируйте: если одна куча больше другой более чем на один элемент, перенесите
      её вершину в другую кучу. Медиана - это вершина большей кучи (при нечётном общем количестве) или
      среднее вершин обеих куч (при чётном). Для медианы скользящего окна дополнительно отслеживайте элементы
      для ленивого удаления при движении окна; для задач вроде максимизации капитала используйте одну
      кучу для отслеживания доступного, а другую - для выбора самого выгодного варианта.'
    telltaleSigns:
    - Нужна текущая/потоковая медиана по мере поступления элементов
    - Разделение чисел на две упорядоченные половины (меньшая и большая)
    - Медиана скользящего окна
    - Планирование, где нужен 'лучший из доступных сейчас' (max heap), ограниченный тем, 'что уже стало
      доступно' (min heap)
    templateSteps:
    - Держите max-heap для нижней половины и min-heap для верхней
    - Вставляйте каждый новый элемент в нужную кучу по сравнению с вершиной max-heap
    - Балансируйте так, чтобы размеры куч отличались не более чем на один элемент
    - Читайте медиану с вершины(вершин) куч за O(1)
    - Для задач планирования используйте одну кучу как фильтр доступности, другую - для выбора лучшего
      варианта
    commonMistakes:
    - Позволить кучам разойтись по размеру более чем на один элемент
    - Сравнивать новый элемент не с той кучей при выборе, куда его вставить
    - Забыть, что PriorityQueue в Java по умолчанию min-heap и для max-heap нужен свой компаратор
    - Неверно обрабатывать ленивое удаление в варианте с медианой скользящего окна, оставляя устаревшие
      элементы в куче
    whenNotToUse:
    - Нужен полный отсортированный порядок, а не только медиана или верхние элементы (лучше TreeMap)
    - Данные не требуют инкрементальных обновлений - разовая сортировка проще, чем поддержка двух куч
