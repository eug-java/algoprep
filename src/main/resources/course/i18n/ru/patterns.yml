        hints:
        - "Нужен полный порядок или только K значений, которые лучше остальных?"
        - "Куча размера K забывает всё, что уже не может попасть в ответ."
        - "Держите min-кучу из k наибольших значений; вершина кучи — текущий k-й по величине. Кладите каждое число; если размер > k, удаляйте наименьшее — оно уже не может быть ответом. Quickselect — follow-up со средним O(n); упомяните худший случай O(n²) без median-of-medians."
      reorganize-string:
        title: Реорганизация строки
        summary: Переставьте символы так, чтобы никакие два соседних не совпадали; верните пустую строку,
          если это невозможно.
        whenToUse: Max-heap по частоте символов; жадно размещайте следующий символ.
        hints:
        - "Нужен полный порядок или только K значений, которые лучше остальных?"
        - "Куча размера K забывает всё, что уже не может попасть в ответ."
        - "Если максимальная частота больше (n+1)/2 — решения не существует Всегда берите самый частый из доступных символов"
