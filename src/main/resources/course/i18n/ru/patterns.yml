  BACKTRACKING:
    constraints: "Отсекайте, как только частичный выбор незаконен. Не ждите листа."
    followUp: "А если нужна одна расстановка, а не все?"
    title: Поиск с возвратом (backtracking)
    subtitle: Выбирай, исследуй, отменяй - обход дерева решений с отсечением
    intuition: 'Backtracking исследует дерево решений частичных решений: делает выбор, углубляется рекурсией
      и отменяет (''отменяет выбор'') этот выбор, как только он оказывается недопустимым или все его потомки
      уже исследованы. Именно шаг отмены отличает backtracking от обычного DFS - он позволяет переиспользовать
      одно и то же изменяемое состояние во всех ветках вместо копирования.'
    recognition: Задача на удовлетворение ограничений или комбинаторный поиск - N ферзей, судоку, поиск
      слова в сетке, сумма комбинаций или разбиение на палиндромы - и требует все допустимые решения,
      любое одно решение или их количество.
    walkthrough: 'Спроектируйте рекурсивную функцию как одну точку принятия решения: попробуйте кандидата,
      отметьте нужное состояние (поставьте ферзя, отметьте клетку посещённой, добавьте число в текущую
      комбинацию) и рекурсивно перейдите к следующему решению. Если рекурсия достигает полного допустимого
      решения - зафиксируйте его; если состояние заведомо не может стать допустимым - сразу возвращайтесь
      (это и есть отсечение). В любом случае перед следующим кандидатом отмените именно те изменения состояния,
      которые сделали, чтобы следующая ветка начиналась с чистого корректного состояния. Добавляйте отсечение
      как можно раньше, проверяя частичные ограничения до дальнейшей рекурсии, а не только полную валидность
      на листьях - именно это не даёт времени выполнения взорваться на больших входах.'
    telltaleSigns:
    - Удовлетворение ограничений или комбинаторный поиск (N ферзей, судоку, поиск слова)
    - Нужны все допустимые решения, любое одно решение, или их количество
    - Частичного кандидата можно проверить на валидность до завершения (это даёт отсечение)
    - Явный обход сетки/доски/пути с маркером 'посещено'/'использовано', который нужно отменять
    templateSteps:
    - Выберите значение-кандидат или ход для текущей точки решения
    - Примените его к общему состоянию (отметьте посещённым, добавьте в путь, поставьте фигуру)
    - Рекурсивно перейдите к следующему решению или зафиксируйте решение, если оно завершено
    - Отмените именно то изменение, что сделали, перед следующим кандидатом
    - Отсекайте рано, проверяя частичную валидность, а не только валидность полного решения
    commonMistakes:
    - Забыть отменить изменение состояния, испортив последующие ветки поиска
    - Копировать большие структуры состояния на каждом рекурсивном вызове вместо изменения и отмены на
      месте
    - Проверять валидность только на листьях вместо раннего отсечения, что вызывает лишний экспоненциальный
      рост
    - Ошибка на единицу в границах цикла при переборе следующего кандидата (например, повторное использование
      индекса)
    whenNotToUse:
    - Пространство поиска доказуемо огромно без эффективного отсечения, и нужен лишь приближённый/жадный
      ответ
    - Есть перекрывающиеся подзадачи, которые можно мемоизировать - динамическое программирование будет
      намного быстрее полного перебора
    problems:
      combination-sum:
        title: Сумма комбинаций
        summary: Найдите все уникальные комбинации чисел, дающие в сумме target; числа можно использовать
          повторно.
        whenToUse: Классический backtracking со стартовым индексом, предотвращающий генерацию перестановок
          одной комбинации.
        hints:
        - "Где выбор фиксируется и где его обязательно откатить?"
        - "Доска допустима для уже сделанных выборов; тупик возвращает предыдущее состояние."
        - "Передавайте тот же стартовый индекс (не start+1) при повторном использовании числа. Отсекайте ветку, как только текущая сумма превысит target."
      word-search:
        title: Поиск слова
        summary: Определите, есть ли слово в сетке через соседние клетки, каждая используется не более
          раза.
        whenToUse: DFS/backtracking из каждой клетки, отметка посещённых клеток и снятие отметки при откате.
        hints:
        - "Где выбор фиксируется и где его обязательно откатить?"
        - "Доска допустима для уже сделанных выборов; тупик возвращает предыдущее состояние."
        - "Отмечайте клетку посещённой перед рекурсией в соседей и снимайте отметку сразу после. Сразу отсекайте, если буква текущей клетки не совпадает с нужным символом."
      n-queens:
        title: Задача о N ферзях
        summary: Все различные решения головоломки о расстановке n ферзей.
        whenToUse: Расставляйте ферзей построчно, отсекая занятые столбцы и диагонали.
        hints:
        - "Где выбор фиксируется и где его обязательно откатить?"
        - "Доска допустима для уже сделанных выборов; тупик возвращает предыдущее состояние."
        - "Отслеживайте занятые столбцы и обе диагонали Формируйте строки доски в листьях дерева перебора"
      sudoku-solver:
        title: Решатель судоку
        summary: Заполните доску судоку 9×9 на месте.
        whenToUse: Перебирайте цифры от 1 до 9 с проверкой ограничений строки, столбца и блока 3×3.
        hints:
        - "Где выбор фиксируется и где его обязательно откатить?"
        - "Доска допустима для уже сделанных выборов; тупик возвращает предыдущее состояние."
        - "Найдите следующую пустую клетку Проверьте строку, столбец и блок 3×3 перед размещением цифры"
      letter-case-permutation:
        title: Перестановки регистра букв
        summary: Return all strings formed by toggling letter case.
        whenToUse: Simple backtracking / branching on letters only.
        hints:
        - "Где выбор фиксируется и где его обязательно откатить?"
        - "Доска допустима для уже сделанных выборов; тупик возвращает предыдущее состояние."
        - "Digits stay fixed Branch lower/upper for each letter"
  DYNAMIC_PROGRAMMING:
    constraints: "Определите dp[i] одной фразой до любого цикла. Наивная рекурсия на таком n не пройдёт."
    followUp: "От каких клеток зависит эта, и можно ли оставить только предыдущую строку?"
    title: Динамическое программирование
    subtitle: Перекрывающиеся подзадачи и оптимальная подструктура, решаемые раз и переиспользуемые
    intuition: Динамическое программирование применимо, когда у задачи есть оптимальная подструктура (лучший
      ответ строится из лучших ответов меньших подзадач) и перекрывающиеся подзадачи (одна и та же меньшая
      подзадача нужна несколько раз). Вместо пересчёта таких подзадач с нуля вы сохраняете ответ каждой
      подзадачи один раз - либо сверху вниз с мемоизацией, либо снизу вверх, заполняя таблицу в порядке
      зависимостей.
    recognition: 'Задача просит оптимальное количество, минимальное/максимальное значение или число способов,
      и наивное рекурсивное решение повторно обрабатывало бы одни и те же меньшие входы - классические
      примеры: варианты рюкзака, наибольшая возрастающая подпоследовательность, ''ограбление домов'',
      редакционное расстояние, подсчёт уникальных путей.'
    walkthrough: 'Начните с определения, что именно означает dp[i] (или dp[i][j]) простыми словами - это
      самый важный шаг, который нужно сформулировать до написания кода. Запишите рекуррентное соотношение,
      связывающее dp[i] с меньшими подзадачами, и определите базовые случаи, не требующие дальнейшей рекурсии.
      Выберите порядок заполнения так, чтобы все значения, от которых зависит рекуррентность, уже были
      вычислены к моменту использования, затем реализуйте либо мемоизированную рекурсию сверху вниз, либо
      цикл снизу вверх. После того как решение верно, поищите оптимизацию по памяти: если dp[i] зависит
      только от последних одной-двух строк/значений, часто можно свернуть таблицу O(n^2) до O(n) или O(1)
      - но только после того, как наивная версия работает и вы чётко объяснили рекуррентность интервьюеру.'
    telltaleSigns:
    - Просят оптимальное (мин/макс) значение или число способов, а не просто любую допустимую расстановку
    - Наивное рекурсивное решение повторно вычисляло бы одинаковые меньшие подзадачи
    - Выборы на каждом шаге взаимодействуют с текущим бюджетом/вместимостью/целью (в стиле рюкзака)
    - Задачу можно сформулировать как 'лучший ответ с использованием первых i элементов' или похожим образом
    templateSteps:
    - Определите значение dp[i] или dp[i][j] одним чётким предложением
    - Запишите рекуррентное соотношение с меньшими подзадачами и базовые случаи
    - Выберите порядок итерации так, чтобы зависимости всегда были вычислены заранее
    - Реализуйте снизу вверх (таблица) или сверху вниз (мемоизированная рекурсия)
    - Оптимизируйте память после, если dp зависит только от небольшого окна предыдущих состояний
    commonMistakes:
    - Писать код до чёткого определения значения dp[i], что приводит к неверной или недоказуемой рекуррентности
    - Пропущенные или неверные базовые случаи, вызывающие ошибки на единицу по всей таблице
    - Итерация в неверном порядке, из-за чего зависимость ещё не вычислена, когда нужна
    - Преждевременная оптимизация памяти до того, как проверена корректность прямолинейной версии
    whenNotToUse:
    - Подзадачи на самом деле не перекрываются - обычное разделяй-и-властвуй или жадный подход будут проще
      и не медленнее
    - Задаче нужен лишь один допустимый ответ, а не оптимум, и backtracking с отсечением более прямолинеен
    problems:
      climbing-stairs:
        title: Подъём по лестнице
        summary: Посчитайте число способов подняться на n ступеней, шагая на 1 или 2 ступени.
        whenToUse: 'Вводная задача в стиле Фибоначчи: dp[i] = dp[i-1] + dp[i-2].'
        hints:
        - "Какой меньший вопрос имеет ту же форму, и что пришлось бы пересчитывать с нуля?"
        - "Клетка этого префикса собирается только из клеток, которые уже посчитаны."
        - "Базовые случаи: dp[1]=1 и dp[2]=2. Нужны только последние два значения, поэтому достаточно O(1) памяти."
      house-robber:
        title: Ограбление домов
        summary: Найдите максимальную сумму денег, которую можно украсть, не грабя два соседних дома.
        whenToUse: dp[i] = max(dp[i-1], dp[i-2] + nums[i]) - решение пропустить дом или ограбить его.
        hints:
        - "Какой меньший вопрос имеет ту же форму, и что пришлось бы пересчитывать с нуля?"
        - "Клетка этого префикса собирается только из клеток, которые уже посчитаны."
        - "На каждом доме: либо пропустить его (dp[i-1]), либо ограбить (dp[i-2] + nums[i]). Достаточно хранить только два предыдущих значения dp."
      0-1-knapsack:
        title: Рюкзак 0/1
        summary: Максимизируйте ценность при ограничении по весу, если каждый предмет можно взять не более
          раза.
        whenToUse: Классический 2D (или 1D с обратной итерацией) DP по индексу предмета и оставшейся вместимости.
        hints:
        - "Какой меньший вопрос имеет ту же форму, и что пришлось бы пересчитывать с нуля?"
        - "Клетка этого префикса собирается только из клеток, которые уже посчитаны."
        - "dp[c] - лучшая достижимая ценность при вместимости c. В 1D-версии итерируйте вместимость от большей к меньшей, чтобы каждый предмет использовался не более раза."
      coin-change:
        title: Размен монет
        summary: Минимальное количество монет для набора суммы, либо -1, если это невозможно.
        whenToUse: ДП по неограниченному рюкзаку. Жадный выбор ломается на неканонических номиналах — монеты [1,3,4] и сумма 6 дают 3 монеты жадно и 2 монеты в DP.
        hints:
        - "Какой меньший вопрос имеет ту же форму, и что пришлось бы пересчитывать с нуля?"
        - "Клетка этого префикса собирается только из клеток, которые уже посчитаны."
        - "dp[x] = минимум по всем монетам c от dp[x-c]+1 Инициализируйте dp[0]=0, остальные значения — бесконечностью"
      edit-distance:
        title: Расстояние редактирования
        summary: Минимальное число операций вставки, удаления и замены для превращения word1 в word2.
        whenToUse: '2D DP по префиксам обеих строк; каждая клетка — insert / delete / replace от соседей.'
        hints:
        - "Какой меньший вопрос имеет ту же форму, и что пришлось бы пересчитывать с нуля?"
        - "Клетка этого префикса собирается только из клеток, которые уже посчитаны."
        - "dp[i][j] — расстояние между word1[:i] и word2[:j]; совпадающие символы берут диагональ. При несовпадении: 1 + min(insert=dp[i][j-1], delete=dp[i-1][j], replace=dp[i-1][j-1]). Оставляйте только предыдущую строку, чтобы уложиться в O(n) памяти после ясной 2D-рекуррентности."
      longest-increasing-subsequence:
        title: Наибольшая возрастающая подпоследовательность
        summary: Длина самой длинной строго возрастающей подпоследовательности. Она не обязана быть непрерывной.
        whenToUse: dp[i] — лучшая длина, заканчивающаяся в i. Сначала фраза, потом цикл. O(n log n) — это follow-up.
        hints:
        - "Какой меньший вопрос имеет ту же форму, и что пришлось бы пересчитывать с нуля?"
        - "Клетка этого префикса собирается только из клеток, которые уже посчитаны."
        - "Что означает одна клетка, до того как вы напишете цикл? dp[i] = 1 + лучший dp[j] среди более ранних меньших значений. Ответ — максимум по клеткам, а не dp[n-1]."
      unique-paths:
        title: Уникальные пути
        summary: Число путей из левого верхнего угла в правый нижний, шагая только вправо или вниз.
        whenToUse: dp[r][c] = dp[r-1][c] + dp[r][c-1]. Первая строка и первый столбец равны 1.
        hints:
        - "Какой меньший вопрос имеет ту же форму, и что пришлось бы пересчитывать с нуля?"
        - "Клетка этого префикса собирается только из клеток, которые уже посчитаны."
        - "Скажите, что хранит клетка, до заполнения. В клетку приходят только сверху или слева. В первую строку и первый столбец есть ровно один способ попасть."
  CYCLIC_SORT:
    constraints: "Значения лежат в 1..n или 0..n-1. Этот диапазон разрешает ставить их на место."
    followUp: "А если обещание диапазона ложно и значение выпадает из него?"
    title: Циклическая сортировка
    subtitle: Размещайте каждое число из диапазона [1..n] по индексу value-1
    intuition: Когда значения массива гарантированно лежат в известном небольшом диапазоне вроде 1..n
      (или 0..n), у каждого значения есть 'правильный' домашний индекс. Многократный обмен неправильно
      расположенных значений на их правильные места сортирует массив за O(n) без дополнительной памяти,
      а второй проход сразу выявляет пропущенные или повторяющиеся числа - их слоты либо указывают не
      на то значение, либо хранят неверное количество.
    recognition: Массив содержит n (или около того) чисел из небольшого известного диапазона вроде 1..n
      или 0..n-1, и вопрос касается поиска пропущенного числа, дубликатов, испорченной пары или первого
      пропущенного положительного числа - всё при ограничениях O(n) времени и O(1) дополнительной памяти.
    walkthrough: 'Пройдитесь по массиву индексом i, и пока nums[i] не на своём правильном месте (nums[i]
      - 1 != i, для значений 1..n), меняйте nums[i] местами с элементом, стоящим на правильном для nums[i]
      месте. Повторяйте обмен на том же индексе i, пока там не окажется правильно расположенное значение
      или дубликат/значение вне диапазона, которое меняется само с собой - только тогда переходите дальше.
      После этого единственного прохода сделайте второй: любой индекс i, где nums[i] != i + 1, указывает
      либо на пропущенное число (i + 1 отсутствует), либо, если ищете дубликаты, на дважды встречающееся
      значение. Оберегайтесь бесконечных циклов при наличии дубликатов - дубликат никогда не сможет попасть
      на ''правильное'' место, уже занятое им же.'
    telltaleSigns:
    - Числа из известного небольшого диапазона, тесно связанного с индексами массива (1..n или 0..n)
    - Нужно найти пропущенное число(а), дубликат(ы) или испорченную пару
    - Явно требуются O(n) времени и O(1) дополнительной памяти
    - Формулировка 'первое пропущенное положительное' или похожее отображение на индексы
    templateSteps:
    - Для каждого индекса i проверьте, находится ли nums[i] на своём правильном месте (value - 1)
    - Если нет, поменяйте nums[i] с элементом на его правильном месте
    - Повторяйте обмен на индексе i, пока там не окажется правильное или дублирующееся значение, затем
      идите дальше
    - Сделайте второй проход, чтобы найти индексы, где значение не совпадает с ожидаемым
    - Сообщите о пропущенных/дублирующихся числах на основе этого несовпадения
    commonMistakes:
    - Переходить к следующему i после одного обмена вместо повторения обменов на i до устаканивания
    - Бесконечный цикл, когда дублирующееся значение пытается встать на уже занятое им же правильное место
    - Ошибка на единицу при переходе между значением и индексом (value - 1 против value)
    - Забыть, что массив может использовать 0-индексацию вместо 1-индексации, меняя формулу отображения
    whenNotToUse:
    - Значения не ограничены небольшим диапазоном, связанным с длиной массива (нужны хеш-множество или
      сортировка)
    - Массив нельзя изменять, и не разрешена дополнительная память O(n) для копии только для чтения
    problems:
      cyclic-sort:
        title: Циклическая сортировка
        summary: Отсортируйте на месте массив, содержащий числа от 1 до n.
        whenToUse: Прямое, классическое применение паттерна.
        hints:
        - "Если каждое значение принадлежит одному индексу, какое сейчас стоит не на своём месте?"
        - "В индексе i должно лежать i или i + 1; один обмен сажает значение на место без дополнительной памяти."
        - "Пока nums[i] не находится по индексу nums[i]-1, меняйте его местами. Каждый элемент переставляется на своё место не более раза, что даёт O(n)."
      find-missing-number:
        title: Поиск пропущенного числа
        summary: Дан массив из n уникальных чисел от 0 до n - найдите пропущенное число.
        whenToUse: Циклическая расстановка чисел (или сумма/XOR); здесь - циклическая сортировка и поиск
          несовпадения.
        hints:
        - "Если каждое значение принадлежит одному индексу, какое сейчас стоит не на своём месте?"
        - "В индексе i должно лежать i или i + 1; один обмен сажает значение на место без дополнительной памяти."
        - "Размещайте каждое значение v по индексу v, если v < n. После расстановки первый индекс i, где nums[i] != i, и есть пропущенное число."
      find-all-duplicates:
        title: Поиск всех дубликатов
        summary: Дан массив чисел от 1 до n, где некоторые встречаются дважды - верните все дубликаты.
        whenToUse: Расставьте каждое значение по индексу; то, что нельзя расставить, потому что место
          занято - дубликат.
        hints:
        - "Если каждое значение принадлежит одному индексу, какое сейчас стоит не на своём месте?"
        - "В индексе i должно лежать i или i + 1; один обмен сажает значение на место без дополнительной памяти."
        - "Выполните обычную расстановку циклической сортировкой. После расстановки любой индекс i, где nums[i] != i + 1, содержит дублирующееся значение."
      find-duplicate-number:
        title: Поиск дублирующегося числа
        summary: В массиве из n+1 чисел от 1 до n есть один дубликат; найдите его, не изменяя массив.
        whenToUse: Индексы→значения как функциональный граф; найдите вход в цикл (Floyd), не изменяя массив.
        hints:
        - "Если каждое значение принадлежит одному индексу, какое сейчас стоит не на своём месте?"
        - "В индексе i должно лежать i или i + 1; один обмен сажает значение на место без дополнительной памяти."
        - "Индекс i указывает на nums[i]; из-за одного дубликата в графе ровно один цикл. Floyd: slow = nums[slow], fast = nums[nums[fast]] до встречи. Сбросьте один указатель в начало и шагайте оба по одному; точка встречи — дубликат."
      first-missing-positive:
        title: Первое отсутствующее положительное число
        summary: Наименьшее отсутствующее положительное число в неотсортированном массиве.
        whenToUse: 'Размещение на месте: каждое v из [1..n] на индекс v-1, затем скан первого несовпадения.'
        hints:
        - "Если каждое значение принадлежит одному индексу, какое сейчас стоит не на своём месте?"
        - "В индексе i должно лежать i или i + 1; один обмен сажает значение на место без дополнительной памяти."
        - "Игнорируйте неположительные и > n — они не могут быть первым пропущенным в 1..n+1. Пока nums[i] в диапазоне и не на месте, меняйте его с индексом nums[i]-1 (защита от бесконечного self-swap). После размещения первый i с nums[i] != i+1 даёт ответ i+1; если все на месте — ответ n+1."
  TOPOLOGICAL_SORT:
    constraints: "Цикл значит, что порядка нет. Скажите это до Кана или DFS."
    followUp: "А если порядков несколько и просят любой?"
    title: Топологическая сортировка
    subtitle: Упорядочивайте задачи с зависимостями через BFS по входящей степени в DAG
    intuition: 'Когда у задач есть предпосылки, это отношение зависимости - направленный граф, и любой
      допустимый порядок выполнения - топологическая сортировка этого графа, которая существует только
      если в графе нет циклов. Алгоритм Кана делает это конкретным: раз за разом убирайте узлы с нулевой
      входящей степенью (без невыполненных предпосылок), так как их всегда безопасно выполнить следующими.'
    recognition: Задача говорит о предпосылках, зависимостях или отношениях 'должно произойти раньше'
      между элементами - расписание курсов, системы сборки, порядок букв в 'инопланетном словаре' - и
      просит валидный порядок, существование такого порядка вообще, либо обнаружение невозможной (циклической)
      зависимости.
    walkthrough: Постройте список смежности с рёбрами 'A должно быть перед B' и одновременно посчитайте
      входящую степень (число невыполненных предпосылок) для каждого узла. Инициализируйте очередь всеми
      узлами с нулевой входящей степенью - у них нет невыполненных предпосылок, и их можно выполнять сразу.
      Раз за разом извлекайте узел, добавляйте его в порядок вывода, затем уменьшайте входящую степень
      каждого соседа - любой сосед, чья степень упала до нуля, попадает в очередь. Если обработанных узлов
      оказалось меньше общего числа - есть цикл, и валидный порядок невозможен, это и есть ответ для вопросов
      вроде 'можно ли завершить все курсы'. Для задач вроде 'инопланетного словаря' сначала выведите рёбра,
      сравнивая каждую пару соседних слов посимвольно до первой отличающейся буквы, затем выполните ту
      же топологическую сортировку над алфавитом.
    telltaleSigns:
    - Предпосылки, зависимости или отношения 'должно быть раньше' между элементами
    - Нужен валидный порядок обработки, или проверка существования такого порядка
    - Направленный граф, где циклы делают задачу невозможной
    - Задачи на вывод порядка букв вроде 'инопланетного словаря'
    templateSteps:
    - Постройте список смежности рёбер 'до' и счётчик входящей степени для каждого узла
    - Заполните очередь всеми узлами с нулевой входящей степенью
    - Извлекайте узел, добавляйте его в порядок, уменьшайте входящую степень соседей
    - Помещайте в очередь любого соседа, чья входящая степень достигла нуля
    - Если обработано меньше узлов, чем есть - сообщите о цикле / невозможном порядке
    commonMistakes:
    - Строить рёбра в неверном направлении, переворачивая нужное отношение 'до'
    - Забыть проверить, все ли узлы обработаны, полностью пропустив обнаружение цикла
    - Не инициализировать входящую степень для узлов без входящих рёбер перед заполнением очереди
    - Для 'инопланетного словаря' пропустить случай, когда одно слово - префикс другого, но идёт после
      него (недопустимый порядок)
    whenNotToUse:
    - Граф гарантированно ацикличен, и порядок не важен - достаточно простого обхода DFS/BFS
    - Отношения на самом деле не являются графом зависимостей, а просто связностью (лучше подойдут обычные
      BFS/DFS или union-find)
    problems:
      course-schedule:
        title: Расписание курсов
        summary: Определите, можно ли завершить все курсы при заданных парах предпосылок.
