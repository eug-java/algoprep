  STACKS:
    constraints: "В стеке лежат индексы или значения, которые ещё могут быть ответом."
    followUp: "А если массив кольцевой и последний элемент смотрит на первый?"
    title: Стеки
    subtitle: LIFO для сопоставления пар, следующего большего элемента и монотонных структур
    intuition: Стек естественно подходит, когда ответ на вопрос 'чем разрешается этот элемент' зависит
      от самого недавнего ещё неразрешённого кандидата - как самая недавняя непарная открывающая скобка,
      или ближайший предыдущий элемент, ожидающий появления чего-то большего. Поддержание монотонности
      стека (всегда возрастающий или убывающий) позволяет разрешить много элементов за один амортизированный
      проход O(n), а не сравнивая каждую пару.
    recognition: Задача про сопоставление пар (скобки), поиск следующего/предыдущего большего или меньшего
      элемента, вычисление промежутков до смены условия (дневные температуры), либо площадей/высот, зависящих
      от соседних более высоких/низких элементов (наибольший прямоугольник в гистограмме).
    walkthrough: 'Для задач сопоставления помещайте открывающие символы в стек, и на каждом закрывающем
      проверяйте совпадение с вершиной стека перед извлечением - несовпадение или пустой стек в неподходящий
      момент означает недопустимый вход. Для задач ''следующий больший элемент'' проходите по массиву,
      поддерживая монотонный стек индексов: перед добавлением текущего элемента извлекайте всё, что меньше
      него, ведь текущий элемент - это точный ответ ''следующий больший'' для каждого извлечённого индекса.
      Фиксируйте это разрешение при извлечении, затем добавляйте текущий индекс. Для задач с площадью
      в стиле гистограммы используйте ту же идею монотонного стека, но дополнительно вычисляйте ширину
      при каждом извлечении, используя новую вершину стека (или -1) как левую границу и текущий индекс
      как правую. Всегда завершайте разбором оставшихся в стеке элементов после основного цикла, так как
      они могут представлять неразрешённых кандидатов, доходящих до конца массива.'
    telltaleSigns:
    - Сопоставление пар символов (скобки, теги)
    - Формулировки 'следующий/предыдущий больший/меньший элемент'
    - Дни/позиции до смены условия (в стиле 'дневные температуры')
    - Вычисление наибольшего прямоугольника, площади или промежутка, зависящего от соседних элементов
    - Явная возможность применить монотонный стек в массиве/последовательности
    templateSteps:
    - 'Для сопоставления: помещайте открывающие символы, проверяйте/извлекайте по вершине на каждом закрывающем'
    - 'Для следующего/предыдущего большего: держите монотонный стек индексов, извлекая и разрешая, когда
      текущий элемент превосходит вершину'
    - Фиксируйте разрешение (расстояние, значение, площадь) в момент извлечения, а не раньше
    - Для задач с площадью/шириной используйте новую вершину стека после извлечения как границу
    - Разберите оставшиеся записи стека после основного цикла, чтобы разрешить оставшихся кандидатов
    commonMistakes:
    - Извлекать, не зафиксировав сначала разрешение для извлечённого элемента
    - Использовать стек значений вместо индексов, когда нужны расстояния/промежутки
    - Забыть разобрать стек после цикла, оставив часть элементов неразрешёнными
    - Перепутать направление монотонности (возрастающий/убывающий) для конкретного варианта
    whenNotToUse:
    - Связь между элементами не про 'самого недавнего неразрешённого кандидата' (проще подойдут хеш-карта
      или два указателя)
    - Нужен произвольный доступ в середину последовательности ожидающих кандидатов (стек даёт доступ только
      к вершине)
    problems:
      valid-parentheses:
        title: Валидные скобки
        summary: Проверьте, правильно ли сопоставлены и вложены скобки в строке.
        whenToUse: Классический шаблон стека для любых вопросов о валидности скобок.
        hints:
        - "Что нужно закрыть, прежде чем принять текущее значение?"
        - "Стек хранит незакрытые элементы в том порядке, в котором их ещё надо разрешить."
        - "Помещайте открывающие скобки в стек; на закрывающей извлекайте и проверяйте совпадение. Строка валидна, только если стек пуст в самом конце."
      daily-temperatures:
        title: Дневные температуры
        summary: Для каждого дня найдите, через сколько дней наступит более тёплая температура.
        whenToUse: Монотонно убывающий стек индексов разрешает каждый день, как только появляется более
          тёплый.
        hints:
        - "Что нужно закрыть, прежде чем принять текущее значение?"
        - "Стек хранит незакрытые элементы в том порядке, в котором их ещё надо разрешить."
        - "Храните в стеке индексы, а не температуры, чтобы можно было вычислить разницу дней. Извлекайте и разрешайте каждый индекс в стеке, чья температура меньше текущей."
      next-greater-element:
        title: Следующий больший элемент
        summary: Для каждого элемента nums1 найдите его следующий больший элемент в nums2 (nums1 - подмножество
          nums2).
        whenToUse: Заранее вычислите следующий больший для каждого значения nums2 монотонным стеком, затем
          сопоставьте ответы nums1 через хеш-карту.
        hints:
        - "Что нужно закрыть, прежде чем принять текущее значение?"
        - "Стек хранит незакрытые элементы в том порядке, в котором их ещё надо разрешить."
        - "Постройте полное отображение 'следующий больший' для nums2 за один проход монотонным стеком. Ищите каждое значение nums1 в этом отображении вместо пересканирования nums2 при каждом запросе."
      decode-string:
        title: Декодирование строки
        summary: Декодируйте закодированную строку вида 3[a2[c]] → accaccacc.
        whenToUse: Стек счётчиков повторов и частично собранных строк.
        hints:
        - "Что нужно закрыть, прежде чем принять текущее значение?"
        - "Стек хранит незакрытые элементы в том порядке, в котором их ещё надо разрешить."
        - "Кладите в стек при встрече '[' Извлекайте из стека и повторяйте строку при встрече ']'"
      basic-calculator:
        title: Простой калькулятор
        summary: Вычислите значение выражения с +, -, скобками и пробелами.
        whenToUse: Стек знаков для обработки вложенных скобок.
        hints:
        - "Что нужно закрыть, прежде чем принять текущее значение?"
        - "Стек хранит незакрытые элементы в том порядке, в котором их ещё надо разрешить."
        - "Ведите текущий результат и текущий знак При '(' кладите результат и знак в стек, при ')' извлекайте их"
