courseDescription: AlgoPrep — автономный тренажёр по Java-собеседованиям. Каждый модуль паттерна учит
  распознавать класс задач, проговаривать подход, применять шаблон на Java, избегать типичных ловушек
  и практиковаться на Easy → Medium → Hard с тестами JUnit. После паттерна проверьте распознавание в режиме
  Blind Spot (без меток паттерна). Бонусный трек — темы Spring Boot для Java backend.
weeks:
  1: Хеш-таблицы, два указателя, окна, списки
  2: Деревья, графы и обходы
  3: Поиск, рекурсия и динамическое программирование
  4: Интервалы, кучи, проектирование и Spring
cheatsheet:
- q: Непрерывный подмассив/подстрока с ограничением по сумме или числу уникальных?
  a: Скользящее окно
- q: Отсортированный массив, нужна пара/тройка с целью, или разворот на месте?
  a: Два указателя
- q: Цикл в связном списке, средний узел, или последовательность, которая может зациклиться?
  a: Быстрый и медленный указатели
- q: Нужна текущая медиана или баланс двух упорядоченных половин потока?
  a: Две кучи
- q: Слить несколько уже отсортированных списков/массивов, или найти k-й среди них?
  a: Слияние K источников
- q: Нужны только топ/наибольшие/наименьшие/самые частые K элементов, а не полная сортировка?
  a: Топ K элементов
- q: Отсортированный или повёрнутый массив; нужно первое/последнее вхождение, или поиск по ответу?
  a: Модифицированный бинарный поиск
- q: Сгенерировать все подмножества, перестановки или сочетания?
  a: Подмножества
- q: Локально лучший выбор, после сортировки по правильному ключу, кажется безопасным?
  a: Жадные алгоритмы
- q: Нужны все допустимые решения/расстановки через выбор-исследование-отмену?
  a: Поиск с возвратом (backtracking)
- q: Оптимальное значение/количество с перекрывающимися подзадачами и оптимальной подструктурой?
  a: Динамическое программирование
- q: Числа ограничены диапазоном 1..n; нужны пропущенные/дублирующиеся значения за O(1) памяти?
  a: Циклическая сортировка
- q: Задачи с предпосылками; нужен допустимый порядок или обнаружение цикла?
  a: Топологическая сортировка
- q: Явный или неявный граф; связность, компоненты, или кратчайший невзвешенный путь?
  a: Графы
- q: Сумма пути в бинарном дереве, диаметр, или наименьший общий предок?
  a: DFS по дереву
- q: Быстрая проверка дополнения/частот или подсчёт префиксных сумм за один проход?
  a: Хеш-карты
- q: Пересекающиеся встречи или обход начал и концов?
  a: Интервалы
- q: Следующий больший элемент, температуры или прямоугольник в гистограмме?
  a: Стек
- q: Словарь префиксов, автодополнение или много слов на доске?
  a: Префиксное дерево
- q: Динамическая связность или «эти две вершины в одной компоненте»?
  a: Система непересекающихся множеств
- q: Спиральный порядок, поворот матрицы или обнуление строки и столбца?
  a: Матрицы
- q: Развернуть список или каждые k узлов на месте?
  a: Связный список на месте
- q: Одно число встречается один раз, или нужно ставить и проверять биты?
  a: Биты
- q: Бегущий баланс нулей и единиц, или кандидат большинства?
  a: Знать, что отслеживать
