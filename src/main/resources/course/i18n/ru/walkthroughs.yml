# Разбор каждой задачи каталога. У сложных задач числа совпадают с английским следом.
"quadruple-sum": |
  nums = [1, 0, -1, 0, -2, 2], цель = 0
  сортировка -> [-2, -1, 0, 0, 1, 2]

  i=0 (-2), j=1 (-1)
    L=2 (0), R=5 (2)
    сумма=-2-1+0+2=-1 < 0 -> L++
    L=3 (0), R=5 (2)
    сумма=-2-1+0+2=-1 < 0 -> L++
    L=4 (1), R=5 (2)
    сумма=-2-1+1+2=0  ок  [-2,-1,1,2]

  Одинаковые пары пропускаем; i и j двигаем так же.
  Результат: [[-2,-1,1,2],[-2,0,0,2],[-1,0,0,1]]

"min-window-substring": |
  s = "ADOBECODEBANC", t = "ABC"
  нужно = {A:1, B:1, C:1}, не хватает = 3

  расширяем R:
    A D O B E C ...  -> есть A,B,C; не хватает=0
    окно "ADOBEC" (0..5)

  сжимаем L, пока окно годно:
    убрали A -> не хватает=1; лучшая длина всё ещё 6
  дальше...
    позже окно "BANC" (9..12) длина 4  ЛУЧШЕЕ

  Ответ: "BANC"

"minimum-meeting-rooms": |
  встречи: [0,30], [5,10], [15,20]
  начала: 0, 5, 15
  концы:  10, 20, 30

  проход i/j:
    0 начало -> комнат=1 (макс=1)
    5 начало -> комнат=2 (макс=2)
   10 конец  -> комнат=1
   15 начало -> комнат=2 (макс=2)
   20 конец  -> комнат=1
   30 конец  -> комнат=0

  Ответ: 2

"merge-k-sorted-lists": |
  списки: [1,4,5], [1,3,4], [2,6]
  в min-heap кладём головы: (1,a0), (1,b0), (2,c0)

  взяли 1(a) -> кладём следующий 4(a)
  взяли 1(b) -> кладём следующий 3(b)
  взяли 2(c) -> кладём следующий 6(c)
  взяли 3(b) -> кладём следующий 4(b)
  ...
  выход: 1 -> 1 -> 2 -> 3 -> 4 -> 4 -> 5 -> 6

"n-queens": |
  доска n=4, ставим ферзя ряд за рядом

  ряд0: пробуем столбцы 0..3
    ставим (0,1)
  ряд1: бьют 0,1,2? пробуем столбец 3
    ставим (1,3)
  ряд2: пробуем столбец 0
    ставим (2,0)
  ряд3: пробуем столбец 2
    ставим (3,2)  РЕШЕНИЕ

  Откат, когда безопасного столбца не осталось.

"edit-distance": |
  слово1="horse", слово2="ros"

  таблица dp (строки=horse, столбцы=ros):
       ''  r  o  s
  ''    0  1  2  3
  h     1  1  2  3
  o     2  2  1  2
  r     3  2  2  2
  s     4  3  3  2
  e     5  4  4  3

  dp[i][j] = минимум из замены, вставки и удаления
  Ответ: 3  (horse -> rorse -> rose -> ros)

"alien-dictionary-order": |
  слова: ["wrt","wrf","er","ett","rftt"]

  рёбра из соседних пар:
    t -> f   (wrt < wrf)
    w -> e   (wrf < er)
    r -> t   (er < ett)
    e -> r   (ett < rftt)

  топосорт Кана:
    входящие: w0 e1 r1 t1 f1
    порядок: w -> e -> r -> t -> f
  Ответ: "wertf"

"max-path-sum": |
  дерево (корень=-10, левый=9, правый=20, у правого левый=15, правый=7)

  вклад(узел) = узел + max(0, вклад(L), вклад(R))
  путь через узел = узел + max(0,L) + max(0,R)

  лист 15 -> 15, лист 7 -> 7
  20: через узел=20+15+7=42  ЛУЧШЕЕ
  корень: через узел=-10+9+20 = 19 < 42

  Ответ: 42

"lru-cache": |
  ёмкость=2
  put(1,a)  карта{1}  список: 1
  put(2,b)  карта{1,2} список: 2-1
  get(1)    поднимаем 1   список: 1-2
  put(3,c)  вытесняем 2   список: 3-1
  get(2)    -1
  put(4,d)  вытесняем 1   список: 4-3
  get(1)    -1
  get(3)    c
  get(4)    d

"sudoku-solver": |
  Находим первую пустую клетку (r,c)
  Пробуем цифру 1..9, если свободны строка, столбец и квадрат:
    доска[r][c]=d
    рекурсия
    если не вышло: доска[r][c]='.'  (откат)
  Пустых клеток нет -> решено

  Индекс квадрата = (r/3)*3 + (c/3)

"word-search-ii": |
  слова=["oath","pea","eat","rain"]
  строки доски делят одно префиксное дерево

  DFS из каждой клетки:
    шаг в дочерний узел бора
    если в узле слово: забираем и стираем (без повторов)
    помечаем клетку '#', смотрим 4 направления, восстанавливаем

  Пустые ветки бора срезаем после находки.
  Ответ: ["oath","eat"]

"first-missing-positive": |
  nums = [3,4,-1,1]  n=4
  каждое x из диапазона ставим на индекс x-1:

  i=0: 3 -> обмен с nums[2] => [-1,4,3,1]
  i=1: 4 -> обмен с nums[3] => [-1,1,3,4]
       1 -> обмен с nums[0] => [1,-1,3,4]
  i=2,3 уже на местах

  просмотр: на индексе 1 лежит -1, а не 2
  Ответ: 2

"find-median-stream": |
  поток: 1, 2, 3
  maxHeap (меньшая) | minHeap (большая)

  +1 -> меньшая:[1]                 медиана=1
  +2 -> меньшая:[1] большая:[2]     медиана=(1+2)/2
  +3 -> меньшая:[1,2] большая:[3]   баланс; медиана=2

  Всегда |меньшая| == |большая| или |меньшая| == |большая|+1

"reorder-list": |
  1 -> 2 -> 3 -> 4 -> 5

  середина (slow/fast останавливаются на 3)
  разрез после середины: первая = 1->2->3 , вторая = 4->5
  разворачиваем только вторую: 5 -> 4
  сплетаем первую с развёрнутой второй:
    1 -> 5 -> 2 -> 4 -> 3

"critical-connections": |
  мосты графа через время входа и lowlink (Тарьян)

  dfs(u):
    disc[u]=low[u]=время++
    для v из соседей u:
      если не были: это родитель, уходим в рекурсию
        low[u]=min(low[u], low[v])
        если low[v] > disc[u]: ребро (u,v) — мост
      иначе если v не родитель:
        low[u]=min(low[u], disc[v])

"basic-calculator": |
  s = "(1+(4+5+2)-3)+(6+8)"
  стек хранит прежнюю сумму и знак на '('

  число=0, знак=+1, накопление=0
  '(': кладём накопление и знак; обнуляем
  ')': накопление = знак_со_стека*накопление + сумма_со_стека
  цифра: собираем число; на операции применяем знак*число

  Ответ: 23

"vertical-order": |
  корень=3, левый=9, правый=20, у правого левый=15, правый=7

  BFS, в очереди (узел, столбец)
  карта столбцов:
    -1: [9]
     0: [3,15]
     1: [20]
     2: [7]

  столбцы слева направо
  Ответ: [[9],[3,15],[20],[7]]

"count-smaller-after-self": |
  nums = [5,2,6,1]
  сортировка слиянием считает инверсии справа

  сливаем половины; когда берём элемент из правой,
  каждый оставшийся слева получает +1 «меньше справа»

  по индексам: [2,1,1,0]

"lfu-cache": |
  ёмкость=2
  put(1,a) частота 1
  put(2,b) частота 1
  get(1)   частота 2  (1 встречается чаще)
  put(3,c) вытесняем 2 (самый редкий среди частоты 1)
  get(2)   -1
  get(3)   c

  карты: ключ->узел, частота->LRU-список, минимальная частота

"shortest-path-binary-matrix": |
  сетка: 0 открыто, 1 закрыто, BFS на 8 направлений
  старт (0,0), если открыт

  в очереди расстояние=1; клетку помечаем
  смотрим 8 соседей; первое попадание в (n-1,n-1) — кратчайший путь

  закрытый старт или финиш -> -1

"candy": |
  оценки = [1,0,2]
  проход слева: у большего соседа слева конфета больше
    конфеты: [1,1,2]
  проход справа: у большего соседа справа тоже
    конфеты: [2,1,2]
  сумма = 5

"circular-array-loop": |
  nums = [2, -1, 1, 2, 2]
  медленный и быстрый остаются в одном направлении
  индекс 0 -> 2 -> 3 -> 0 — цикл вперёд
  смена знака значит, что с этого старта петли нет

"maximize-capital": |
  проекты: капитал [0,1,1], прибыль [1,2,3], k=2, w=0
  min-heap по капиталу, max-heap доступной прибыли
  при w=0 берём прибыль 1 -> w=1
  при w=1 берём прибыль 3 -> w=4

"sliding-window-median": |
  nums = [1,3,-1,-3,5,3,6,7], k=3
  две кучи держат окно упорядоченным
  окно [1,3,-1], медиана 1
  сдвиг: убрали 1, добавили -3 -> медиана -1
  балансируем, чтобы кучи отличались не больше чем на один

"smallest-range": |
  списки [4,10,15,24,26] [0,9,12,20] [5,18,22,30]
  куча текущих голов: 0,4,5  диапазон 0..5
  двигаем список, которому принадлежит минимум
  следующие головы 4,5,9  диапазон 4..9 хуже
  лучший остаётся 0..5, пока не появится теснее (20..24)

"reorganize-string": |
  s = aab
  max-heap по числу: a2, b1
  ставим a, затем другую букву b, затем a
  получается aba
  если верхняя буква чаще чем (n+1)/2, ответ пустой

"search-rotated-duplicates": |
  nums = [2,5,6,0,0,1,2], цель 0
  оба конца равны середине, половина не определяется
  сжимаем оба конца на один и ищем снова
  дальше обычный отброс половины повёрнутого массива

"unique-permutations": |
  nums = [1,1,2]
  сначала сортируем
  берём 1 и на той же глубине пропускаем повторную 1
  ветки: 1,1,2 и 1,2,1 и 2,1,1

"four-sum-ii": |
  A=B=C=D = [1,2] [-2,-1] [-1,2] [0,2]
  каждая сумма A[i]+B[j] идёт в карту счётчиков
  для каждой C[k]+D[l] прибавляем число противоположной суммы
  ответ 2

"number-of-islands-ii": |
  клетки суши добавляют по одной
  новая клетка — своя компонента
  объединяем с уже сухопутным соседом (4 направления)
  ответ после каждого добавления — число компонент

"bitwise-and-range": |
  left=5 (101), right=7 (111)
  AND диапазона хранит только общий префикс битов
  сдвигаем, пока left==right, затем возвращаем префикс
  5&6&7 = 4

"max-points-on-a-line": |
  точки (1,1) (2,2) (3,3)
  из (1,1) наклон к обеим другим равен 1/1
  один и тот же сокращённый наклон — одна прямая
  вертикаль кладём в отдельную корзину, не в дробь

"circuit-breaker": |
  закрыт: отказов 0
  вызов упал, отказов 1
  порог 2 -> открыт
  пока открыт, вызовы падают сразу
  после паузы одна попытка в полуоткрытом
  успех закрывает; новый отказ снова открывает

"concurrent-login-tracker": |
  login(user) пишет сессию в этом процессе
  второй экземпляр этот набор не видит
  счётчик в памяти занижен, как только трафик разделён

"maximum-gap": |
  nums = [3, 6, 9, 1]
  min=1 max=9 n=4
  ширина корзины = (9-1)/(4-1) = 2
  корзины: [1,3) [3,5) [5,7) [7,9]
  заняты: 1 | 3 | 6 | 9
  разрывы между соседями: 3-1=2, 6-3=3, 9-6=3
  ответ 3

