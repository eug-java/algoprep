  Проверьте пример вручную по этому инварианту, прежде чем писать цикл.
"intersection-two-arrays": |
  Пример: Вход: [4, 9, 5, 9], [9, 4, 9, 8, 4] → [4, 9]
  Инвариант: Значение попадает в ответ один раз, если оно есть в обоих массивах, лишние копии не важны.
  Проверьте пример вручную по этому инварианту, прежде чем писать цикл.
"matrix-diagonal-sum": |
  Пример: Вход: [[1, 2, 3], [4, 5, 6], [7, 8, 9]] → 25
  Инвариант: Сумма — главная диагональ плюс побочная, и центральная клетка не добавляется дважды, когда сторона нечётная.
  Проверьте пример вручную по этому инварианту, прежде чем писать цикл.
"valid-parentheses": |
  Пример: Вход: "{[]}" → true
  Инвариант: Стек хранит незакрытые открывающие скобки в том порядке, в котором их надо закрыть.
  Проверьте пример вручную по этому инварианту, прежде чем писать цикл.
"path-sum": |
  Пример: Вход: [5, 4, 8, 11, null, 13, 4, 7, 2, null, null, null, 1], 22 → true
  Инвариант: Лист успешен, только когда оставшаяся цель равна листу, а любой другой узел просто вычитает себя.
  Проверьте пример вручную по этому инварианту, прежде чем писать цикл.
"min-depth": |
  Пример: Вход: [1, 2, 3, 4] → 2
  Инвариант: Первый лист, достигнутый уровень за уровнем, имеет минимальную глубину.
  Проверьте пример вручную по этому инварианту, прежде чем писать цикл.
"longest-common-prefix": |
  Пример: Вход: [\"flower\", \"flow\", \"flight\"] → fl
  Инвариант: Префикс — самая длинная серия столбцов, где у каждого слова всё ещё тот же символ.
  Проверьте пример вручную по этому инварианту, прежде чем писать цикл.
"two-sum": |
  Пример: Вход: [2, 7, 11, 15], 9 → [0, 1]
  Инвариант: Карта хранит индекс каждого более раннего значения, и текущее число кладётся только после проверки дополнения.
  Проверьте пример вручную по этому инварианту, прежде чем писать цикл.
"isomorphic-strings": |
  Пример: Вход: \"egg\", \"add\" → true
  Инвариант: У каждого символа первой строки один образ, и два символа не делят один образ.
  Проверьте пример вручную по этому инварианту, прежде чем писать цикл.
"majority-element": |
  Пример: Вход: [2, 2, 1, 1, 1, 2, 2] → 2
  Инвариант: Кандидата и его голосов достаточно: совпадения добавляют голос, всё остальное отнимает один.
  Проверьте пример вручную по этому инварианту, прежде чем писать цикл.
"path-exists": |
  Пример: Вход: 6, [[0, 1], [1, 2], [2, 5], [3, 4]], 0, 5 → true
  Инвариант: Источник достигает цели ровно когда у них один корень.
  Проверьте пример вручную по этому инварианту, прежде чем писать цикл.
"design-hashmap": |
  Пример: Операции: put(1, 1), put(2, 2), get(1), get(3), put(2, 1), get(2) → [null, null, 1, -1, null, 1, null, -1]
  Инвариант: Ключ живёт в корзине key по модулю числа корзин, а столкновение — ещё один узел в цепи этой корзины.
  Проверьте пример вручную по этому инварианту, прежде чем писать цикл.
"single-number": |
  Пример: Вход: [4, 1, 2, 1, 2] → 4
  Инвариант: XOR стирает значение, которое встретилось дважды, и оставляет то, которое встретилось один раз.
  Проверьте пример вручную по этому инварианту, прежде чем писать цикл.
"number-of-1-bits": |
  Пример: Вход: -1 → 32
  Инвариант: Каждый шаг снимает ровно один установленный бит, поэтому число шагов — число единичных битов.
  Проверьте пример вручную по этому инварианту, прежде чем писать цикл.
"reverse-bits": |
  Пример: Вход: 43261596 → 964176192
  Инвариант: Он становится новым старшим битом результата, и так по разу для каждой из 32 позиций.
  Проверьте пример вручную по этому инварианту, прежде чем писать цикл.
"gcd-of-strings": |
  Пример: Вход: \"ABCABC\", \"ABC\" → ABC
  Инвариант: Строки делят строку-делитель, только когда любой порядок склейки даёт одну и ту же строку.
  Проверьте пример вручную по этому инварианту, прежде чем писать цикл.
"sqrt": |
  Пример: Вход: 8 → 2
  Инвариант: Поиск держит наибольшую середину, чей квадрат всё ещё ≤ x.
  Проверьте пример вручную по этому инварианту, прежде чем писать цикл.
"config-store": |
  Пример: Операции: set(theme, dark), get(theme), get(missing), getOrDefault(missing, light) → [null, "dark", null, "light"]
  Инвариант: Карта — это всё хранилище, и отсутствующий ключ возвращает значение по умолчанию от вызывающего.
  Проверьте пример вручную по этому инварианту, прежде чем писать цикл.
"request-id-filter": |
  Пример: Вход: запрос без X-Request-Id получает новый id. Запрос, у которого id уже есть, сохраняет его.
  Инвариант: Непустой входящий id сохраняется; иначе создаётся новый и кладётся на этот запрос.
  Проверьте пример вручную по этому инварианту, прежде чем писать цикл.
"triplet-sum-zero": |
  Пример: Вход: [-3, 0, 1, 2, -1, 1, -2] → [[-3, 1, 2], [-2, 0, 2], [-2, 1, 1], [-1, 0, 1]]
  Инвариант: Для фиксированного якоря подходящая пара всё ещё лежит справа от него.
  Проверьте пример вручную по этому инварианту, прежде чем писать цикл.

"container-with-most-water": |
  Пример: Вход: [1, 8, 6, 2, 5, 4, 8, 3, 7] → 49
  Инвариант: Лучшая площадь не меньше любого сосуда, который ещё использует короткую сторону, которую вы собираетесь покинуть.
  Проверьте пример вручную по этому инварианту, прежде чем писать цикл.

"dutch-national-flag": |
  Пример: Вход: [1, 0, 2, 1, 0] → [0, 0, 1, 1, 2]
  Инвариант: Всё до low — нули, всё после high — двойки, mid — первый неразобранный индекс.
  Проверьте пример вручную по этому инварианту, прежде чем писать цикл.

"cycle-start": |
  Пример: Вход: 1 → 2 → (назад к 2) → 2
  Инвариант: Если вернуть одного к голове и шагать обоим по одному, они встретятся у входа в цикл.
  Проверьте пример вручную по этому инварианту, прежде чем писать цикл.

"palindrome-linked-list": |
  Пример: Вход: 1 → 2 → 2 → 1 → true
  Инвариант: Первая половина остаётся, развёрнутая вторая стыкуется с ней снаружи внутрь.
  Проверьте пример вручную по этому инварианту, прежде чем писать цикл.

"longest-substring-k-distinct": |
  Пример: Вход: \"araaci\", 2 → 4
  Инвариант: Окно допустимо ровно пока в карте частот не больше K ключей.
  Проверьте пример вручную по этому инварианту, прежде чем писать цикл.

"find-all-anagrams": |
  Пример: Вход: \"cbaebabacd\", \"abc\" → [0, 6]
  Инвариант: Окно длины образца совпадает, когда его счётчики равны счётчикам образца.
  Проверьте пример вручную по этому инварианту, прежде чем писать цикл.

"longest-no-repeat": |
  Пример: Вход: "aabccbb" → 3
  Инвариант: Left стоит сразу за предыдущей копией символа справа, ответ — самая широкая такая щель.
  Проверьте пример вручную по этому инварианту, прежде чем писать цикл.

"merge-intervals": |
  Пример: Вход: [[2, 5], [1, 3], [7, 9]] → [[1, 5], [7, 9]]
  Инвариант: Перекрываться с текущим может только последний уже слитый интервал.
  Проверьте пример вручную по этому инварианту, прежде чем писать цикл.

"insert-interval": |
  Пример: Вход: [[1, 3], [6, 9]], [2, 5] → [[1, 5], [6, 9]]
  Инвариант: До перекрытия список копируется как есть; во время перекрытия границы нового только растут.
  Проверьте пример вручную по этому инварианту, прежде чем писать цикл.

"interval-intersection": |
  Пример: Вход: [[0, 2], [5, 10]], [[1, 5], [8, 12]] → [[1, 2], [5, 5], [8, 10]]
  Инвариант: Пересечение идёт от более позднего начала до более раннего конца и пусто, если этот отрезок задом наперёд.
  Проверьте пример вручную по этому инварианту, прежде чем писать цикл.

"reverse-sublist": |
  Пример: Вход: [1, 2, 3, 4, 5], 2, 4 → [1, 4, 3, 2, 5]
  Инвариант: Узел, который был на левой границе, замыкает развёрнутый кусок и должен связаться с тем, что шло за правой границей.
  Проверьте пример вручную по этому инварианту, прежде чем писать цикл.

"reverse-every-k": |
  Пример: Вход: [1, 2, 3, 4, 5], 2 → [2, 1, 4, 3, 5]
  Инвариант: Группа разворачивается, только если осталось k узлов; её новая голова вяжется к хвосту предыдущей группы.
  Проверьте пример вручную по этому инварианту, прежде чем писать цикл.

"rotate-list": |
  Пример: Вход: [1, 2, 3, 4, 5], 2 → [4, 5, 1, 2, 3]
  Инвариант: Список на одно сшивание — кольцо: новый хвост в n - (k mod n) шагах от старой головы.
  Проверьте пример вручную по этому инварианту, прежде чем писать цикл.

"next-interval": |
  Пример: Вход: [[2, 3], [3, 4], [5, 6]] → [1, 2, -1]
  Инвариант: Самый ранний незакрытый конец стыкуется с самым ранним стартом, который не раньше этого конца.
  Проверьте пример вручную по этому инварианту, прежде чем писать цикл.

"kth-smallest-sorted-matrix": |
  Пример: Вход: [[1, 3, 4], [2, 6, 8], [3, 6, 7]], 5 → 4
  Инвариант: Куча держит наименьшую ещё не взятую клетку открытых строк, и k-е извлечение — ответ.
  Проверьте пример вручную по этому инварианту, прежде чем писать цикл.

"k-smallest-pairs": |
  Пример: Вход: [1, 7, 11], [2, 4, 6], 3 → [[1, 2], [1, 4], [1, 6]]
  Инвариант: Куча хранит лучшую ещё не взятую пару на каждый начальный индекс, поэтому следующее извлечение — следующая наименьшая сумма.
  Проверьте пример вручную по этому инварианту, прежде чем писать цикл.

"k-closest-points": |
  Пример: Вход: [[1, 3], [-2, 2], [0, 1]], 2 → [[0, 1], [-2, 2]]
  Инвариант: Куча размера K по расстоянию хранит ближайшие точки; её вершина — самая далёкая из них.
  Проверьте пример вручную по этому инварианту, прежде чем писать цикл.

"top-k-frequent": |
  Пример: Вход: [1, 3, 5, 12, 11, 12, 11], 2 → [12, 11]
  Инвариант: Куча хранит K пар по частоте, и её вершина — наименее частая из этих K.
  Проверьте пример вручную по этому инварианту, прежде чем писать цикл.

"kth-largest": |
  Пример: Вход: [3, 2, 1, 5, 6, 4], 2 → 5
  Инвариант: Куча — это K наибольших увиденных значений, поэтому её вершина — текущий k-й по величине.
  Проверьте пример вручную по этому инварианту, прежде чем писать цикл.

"search-rotated-array": |
  Пример: Вход: [10, 15, 1, 3, 8], 1 → 2
  Инвариант: Одна сторона от середины — обычный отсортированный отрезок; цель остаётся, только если она внутри этого отрезка.
  Проверьте пример вручную по этому инварианту, прежде чем писать цикл.

"find-range": |
  Пример: Вход: [4, 6, 6, 6, 9], 6 → [1, 3]
  Инвариант: Левый поиск держит самое левое совпадение, правый — самое правое, оба на одном отсортированном массиве.
  Проверьте пример вручную по этому инварианту, прежде чем писать цикл.

"find-peak-element": |
  Пример: Вход: [1, 2, 3, 1] → 2
  Инвариант: Подъём вправо значит, что пик есть справа; иначе пик есть слева, включая середину.
  Проверьте пример вручную по этому инварианту, прежде чем писать цикл.

"subsets": |
  Пример: Вход: [1, 2] → [[], [1], [2], [1, 2]]
  Инвариант: Результат — все подмножества префикса, и новое число либо дописывается к каждому, либо нет.
  Проверьте пример вручную по этому инварианту, прежде чем писать цикл.

"subsets-with-duplicates": |
  Пример: Вход: [1, 2, 2] → [[], [1], [2], [1, 2], [2, 2], [1, 2, 2]]
  Инвариант: Повтор расширяет только подмножества, созданные предыдущей копией, поэтому одно и то же не строится дважды.
  Проверьте пример вручную по этому инварианту, прежде чем писать цикл.

"permutations": |
  Пример: Вход: [1, 2, 3] → [[3, 2, 1], [2, 3, 1], [2, 1, 3], [3, 1, 2], [1, 3, 2], [1, 2, 3]]
  Инвариант: Префикс до текущего индекса — одна частичная перестановка, и обмен откатывается перед следующим выбором.
  Проверьте пример вручную по этому инварианту, прежде чем писать цикл.

"generate-parentheses": |
  Пример: Вход: 3 → ((())), (()()), (())(), ()(()), ()()()
  Инвариант: Префикс допустим, пока закрывающих не больше, чем открывающих, а открывающих не больше n.
  Проверьте пример вручную по этому инварианту, прежде чем писать цикл.

"jump-game": |
  Пример: Вход: [2, 3, 1, 1, 4] → true
  Инвариант: Если i когда-либо дальше достигнутого, конец недостижим; иначе досягаемость только растёт.
  Проверьте пример вручную по этому инварианту, прежде чем писать цикл.

"jump-game-ii": |
  Пример: Вход: [2, 3, 1, 1, 4] → 2
  Инвариант: Текущий прыжок покрывает до записанного конца, и новый прыжок тратится, только когда i доходит до этого конца.
  Проверьте пример вручную по этому инварианту, прежде чем писать цикл.

"gas-station": |
  Пример: Вход: [1, 2, 3, 4, 5], [3, 4, 5, 1, 2] → 3
  Инвариант: Старт возможен только на станции после провала и только если всего бензина хватает на всю стоимость.
  Проверьте пример вручную по этому инварианту, прежде чем писать цикл.

"combination-sum": |
  Пример: Вход: [2, 3, 6, 7], 7 → [[2, 2, 3], [7]]
  Инвариант: Сумма пути — сумма выбранного мультимножества, и ветка умирает, как только сумма переходит цель.
  Проверьте пример вручную по этому инварианту, прежде чем писать цикл.

"word-search": |
  Пример: Вход: [\"ABCE\", \"SFCS\", \"ADEE\"], \"ABCCED\" → true
  Инвариант: Текущая клетка помечена занятой для этого пути и снимается, как только путь возвращается.
  Проверьте пример вручную по этому инварианту, прежде чем писать цикл.

"house-robber": |
  Пример: Вход: [2, 7, 9, 3, 1] → 12
  Инвариант: Лучшая добыча до дома i — это лучшее из «пропустить i» и «взять i плюс лучшее до i-2».
  Проверьте пример вручную по этому инварианту, прежде чем писать цикл.

"0-1-knapsack": |
  Пример: Вход: [1, 6, 10, 16], [1, 2, 3, 5], 7 → 22
  Инвариант: Лучшая ценность первых i предметов при вместимости c — лучшее из «пропустить» и «взять, если влезает».
  Проверьте пример вручную по этому инварианту, прежде чем писать цикл.

"coin-change": |
  Пример: Вход: [1, 2, 5], 11 → 3
  Инвариант: Минимум монет для суммы a — это одна плюс минимум для a минус монета, или невозможно, если ни одна монета туда не доходит.
  Проверьте пример вручную по этому инварианту, прежде чем писать цикл.

"longest-increasing-subsequence": |
  Пример: Вход: [10, 9, 2, 5, 3, 7, 101, 18] → 4
  Инвариант: Лучшая длина, кончающаяся в i, на единицу больше лучшей длины, кончающейся меньшим более ранним значением.
  Проверьте пример вручную по этому инварианту, прежде чем писать цикл.

"unique-paths": |
  Пример: Вход: 3, 7 → 28
  Инвариант: Пути в клетку — это пути в клетку сверху плюс пути в клетку слева, а первая строка и столбец равны 1.
  Проверьте пример вручную по этому инварианту, прежде чем писать цикл.

"find-all-duplicates": |
  Пример: Вход: [4, 3, 2, 7, 8, 2, 3, 1] → [3, 2]
  Инвариант: Каждое значение занимает слот value-1; вторая заявка значит, что значение встретилось дважды.
  Проверьте пример вручную по этому инварианту, прежде чем писать цикл.

"find-duplicate-number": |
  Пример: Вход: [1, 3, 4, 2, 2] → 2
  Инвариант: Повтор — это вход в цикл цепочки индексов.
  Проверьте пример вручную по этому инварианту, прежде чем писать цикл.

"course-schedule": |
  Пример: Вход: 2, [[1, 0]] → true
  Инвариант: Курс свободен, когда его входная степень стала нулём; цикл остаётся, если какой-то курс так и не освободился.
  Проверьте пример вручную по этому инварианту, прежде чем писать цикл.

"course-schedule-order": |
  Пример: Вход: 4, [[1, 0], [2, 0], [3, 1], [3, 2]] → [0, 1, 2, 3]
  Инвариант: Порядок — это последовательность, в которой входные степени становятся нулём; если она короче, в графе был цикл.
  Проверьте пример вручную по этому инварианту, прежде чем писать цикл.

"tasks-scheduling": |
  Пример: Вход: 3, [[0, 1], [1, 2]] → true
  Инвариант: Расписание есть ровно когда каждая задача в конце концов получает нулевую входную степень.
  Проверьте пример вручную по этому инварианту, прежде чем писать цикл.

"group-anagrams": |
  Пример: Вход: [\"eat\", \"tea\", \"tan\", \"ate\", \"nat\", \"bat\"] → [[eat, tea, ate], [tan, nat], [bat]]
  Инвариант: Слова с одной отсортированной подписью или одними счётчиками символов — одна группа.
