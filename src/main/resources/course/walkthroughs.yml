# ASCII walkthroughs for selected HARD problems (problemId -> multiline string)
"quadruple-sum": |
  nums = [1, 0, -1, 0, -2, 2], target = 0
  sort -> [-2, -1, 0, 0, 1, 2]

  i=0 (-2), j=1 (-1)
    L=2 (0), R=5 (2)
    sum=-2-1+0+2=-1 < 0 -> L++
    L=3 (0), R=5 (2)
    sum=-2-1+0+2=-1 < 0 -> L++
    L=4 (1), R=5 (2)
    sum=-2-1+1+2=0  OK  [-2,-1,1,2]

  Skip duplicate pairs; advance i/j similarly.
  Result: [[-2,-1,1,2],[-2,0,0,2],[-1,0,0,1]]

"min-window-substring": |
  s = "ADOBECODEBANC", t = "ABC"
  need = {A:1, B:1, C:1}, missing = 3

  expand R:
    A D O B E C ...  -> have A,B,C; missing=0
    window "ADOBEC" (0..5)

  shrink L while valid:
    drop A -> missing=1; best still len 6
  continue...
    later window "BANC" (9..12) len 4  BEST

  Answer: "BANC"

"minimum-meeting-rooms": |
  meetings: [0,30], [5,10], [15,20]
  starts: 0, 5, 15
  ends:   10, 20, 30

  i/j scan:
    0 start -> rooms=1 (max=1)
    5 start -> rooms=2 (max=2)
   10 end   -> rooms=1
   15 start -> rooms=2 (max=2)
   20 end   -> rooms=1
   30 end   -> rooms=0

  Answer: 2

"merge-k-sorted-lists": |
  lists: [1,4,5], [1,3,4], [2,6]
  min-heap seed: (1,a0), (1,b0), (2,c0)

  pop 1(a) -> next push 4(a)
  pop 1(b) -> next push 3(b)
  pop 2(c) -> next push 6(c)
  pop 3(b) -> next push 4(b)
  ...
  out: 1 -> 1 -> 2 -> 3 -> 4 -> 4 -> 5 -> 6

"n-queens": |
  n=4 board, place row by row

  row0: try col0..3
    place (0,1)
  row1: attack on 0,1,2? try col3
    place (1,3)
  row2: try col0
    place (2,0)
  row3: try col2
    place (3,2)  SOLUTION

  Backtrack when no safe column remains.

"edit-distance": |
  word1="horse", word2="ros"

  dp table (rows=horse, cols=ros):
       ''  r  o  s
  ''    0  1  2  3
  h     1  1  2  3
  o     2  2  1  2
  r     3  2  2  2
  s     4  3  3  2
  e     5  4  4  3

  dp[i][j] = replace/insert/delete min
  Answer: 3  (horse -> rorse -> rose -> ros)

"alien-dictionary-order": |
  words: ["wrt","wrf","er","ett","rftt"]

  edges from adjacent pairs:
    t -> f   (wrt < wrf)
    w -> e   (wrf < er)
    r -> t   (er < ett)
    e -> r   (ett < rftt)

  Kahn topo:
    indeg: w0 e1 r1 t1 f1
    order seed w -> e -> r -> t -> f
  Answer: "wertf"

"max-path-sum": |
  tree (root=-10, left=9, right=20, right.left=15, right.right=7)

  gain(node) = node + max(0, gain(L), gain(R))
  best through node = node + max(0,L) + max(0,R)

  leaf 15 -> 15, leaf 7 -> 7
  20: through=20+15+7=42  BEST
  root: through=-10+9+20 = 19 < 42

  Answer: 42

"lru-cache": |
  capacity=2
  put(1,a)  map{1}  list: 1
  put(2,b)  map{1,2} list: 2-1
  get(1)    promote 1   list: 1-2
  put(3,c)  evict 2     list: 3-1
  get(2)    -1
  put(4,d)  evict 1     list: 4-3
  get(1)    -1
  get(3)    c
  get(4)    d

"sudoku-solver": |
  Find first empty cell (r,c)
  Try digit 1..9 if row/col/box free:
    board[r][c]=d
    recurse
    if fail: board[r][c]='.'  (undo)
  No empty cells -> solved

  Box index = (r/3)*3 + (c/3)

"word-search-ii": |
  words=["oath","pea","eat","rain"]
  board rows share prefix tree (trie)

  DFS from each cell:
    move to child trie node
    if node.word: collect and clear (dedupe)
    mark visited '#', explore 4-dir, restore

  Prune empty trie branches after finds.
  Answer: ["oath","eat"]

"first-missing-positive": |
  nums = [3,4,-1,1]  n=4
  place each x in range at index x-1:

  i=0: 3 -> swap with nums[2] => [-1,4,3,1]
  i=1: 4 -> swap with nums[3] => [-1,1,3,4]
       1 -> swap with nums[0] => [1,-1,3,4]
  i=2,3 already set

  scan: index 1 holds -1 != 2
  Answer: 2

"find-median-stream": |
  stream: 1, 2, 3
  maxHeap (lo) | minHeap (hi)

  add 1 -> lo:[1]           median=1
  add 2 -> lo:[1] hi:[2]    median=(1+2)/2
  add 3 -> lo:[1,2] hi:[3]  rebalance; median=2

  Always |lo| == |hi| or |lo| == |hi|+1

"reorder-list": |
  1 -> 2 -> 3 -> 4 -> 5

  mid (slow/fast stops at 3)
  cut after mid: first = 1->2->3 , second = 4->5
  reverse second only: 5 -> 4
  weave first with reversed second:
    1 -> 5 -> 2 -> 4 -> 3

"critical-connections": |
  graph bridges via discovery/lowlink (Tarjan)

  dfs(u):
    disc[u]=low[u]=time++
    for v in adj[u]:
      if not visited: parent, recurse
        low[u]=min(low[u], low[v])
        if low[v] > disc[u]: (u,v) is bridge
      else if v!=parent:
        low[u]=min(low[u], disc[v])

"basic-calculator": |
  s = "(1+(4+5+2)-3)+(6+8)"
  stack holds prior sum & sign when '('

  num=0, sign=+1, acc=0
  '(': push acc,sign; reset
  ')': acc = pop_sign*acc + pop_acc
  digit: build num; on op apply sign*num

  Answer: 23

"vertical-order": |
  tree root=3, L=9, R=20, R.L=15, R.R=7

  BFS queue (node, col)
  col map:
    -1: [9]
     0: [3,15]
     1: [20]
     2: [7]

  emit cols left->right
  Answer: [[9],[3,15],[20],[7]]

"count-smaller-after-self": |
  nums = [5,2,6,1]
  merge-sort count inversions to the right

  merge halves; when taking from right half,
  each remaining left element gains +1 smaller-after

  result indices: [2,1,1,0]

"lfu-cache": |
  capacity=2
  put(1,a) freq1
  put(2,b) freq1
  get(1)   freq2  (1 more frequent)
  put(3,c) evict 2 (LFU among freq1)
  get(2)   -1
  get(3)   c

  maps: key->node, freq->LRU list, minFreq

"shortest-path-binary-matrix": |
  grid 0=open 1=blocked, 8-dir BFS
  start (0,0) if open

  queue dist=1; mark visited
  expand 8 neighbors; first reach (n-1,n-1) = shortest

  blocked start/end -> -1

"candy": |
  ratings = [1,0,2]
  left pass:  ensure higher than left neighbor
    candies: [1,1,2]
  right pass: ensure higher than right
    candies: [2,1,2]
  sum = 5

"circular-array-loop": |
  nums = [2, -1, 1, 2, 2]
  slow and fast must stay in the same direction
  index 0 -> 2 -> 3 -> 0 is a forward cycle
  a sign change means this start is not a loop

"maximize-capital": |
  projects: capital [0,1,1] profits [1,2,3]  k=2  w=0
  min-heap by capital, max-heap of affordable profits
  w=0 can take profit 1 -> w=1
  w=1 can take profit 3 -> w=4

"sliding-window-median": |
  nums = [1,3,-1,-3,5,3,6,7] k=3
  two heaps keep the window ordered
  window [1,3,-1] median 1
  slide: drop 1, add -3 -> median -1
  rebalance so the heaps differ by at most one

"smallest-range": |
  lists [4,10,15,24,26] [0,9,12,20] [5,18,22,30]
  heap of current heads: 0,4,5  range 0..5
  advance the list that owns the minimum
  next heads 4,5,9  range 4..9 worse
  best stays 0..5 until a tighter window appears (20..24)

"reorganize-string": |
  s = aab
  max-heap by count: a2, b1
  place a, then the next different letter b, then a
  result aba
  if the top letter is more than (n+1)/2, return empty

"search-rotated-duplicates": |
  nums = [2,5,6,0,0,1,2] target 0
  both ends equal the mid, so you cannot tell which half is sorted
  shrink both ends by one and search again
  then a normal rotated-array discard works

"unique-permutations": |
  nums = [1,1,2]
  sort first
  choose 1, then skip the duplicate 1 at the same depth
  branches: 1,1,2 and 1,2,1 and 2,1,1

"four-sum-ii": |
  A=B=C=D = [1,2] [-2,-1] [-1,2] [0,2]
  map every A[i]+B[j] to a count
  for each C[k]+D[l], add the count of the negation
  answer 2

"number-of-islands-ii": |
  positions added one by one on a grid
  each land cell is its own component
  union with any already-land neighbor (4 directions)
  the answer after each add is the component count

"bitwise-and-range": |
  left=5 (101) right=7 (111)
  the range AND keeps only the common prefix
  shift until left==right, then shift the prefix back
  5&6&7 = 4

"max-points-on-a-line": |
  points (1,1) (2,2) (3,3)
  from (1,1), slope to both others is 1/1
  same reduced slope means the same line
  vertical lines use a separate bucket, not a double

"circuit-breaker": |
  closed: failures 0
  call fails, failures 1
  threshold 2 -> open
  while open, calls fail fast
  after the timeout, one trial is half-open
  success closes; another failure opens again

"concurrent-login-tracker": |
  login(user) records the session in this process
  a second instance does not see that set
  the in-memory count undercounts as soon as traffic is shared
