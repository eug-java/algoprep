<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AlgoPrep — Coding Interview Patterns</title>
  <meta name="description" content="Java pattern-based coding interview course with Spring Boot." />
  <meta name="theme-color" content="#0f3d2e" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="apple-touch-icon" href="/icons/icon.svg" />
  <script>
    (function () {
      var t = localStorage.getItem('algoprep.theme.v1') || 'light';
      document.documentElement.setAttribute('data-theme', t === 'dark' ? 'dark' : 'light');
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Newsreader:opsz,wght@6..72,400;6..72,600&family=Syne:wght@600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/app.css" />
  <link rel="icon" href="/icons/icon.svg" />
</head>
<body>
  <div class="noise" aria-hidden="true"></div>
  <header class="topbar">
    <a class="brand-mark" href="#/" data-link>
      <span class="mark" aria-hidden="true"></span>
      <span>AlgoPrep</span>
    </a>
    <nav class="nav">
      <a href="#/patterns" data-link data-i18n="nav.patterns">Patterns</a>
      <a href="#/tracks" data-link data-i18n="nav.tracks">Tracks</a>
      <a href="#/daily" data-link data-i18n="nav.daily">Daily</a>
      <a href="#/review" data-link data-i18n="nav.review">Review</a>
      <a href="#/mock" data-link data-i18n="nav.mock">Mock</a>
      <a href="#/skills" data-link data-i18n="nav.skills">Skills</a>
      <a href="#/metrics" data-link data-i18n="nav.metrics">Metrics</a>
      <a href="#/quiz" data-link data-i18n="nav.quiz">Guess pattern</a>
      <a href="#/challenge" data-link data-i18n="nav.challenge">Challenge</a>
      <a href="#/spring" data-link data-i18n="nav.spring">Spring</a>
      <a href="#/cheatsheet" data-link data-i18n="nav.cheatsheet">Cheatsheet</a>
      <a href="#/settings" data-link data-i18n="nav.settings">Settings</a>
    </nav>
    <div class="toolbar">
      <div class="lang-switch" role="group" aria-label="Language">
        <button type="button" data-lang="en" aria-pressed="true">EN</button>
        <button type="button" data-lang="ru" aria-pressed="false">RU</button>
        <button type="button" data-lang="es" aria-pressed="false">ES</button>
      </div>
      <div class="theme-switch" role="group" aria-label="Theme">
        <button type="button" data-theme-btn="light" aria-pressed="true" title="Light">Light</button>
        <button type="button" data-theme-btn="dark" aria-pressed="false" title="Dark">Dark</button>
      </div>
      <span class="streak-pill" id="streak-pill" title="Streak">Streak: 0</span>
      <button class="nav-progress" id="progress-pill" type="button" title="Local progress">0%</button>
      <button class="nav-reset" id="reset-progress" type="button" data-i18n="common.reset">Reset</button>
    </div>
  </header>

  <main id="app" class="app"></main>

  <footer class="site-footer">
    <p>Java 21 · Spring Boot · pattern-first interview prep</p>
  </footer>

  <script type="module" src="/js/app.js"></script>
</body>
</html>
